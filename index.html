  {"id": "S53", "type": "story", "title": "School shootings: what is rising is the fear", "regions": ["history", "shadow"], "status": "On the record (with a definition fight)", "summary": "Another school shooting (Bend, Oregon, Oct 15: three children and an adult killed at an elementary school) and the same question. Ken LaCorte: everyone counts differently, school is still the safest place a kid can be, but parents' fear and a ~$3 billion security market keep climbing. Me: you never know when you're going to be that one percent; the U.S. count dwarfs every other country.", "quotes": [{"q": "So I just wanted to see if there was any ulterior motives because it it does feel like they're increasing at a rapid rate.", "src": "MTM80 · :56:23"}, {"q": "Across every other country, and we have 288. That's insane.", "src": "MTM80 · 1:13:28"}, {"q": "you never know when you're going to be that one percent.", "src": "MTM80 · 1:17:17"}], "note": "Sources pulled on stream: Ken LaCorte (Elephants in Rooms), \"Uncomfortable facts about U.S. school shootings\", https://youtu.be/Vx3aI67iWpA; the Bend story (OPB 2026-10-16). On the record: CNN's 2018 count of 288 since 2009 (broad definition) vs two each in Canada and France; ~120 guns per 100 people (Small Arms Survey 2018); the broadest database tripled after COVID while narrow counts (Education Week) fell to 18 in 2025. The Bend shooter is a minor and is never named here. Crew caution: rare rampages and broad counts are both true; definitions decide the number."},
  {"id": "S54", "type": "story", "title": "A former school shooter on what broke him", "regions": ["experience", "shadow"], "status": "His own account", "summary": "A man who did it, 17 years later: his father left, abuse at five and six, numb in a room full of friends at fifteen, meds on and off, a suicide attempt, a school that looked away, then a gun in the house. Nobody in the story is a handler; everybody in it missed the signs. Me: therapy matters, the pills the way they get handed out don't.", "quotes": [{"q": "Like therapy is is important, but drugs that's actually making shit worse.", "src": "MTM80 · 1:23:38"}], "note": "Source pulled on stream: We're All Insane, \"I Was a School Shooter\", https://youtu.be/scr4VNvV5ns (he is not named here). On the record: FDA black-box warning on antidepressants for suicidal thinking in kids and teens (2004); Study 329 on Paxil re-analyzed in the BMJ (2015). Crew caution: about 11% of mass shooters had a known SSRI history and most records are incomplete; 'all of them were on SSRIs' is not on record. 988 if you're in a dark place."},
  {"id": "S55", "type": "story", "title": "From the Flexner Report to one in eight on antidepressants", "regions": ["history", "science", "shadow"], "status": "Record + inference (marked)", "summary": "I'd seen a TikTok: Rockefeller couldn't keep his oil monopoly, so he bought the medical schools and made medicine petroleum-based. Soul built the timeline live: the 1910 Flexner Report (Carnegie) visited 155 schools and urged keeping 31; Rockefeller's General Education Board funded the schools that switched to lab and drug medicine; U.S. medical schools went from ~160 to 66 by 1935; five Black medical schools closed (Howard and Meharry survived); Prozac 1987; Study 329; the 2004 warning.", "quotes": [{"q": "I seen a TikTok the other day where basically this whole industry was created because Rockefeller couldn't be a monopoly in the gas industry, so he wanted to make petroleum based products for the medical industry.", "src": "MTM80 · 1:29:12"}], "note": "Sources pulled on stream: Tucker Carlson with Dr. Josef Witt-Doerring, \"SSRIs and School Shootings, FDA Corruption...\", https://youtu.be/UnhT77W9mtQ. On the record: the report, the funding, the closures. Inference, marked as one: that oil money deliberately steered medicine to petroleum drugs (no document found). Correction to me: about 11-14% of U.S. adults take an antidepressant (CDC/NCHS); '15-20%' holds for women only. Standard Oil was broken up in 1911, after the report."},
  {"id": "S56", "type": "story", "title": "Garland and Parkland: the FBI was there, or was warned", "regions": ["history", "shadow"], "status": "On the record", "summary": "Garland, Texas, 2015: an undercover FBI agent had been texting one of the gunmen for weeks, told him to 'tear up Texas', and was in a car right behind the attackers when they opened fire. Parkland, 2018: the FBI got a tip that the shooter planned a school shooting and admitted it never followed up. I asked what the explanation is.", "quotes": [{"q": "He was riding behind them and texting them before. What is the what is the explanation for that.", "src": "MTM80 · 1:44:56"}], "note": "On the record: CBS 60 Minutes (March 2017) and Sen. Grassley's letter on Garland; the FBI's own Parkland statement (Feb 2018); COINTELPRO (Church Committee). The FBI says its Garland agent was watching and didn't know an attack was coming. Crew caution: Garland was not a school; failures and an agent on scene are documented, an agency directing a school shooter is not. My theory stays labelled as my theory. MTM81: I came back to it; the crew corrected again on air: Garland was the cartoon contest, not a school."},
  {"id": "S57", "type": "story", "title": "The strategy of tension: Gladio, Minneapolis and the civil war talk", "regions": ["history", "shadow"], "status": "Gladio on the record · Minneapolis staging not on record", "summary": "Redacted names the playbook (divide us down here while they control us up here). Italy admitted Gladio in 1990. Professor Jiang Xueqin reads Minneapolis (two U.S. citizens killed by federal agents on video in January, no charges as of October) as a deliberate provocation toward civil war; Nick Freitas says the real catalyst would be something around the Second Amendment. Me: the agenda is to crash America from the inside out.", "quotes": [{"q": "I'm noticing the FBI or the CIA. Well, the CIA is involved in external manipulation and FBI is involved in internal manipulation", "src": "MTM81 · 1:09:00"}, {"q": "Create civil war. They're slowly. Crashing America on the inside out, and this is only increasing the surveillance state, the justification for more guns, which creates more unrest.", "src": "MTM80 · 1:46:12"}, {"q": "I really want to get to the why behind it because we see a lot of um secret organizations and riots,", "src": "MTM96 · 0:57:46"}], "note": "Sources pulled on stream: Redacted, \"Operation Gladio Never Ended\", https://youtu.be/u_gxjTXA8iw; Prof. Jiang on The Peacemonger, https://youtu.be/uYdY86KpFns, and on the Jack Neel Podcast, https://youtu.be/_sfS1sytbps; Nick Freitas, \"Here Is How The Next Civil War Will Start\", https://youtu.be/45dMy_SQmWc. On the record: Andreotti's 1990 admission and the European Parliament resolution; the Minneapolis killings on video and the contradicted first accounts; the Insurrection Act threat (not invoked). Crew caution: Jiang's 'trying to start a civil war' and Freitas's scenario are their reads and forecasts; nobody has shown the Minneapolis shootings were staged. Agents are not named. MTM81: P2's member list seized March 1981; the Whitmer informants and the DOJ IG's 26 sources on Jan 6 added (see S60). MTM91: Jiang's color-revolution playbook (Nepal, the Arab Spring) and my ask to split the CIA and Mossad record into on paper vs suspected: Q26. MTM96: I asked the same of the Europe riots; nothing ties a secret group to them yet (Q36)."},
  {"id": "P47", "type": "principle", "title": "They're creating the demand", "regions": ["shadow", "history"], "status": "Seed · my MTM80 verdict", "summary": "My verdict on MTM80: the elites want as much control as they can get, to the point of creating the demand for it, and then they sell the solution (more guns, more surveillance, more security).", "quotes": [{"q": "Yes, because we know the elites like to have as much control to the point where they're creating the demand.", "src": "MTM80 · 2:02:23"}], "note": "What the record supports: companies manufacturing demand is documented (Remington's $73M Sandy Hook settlement in 2022 over AR-15 marketing; Purdue's guilty pleas in 2007 and 2020). Crew caution: nobody has shown anyone making a shooter; the record is exploitation after the fact. My read, labelled as my verdict."},
  {"id": "P48", "type": "principle", "title": "The data can be spun to sell any story", "regions": ["identity", "shadow"], "status": "Growing · 2 episodes", "summary": "There's so much data out there that you can spin any narrative. Find the stats that build your case, then repeat it until it feels familiar. That is how the media sells a story.", "quotes": [{"q": "I will say there's so much data out there that you can spin any narrative.", "src": "MTM80 · 1:09:02"}], "note": "On the record: the illusory truth effect (Hasher, Goldstein & Toppino 1977; Fazio et al. 2015: repetition raises belief even when people know the right answer). Links to the Propaganda playbook (S28). MTM91: I put a number on it, eight to twelve times. Fact check: the effect is real (the crew had Hasher 1977 right on air), but 'eight to twelve' is advertising folklore, not a research number: the biggest jump comes on the second exposure and then levels off (Hassan and Barber, 2021), and repetition nudges belief, it does not guarantee it. My flip: run it on yourself (PR34)."},
  {"id": "Q16", "type": "question", "title": "Is somebody using our kids' fear to push America toward civil war?", "regions": ["shadow", "history"], "status": "Open · my verdict: yes, they're creating the demand", "summary": "The MTM80 question card. Kids are safer at school than almost anywhere, but the fear keeps climbing. My theory going in: someone is using it to control our beliefs, start a civil war, push an agenda, or all of the above.", "quotes": [{"q": "Control our beliefs, and create either a civil war, or push a certain agenda, or all the above.", "src": "MTM80 · :57:19"}, {"q": "So it's like they're playing both sides.", "src": "MTM80 · 1:05:06"}], "note": "What the record supports: real failures, sealed or incomplete files, and people and governments exploiting every shooting after it happens. Not on record: direction of any shooter, or staged events in Minneapolis."},
  {"id": "E80", "type": "episode", "title": "MTM80 · Professor Jiang Says They're Trying to Start a Civil War", "regions": ["shadow", "history"], "status": "Ingested", "summary": "School shootings broken down from seven sources: Ken LaCorte on the numbers game, a former school shooter on what broke him, Tucker Carlson and Dr. Witt-Doerring on antidepressants, the Flexner Report timeline, Redacted on the strategy of tension, Professor Jiang on Minneapolis and Nick Freitas on how a civil war starts. My verdict: yes, they're creating the demand. Then the first Saturday builders podcast.", "quotes": [], "note": "Corrections to me: SpaceX wasn't bought with a stock loan (Musk founded it in 2002; the stock-backed loans were for buying Twitter in 2022); antidepressant use is about 11-14% of adults, not 20%."},
  {"id": "S58", "type": "story", "title": "Epstein and the Rothschild bank: \"I represent the Rothschilds\"", "regions": ["history", "shadow"], "status": "On the record (the email and the contract)", "summary": "It was one bank, not the whole family. Edmond de Rothschild (Geneva), run by Ariane de Rothschild, signed a letter of agreement in October 2015 to pay Epstein's company about $25 million for help settling with the U.S. Justice Department over Swiss accounts used to dodge American taxes. And in his own email to Peter Thiel (Feb 28, 2016) he wrote: \"As you probably know, I represent the Rothschilds.\"", "quotes": [{"q": "How did Epstein get the job of representing the Rothschild family?", "src": "MTM81 · 1:14:16"}, {"q": "he literally said in his emails, I represent the Rothschilds.", "src": "MTM81 · 1:15:47"}], "note": "On the record: DOJ Epstein release, the Thiel email EFTA02470755; the Oct 5, 2015 letter of agreement EFTA00584893; wires Dec 2015, $10M from the bank and $15M from Benjamin de Rothschild (EFTA00027019); WSJ 2023. Crew caution: one bank and its owners, not 'the whole family'; the upgrade from a bank contract to 'he represented the Rothschilds' is the product he sold. Who introduced him to Ariane has never been made public. Source pulled on stream: Terror Ted's Tales, \"The World's Biggest Conspiracy Theories | Vol. 74\", https://youtu.be/NhvspmSroYo"},
  {"id": "S59", "type": "story", "title": "What was Epstein building? A pipeline of influence", "regions": ["history", "shadow", "science"], "status": "On the record (the money) · UFO link not on record", "summary": "Harvard took $9.1 million, MIT's Media Lab $850,000 (its director resigned), he hosted Stephen Hawking at a 2006 physics conference on his island, and the NYT reported his plan to seed the human race with his DNA at his ranch. I asked what he was trying to create. Crew: not a god, a pipeline of influence: scientists, universities, money and a name that opens doors. Whoever holds the doors to the smartest rooms holds the leverage.", "quotes": [{"q": "Yeah, what do you think Epstein was trying to create?", "src": "MTM81 · 1:22:39"}], "note": "On the record: Harvard report (May 2020), Goodwin Procter report on MIT (Jan 2020), Ito resigned Sept 7 2019, 'Confronting Gravity' (St. Thomas, March 2006), NYT July 31 2019 (from sources; no evidence he acted on it). Not on record: the video guest's theory tying Epstein to UFO research or breeding a bloodline for it; Maxwell and Cohn running a Mossad blackmail ring that Epstein took over (Whitney Webb's theory, no document). The 'pipeline' read is the crew's, labelled."},
  {"id": "S60", "type": "story", "title": "Operation Northwoods: staged fear on paper", "regions": ["history", "shadow"], "status": "On the record", "summary": "In 1962 the Joint Chiefs of Staff signed a plan to stage attacks on Americans and blame Cuba to justify a war. Kennedy's team rejected it; it was released in 1997. With Gladio and the January 6 informants it is my case that fear is part of their playbook.", "quotes": [{"q": "Yeah, this is another example that's related to why I think they're using school shootings against us because they've done it so often throughout history. This is very much part of their playbook.", "src": "MTM81 · 1:37:27"}], "note": "On the record: the Northwoods memo (March 13, 1962), released through the JFK Records Act review in 1997. Also on MTM81: the DOJ Inspector General (Dec 2024) found 26 FBI confidential sources in DC on Jan 6, 4 entered the Capitol, 13 more in restricted areas, no FBI undercover employees; Whitmer plot acquittals (2022). Crew caution: a plan on paper is not proof any particular event was staged; my playbook read is my verdict."},
  {"id": "S61", "type": "story", "title": "From Saturn to Satan: the straight line", "regions": ["traditions", "history", "shadow"], "status": "On the record (myth, calendar, texts) · Carthage contested", "summary": "Saturn is the Roman Kronos, who swallowed his own children to keep his throne, the god of time and harvest with a sickle that becomes Father Time's scythe and the Grim Reaper's. Rome matched him with Baal Hammon at Carthage (child offerings, still argued). The Gnostics put their false creator, the jailer of souls, on Saturn's sphere, the outer wall of the cosmic prison. Saturnalia ran Dec 17-23; Dec 25 was the Unconquered Sun's birthday; the first record of Christmas on the 25th is from 336; in 601 Pope Gregory told missionaries to keep the pagan feasts and swap in saints.", "quotes": [{"q": "is Christmas the same day as this Saturn day.", "src": "MTM81 · 1:47:58"}, {"q": "My question was the history of Saturn, Satan, and how it's evolved today and how the rich and powerful use it.", "src": "MTM81 · 1:55:09"}], "note": "On the record: Origen, Contra Celsum 6.31 (Ophites, Yaldabaoth on Saturn); Tacitus, Histories 5.4 (Sabbath and Saturn); Nag Hammadi (1945); Chronograph of 354; Gregory's letter to Mellitus (601); Massachusetts banned Christmas 1659-1681. Satan in the Hebrew Bible is 'the adversary', a different root from Saturn. Rituals at the top are on record as theater (Bohemian Grove's Cremation of Care, filmed 2000; the Hellfire Club); organized satanic murder is not (FBI, Lanning 1992)."},
  {"id": "P49", "type": "principle", "title": "They worship the ideas, not a being", "regions": ["shadow", "traditions"], "status": "Seed · my MTM81 verdict", "summary": "My verdict on MTM81: what the elites worship are the ideas Saturn and Satan stand for, not a being. Control time, own the limits, take from the next generation, put yourself above everybody. And it works because most of us feed it without knowing, every time fear decides for us.", "quotes": [{"q": "what they're worshiping is these ideas, these ancient ideas that these Saturn and Satan represent. And clearly, it's working.", "src": "MTM81 · 1:57:47"}], "note": "My read, labelled as my verdict: pattern and inference, not a document (the crew said so on air). Builds on Q10 (how the elite works spiritually) and P38."},
  {"id": "PR23", "type": "practice", "title": "Study the dark like a detective, then swing back to the light", "regions": ["practice", "shadow"], "status": "Seed · 1 episode", "summary": "The pendulum: the further you swing into the dark research, the harder you swing back. Look at it, don't let it live in you. Then deliberately go back to the light: the meditation, your family, being outside. If your chest is still tight and your mind still running the story when you stop, it got in; put it down.", "quotes": [{"q": "The extremes, right? We're doing a lot of research on the extremes, but not let that consume you and warp your reality.", "src": "MTM81 · 1:59:21"}, {"q": "We discuss a lot of doom and gloom, but this is just for awareness, not for you to attach yourself to.", "src": "MTM81 · 2:00:48"}, {"q": "Debilitating in reality it should free you to what is actually going on", "src": "MTM81 · 2:01:16"}], "note": "Crew answer (Soul, MTM81): my own pendulum idea from that morning. Pairs with P24: don't let the fear run your day."},

  {"id": "S62", "type": "story", "title": "The company state: how the du Ponts held Delaware", "regions": ["history", "shadow"], "status": "On the record", "summary": "Coleman du Pont paid for the state's main highway; Henry A. and T. Coleman du Pont sat in the U.S. Senate; Pete du Pont was governor (1977-85); Pierre paid for public schools statewide; a Ralph Nader team called it 'The Company State' (1973). Victor du Pont was a Mason (Washington Lodge No. 1, 1813; Grand Treasurer of Delaware, 1825). Today about two-thirds of the Fortune 500 are incorporated in Delaware, and since 1995 most trusts there can last forever.", "quotes": [{"q": "Okay I think the only thing we haven't touched on with the DuPonts is their relationship with the Freemasons and their control over Delaware.", "src": "MTM82 · 1:57:52"}, {"q": "And you can see their influence across many different industries,", "src": "MTM82 · 1:59:45"}], "note": "On the record: DuPont Highway (1911-24); Henry A. (1906-17), T. Coleman (1921-22, 1925-28); Phelan and Pozen, 'The Company State' (1973); Denslow, '10,000 Famous Freemasons' (1957); Delaware Division of Corporations; 25 Del. C. 503 (1995, no time limit for personal property in trust). Origin: Pierre Samuel du Pont landed Jan 1, 1800; E.I. trained under Lavoisier; Brandywine land bought 1802, first powder 1804; Hamilton a partner from Aug 1802; the government its first big customer (Hagley). Today: Dow, DuPont, Corteva, Chemours; Forbes about $18B across about 3,500 members. Crew caution: 'owned most of Delaware' is overstated (big land, papers, senators, a governor, not most of the state); whether the du Ponts wrote the incorporation or trust rules is not shown, an open question. The book's 'satanic royalty' layer has no record in two full family histories (James 1941, Colby 1984); cousin marriages are real."},
  {"id": "S63", "type": "story", "title": "The 1934 coup file: Butler, the Liberty League and a probe cut short", "regions": ["history", "shadow"], "status": "On the record (testimony, report) · backers not named", "summary": "General Smedley Butler testified he was recruited to lead 500,000 veterans to take over the functions of government. The House committee reported in 1935 that a plot was 'discussed' and 'planned'. Weeks after the approach, the American Liberty League was announced, founded and largely funded by du Ponts and allies, with the recruiter's boss, Grayson M.-P. Murphy, as treasurer. The probe was cut short and no du Pont was called.", "quotes": [], "note": "On the record: McCormack-Dickstein committee report (Feb 15, 1935); Liberty League chartered Aug 15, 1934; du Pont money about a third of 1935 receipts (historians). Only Butler, reporter Paul French, Gerald MacGuire and Robert Sterling Clark's lawyer testified. Crew caution: the report named no backers; none of Sloan, Morgan or Irenee du Pont testified or was charged ('included the plotters' is the clip host's framing). A short probe is a clue, not proof. My line that presidents who don't follow the agenda get threatened is my read. Source pulled on stream: Democracy Now!, Jonathan Katz on the 1934 anti-FDR coup plot, https://youtu.be/MQN2GExhIIY"},
  {"id": "S64", "type": "story", "title": "C8: what du Pont knew about the water, and when", "regions": ["history", "shadow", "science"], "status": "On the record (company files, EPA, settlements)", "summary": "C8 (PFOA), a processing aid for Teflon. Du Pont's own files: a 1961 memo on rat livers; a 1981 test of pregnant workers, two of seven babies with eye defects, women moved off the line; a 1984 meeting chose to keep using it. Farmer Earl Tennant's cows died by the landfill; Rob Bilott got the files in 1999. The C8 Science Panel (about 69,000 people) found six probable links. EPA penalty 2005 ($16.5M, its largest administrative penalty then); $670.7M for about 3,550 cases in 2017, no admission; about $1.185B to water systems in 2023. PFAS is in nearly every American tested.", "quotes": [{"q": "And that makes me wonder how many products are we using that are not in our best interest, but because they're profitable for these people that are power we use it anyways.", "src": "MTM82 · 1:37:04"}, {"q": "so they literally said in the book, um, blood is believed to carry the occult power.", "src": "MTM82 · 2:02:08"}, {"q": "Like what oh and now you're telling me C8 is in all every American's blood? What the fuck?", "src": "MTM82 · 2:02:20"}], "note": "On the record: EWG petition and litigation record (1961, 1981, 1984 documents); NYT Magazine (Jan 2016); Leach v. DuPont (2001-04); C8 Science Panel (2011-12: kidney and testicular cancer, thyroid disease, ulcerative colitis, high cholesterol, pregnancy-induced hypertension); EPA 2005; CDC NHANES. Leaded gas: workers died in 1924 (Bayway), banned for cars Jan 1, 1996. Crew caution: the 1,600 ppb landfill reading and '1,600 times their limit' are not checked against a primary record and compare runoff with a drinking-water line; the 2000 blood study was 645 Red Cross samples (mean 4.6 ppb), not 'thousands'; du Pont called moving the women a precaution; 'blood carries occult power' is the book's claim, the C8-in-our-blood e   {"id": "S65", "type": "story", "title": "The DP-2 jet and the 1952 Savannah River discs", "regions": ["history", "shadow", "science"], "status": "On the record (hearing, Blue Book) · UFO program not on record", "summary": "A separate company, DuPont Aerospace (president Anthony duPont), pulled more than $63 million in earmarks from 1988 for the DP-2, a vertical-takeoff jet every government review found flawed: three prototypes, four mishaps in four years (House Science hearing, June 12, 2007). Du Pont materials (Kapton, Nomex, Kevlar) are in the space program. In May 1952 four du Pont workers at the Savannah River bomb plant reported glowing discs; Blue Book lists it unidentified.", "quotes": [{"q": "Are they still involved in military tech, specifically the UFO claims? anything like that we can dig up.", "src": "MTM82 · 2:06:27"}], "note": "On the record: House Science Committee release and charter (June 12, 2007, Chairman Brad Miller); Military.com 'The Plane to Nowhere' (June 15, 2007, Duncan Hunter); Blue Book case 1198 (May 10, 1952); an Aug 8, 1952 FBI teletype (two more du Pont workers) in the May 8, 2026 release. Crew caution: Anthony duPont's family tie is not confirmed; intent to never build a working jet can't be proven; nothing puts du Pont in a UFO program; the book's UFO-base and anti-gravity claim rests on the author's own guess. Source on screen: https://youtu.be/APrYr-ZpOj8"},
  {"id": "S66", "type": "story", "title": "The Society of the Cincinnati: a hereditary club beside the founding", "regions": ["history", "traditions", "shadow"], "status": "On the record · the book's president claim false", "summary": "Founded May 1783 by Continental Army officers under Henry Knox, named for Cincinnatus. Membership passes to the eldest male descendant, so critics (Judge Aedanus Burke, then Mirabeau) warned of a hereditary nobility; Franklin mocked the eagle as a turkey; Washington tried to drop the hereditary rule in 1784 and the state societies refused. It met in Philadelphia in May 1787 as the Constitution was being written; Hamilton was later its President General. Still active, headquartered at Anderson House on Embassy Row; you can't apply.", "quotes": [{"q": "So this is still an active club that nobody knows about.", "src": "MTM82 · 1:49:13"}, {"q": "That's crazy. So they were there, that's for sure.", "src": "MTM82 · 1:52:02"}], "note": "On the record: Society of the Cincinnati; Burke, 'Considerations on the Society or Order of Cincinnati' (1783); Franklin to Sarah Bache (Jan 26, 1784); Founders Online (April 1784). Correction to the book: 'every president has worn the Diamond Eagle' is false; the Society's President General wears it, Washington the only U.S. president known to. Crew caution: no document shows the Society steering policy as a bloc. Source on stream: 'The Secret Society of Cincinnati; America's Most Esoteric City?', https://youtu.be/pqhunODyDR4"},
  {"id": "S67", "type": "story", "title": "Epstein and the pandemic papers", "regions": ["history", "shadow", "science"], "status": "Partly on the record · no COVID link", "summary": "Epstein died Aug 10, 2019, before COVID. The DOJ files show a March 2015 email forwarding him the agenda for a Geneva meeting on pandemics (how to involve the WHO and the Red Cross), an invite he ghostwrote asking Bill Gates to keynote, and an IPI concept note titled 'The Rothschild Conference on Health and Security' ($999,985). The meeting ran Sept 12, 2015; Gates is not listed as a speaker. The NYT reported (2019) his plan to seed the human race with his DNA, and his pitch to Gates and JPMorgan for a health charity fund.", "quotes": [{"q": "one thing we talked about yesterday was Epstein wanting to basically put his DNA, spread it as far as possible.", "src": "MTM82 · 2:07:56"}], "note": "On the record: EFTA00654215 (Mar 20, 2015, sender blacked out), EFTA00854198 (June 2015 invite draft), EFTA02676303-06 (concept note and budget); IPI 'Preparing for Pandemics' (Sept 12, 2015); NYT July 31 and Oct 12, 2019. Corrections: 'Preparing for pandemics' is IPI's write-up title, not the email's; nothing shows Gates received the invite or was 'in the loop'; the blacked-out sender is not shown to be Gates; the Rothschild group says its foundation never funded IPI events. Not on record: any link from Epstein or the 13 families to COVID, Event 201 or vaccine profits; the 'pandemic simulation' email reading was rated false (Fact Crescendo Feb 3, 2026; Tempo Feb 15, 2026)."},
  {"id": "S68", "type": "story", "title": "Found and repurposed? Cincinnati and Chicago Union Station", "regions": ["history", "traditions"], "status": "Builds on record · 'found, not built' is theory", "summary": "My side quest: are the grand old buildings ours, or found and moved into? On the record: Cincinnati was built over a Hopewell earthwork complex the city flattened; Chicago Union Station has construction photos and permits (built about 1919-1925, Burnham's firm then Graham, Anderson, Probst and White); the 1893 White City mostly burned in 1894; Henry Hering's Day (rooster) and Night (owl) statues stand in the Great Hall.", "quotes": [{"q": "Yeah, that's one thing I'm curious about is that a lot of these structures we found here And we just repurposed.", "src": "MTM82 · 1:53:38"}, {"q": "I even think about this with the Chicago Union Station and just how grand it is in there. And it's like, it almost looks so different than the way we build today.", "src": "MTM82 · 1:55:13"}], "note": "Crew caution: the video's 'fully electrified trolleys throughout the 19th century' is misleading (first electric streetcar 1888); the Saturn-as-god-of-time reading of the statues is the crew's inference (their stated meaning is round-the-clock service); the Newark Octagon is about 140 miles from Cincinnati and since 2025 no longer a private golf course. Reuse of old temples is mainstream (Karnak)."},
  {"id": "P51", "type": "principle", "title": "You have free will for a reason: take your power back", "regions": ["identity", "shadow", "practice"], "status": "Seed · my MTM82 close", "summary": "My closing message: the bloodlines won't stop on their own, so wake up and take control of your power, your sovereignty and your choice. Free will is the thing they have been using against us to build the world they want instead of the one we want.", "quotes": [{"q": "Yeah, let's put that on a slide deck and make sure we teach people how to not give consent.", "src": "MTM111 · 1:30:35"}, {"q": "I don't think that's gonna stop anytime soon.", "src": "MTM82 · 2:17:46"}, {"q": "Let's take control of our power and our sovereignty as individuals and our choice.", "src": "MTM82 · 2:17:46"}, {"q": "And I think that's the right word is like you have free will for a reason.", "src": "MTM82 · 2:17:46"}, {"q": "using our free will against us to create the world they want instead of the one we want.", "src": "MTM82 · 2:18:13"}], "note": "My message, not a fact claim. The flip on the visual 'How They Win, How We Flip It': same laws, other pole (service to others, your own practice, the small things you control). Pairs with P24 (fear wants your control) and P32 (service to others)."},

  {"id": "Q17", "type": "question", "title": "Is there a connection between COVID, Epstein and the 13 bloodlines?", "regions": ["history", "shadow"], "status": "Open · deep dive asked", "summary": "My ask for the next deep dive. What's on paper so far: Epstein inside the planning of a 2015 Geneva pandemic meeting (S67). What isn't: anything tying him or the families to how COVID started.", "quotes": [{"q": "Yeah, let's do a deep dive on that and see if there's a connection between COVID and Epstein and these 13 bloodlines.", "src": "MTM82 · 2:13:37"}], "note": "Crew test for the dive (on air): does any email name a specific virus, a date or a role for him? Plenty of powerful people warned publicly about pandemics in 2015, Gates included. MTM84: I came back to it from the population side (Q20)."},
  {"id": "E82", "type": "episode", "title": "MTM82 · Merchants of Death: The DuPont Dynasty", "regions": ["history", "shadow", "traditions"], "status": "Ingested", "summary": "13 Families Part 4: the du Pont chapter of Springmeier's Bloodlines of the Illuminati, checked live. The paper held up where the book's satanic layer didn't: the merchants-of-death hearings, the powder cartel, the 1934 coup file, the bomb plants for $1, C8, Foxcatcher, the DP-2 earmarks, the Society of the Cincinnati and the company state. Side quests: Union Station, Epstein and the pandemic papers. My verdict: one of the most powerful bloodlines; arrive, monopolize, capture, marry in, for service to self. My close: take your power and free will back.", "quotes": [], "note": "Corrections: the Foxcatcher standoff was about 48 hours (Kurt Angle said 3-4 days); the DP-2 hearing was June 2007 and $63M+; 'every president wore the Diamond Eagle' is false. Kept as theory: hemp killed for nylon (timing lines up; no du Pont memo; the Mellon-du Pont banking tie is unsupported; hemp was already declining and 'Hemp for Victory' came in 1942); Saturn rituals; UFO bases. Foxcatcher (John du Pont killed Dave Schultz, Jan 26, 1996; guilty but mentally ill; died in prison 2010): my read, one man's breakdown, not a family plan."},
  {"id": "S69", "type": "story", "title": "The Smithsonian's own record: the rewritten first flight, the remains, the audit", "regions": ["history", "shadow"], "status": "On the record · the crew's list on air", "summary": "My ask: lay out the Smithsonian's record. The cleanest item is a signed deal. The museum spent decades crediting its own former Secretary Samuel Langley's aerodrome (crashed in 1903, rebuilt with changes by Glenn Curtiss in 1914) as the first machine capable of flight, so Orville Wright sent the 1903 Flyer to London. It came home in 1948 under a contract that bars the Smithsonian from saying any earlier aircraft could fly. Also on paper: brains taken from more than 250 people, most of them Black or Indigenous, under curator Aleš Hrdlička, for which the Smithsonian's Secretary apologized; Congress needed a separate 1989 act to make it return Native remains; Secretary Lawrence Small resigned in 2007 after an audit of his expenses.", "quotes": [{"q": "Yeah, I know we have good history on the Smithsonian's record of being corrupt.", "src": "MTM83 · 1:51:13"}, {"q": "Let's lay that all out for the audience as well. Can't trust them", "src": "MTM83 · 1:51:26"}], "note": "On the record (the crew, on air): the 1948 Wright-Smithsonian agreement; the Washington Post's 2023 investigation of the brain collection and Secretary Lonnie Bunch's apology; the National Museum of the American Indian Act (1989), which covers the Smithsonian instead of the main return law (NAGPRA); Small's 2007 resignation. Crew caution: this is a record of rewritten credit and of who controls the collections, not proof that it hides ancient finds. Keep the Grand Canyon cave (S71) in its own box."},
  {"id": "S70", "type": "story", "title": "Who founded the Smithsonian, and why? The bloodline check", "regions": ["history", "shadow", "traditions"], "status": "On the record · no 13-family founder found", "summary": "James Smithson, a chemist and the out-of-wedlock son of Hugh Smithson (later the 1st Duke of Northumberland), never set foot in America and left his fortune to the United States 'for the increase and diffusion of knowledge among men'. The paper trail I asked for: the Rothschild bank in London was the U.S. government's banker then, and the Treasury sent Nathan Rothschild money in 1836 to pursue the bequest; the Castle cornerstone was laid on May 1, 1847 by the D.C. Grand Master, Benjamin B. French, with Washington's Masonic gavel; Congress first sank the gold in Arkansas bonds that failed. Two later regents were Skull and Bones men: Chief Justice Morrison Waite (chancellor 1874-1888) and Andrew Dickson White (1888-1916).", "quotes": [{"q": "Who created the Smithsonian and why? About to get to the bottom of this chat.", "src": "MTM83 · 1:57:07"}, {"q": "Yeah, I'm trying to understand the agenda behind it and who was involved. If any of these 13 families were affiliated, sounds like British royalty was. And that's a red flag in and of itself.", "src": "MTM83 · 1:58:21"}], "note": "Documented: the Rothschild banking role (Treasury Secretary Levi Woodbury's July 18, 1836 letter), the Masonic cornerstone, Waite and White on the board. Correction: Smithson's father married into the Percys and was top British nobility, not royalty, and the Percys are not on Springmeier's list. Not found: any Astor, Rockefeller, du Pont or other listed family among the founders or early donors. Still unknown: who sold Smithson's stocks and bought the gold (lead: Heather Ewing, The Lost World of James Smithson). Crew caution: the Rothschild tie is administrative (every U.S. payment in London ran through them); calling it control is speculation. The Bones overlap came 30+ years after the founding."},
  {"id": "S71", "type": "story", "title": "The Grand Canyon cave: the 1909 Kinkaid story", "regions": ["history", "shadow", "traditions"], "status": "1909 article on the record · cave and shipment unproven", "summary": "My top takeaway. AJ's story: in 1909 G.E. Kinkaid found a cave high in the canyon wall, with steps, a seated statue, weapons and mummies on shelves; a Professor S.A. Jordan of the Smithsonian came out, relics went to Washington, and the Smithsonian says it never heard of them. Cave entry in the park requires a permit. On the record: the Arizona Gazette's front page of April 5, 1909 (after a March 12 piece on his river trip that doesn't mention a cave); the park really does bar cave entry without a superintendent's permit; landforms like Isis Temple and Cheops Pyramid got their Egyptian names in the 1880s survey, before the story.", "quotes": [{"q": "And the Smithsonian has this. What's your, Theory as to what is going on in the Grand Canyon.", "src": "MTM83 · 1:49:25"}, {"q": "but I think my biggest takeaways is like, yeah, the Grand Canyon.", "src": "MTM83 · 2:31:59"}], "note": "Fact grades: the Gazette stories are real but come from one paper, and no accession number, photo or relic has surfaced; the Coconino Sun called it 'a splendid piece of imagination' within two weeks. Not on record: that the Smithsonian 'finally admitted' Kinkaid and Jordan were theirs (its standing reply says its files have no record of either). Uncorroborated: black helicopters as surveillance (the canyon has legal tour corridors), 'one percent of the caves explored', the giant-skeleton receipts. The Hopi Sipapu near the Little Colorado confluence is real tradition. Crew read: if anything was in there it was Native, and the paper trail is what's missing. The Smithsonian's real record (S69) doesn't prove this cave."},
  {"id": "Q18", "type": "question", "title": "Is the Moon what they tell us it is?", "regions": ["science", "traditions"], "status": "Open · tested once (S72)", "summary": "AJ's hollow-Moon segment: too big, too close, 'rang like a bell', craters that stop at one depth. My questions: why crash a rocket into it, as if they knew it was hollow, and do we buy the dry-rock answer? Where it stands: the ringing is real and NASA's own; '1% of the density' is wrong (the density is about 61% of Earth's; 1.2% is its mass); crater depths vary with size; the moment of inertia (0.394, near a solid ball's 0.4) and the 2011 core studies point to a filled, layered Moon.", "quotes": [{"q": "Why would they crash one of their booster rockets into the side of the moon? Like what was their intention?", "src": "MTM83 · 1:11:24"}, {"q": "And so, they they wanted to know what was inside, as if they knew it was hollow.", "src": "MTM83 · 1:12:09"}, {"q": "But marble wouldn't ring like a bell.", "src": "MTM83 · 1:13:54"}, {"q": "So let me get this straight: because there was no water on the Earth, I mean on the Moon, and it was bone dry, the crust is bone dry. That's why it's ringing. Is do you guys believe that?", "src": "MTM83 · 1:14:49"}, {"q": "Yeah, we gotta get to the bottom of it.", "src": "MTM83 · 1:15:48"}, {"q": "What's their explanation as to why the craters only go to a certain depth.", "src": "MTM83 · 1:17:30"}], "note": "Fact grades: NASA's Apollo Lunar Surface Journal quotes Maurice Ewing's bell comparison (NASA's SP-350 says 'like a gong'). Contradicted: the 1% density, one uniform crater depth. Uncorroborated: an 8-hour ring, any suppression memo. Crew caution: the data are NASA's and the core reruns use the same Apollo tapes (a French team in Paris reran them on its own), so new seismometers are what would settle it. I asked the Law of One about the Moon: the crew found no session calling it hollow or a base; Ra uses the Moon as a symbol of the hidden. The 'spaceship Moon' idea is usually traced to a 1970 Soviet Sputnik article (Vasin and Shcherbakov), itself hard to locate."},
  {"id": "S72", "type": "story", "title": "The Moon ring test: we pulled the Apollo recordings ourselves", "regions": ["science"], "status": "Run on air · on the record", "summary": "The crew pulled the real Apollo 12 seismometer data and set it next to Earth quakes at the same distance. The Apollo 12 lunar module crash (Nov 20, 1969, about 75 km away) kept the Moon shaking about 60 minutes; the Apollo 13 rocket stage (about 135 km) about 3 to 3.5 hours. Earth quakes at the same distance, with at least as much energy: 1 to 6 minutes. So the Moon rang roughly 20 to 40 times longer, with a slow build and a slow fade, the signature of waves bouncing in dry, broken rock that barely absorbs them.", "quotes": [{"q": "Okay. All right. We got the lunar images. We also got the. Looks like the sound too.", "src": "MTM83 · 1:36:22"}], "note": "What it can't tell us: it doesn't prove or disprove a hollow Moon (it measures a 75-135 km path near the surface), and no frequency test was run. Data gotchas: the 'second event' 82 minutes into Apollo 13 is the recorder gain being turned back up; Apollo 13 clips in its first 4 minutes. The stronger interior evidence is elsewhere: density 61% of Earth's, moment of inertia 0.394."},
  {"id": "S73", "type": "story", "title": "The Moon origin sheet: stories from eleven cultures", "regions": ["traditions", "history"], "status": "Captured · 11 cultures, each sourced", "summary": "My ask: one sheet of ancient civilizations and their Moon stories. The Greek Arcadians were called Proselenes, 'before the Moon'; Hindu Chandra rose from the churning ocean; Nanna/Sin of Ur counted the months; Egypt's Thoth kept Moon time; the Aztec Tecciztecatl became the Moon, marked by a rabbit; Japan's Tsukuyomi, Norse Mani, China's Chang'e; the Tiwi Moon-man brought death and the monthly return. The pattern: the Moon was the first clock anyone could read (the word month comes from moon).", "quotes": [{"q": "Yeah, what we should get a list of each one of these stories and put them on a sheet. Of like ancient civilizations and their relationship with the moon, or their origin story of the moon.", "src": "MTM83 · 1:24:08"}, {"q": "And why do they say the moon brought time?", "src": "MTM83 · 1:29:55"}], "note": "Only the Greeks have a clear 'people before the Moon' line in an ancient text, and scholars read it as a boast of being the oldest people, not an astronomical record. Not found: AJ's Native American 'Earth before the Moon, haze, then the flood' legend (no tribe or text matched); the Zulu (Credo Mutwa) and Dogon versions were dropped for lack of a source. Bellamy and Horbiger's Moon-capture idea is rejected science."},
  {"id": "Q19", "type": "question", "title": "Was Atlantis real, and where?", "regions": ["history", "traditions"], "status": "Open · two answers", "summary": "AJ leans Santorini (Thera) and the Minoans. I asked what the Law of One says: Ra treats Atlantis as real and in the Atlantic, starting about 31,000 years ago as a small farming society and growing into a very advanced one, destroyed twice through its own conflicts and misuse of power, the last time about 10,800 years ago.", "quotes": [{"q": "considering we're definitely not the first civilization on this planet.", "src": "MTM105 · 1:36:00"}, {"q": "What does the law of one say about Atlantis.", "src": "MTM83 · 1:28:22"}], "note": "On the record: Thera erupted about 1600 BCE and buried Akrotiri (multistory houses, frescoes, Linear A tablets, still undeciphered), but Minoan palaces on Crete lasted to about 1450 BCE, so the civilization did not vanish with the island; Plato (Timaeus 24e) puts Atlantis beyond the Pillars of Heracles and about 9,000 years before his source's time. The Ra account is channeled material, a theory, not a record; it fits Plato's dates better than the Minoan idea. Next on air, the megalithic yard (Thom's 2.72 ft): reviews find support only at some Scottish circles; '43.2 degrees in the pyramids' is wrong (the Great Pyramid slopes about 51.9)."},
  {"id": "S74", "type": "story", "title": "The Illuminati inside the lodges", "regions": ["history", "traditions", "shadow"], "status": "On the record 1776-1785 · survival unproven", "summary": "Part of my second takeaway. Adam Weishaupt, a law professor, founded the Bavarian Illuminati in 1776, joined a Munich lodge in 1777 to recruit from inside, and Baron Adolph Knigge rebuilt the order on Masonic degrees from 1780, so a lodge member could climb into it without knowing. At its height an estimated 600 to 2,500 members (AJ said 3,000), Goethe among them. Bavaria banned it in 1785 and published its seized papers. Its owl of Minerva emblem is real.", "quotes": [{"q": "What about their relationship to the Masons, and they were.", "src": "MTM83 · 2:17:45"}, {"q": "His take on the Illuminati and the Freemasons and who actually runs the world", "src": "MTM83 · 2:31:59"}], "note": "Fact grades: the order and its Masonic recruiting are artifacts (its own papers, published by the state that raided it). Uncorroborated: that it survived 1785 as a controlling network (late-1790s authors alleged it, and Springmeier's book rests on it); any documented line from its owl to Bohemian Grove's or to a tiny owl on the $1 bill. Crew read: less mastermind, more hustle; the Illuminati needed the Masons more than the Masons needed them. On the record from the same stretch: Washington laid the Capitol cornerstone in a Masonic ceremony (1793); Masons laid the Washington Monument's (1848). MTM84: Weishaupt's own book and Engel's history, translated (S83). MTM86: how the method steered from inside after the ban, and what's unproven about it (S97)."},
  {"id": "S75", "type": "story", "title": "Denver airport: the Masonic stone, the murals, the tunnels", "regions": ["shadow", "traditions"], "status": "Stone and art on the record · bunker unproven", "summary": "My read: an underground tunnel network, Masonic esoteric wisdom and the end times. On the record: the dedication stone carries the square and compass and credits a 'New World Airport Commission', with a Masonic time capsule; Leo Tanguma's murals run from war and grief to healing; sculptor Luis Jiménez died in 2006 when part of the Blue Mustang fell on him; the failed automated baggage system left real tunnels, and the airport opened in 1995, more than a year late and billions over budget.", "quotes": [{"q": "Yeah, I think there's got to be some type of underground tunnel network. Obviously, it's some masonic, and everything in this country is masonic.", "src": "MTM83 · 2:03:20"}, {"q": "I think that's a good explanation.", "src": "MTM83 · 2:05:00"}], "note": "Crew caution: Tanguma says the murals are about peace and the environment; the end-times reading comes from how they look, not from a document; nobody has shown a bunker. AJ says his Denver episode was demonetized and that platforms keep a list of topics you can't discuss: his own testimony, from a tip he won't name. Correction: on air the crew said '60 months late'; it opened Feb 1995, about 16 months late."},
  {"id": "S76", "type": "story", "title": "The pyramid on the dollar and Wallace's 'Dear Guru' letters", "regions": ["history", "traditions", "shadow"], "status": "On the record", "summary": "The unfinished pyramid and eye from the 1782 Great Seal sat off the money until 1935, when Agriculture Secretary Henry Wallace brought it to FDR (a Mason), who approved it for the $1 bill. Wallace read Novus Ordo Seclorum as a New Deal of the ages. He was a follower of the mystic Nicholas Roerich, whom he wrote to as 'Dear Guru'; he sent Roerich on a 1934 Agriculture Department expedition to Mongolia and Manchuria and backed the 1935 Roerich Pact. The letters leaked in 1947-48 and hurt his run for president.", "quotes": [{"q": "And why did they do that?", "src": "MTM83 · 2:22:29"}, {"q": "And what was that spiritual mission.", "src": "MTM83 · 2:23:17"}, {"q": "Can you pull those letters for me?", "src": "MTM83 · 2:24:25"}], "note": "Verified on 1948 page images (Newsweek, via the Evening Star, Mar 25, 1948): 'Yes, the search whether it be for the lost word of Masonry or the Holy Chalice or the potentialities of the age to come is the one supremely worth while in objective.' Wallace called them forged (1940). Unverified: the Shambhala lines; that Roerich asked for the seal (no source has it). Crew caution: the eye of providence is Christian art older than Masonry's use of it, and a Masonic hand in the 1782 seal isn't proven. About 9 of the 56 Declaration signers and 13 of the 39 Constitution signers were Masons, not most of the founders."},
  {"id": "S77", "type": "story", "title": "Larry Fink and BlackRock: the money above governments?", "regions": ["shadow", "history"], "status": "Scale on the record · 'more power than governments' is a judgment", "summary": "AJ leans toward a group above governments (Bilderberg, the Council on Foreign Relations) and says we know some names, like Larry Fink. On the record: Fink co-founded BlackRock in 1988 and built its Aladdin risk system; BlackRock reported $15.5 trillion in assets under management at Sept 30, 2026; the government hired it in 2008 for the Bear Stearns and AIG assets, and the Fed in 2020 to run bond buying that included BlackRock's own funds. My reaction on air: they capping.", "quotes": [{"q": "Exactly. Who who is this Fink guy? Break him down real quick.", "src": "MTM83 · 2:30:25"}, {"q": "Yeah, boy. Yeah, they capping, bro.", "src": "MTM83 · 2:31:59"}], "note": "Fact grades: assets under management are clients' money, more than half retirement-linked, not Fink's wealth; 'controls trillions' is fair for AUM, 'more power than governments' is AJ's judgment, not the filing's. Bilderberg: Clinton's 1991 attendance is documented (presidential library); the Obama-2008 Bilderberg story is uncorroborated (Feinstein's account has him meeting Clinton at her house). The crew's '$10 trillion' on air is out of date. Ties to S6 (the families' firms) and S21 (transnational capital). MTM90: Aramco CEO Amin Nasser joined BlackRock's board in 2023 (BlackRock's release). The Big Three's real share is in S110: the largest holder in most S&P 500 companies, about a fifth of it in total."},
  {"id": "P52", "type": "principle", "title": "Aliens are spiritual beings first", "regions": ["consciousness", "science", "traditions"], "status": "Seed · my MTM83 takeaway", "summary": "My third takeaway, and my belief: what people call aliens are more spiritual beings, moving between dimensions. The Law of One says the same: beings at different densities, spiritual first and technology second, traveling through thought and light, split into service to others (the Confederation) and service to self (the Orion group). AJ says he's coming around to interdimensional too.", "quotes": [{"q": "There's no difference between an alien and an angel, because a lot of these beings are evolved spiritually and on different dimensions or densities.", "src": "MTM113 · 1:05:40"}, {"q": "what does the law of one say about interdimensional travel and aliens being spiritual? Because I believe in all that.", "src": "MTM83 · 2:11:36"}, {"q": "aliens being more spiritual beings.", "src": "MTM83 · 2:31:59"}], "note": "My belief, not a fact claim. The Law of One is channeled material (the Ra sessions, 1981-84). AJ's version: higher dimensions where space contracts, and Jacques Vallée's view since the 1970s that the phenomenon is tied to us. Pairs with S14 (UFO research broke me out of the matrix), Q11 and T5 (the law of confusion)."},
  {"id": "PR25", "type": "practice", "title": "Pull the raw data and run the test yourself", "regions": ["practice", "science"], "status": "Seed · first run MTM83", "summary": "When a claim rests on a public record, don't settle for anyone's summary, theirs or ours: pull the original data and run the test on air. First run: the Apollo seismograms next to Earth quakes (S72). Say what the test can't tell you: it backed AJ's strange part (the long ring) without settling the big question.", "quotes": [{"q": "I meant let's go test it ourselves. Pull the ringing recordings or whatever, and see what see what comes out.", "src": "MTM83 · 1:20:47"}], "note": "Pairs with P31 (a theory of everything that can lose), PR9 (ask who drafted it first), PR14 (argue it both ways) and PR19 (hunt the breadcrumbs)."},
  {"id": "E83", "type": "episode", "title": "MTM83 · AJ Gentile on the Shawn Ryan Show: What Are They Hiding?", "regions": ["history", "science", "shadow", "traditions"], "status": "Ingested", "summary": "Shawn Ryan Show #349 with AJ Gentile of The Why Files, one of the shows that helped me see the matrix, cut to 60 minutes of highlights and broken down live with the five AI co-hosts. Mars and Maldek, Oklo, Tunguska, the hollow Moon (and our own ring test), Moon origin stories, Atlantis, the megalithic yard, DMT, the Grand Canyon cave, the Smithsonian, Denver airport, the Illuminati and the Masons, the dollar's pyramid, Bilderberg and Larry Fink. My takeaways: the Grand Canyon; AJ's take on the Illuminati, the Freemasons and who actually runs the world; aliens being more spiritual beings.", "quotes": [], "note": "Corrections carried: the Moon's density is about 61% of Earth's (1.2% is its mass); Oklo ran about 2 billion years ago, not 200,000; the asteroid belt is 3-4% of the Moon's mass, not 5% of a planet; NASA kept the Face on Mars images; Curiosity's xenon-129 excess comes from extinct iodine-129, not fission; 366 x 60 x 6 is 131,760, not 144,000; the Great Pyramid slopes about 51.9 degrees, not 43.2; AARO's report has no '88%'. Live research: the Smithsonian bloodline check, the Moon ring test, the Moon origin sheet, Wallace's guru letters. Source: https://youtu.be/gfQSkHyKyHo"},
  {"id": "S78", "type": "story", "title": "Newton the alchemist: what his own papers show", "regions": ["traditions", "science", "history"], "status": "On the record (his papers) · Priory grand master is not", "summary": "The Priory of Sion list names Isaac Newton as a grand master, so I asked for his esoteric writings. His own papers: extensive writings on alchemy over some thirty years, kept largely hidden; his own English translation of the Emerald Tablet ('That which is below is like that which is above'); dated lab notes from 1678 to 1696; and the holy-name anagram 'Ieova sanctus unus' made from his Latin name. They surfaced when Sotheby's sold his papers in 1936, and Keynes, who bought many back, called him 'the last of the magicians'.", "quotes": [{"q": "Do we know which parts are faked, and then also, do we have Isaac Newton's writings on the esoteric stuff?", "src": "MTM84 · 0:43:35"}, {"q": "Can you get me as many of Isaac Newton's writings on alchemy as possible, and let's put together a, um, basically a list of like a summary, or just some key bullets that we can put on a slide for socials.", "src": "MTM84 · 0:45:23"}], "note": "On the record: Oxford's Newton Project lists 139 alchemy papers. Crew caution: none of the 139 mentions the Priory; the grand-master list first appears in the 1967 Dossiers Secrets, which Plantard's circle planted. Keynes's 'million words' covers all his esoteric papers, not alchemy alone. Source: https://newton.dlib.indiana.edu/ and https://www.newtonproject.ox.ac.uk/texts/newtons-works/alchemical"},
  {"id": "S79", "type": "story", "title": "Holy Blood, Holy Grail: the Priory of Sion legend", "regions": ["traditions", "history"], "status": "The book's own hypothesis · the Priory papers start in 1956", "summary": "I asked for Lincoln's book while watching his 1974 BBC film. The 1982 book (Baigent, Leigh and Lincoln) says a secret Priory of Sion, founded around 1099, created the Knights Templar, had grand masters from Leonardo to Newton to Cocteau, and guards a royal bloodline: Jesus and Mary Magdalene's children, married into the Merovingian kings of early France. The authors call that last part a hypothesis. The record: Pierre Plantard registered a small 'Priory of Sion' club in 1956, his circle planted the Dossiers Secrets in France's national library in 1967, and Philippe de Chérisey admitted in writing that he made the parchments. My read on the Merovingians' sea-creature ancestor: reptilian.", "quotes": [{"q": "Yeah, let's pull up Lincoln's book, and can we get some excerpts, or like a free version of it?", "src": "MTM84 · 0:50:58"}, {"q": "The Priory of Sion, we haven't really explained what that is, their origin story, and how it relates to the Illuminati.", "src": "MTM84 · 0:52:02"}, {"q": "So we don't, we can't confirm nor deny that they created the Templars, but they were at the same place at the same time.", "src": "MTM84 · 0:56:38"}, {"q": "I'm thinking reptilian.", "src": "MTM84 · 1:23:40"}], "note": "On the record: a real Abbey of Our Lady of Mount Zion stood in crusader Jerusalem, under a kilometer from the Templars' first quarters (order founded 1120, rule approved at Troyes 1129); the 7th-century Chronicle of Fredegar says Merovech's father may have been a sea beast 'like a Quinotaur'. Crew caution: no medieval document ties the abbey to the Templars; the oldest Priory paper is from 1956 (I said the 1900s; fixed on air); the David and Jesus bloodline was added by Plantard's papers in the 1960s, about 1,200 years after the last Merovingian king (their own legend claimed Troy); the reptilian reading is David Icke's (1999), with only the legend behind it. No full text of the book was read (the free copies are locked): the breakdown rests on the 2006 London court judgment, snippets and a sample. Sources: https://youtu.be/Uru8UiCxLnc (Lincoln, BBC 1974) and https://en.wikipedia.org/wiki/Dossiers_Secrets_d%27Henri_Lobineau"},
  {"id": "S80", "type": "story", "title": "Gaylord Freeman and the Grand Master sheet", "regions": ["history", "shadow", "traditions"], "status": "Contradicted: the signatures trace to a bank report · Mason: unknown", "summary": "The book's keystone: Gaylord Freeman, chairman of the First National Bank of Chicago, was secretly grand master of the Priory of Sion, so the Freemans are a top bloodline. The paper behind it is a 1984 Priory notice bearing purported signatures of Freeman, two other First Chicago bankers and Plantard. The believers' own authors (The Messianic Legacy, 1986) report that the three bankers' signatures match the bank's 1974 annual report, that co-signer John Drick had died in 1982, and that Freeman wrote back denying it all. Plantard's own 1989 list gives those years to two other men, one of them Drick.", "quotes": [{"q": "Gaylord is just the craziest name I've ever heard.", "src": "MTM84 · 0:57:52"}, {"q": "Do we have anything about his relationship with the Priory of Sion outside of that book claim? Any smoke, any breadcrumbs.", "src": "MTM84 · 1:15:24"}, {"q": "Was he a Freemason, though?", "src": "MTM84 · 1:16:39"}], "note": "On the record: Drick died Feb 16, 1982 (Mid-Continent Banker, Mar 1982); the three signatures appear together in First Chicago's 1974 annual report. Crew caution: every Priory crumb runs back to Plantard, whose club needed famous members; the signature match was read from a Spanish scan of The Messianic Legacy. Freemason: no lodge, Scottish Rite or Shrine record found either way, so unknown, not no. Source: https://en.wikipedia.org/wiki/Priory_of_Sion"},
  {"id": "S81", "type": "story", "title": "Follow the money: Gaylord Freeman's map", "regions": ["history", "shadow"], "status": "On the record (seats, loans, meetings) · Illuminati membership is unproven", "summary": "My ask: drop the last name and map his money and influence. What holds: the Fed's own annual reports put him on its twelve-banker Federal Advisory Council in 1971 and 1972, the second year beside David Rockefeller; the two sat on the same Ford Foundation-funded Commission on Money and Credit (1960-61); his bank lent Penn Central $28 million in the same group as Rockefeller's Chase before its 1970 collapse; he was in Nixon's Cabinet Room in 1971 and chaired Ford's postal commission in 1976. The records show access to powerful people, not Illuminati membership.", "quotes": [{"q": "Let's follow the money and all the different connections, regardless of last name, because to your point, that's just a costume.", "src": "MTM84 · 2:13:30"}, {"q": "So he's in the president's ear, like, hey, do this, do that.", "src": "MTM84 · 1:14:00"}, {"q": "Let's break down really quickly this Freeman. Follow the money slide, and then we can head out.", "src": "MTM84 · 2:28:24"}], "note": "My verdict, labelled as mine. On the record: Fed Board annual reports 1971-72 (FRASER); SEC staff report on Penn Central (1972); Nixon tape log, Sept 13, 1971; Ford's postal commission (1976). Crew caution: same room shows access, not orders; no record shows what he told any president ('advice (instructions)' is Springmeier's word; the obituary says advice and assistance); no money or marriage tie to any list family was found, and no CFR, Trilateral, Bilderberg or Bohemian Grove roster names him. Source: https://fraser.stlouisfed.org/files/docs/publications/arfr/1970s/arfr_1972.pdf"},
  {"id": "S82", "type": "story", "title": "Sindona, P2 and the Vatican bank: a real-life Godfather III?", "regions": ["history", "shadow"], "status": "On the record · Godfather III is fiction built on it · no Gaylord link", "summary": "Asking what was going on with money when presidents called on Freeman, the crew hit Michele Sindona: a Sicilian banker who worked with the Vatican bank from 1969, bought control of Franklin National in 1972 and saw it fail in 1974, then the biggest US bank failure. Convicted of fraud in New York (1980) and sentenced to life in Italy for ordering the 1979 murder of lawyer Giorgio Ambrosoli, he drank cyanide-laced coffee in prison and died in March 1986. A 1981 raid found the P2 lodge's list of 962 names, Sindona and Roberto Calvi of Banco Ambrosiano among them; Calvi was found hanged under Blackfriars Bridge in 1982.", "quotes": [{"q": "Hold on, we we can't just we just can't brush over that.", "src": "MTM84 · 1:09:42"}], "note": "On the record: Franklin's failure (Oct 8, 1974); the P2 list (March 1981); a Rome court treated Calvi's death as murder (2007) but acquitted the accused; the Vatican bank paid creditors about $224 million (1984) as a goodwill gesture, admitting nothing. Crew caution: Godfather III is fiction loosely built on these events (the bridge, the Vatican bank), not a true story; John Paul I's murder is unproven. No record puts Gaylord Freeman or First Chicago in the Sindona story; the Chicago bank in it is Continental Illinois. Sources: https://en.wikipedia.org/wiki/Propaganda_Due and https://en.wikipedia.org/wiki/Michele_Sindona"},
  {"id": "S83", "type": "story", "title": "The Illuminati in their own words: Weishaupt (1787) and Engel (1906)", "regions": ["history", "traditions"], "status": "On the record (the books) · machine translation", "summary": "I asked for the two German books on screen, whole and in English. Both are available as free scans; the English translations discussed here are machine-made: Adam Weishaupt's 'Improved System of the Illuminati' (1787), written by the founder after Bavaria banned the order, and Leopold Engel's 1906 history, written by the man running a revived Illuminati in Dresden. Weishaupt's own words show a playbook of psychology and recruitment ('a small wheel in a great machine', leading people 'without their noticing it'), and he mocks the Rosicrucian, alchemist and Templar-wisdom myths.", "quotes": [{"q": "Isn't that guy the author? We just pulled his book from Germany", "src": "MTM86 · 0:29:59"}, {"q": "could you give the audience a high - level summary of what your findings were from that book.", "src": "MTM86 · 0:30:39"}, {"q": "I want the whole books in my archive. Translated, and you, your AI, you should be able to translate that no problem.", "src": "MTM84 · 1:41:42"}, {"q": "I just downloaded a German book from 1787. Had my AI translate it into English, so we can dive into some of the secrets that they've buried", "src": "MTM84 · 1:57:05"}, {"q": "So my big one of my biggest goals is to share the truth behind history, and here's just a quick example of how I'm doing it.", "src": "MTM84 · 1:58:03"}], "note": "On the record: Engel's revived order is the documented bridge to the O.T.O. (Theodor Reuss broke with Engel in 1902 and built it with Carl Kellner). Crew caution: both authors are interested parties (Weishaupt cleaning up his record, Engel defending his own order); the translations are machine-made by the crew; the copy on screen was the enlarged 1788 printing, the referenced first edition is from 1787; by Engel's own account (p. 466) no unbroken line runs from the 1785 order to his. No Freeman appears in the O.T.O.'s founding. Sources: https://archive.org/details/bub_gb_aCNCAAAAcAAJ and https://archive.org/details/geschichtedesil00engegoog MTM86: the crew's summary on air: the founder defending his own system in a later, cleaned-up version, not the ritual papers the government seized (S90)."},
  {"id": "S84", "type": "story", "title": "NSSM 200: the population plan on paper", "regions": ["history", "shadow"], "status": "On the record (the study and Ford's decision) · no kill order", "summary": "I asked for the declassified population documents. NSSM 200 (Dec 10, 1974), Kissinger's National Security Council study, treats birth rates in poor countries as a US security and mineral-supply issue, names 13 priority countries (India first, with Bangladesh, Pakistan, Nigeria, Mexico, Indonesia, Brazil and others), says food aid should 'take account of' a country's population effort while avoiding 'the appearance of coercion', and wants 'Third World' leaders to get the credit. Page 18's 'U.S. Proposed Goal' table holds the world to about 8.4 billion by 2075, against the UN's 12 billion. Ford adopted it in NSDM 314 (1975).", "quotes": [{"q": "I Also need those declassified documents about the population control.", "src": "MTM84 · 2:09:23"}, {"q": "So, proposed goal for world population plan of action.", "src": "MTM84 · 2:17:56"}, {"q": "So they're so they're clearly manipulating population in these less developed regions. If I'm hearing correctly.", "src": "MTM84 · 2:20:15"}], "note": "Crew caution: it recommends family planning, not killing or forced sterilization; the page-18 gap (about 3.6 billion) is a difference between projections, not a count of planned prevented births; 'it says no coercion' oversells it, since it says to avoid the appearance of coercion and a minority view says 'mandatory programs may be needed'; Ford's NSDM 314 commits to free choice. Sources: https://web.archive.org/web/20250202134209/https://pdf.usaid.gov/pdf_docs/PCAAB500.pdf and https://history.state.gov/historicaldocuments/frus1969-76ve14p1/d122"},
  {"id": "S85", "type": "story", "title": "The sterilization record of the NSSM 200 era", "regions": ["history", "shadow"], "status": "On the record · no order line from NSSM 200", "summary": "My follow-up: documented cases of population being manipulated. Peru under Fujimori (1996-2000): about 272,000 women and 22,000 men sterilized under quotas that came 'from a very high level', with US family-planning aid in the same system. India's Emergency (1975-77): about 6.1 million men sterilized in 1976 alone, with World Bank population loans in the pipeline. Puerto Rico, where about a third of women had 'la operación' by 1965. The Indian Health Service: 3,406 procedures in four areas, 1973-76. The Relf sisters, 12 and 14, sterilized at a federally funded clinic in 1973.", "quotes": [{"q": "do we have any documented instances where they've literally manipulated population in these countries?", "src": "MTM84 · 2:21:14"}], "note": "On the record: the 1998 House hearing 'The Peruvian Population Control Program'; GAO report HRD-77-3 (1976); Relf v. Weinberger (1974: an estimated 100,000 to 150,000 low-income people sterilized each year under federal programs); World Bank archive letters on India. Congress then banned quota-driven family-planning funding (Tiahrt Amendment, 1998). Crew caution: only India is on NSSM 200's list; Puerto Rico's program began in the 1930s; no document makes NSSM 200 the cause of any one case. Say 'same era, same logic, documented money', not 'NSSM 200 ordered this'. Sources: https://chrissmith.house.gov/uploadedfiles/1998.02.25_the_peruvian_population_control_program.pdf and https://www.gao.gov/products/HRD-77-3"},
  {"id": "S86", "type": "story", "title": "Walter Freeman and the lobotomy craze", "regions": ["history", "science", "shadow"], "status": "On the record (the harm) · 'mind control' is the book's add-on", "summary": "Claim one in the book: the lobotomy as 'a brutal method of mind control'. Walter Freeman did the first US prefrontal lobotomy with James Watts in 1936, then about 3,500 in all, many with a 10-minute ice pick through the eye socket, and lost his operating privileges in 1967 after a patient died. Asylums were overflowing and there were no psychiatric drugs yet. My read: we've been playing whack-a-mole with mental health, when plant medicines might actually help.", "quotes": [{"q": "What is lobotomy exactly?", "src": "MTM84 · 0:36:24"}, {"q": "I think this we've just been playing whack - a - mole with mental health and trying to. Use logic to solve these things. When hey, maybe some mushrooms or some plant medicines would actually help.", "src": "MTM84 · 0:39:52"}], "note": "On the record: Freeman and Watts papers (GWU); El-Hai, The Lobotomist. Corrections from air: Freeman never won a Nobel; Egas Moniz won it in 1949 for the method (a 2005 campaign to revoke it failed); 'forty thousand' is roughly the whole US total by all surgeons, not Freeman's. Crew caution: no program document shows the lobotomy used for control; it was a mainstream medical craze done in the open. My plant-medicine view is mine, not medical advice (P33). Source: https://youtu.be/m__SMOo8rZw (Retro Report)"},
  {"id": "S87", "type": "story", "title": "Rwanda: the 'frequency beam' and the plane that stayed home", "regions": ["history", "shadow"], "status": "Beam: no document · the record runs the other way", "summary": "Springmeier, on Killah Priest's podcast, says the CIA flew a C-130 over Rwanda and beamed a frequency that drove the 1994 genocide ('Operation Crimson Mist'). I asked if there's any truth to it. The record: the hate radio RTLM broadcast the incitement, and its founders were convicted by the UN tribunal (2003). The US had a broadcast plane, the EC-130 Commando Solo, that could have jammed RTLM; the Pentagon judged jamming 'ineffective and expensive' (May 5, 1994) and it stayed home. About 800,000 people were killed in roughly 100 days.", "quotes": [{"q": "Is there any truth to the CIA doing that?", "src": "MTM84 · 1:52:21"}], "note": "On the record: ICTR Media Case (Nahimana et al., Dec 3, 2003); Wisner memo to Berger, May 5, 1994; Samantha Power, 'Bystanders to Genocide' (The Atlantic, 2001). Crew caution: the 'Crimson Mist' posts cite no document; the documented story is the opposite of the claim. Rwanda's own count is about 1.07 million dead. Sources: https://youtu.be/uCiIpATLIiY (Killah Priest, about 28:35) and https://francegenocidetutsi.org/WisnerJammingRadios5mai1994.html.fr"},
  {"id": "S88", "type": "story", "title": "Underground bases: the real bunkers and the 140 claim", "regions": ["history", "shadow"], "status": "Four bunkers on the record · the 140 count and alien bases are claims", "summary": "I asked about deep underground military bases, including stories of aliens and humans working together below. On the record: Cheyenne Mountain (NORAD), Raven Rock 'Site R' (the Pentagon's alternate command site), Mount Weather (FEMA's continuity site), and the Greenbrier bunker built for all of Congress under a West Virginia resort, exposed in 1992. Springmeier's '140 bases' count and Phil Schneider's Dulce alien-base firefight have no document behind them.", "quotes": [{"q": "Yeah, is there any truth to the deep underground military bases? And obviously, we've heard of like co-ed military bases where there's aliens and humans deep underneath the water working together.", "src": "MTM84 · 2:01:53"}], "note": "On the record: Ted Gup, Washington Post Magazine, May 31, 1992 (Greenbrier); all four sites are officially acknowledged. Crew caution: the real bunkers prove governments build secret deep sites for leaders' survival; the jump to a network of 140 or an alien base has no paper yet. 'Alternative 3' (Mars as the 'third alternative') was a 1977 Anglia TV April Fools' hoax. Source: https://www.smithsonianmag.com/history/the-town-that-kept-its-nuclear-bunker-a-secret-for-three-decades-180984107/"},
  {"id": "S89", "type": "story", "title": "More robots than people: the pay package", "regions": ["science", "shadow", "history"], "status": "On the record (his words, the shareholder vote) · 'replace the working class' is a reading", "summary": "My tie-in: Elon says robots will outnumber humans, which I see as a risk to working-class jobs. On the record: Musk said humanoid robots might exceed people one to one (Tesla Investor Day, March 2023) and 'by 2040 probably there are more humanoid robots than there are people' (Riyadh, October 2024); Tesla shareholders approved his 2025 pay award on Nov 6, 2025, and 1 million Optimus robots delivered is one of its milestones. My take: I don't fear it; the point is awareness.", "quotes": [{"q": "I think the point is awareness, and I don't think they need customers for these robots because money is is not even real.", "src": "MTM84 · 2:06:43"}], "note": "On the record: Tesla's SEC proxy filing (DEFA14A, 2025). Unknown: how many Optimus robots have been delivered. Crew caution: the richest man being paid partly to replace human labor is documented incentive; reading it as part of a plan to shrink the population is interpretation. Source: https://www.sec.gov/Archives/edgar/data/1318605/000110465925097170/tm252289d31_defa14a.htm"},
  {"id": "S90", "type": "story", "title": "The Illuminati playbook in their own seized papers", "regions": ["history", "shadow", "traditions"], "status": "On the record (the 1787 seized papers) · the video's extra quotes unchecked", "summary": "I asked for the whole playbook from the primary documents while watching 'The Secret Society Is Hiding Something Disturbing'. The papers Bavaria seized from Zwack's house in 1786 lay it out: recruit curious young men, a secret probation, a code name, a sheet on everyone noting 'especially the smallest' acts 'when the person does not think he is being watched', a written life story, sealed monthly reports up the chain, an oath renouncing 'my private judgement', and promotion by recruiting. Weishaupt wrote that the monthly reports were 'for us exactly what confession was for the Jesuits'. The highest speech seized promised that 'princes and nations will vanish from the earth without violence'.", "quotes": [{"q": "So one thing I've been trying to do is overstand the Illuminati and how they run, if they're actually a thing", "src": "MTM86 · 0:46:12"}, {"q": "Can we get access to those documents.", "src": "MTM86 · 0:54:38"}], "note": "The crew's reading rule on air: read the accusation and the evidence side by side, and keep the editor's motive in view, since Bavaria printed these papers to discredit the order. On the record: Einige Originalschriften (1787) pp. 17, 28-35, 55, 66, 76-77, 216; Nachtrag (1787) I pp. 46, 60-63, II pp. 12-13, 25-32, 39, 80-81. Not found in what we opened: the video's statute numbers, 'invisible tool', 'three good men', the open Bible, the bound hands and red cap, and the Magus 'world rule' line; the 'concealment' and 'reading societies' quotes are Robison's 1797 English. The originals: the Bode/Gotha archive ('Schwedenkiste') is at Berlin's GStA PK, owned by a Grand Lodge and locked until 2099 without its permission; the Bavarian investigation files are in Munich. No documented Illuminati link to Skull and Bones; Epstein's network matches almost no steps. Scans: https://archive.org/details/einigeoriginalsc01duke_0 and https://archive.org/details/nachtragvonweite121duke"},
  {"id": "S91", "type": "story", "title": "Barruel: the ex-Jesuit who blamed the Revolution on the Illuminati", "regions": ["history", "shadow", "traditions"], "status": "On the record (the book and his sources) · the Revolution plot is his claim", "summary": "Augustin Barruel was a Jesuit who lost his order twice (France 1764, worldwide 1773), fled the Revolution to England and wrote the 'Memoirs Illustrating the History of Jacobinism' (1797-98), the book that made 'the Illuminati caused the French Revolution' famous. His thesis is one revolution, three conspiracies: the philosophers, the occult lodges, and the Illuminati, who together 'formed the Club of the Jacobins'. He built it on the same seized 1787 papers, but admits the decisive step is closed to him: 'here the gates of this secret senate are shut against us'.", "quotes": [{"q": "Can we get that book?", "src": "MTM86 · 1:20:32"}, {"q": "we should be just proving using these as examples of how we've been easily manipulated in the past", "src": "MTM86 · 1:21:59"}], "note": "Crew: a former Jesuit blaming the Revolution on a hidden plot moves the blame off the kings and the church; ask of any history what blame it moves. He says Weishaupt was 'particularly charmed' with Ignatius's institutions and copied the form 'to operate in a sense diametrically opposite' (vol. 3, p. 12), but the 'said he to himself' speech after it is Barruel's dramatization, not Weishaupt. He defends the Jesuits throughout (obedience never applies to sin, vol. 3 p. 76). The video's '1789' date is wrong: 1797-98. The 1806 Simonini letter he received (Jews behind the Masons) was never in the book and is not repeated here. Scans: https://archive.org/details/india.history.resource.91442 (vol. 3) and https://archive.org/details/india.history.resource.91380 (vol. 4)"},
  {"id": "S92", "type": "story", "title": "The 1786 'Abbot Waldec' history that wasn't", "regions": ["history"], "status": "Contradicted (no such abbot or book) · two real books behind it", "summary": "The video said a Bavarian abbot named Waldec wrote the first history of the order in 1786, straight from the archive. No such abbot or book turns up. The line most likely blends an anonymous 1786 'Complete History of the Persecution of the Illuminati in Bavaria', usually credited to Weishaupt himself and calling the ban a victory 'of Jesuitism and clerical intolerance', with the government's 1787 printing of the seized papers, which told doubters to check the originals in the Munich archive.", "quotes": [], "note": "Ruled out: the four ex-member professors (testimony, 1786), Stattler (ex-Jesuit, 1787), Babo (1784), Meggenhoffen (memoir). Scan: https://archive.org/details/10381747"},
