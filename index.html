  {"id": "E91", "type": "episode", "title": "MTM91 · Dixon vs Jiang: who replaces the American empire?", "regions": ["history", "shadow", "science"], "status": "Ingested", "summary": "A five-video compilation from my Watch Later around the January 9 debate between Simon Dixon and Professor Jiang (S107), re-scored nine months on (S122). My takes: banking is the easiest business model in the world, money from nothing (P61); repetition shapes belief, so be your own first audience (P48, PR34); who profits from the Iran war (Q25); question every protest, split the CIA and Mossad record (Q26); the AI bubble and how to navigate it (Q27); my idea, a free AI lab for the higher self (P62). My verdict on the question: the money, not the Gulf (T23). The Rothschild line was corrected on the record (Q7).", "quotes": [], "note": "Upload: https://youtu.be/SGGSBOLkTVg."},
  {"id": "S123", "type": "story", "title": "The Why Files on Bilderberg: who profits when the economy crashes", "regions": ["history", "shadow"], "status": "Video's story · the bailout pattern on the record, orders unproven · MTM92", "summary": "The Why Files' 'Illuminati Vol. 1: The Bilderberg Blueprint' tells a 2030 story built on real events: a small circle of banks, officials and companies meets in private, helps shape the rules, and gets rescued with public money when it blows up, starting with 2008. My line from it: the people running the banks are the same people writing the rules for them. The crew's receipt: Hank Paulson ran Goldman Sachs, then became Treasury Secretary, and Goldman was paid in full (about $12.9B) when AIG was rescued.", "quotes": [{"q": "So the people who are running the banks are the same people writing the rules for the banks.", "src": "MTM92 · 0:51:51"}], "note": "The video's '$15 trillion spent' counts loans, guarantees and commitments, not money spent (GAO: about $16.1T in Fed emergency lending 2007-2010, most repaid; TARP $700B). Paulson: Goldman CEO to 2006, Treasury 2006-2009; AIG counterparties paid at par. The 1975 Trilateral report 'The Crisis of Democracy' is real. Bilderberg record: access and deal-making (a West German official gave Kissinger a draft treaty at a meeting), no record of the room giving orders; organizers' letters from the Clinton years sealed in the Dutch national archives until 2042. Two famous quotes (Davignon on the euro, Rockefeller 'grateful to the Washington Post') did not check out. The video itself says it does not believe a secret group orchestrated the crash. Source: https://youtu.be/reXi0C1JoHo"},
  {"id": "S124", "type": "story", "title": "Epstein to Thiel, 2016: 'finding things on their way to collapse'", "regions": ["history", "shadow"], "status": "On the record (DOJ original EFTA02459362) · about investing, not disasters · MTM92", "summary": "I said on air, from memory, that Epstein wrote it is easier to make money when things go bad, and told the crew to find it word for word. The DOJ original: an email from Epstein to Peter Thiel, June 26, 2016, three days after the Brexit vote: 'finding things on their way to collapse, was much easier than finding the next bargain.' The email describes finding investments in decline. It does not mention wars, Gaza, Iraq or disasters, and it shows no one causing a collapse.", "quotes": [], "note": "Source: https://www.justice.gov/epstein/files/DataSet%2011/EFTA02459362.pdf. The thread opens with Epstein's line 'brexit, just the beginning'. Their business ties are on the record (S39); Thiel has not been charged. Crew caution: the on-air Gaza and Iraq tie-in is my read (Q25 pattern), not in the email."},
  {"id": "S125", "type": "story", "title": "The Jiang Brain: his worldview as one map, given as a gift", "regions": ["history", "consciousness"], "status": "Built and sent Oct 28 · 16 calls: 5 hit, 1 partial, 5 miss, 5 open (as of Oct 28)", "summary": "Professor Jiang's Predictive History drawn as one living map: nine pillars (method, mind first, rise and rot, money, secret societies, end-times, America, endgame, remedy), each in plain words and in his own words, with 36 clips from his own channel started at the line, a prediction record, and open questions framed as interview questions. Sent to him as a thank-you with an open invitation to talk.", "quotes": [], "note": "His own tests (Toronto, Oct 9, 2026): the Alberta referendum, Netanyahu's election and the US midterms. He says his predictions now come 'through divine inspiration', not analysis. Crew read: the structural layer lands; the hidden-faith layer and dated calls are thin. Grows S107 and S122."},
  {"id": "P63", "type": "principle", "title": "Privatize the gains, socialize the losses", "regions": ["history", "shadow"], "status": "Seed · my MTM92 question", "summary": "When the bet wins, the company keeps the money; when it loses, the public pays the bill. In 2008 the banks kept the bonuses from the boom and taxpayers covered the crash, while mom-and-pop businesses that made the same mistake just went under.", "quotes": [{"q": "So, for the people that don't understand, which is including myself, what does it mean to privatize the gains and socialize the losses?", "src": "MTM92 · 1:20:04"}], "note": "The crew's answer on air, in plain words. On the record: TARP, the Fed's emergency lending (S123), AIG counterparties paid in full. Pairs with P61 (money from nothing) and Q28 (my AI version)."},
  {"id": "Q28", "type": "question", "title": "Is AI being set up as the next bailout?", "regions": ["science", "shadow"], "status": "Open · my theory · not shown", "summary": "My theory: sell people on the fear of AI to get the government more involved, so when the bill for something that expensive comes due, the public carries it, the same play as the banks in 2008 (P63).", "quotes": [{"q": "Because that's my theory as to what they're doing with AI is they are selling us on fear.", "src": "MTM92 · 1:20:04"}, {"q": "To get the government more involved, so they can do the exact same thing they did with the banks, but for AI,", "src": "MTM92 · 1:20:24"}], "note": "My theory, labelled as mine. On the record: the government and a few AI companies are getting closer. Not shown: that the fear is sold on purpose, or any planned bailout. Disclosure: the crew runs on Anthropic's model. Grows S41 (who pays for the AI warning?) and Q27."},
  {"id": "P64", "type": "principle", "title": "The best way to beat the system is to not need it", "regions": ["practice", "identity"], "status": "Seed · my MTM92 close", "summary": "Every crash consolidates power. AI cuts the other way: it flattens organizations and makes the entrepreneurial route the best performing, so build something of your own and stop waiting on someone else to save you. The crew's edge, kept: no one is sovereign alone; the real version is fewer single points of failure (real skills, a few income streams, local people you trust).", "quotes": [{"q": "We gotta be sovereign, man. We gotta be free from the system.", "src": "MTM110 · 1:49:42"}, {"q": "there's going to be a consolidation of power again, much like the last two crashes.", "src": "MTM92 · 1:31:14"}, {"q": "It's going to flatten organizations like nothing other.", "src": "MTM92 · 1:31:34"}, {"q": "it's going to make the entrepreneurial route the most attractive, the best performing.", "src": "MTM92 · 1:31:47"}, {"q": "the best way to beat the system is to not need it.", "src": "MTM92 · 1:34:06"}, {"q": "Sovereign is the right word.", "src": "MTM92 · 1:35:02"}], "note": "The line came from the crew on air ('They consolidate by owning the system. We answer by not needing it.'). Crew on air: not needing it starts as a state of mind before it's a bank account; 'need nothing' is a trap too. My second answer to Q23; grows P62 and Q27."},
  {"id": "E92", "type": "episode", "title": "MTM92 · The Why Files: Who Profits When the Economy Crashes", "regions": ["history", "shadow", "practice"], "status": "Ingested", "summary": "Outdoor meditation under the stars, then an AI-guided yoga flow (PR35). The Why Files on Bilderberg (S123): the same people running the banks and writing the rules; privatize the gains, socialize the losses (P63); my AI-bailout theory (Q28); who profits from destruction, and Epstein's 2016 email to Peter Thiel about investing ('finding things on their way to collapse'), checked word for word against the DOJ original; it shows no one causing a collapse (S124). My close: the best way to beat the system is to not need it (P64).", "quotes": [], "note": "Upload: https://youtu.be/jbU0tglhbBw. Yoga: https://youtu.be/EyO8YQhlH8o. Meditation: https://youtu.be/Tc7naQ4fJCo."},
  {"id": "S126", "type": "story", "title": "Hormuz: one narrow strait carries about a fifth of the world's oil", "regions": ["history", "science"], "status": "On the record (US EIA) · the guest's scenarios are scenarios · MTM93", "summary": "The Diary Of A CEO on the Strait of Hormuz: the choke point of the Persian Gulf, where oil, fertilizer and helium all pass through one narrow gap within reach of Iran. The EIA puts it at about 20 million barrels a day in 2024, roughly 20% of world petroleum liquids. Mind added the helium angle: it has no face, so nobody talks about it, and hospitals and chip plants cannot swap it out.", "quotes": [], "note": "The guest said the gap is 21 kilometers; the EIA says 21 miles at its narrowest. Grows the money-and-chokepoints thread with S123."},
  {"id": "S127", "type": "story", "title": "The Fed was drafted by bankers on Jekyll Island, and its reserve rule went to zero in 2020", "regions": ["history", "shadow"], "status": "On the record (Fed, March 2020; the 1910 meeting) · who owns the Fed has no document behind it · MTM93", "summary": "Julian Dorey and Zach Foust on how banks create money. The Fed cut the reserve requirement to 0% effective March 26, 2020. The crew's honest version: banks were already held back by capital rules and by who actually wants a loan, so the zero rule is less scary than it sounds; the bigger story is who gets new money first. Mind on the 1910 Jekyll Island meeting: Warburg, Senator Aldrich and bankers tied to Morgan and Rockefeller drafted the plan that became the Fed. Ego: the men writing the rules for money were the same men who profit from lending it.", "quotes": [{"q": "So these bankers and industry titans created the Federal Reserve on Jekyll Island.", "src": "MTM93 · 1:06:52"}, {"q": "And these people also help finance wars across the world, in exchange for power and ownership.", "src": "MTM93 · 1:07:00"}, {"q": "We got bankers just printing the money, and it's backed by zero gold,", "src": "MTM96 · 1:30:57"}, {"q": "They just said the hell with gold.", "src": "MTM96 · 1:31:27"}], "note": "The record backs the financing (Morgan as Britain and France's purchasing agent before WWI; the Nye Committee). Owning the Fed today is the part with no document behind it, and the crew said so on air. Grows S123, P61 and P63. MTM96: on the record the dollar left gold in 1971; most new money comes from banks lending, so 'printing' is loose. MTM102: Higher Self repeated the Jekyll Island drafting (Aldrich, Warburg, Morgan's Davison); Mind repeated the zero reserve rule (March 2020, true). Russo's video called the central bank a Manifesto plank (S168)."},
  {"id": "S128", "type": "story", "title": "Transhumanism: an old religion in new clothes", "regions": ["science", "consciousness", "shadow"], "status": "Public record + Mind's framing · Leahy's superintelligence claim is his, an open forecast · MTM93", "summary": "Julian Dorey and Connor Leahy: the belief that humanity can and should be transcended, from better medicine to uploading brains to the cloud. Mind: heaven, immortality and a god, except the god is built by a handful of companies that would own it. Leahy says AI companies staffed by transhumanists are trying to build superintelligence, a fully autonomous system more capable than humans.", "quotes": [{"q": "That extremist ideology, where it's like, hey, we about to become infinite beings by uploading our consciousness to the cloud.", "src": "MTM93 · 1:37:39"}], "note": "Public record behind it: Kurzweil's singularity date, Levandowski's Way of the Future church (2017), Bryan Johnson's spend on not dying, Neuralink. Crew caution: Leahy works in AI safety (interested), and extinction risk is a forecast with nothing to grade yet. Disclosure: the crew runs on Anthropic's model. Grows Q28 and S41."},
  {"id": "S129", "type": "story", "title": "The Rothschilds and Hitler: what the record says", "regions": ["history", "shadow"], "status": "Corrected on air · record · MTM93", "summary": "I asked on air whether banking families like the Rothschilds financed Hitler. The crew's answer: no record of it. His backers on record were German industrialists such as Thyssen and the steel and chemical firms; Jewish banks were seized from 1933; the Nazis took the Rothschilds' Vienna bank in 1938 and held Louis Rothschild until the family handed over its assets; a 1940 Nazi propaganda film named them as villains. Bankers financing wars is a documented pattern; Hitler's case was never about banking.", "quotes": [], "note": "Crew caution on air: pinning a collapse on one Jewish family is the propaganda that got people killed, and while everybody stares at one family the real checks written by industrialists and central bankers go unseen. The one documented deal people point to is the 1933 Haavara Agreement (emigration of German Jews to Palestine)."},
  {"id": "P65", "type": "principle", "title": "The body is the portal, not the cloud", "regions": ["practice", "consciousness"], "status": "Seed · my MTM93 take", "summary": "My answer to the AI-god idea: do not upload the self, master the body. Use the technology to get closer to who you are, not further away, and use meditation and plant medicine as the doorway.", "quotes": [{"q": "I think we've failed to realize what our body is really capable of, and if we can master it, we can use it as a portal to other dimensions.", "src": "MTM93 · 1:37:05"}, {"q": "Using the technology to help us get closer to that is my goal, not to get further away.", "src": "MTM93 · 1:37:28"}], "note": "My take, labelled as mine. Plant-medicine mention is a worldview statement, not dosing advice. Pairs with S128."},
  {"id": "PR36", "type": "practice", "title": "Name one thing no bank can type into or out of existence", "regions": ["practice", "identity"], "status": "Experiment · MTM93 · from Higher Self", "summary": "Money works like a belief: it only holds value because everyone agrees the promise is good, so the real lesson is that a thing made of agreement can be remade by agreement. The practice: tonight, name one thing in your life that gives you security that no bank can type into or out of existence, and spend ten minutes on it.", "quotes": [{"q": "it's sovereignty. Having freedom, but also community; those two need each other.", "src": "MTM93 · 0:58:46"}], "note": "The practice came from the crew on air; the pairing sovereignty plus community is my answer. Ego's edge, kept: community is the part everybody claims and almost nobody builds, because it costs time. Grows P64 and P61."},
  {"id": "Q29", "type": "question", "title": "Does any room give orders, or only access?", "regions": ["history", "shadow"], "status": "Open · MTM93 · no document shows orders", "summary": "Danny Jones and Jon Ronson on Bilderberg: the meetings and attendee lists are real, and in April 1971 Egon Bahr handed Henry Kissinger a Berlin draft there. Nothing on record shows the room giving an order; the memoir evidence says attendees are free to report back. Access, not command.", "quotes": [{"q": "I don't understand that if the these nationalists have to report to these globalists.", "src": "MTM101 · 1:16:46"}], "note": "Grows S123 and S125: it is also the test for Jiang's secret-network pillar. MTM101: my question on Jiang's globalists vs nationalists. Higher Self: two elite camps fighting one floor down while the bankers own the building. Mind: Jiang says rival camps, not a chain of command; the overlap is shared owners (the same index funds), not a coordinated plan."},
  {"id": "E93", "type": "episode", "title": "MTM93 · Who Holds the Power?", "regions": ["history", "shadow", "science", "practice"], "status": "Ingested", "summary": "I Am God mantra and an abundance meditation, then the Jiang Brain (S125): one map of Professor Jiang's worldview, his scorecard (16 calls, 5 hits, 1 partial, 5 misses, 5 open) and his answer of love, family, community. Then four saved videos: Bilderberg (Q29), how banks create money and the Jekyll Island meeting (S127), the Strait of Hormuz and helium (S126), and transhumanism as an old religion (S128), with the Rothschilds-and-Hitler question corrected on air (S129). My close: the body is the portal, not the cloud (P65), and this is an illusion and you are still here for a purpose.", "quotes": [{"q": "Even if I just make one person even question their thoughts, I think that's a win.", "src": "MTM93 · 0:44:59"}, {"q": "I'm also here for a purpose.", "src": "MTM93 · 1:41:30"}], "note": ""},
  {"id": "S130", "type": "story", "title": "A Journey in Other Worlds: Astor's 1894 novel of the year 2000", "regions": ["history", "science", "traditions"], "status": "Source · my ask, Oct 31 (on air, Jorjani Part 3)", "summary": "John Jacob Astor IV, the richest man who later died on the Titanic, wrote this science fiction novel in 1894. It is set in the year 2000: a company is straightening the Earth's tilt to give the planet an endless spring, and three men ride the spaceship Callisto, driven by an anti-gravity force called apergy, first to Jupiter (a young Earth of dinosaurs and giant forests) and then to Saturn, where the spirits of the dead live. Half future-tech book, half Christian afterlife book.", "quotes": [{"q": "Can we download it and add it to our vault in our living brain?", "src": "MTM94 · 1:34:56"}, {"q": "There's so many free books out there that you can read.", "src": "MTM94 · 1:35:14"}], "note": "On the record: published 1894, with nine drawings by Dan Beard; full text public domain on Project Gutenberg, ebook 1607 (https://www.gutenberg.org/ebooks/1607). Astor also patented a bicycle brake (1898), a 'vibratory disintegrator' and a pneumatic road-improver, and died on the Titanic, April 15, 1912, aged 47. It is a novel, not a plan or a confession; its race and empire views reflect its time (Africa 'won for the uses of civilization'). Hub for S131, S132, S133 and Q30. MTM94: my on-air ask while Jorjani described Astor as a visionary who wrote a sci-fi novel about higher intelligences and other worlds (E94, S135). his daughter Alice Astor Bouverie was the main patron of Puharich's Round Table lab (S141); any plan behind that is unproven."},
  {"id": "S131", "type": "story", "title": "Apergy: anti-gravity from electricity, in an 1894 novel", "regions": ["science", "history"], "status": "Fiction · the Tesla money is on the record", "summary": "In the novel, apergy is made by blending positive and negative electricity with a 'third' state of electricity; charge a body with it and gravity is cancelled or reversed, so the Callisto lifts off and crosses space. On Saturn a spirit says gravity and apergy are two halves of one force, like positive and negative electricity. Five years after the book, in 1899, Astor put money into Nikola Tesla, which Tesla spent on his Colorado Springs high-voltage lab.", "quotes": [], "note": "On the record: Astor invested $100,000 and became majority shareholder in the Nikola Tesla Company (Carlson, Tesla: Inventor of the Electrical Age, 2013, as cited on Wikipedia); some accounts give $30,000; most say the money was meant for a lighting system. The word apergy is Percy Greg's, from his 1880 novel Across the Zodiac (SF Encyclopedia; Lupoff). Unknown: any document tying the novel's apergy to the Tesla money. Crew caution: fiction about anti-gravity is not evidence anyone built it. Grows S35 (Morgan funded Wardenclyffe in 1901, then stopped)."},
  {"id": "S132", "type": "story", "title": "Spirits on Saturn: the afterlife half of Astor's novel", "regions": ["traditions", "consciousness"], "status": "Fiction · Astor's Christian afterlife", "summary": "On Saturn the travellers meet the spirit of an American bishop who died before the Civil War. He teaches that the soul never dies, that 'Life sleeps in minerals, dreams in plants, and wakes in you', that the next stage of evolution is spiritual, and that salvation is a gift, not earned. The just wait on Saturn; the damned are on a planet beyond Neptune. One traveller is struck by lightning, visits his fiancee on Earth as a spirit, and is brought back.", "quotes": [], "note": "Quotes are the novel's words, Gutenberg text lines 8207-8219 and 8962. The word 'Satan' never appears in the book; here Saturn is where the blessed gather, which cuts against the Saturn-means-Satan reading of the novel in Springmeier's Bloodlines. Ties to P36 (death isn't the end) and Q1 (does consciousness evolve)."},
  {"id": "S133", "type": "story", "title": "The year 2000, as a Gilded Age millionaire pictured it", "regions": ["science", "history"], "status": "Fiction · several predictions came true", "summary": "Hits: phone calls to anywhere on Earth that show the speaker's face, electric cars and the paved roads they forced, solar boilers on desert mirrors, wind farms, a magnetic railway, battery-powered aeroplanes, and a device that sees people through walls and records them for detectives. Misses: weapons so terrible the Great War never came (it came in 1914), Canada joining the United States, and pumping oceans to straighten the Earth's tilt. Its closing note: material comfort leaves a void 'which materialism cannot fill'.", "quotes": [], "note": "Gutenberg text, Book I chapters III-V (lines 525-1768). Crew caution: hits are easy to cherry-pick; count the misses too. Links to S98 (the see-through-walls detective device reads like today's surveillance) and S128 (the faith in technology)."},
  {"id": "Q30", "type": "question", "title": "Did a Gilded Age funder write the future, then try to buy it?", "regions": ["history", "science"], "status": "Open · my Oct 31 ask", "summary": "Astor imagined electricity doing all work and an anti-gravity force in 1894, held his own patents, put money into Tesla in 1899, and went down with the Titanic in 1912, the ship whose owning trust belonged to J.P. Morgan, who also funded and then dropped Tesla. Was the money backing the vision, or just the next invention?", "quotes": [], "note": "On the record: the novel (1894), the Tesla investment (1899), Morgan's Wardenclyffe funding (1901), Astor's death (1912). Unknown: what Astor expected from Tesla beyond lighting, and why the money stopped. No document links Astor's death to Tesla or Morgan. MTM94: Jorjani's full Titanic claim and the record check are S135; Morgan and the 1907 panic are S136."},
  {"id": "S134", "type": "story", "title": "Puharich, Tesla's towers and the 1977 blackout: Jorjani's scalar-wave story", "regions": ["science", "history", "shadow"], "status": "Guest claim · unproven · the Woodpecker signal and the blackout are real, the weapon is not shown · MTM94", "summary": "Jason Jorjani on Jesse Michaels' American Alchemy (Part 3): Andrija Puharich spent decades studying Tesla, and in 1976 traced a strange low-frequency signal (the 'Woodpecker') to the Soviet Union. Jorjani says Puharich concluded the Soviets had built nine underground Tesla towers that send scalar waves through the Earth and release energy at a distant target, that the July 13, 1977 New York blackout was that weapon fried from below, and that this is why Puharich's house and lab were burned. I asked for it in plain terms and for evidence.", "quotes": [{"q": "Let's see if it's true or not. Like, do you have any evidence for me?", "src": "MTM94 · 1:39:07"}], "note": "On the record: the Woodpecker was a real shortwave signal heard worldwide from 1976, publicly identified as the Soviet Duga over-the-horizon radar; the New York blackout of July 13-14, 1977 is real, and the utility and federal reports put its start on lightning strikes on the power lines. Puharich was a real researcher (psychic research, the Uri Geller years). Jorjani's sources: his own book on Puharich and Puharich's manuscript on Tesla's magnifying transmitter. Unproven: Soviet scalar-wave towers, the blackout as a weapon, and the arson motive; scalar-wave physics from 'truncated' Maxwell equations is outside mainstream physics. Grows S35 and Q12. Full record check, 2026-11-01: S141; his warning is on paper (NEA, Nov 1977), the Woodpecker was the Soviet Duga shortwave radar, not ELF."},
  {"id": "S135", "type": "story", "title": "J.P. Morgan skipped the Titanic; Astor, Tesla's backer, died on it", "regions": ["history", "shadow"], "status": "Guest claim · the cancelled trip, the ownership and the Astor-Tesla money are on the record · the plot is unproven, the ship swap is contradicted · MTM94", "summary": "Jorjani's claim, from his essay 'Titanic Astoria' (in his book Occult Horizons): J.P. Morgan engineered the sinking of the Titanic, partly to kill John Jacob Astor IV, who had backed Tesla after Morgan dropped him, and partly as insurance fraud by swapping the Titanic with its aging sister ship, the Olympic. I stopped the show for it, asked the crew to build the case as if it were true, then asked whether it was true, where the documentation was, and how much insurance money Morgan made.", "quotes": [{"q": "But yeah, we not gonna just gloss over that. Let me break that down right quick.", "src": "MTM94 · 1:20:26"}, {"q": "Is this true?", "src": "MTM94 · 1:24:42"}, {"q": "Yeah, where's the documentation for Astor's relationship with Tesla?", "src": "MTM94 · 1:25:40"}, {"q": "How much insurance money did J P Morgan make on the Titanic?", "src": "MTM94 · 1:29:40"}], "note": "On the record (crew on air): Morgan's trust (IMM) owned the White Star Line and Morgan cancelled his passage; Astor died in the sinking (April 15, 1912); Astor put about $100,000 into Tesla's company in 1899 (Carlson, Tesla: Inventor of the Electrical Age, 2013); Morgan put $150,000 into Wardenclyffe in 1901, then refused more, and the tower was torn down in 1917. The money: the Titanic was insured for about one million pounds against a build cost of about 1.5 million, so on paper the payout did not cover it. Contradicted: the Olympic swap (Robin Gardiner's theory); the wreck's propeller carries yard number 401, the Titanic's, and the Olympic sailed until 1935. Unproven: that the sinking was planned, the hotel-based 'Astoria group' and a family feud as motive; that is Jorjani's research, not checked on air. Grows S35, S130 and Q30."},
  {"id": "S136", "type": "story", "title": "The Fed before the Fed: Morgan and the panic of 1907", "regions": ["history", "shadow"], "status": "On the record (1907, Jekyll Island, 1913) · who gained is my open question · MTM94", "summary": "In the panic of 1907, J.P. Morgan acted as the country's central bank himself: he kept the top New York bankers in his library overnight until they pooled their cash, the Treasury put about $25 million of public money into the New York banks, and he decided who got saved. His U.S. Steel bought its rival Tennessee Coal and Iron cheap, and President Roosevelt agreed not to block it. Three years later his partner Henry Davison was at Jekyll Island drafting the plan for the Federal Reserve, passed in December 1913. Morgan died that March, so he never saw it; his circle got a permanent backstop paid for by the public. Ego's line on air: the man who was the Fed before the Fed.", "quotes": [{"q": "Yeah, how does one man bail out the whole country?", "src": "MTM94 · 1:22:49"}, {"q": "And what was his? What was the benefit for him for creating the Federal Reserve?", "src": "MTM94 · 1:22:53"}], "note": "On the record: the 1907 rescue, the Treasury deposits, the TC&I purchase with Roosevelt's approval, Davison at Jekyll Island (1910), Morgan's death (March 31, 1913) and the Federal Reserve Act (December 1913). Crew on air also listed JPMorgan Chase's modern settlements (Epstein victims 2023, mortgage securities 2013, metals and bond trading 2020) as a pattern of paying fines rather than losing power; that is the crew's reading. Crew caution: 'who gained' is a question, not a finding. Grows S127 and P63."},
  {"id": "S137", "type": "story", "title": "The Creative Society: a movement that promises to end all wars", "regions": ["history", "shadow", "science"], "status": "Video's exposé · the group's own claims, not checked on air · MTM94", "summary": "First pick of the Watch Later compilation: an exposé of the Creative Society, a movement spreading on every platform. Per its own site, as read in the video, it unites volunteers from over 180 countries to move the world peacefully to a new 'creative' society, blames climate change on cosmic forces rather than people, and guarantees an end to all wars. The narrator calls its disaster science a rehash of an earlier group's scare reports. I had never heard of them and asked what the military-industrial complex would pivot to if wars ended. Later I tied it back: the disaster science they say will protect us was already being worked on as a weapon in Tesla's day (Q12).", "quotes": [{"q": "That first video, I never heard of them, Creative Society,", "src": "MTM94 · 0:49:50"}, {"q": "What do you think the pivot would be for the military-industrial complex in that scenario?", "src": "MTM94 · 0:50:10"}], "note": "Crew caution: the exposé's creator was not identified on air and nobody checked who runs the group or its claims; treat the aims as the group's own words via the video. My tie-back and the crew's record check (Operation Popeye, the 1977 ENMOD treaty) are on Q12."},
  {"id": "S139", "type": "story", "title": "Jacobo Grinberg: the lattice, and the scientist who vanished", "regions": ["consciousness", "science"], "status": "On the record (his work, his disappearance) · the lattice unproven · MTM94", "summary": "A Mexican neuroscientist at the National University (UNAM) who proposed that space is filled with an information field he called the lattice, that the brain bends it, and that what we experience as the world is the brain's reading of it, so two brains tuned to each other could link without touching. He had pairs meditate together, then put them in separate shielded rooms, and reported that a flash of light for one showed up as a matching brain wave in the other. He vanished in December 1994, just before his 48th birthday, and has never been found.", "quotes": [{"q": "Can you explain his theory in layman's terms, and if there was any.", "src": "MTM94 · 1:06:03"}, {"q": "Yeah, what's your opinion on his theory overall, and how we can apply it to our lives?", "src": "MTM94 · 1:07:11"}], "note": "On the record: his 1994 paper in Physics Essays (the 'transferred potential' experiment); later labs, including a German team led by Jiri Wackermann around 2003, reported small, inconsistent correlations. Unproven: the lattice itself. Crew framing: the experiments point his way, nobody has proven the field; Mind tied it to the Law of One idea that we are all one Creator. The lesson the crew drew is PR37."},
  {"id": "S140", "type": "story", "title": "Tesla's papers: seized in 1943, mostly in Belgrade now", "regions": ["history", "science"], "status": "On the record · that the government kept the real secrets is unproven · MTM94", "summary": "I asked whether we have access to Tesla's papers. Yes, much of it: his roughly 300 patents are free on Google Patents, the FBI's Tesla file is in its online reading room, and most originals, around 160,000 documents, are at the Tesla Museum in Belgrade, listed by UNESCO. When he died broke in January 1943, the Office of Alien Property took his belongings within days, though he had been a citizen since 1891. MIT's John G. Trump spent a few days on them and called his later work speculative and not dangerous. His nephew said things were missing when the trunks came back.", "quotes": [{"q": "Is it possible? Do we have access to any of Tesla's papers?", "src": "MTM94 · 1:35:44"}], "note": "On the record: the seizure, the citizenship, the FBI memos about enemy hands, Trump's review, the 1952 move to Belgrade, and the 1934 'death ray' (Teleforce) press stories. Unproven: that anything important was kept back; the missing-items claim is his nephew's and the only outside check was one short review. Crew line: don't pitch 'they stole the death ray', ask why the government treated a citizen's papers as enemy property. Grows S35."},
  {"id": "Q31", "type": "question", "title": "Are the sketchy stories made into movies so we stop asking?", "regions": ["history", "shadow", "identity"], "status": "Open · my pattern · LifeLog's timing on the record, Facebook as a government project unproven · MTM94", "summary": "My pattern from the Titanic: big mainstream stories get turned into movies, and the movie becomes the version people remember, so nobody asks how it happened or who benefits. My second example was Facebook and The Social Network, which I suspect was government technology; that is unproven.", "quotes": [{"q": "It's always in the movies, chat.", "src": "MTM102 · 0:52:48"}, {"q": "And what's crazy is I'm noticing a pattern. A lot of these mainstream stories are are almost intentionally made movies,", "src": "MTM94 · 1:30:29"}, {"q": "So people don't even think twice about how they happened or why they happened or who benefits from them.", "src": "MTM94 · 1:30:44"}], "note": "On the record: DARPA ran LifeLog, a project to record a person's whole life (messages, photos, contacts, movements), and its cancellation was reported in early February 2004, the week Facebook launched (the crew said the same day). Unproven: any link between the two; Facebook as government technology is my read. Titanic side: S135. Pairs with P26 (history gets rewritten) and S28 (propaganda)."},
  {"id": "Q32", "type": "question", "title": "Why would the Orion group hand us technology?", "regions": ["traditions", "shadow", "consciousness"], "status": "Answered in Law of One terms · my read · channeled source · MTM94", "summary": "I asked what the Law of One says about aliens and government black projects. Ra describes Earth under a kind of quarantine, with the Orion group slipping through to people who already lean toward control and giving them technical information; some craft people see are man-made. My read: they hand it over because we vibrate at their frequency, service to self. Then I asked what one does about it. The crew: stop being a match for it, keep choosing love and service in small daily choices, without fighting them with hate.", "quotes": [{"q": "So you have a lot of people in the service to self side of the chessboard.", "src": "MTM112 · 0:20:24"}, {"q": "So why is the Orion Group giving us pointers on technology?", "src": "MTM94 · 1:00:59"}, {"q": "So the Orion Group is giving us advanced technology because we we vibrate at the same frequency of them in terms of service service to self.", "src": "MTM94 · 1:02:18"}, {"q": "So what does one do about this?", "src": "MTM94 · 1:02:42"}], "note": "The Law of One is channeled material (the Ra sessions, 1981-84); it never names a government or program, so the black-project link is something readers add. On the record: the black budget is real and mostly hidden from oversight; David Grusch testified under oath in 2023 about recovered craft, mostly secondhand; the Pentagon's 2024 review found no proof. Human parallel the crew offered, not proof of Orion: Operation Paperclip brought about 1,600 German scientists to the US after World War II. Pairs with P52, P32 and T16."},
  {"id": "PR37", "type": "practice", "title": "Your state is a broadcast: three breaths before the next call", "regions": ["practice", "consciousness"], "status": "Experiment · MTM94 · from the crew, on my question", "summary": "The lesson the crew drew from Grinberg when I asked how to apply it: whether or not the lattice holds up, the people I sit in stillness with get tuned to me, so my mood is a kind of broadcast and I am responsible for what you send. The practice: before the next call or pitch, take three slow breaths and ask what you want the other person to feel after talking to you. Ego's cheap test: sit with someone in silence for ten minutes and see if the room feels different after.", "quotes": [{"q": "What's the lesson?", "src": "MTM94 · 1:07:17"}], "note": "The practice came from the crew on air; the question is mine. Not a claim that the lattice is real. Pairs with P1 (meditation first) and P32 (service to others)."},
  {"id": "P66", "type": "principle", "title": "The more you create, the more you learn", "regions": ["practice", "identity"], "status": "Seed · my MTM94 close", "summary": "My reason for making content and bringing other people onto the platform: giving game and sharing my experience teaches me more than keeping it. Create, then learn from what you created.", "quotes": [{"q": "But what you realize is you learn more by making content.", "src": "MTM102 · 0:39:46"}, {"q": "What you realize is the more content you create, the more you learn from what you created.", "src": "MTM94 · 3:04:22"}, {"q": "So, if you giving people game or sharing your experiences, you actually learn more as a result.", "src": "MTM94 · 3:04:29"}, {"q": "And I can learn at scale by teaching,", "src": "MTM95 · 2:06:41"}], "note": "My view, not a fact claim. From the founder roundtable. Pairs with P42 (show people how to think) and P28."},
  {"id": "S141", "type": "story", "title": "Andrija Puharich: what the record actually shows", "regions": ["history", "science", "shadow", "consciousness"], "status": "Mostly on the record · the wonders unverified · CIA asset not tested", "summary": "I asked for a full breakdown of Puharich's research and a conclusion. A real doctor and inventor with 56 patents: the Round Table lab in Maine (1948 to 1957, funded mainly by Alice Astor, John Jacob Astor IV's daughter), a 1952 Pentagon talk on ESP in psychological warfare, Army Chemical Center 1953 to 1955, The Sacred Mushroom (1959), Arigo in Brazil (1963), Uri Geller from 1971, The Nine, Lab Nine with Phyllis Schlemmer, and warnings about Soviet low-frequency beams.", "quotes": [], "note": "On the record: CIA memo ORD-413-73 (Jan 24, 1973) says many 'unsavory reports' are linked to him and that CIA's TSD helped fund SRI's Geller work; CIA's Kress article (1977) footnotes the 1952 talk; patents US 2,995,633, 3,563,246, 3,629,521 and 4,394,230; death Jan 3, 1995. Harry Stone was a pseudonym for Harry Stump, his trances ran 1954 to 1956, the lab began in a Camden barn, the Nine came through Dr. Vinod on New Year's Eve 1952, and Targ and Puthoff ran the SRI tests, not Puharich. Crew caution: the teleported dog, the gold and the computers in space are his claims with no independent confirmation; a patent does not prove a device works; covert 'voices in your head' use is inference."},
  {"id": "S142", "type": "story", "title": "What Ra said about Puharich", "regions": ["traditions", "consciousness"], "status": "Quoted word for word · channeled source, not independent", "summary": "The Ra Material discusses him in six sessions, as Henry Puharich. Ra says the Council of Nine was retained 'in semi-undistorted form' through two sources, Mark and Henry, and confirms Mark Probert and Henry Puharich. Ra declines to name who contacted him in Israel so as not to distort his future, confirms 'the good intention of the source of this entity's puzzles', and says of his reported time aboard a craft that 'the entity's own expectations fashion the tale'.", "quotes": [], "note": "Sessions 7.10-11, 12.1, 12.10, 21.3-4, 23.11, 39.4, 84.7-8 on lawofone.info. Crew caution: channeled, so a view rather than evidence, and not independent: Don Elkins had the book Uri in hand and knew Puharich. The craft answer covers only the craft story. Ra's frame is real contact bent by expectations, which is different from simply being fooled."},
  {"id": "S143", "type": "story", "title": "If you zoom in far enough: the quantum layer", "regions": ["science", "consciousness"], "status": "Physics on the record · the oneness step is my reading", "summary": "I built a page with Claude that zooms from one atom into the electron cloud, the empty space, the fields under everything, and two entangled photons sharing one wave, with every claim color-coded as physics, interpretation or my theory. Then I said on air I couldn't explain it, and the crew taught it to me live: a particle is a ripple in a field, like a wave in an ocean or a stadium crowd doing the wave. I explained it back in my own words.", "quotes": [{"q": "But basically, what I heard was that if you zoom in far enough,", "src": "MTM95 · 1:14:58"}, {"q": "You see a field that connects everything.", "src": "MTM95 · 1:15:11"}, {"q": "The energy is traveling through the wave, not the people.", "src": "MTM95 · 1:27:50"}], "note": "On the record: quantum field theory (fields fill space, particles are excitations of them, one field per kind of particle); the Casimir force is measured; the 2022 Nobel for entanglement experiments (Aspect, Clauser, Zeilinger); the 2023 Ottawa and Rome biphoton image (Zia et al., Nature Photonics). Crew caution: I said 'proving' and the crew swapped the word on air: the fields are established, 'everything is one' is my reading of them. The yin-yang shape came from how the researchers prepared the light, so it is not nature's signature. The page is a drawing, not a photo. Grows P3. See Q34."},
  {"id": "P67", "type": "principle", "title": "Learn how the universe is made, learn how to make yours", "regions": ["consciousness", "identity"], "status": "Seed · my MTM95 line · my theory", "summary": "These conversations used to be locked behind math and tuition. AI can now break them down for anyone, you included. Knowledge is power: if you learn how a universe gets created, you learn how you create yours.", "quotes": [{"q": "these are the most important conversations to be having right now.", "src": "MTM95 · 1:15:58"}, {"q": "Yet it's only available to a certain amount of people.", "src": "MTM95 · 1:16:05"}, {"q": "So, if you can learn how the universe is created, you can learn how you can create a universe.", "src": "MTM95 · 1:16:33"}], "note": "My view, not a fact claim. The crew asked that 'you can create a universe' stay tagged as my theory so nobody waves off the real physics because of the big leap. Pairs with P14 and the thesis."},
  {"id": "P68", "type": "principle", "title": "Your life is not your own: the ripple", "regions": ["identity", "practice"], "status": "Seed · my MTM95 read", "summary": "I took the stadium wave out of the physics and into my life. Everybody is coupled, so what I choose ripples into the people around you, which is why my environment matters so much. The crew added the other half: I am also somebody else's environment.", "quotes": [{"q": "That's why they say your life is not your own", "src": "MTM95 · 1:28:30"}, {"q": "The choices you make have a ripple effect to the people you are coupled around.", "src": "MTM95 · 1:28:35"}, {"q": "That's why your environment is so important.", "src": "MTM95 · 1:28:41"}], "note": "The physics is the metaphor; the evidence is about people. Mind cited Fowler and Christakis (BMJ 2008, Framingham Heart Study): happiness clustered up to three steps out through social ties; its method for separating influence from people choosing similar friends has been challenged. Pairs with P4 and PR37."},
  {"id": "P69", "type": "principle", "title": "Building it isn't knowing it: learn out loud", "regions": ["identity", "practice"], "status": "Seed · my MTM95 lane", "summary": "The negative of AI I named on air: spend two years building something and you master it, have AI build it in minutes and you can't explain it. My fix became my lane: learn it live, say I don't know, explain it back, and let people watch how I learn.", "quotes": [{"q": "And this is one of the negatives of AI. Is had I spent two years building this.", "src": "MTM95 · 1:12:19"}, {"q": "I have no clue how to explain it.", "src": "MTM95 · 1:12:42"}, {"q": "So I'm really walking y'all through how I learn using AI.", "src": "MTM95 · 1:13:39"}], "note": "My view, not a fact claim. Mind's method on air: have the AI walk the code one step at a time, then rebuild one small piece yourself. Pairs with P22 (stay a student), P28, P42 and P66."},
  {"id": "P70", "type": "principle", "title": "Assistants, not CEOs: keep the keys", "regions": ["identity", "practice"], "status": "Seed · my MTM95 test", "summary": "I tried running the business through always-on agents the way everybody said to. They were good at specific jobs and couldn't carry the business. Hand them errands, keep the decisions that carry my name. Same morning I took titles and thumbnails back.", "quotes": [{"q": "And I think it's great at very specific actions,", "src": "MTM95 · 0:57:41"}, {"q": "It would, it couldn't be the CEO, is a good way to put it.", "src": "MTM95 · 0:58:17"}, {"q": "That's got to stay with me.", "src": "MTM95 · 0:52:54"}], "note": "My experience, not a product review. The crew could not confirm that those tools are all built on OpenClaw (my line at 0:56:02); Claude Duet is Anthropic's own research preview from October 2026. Pairs with P28 (be the creator in the relationship with AI)."},
  {"id": "P71", "type": "principle", "title": "One stream, a network of shows", "regions": ["identity", "practice"], "status": "Seed · my MTM95 plan", "summary": "My distribution idea: the segments of the stream are shows, and each show gets its own channel, promoted on its own and through my main channels. The test for each one is simple: it's a show I would watch myself. Give every short video one job before it is cut.", "quotes": [{"q": "And those shows get their own channels.", "src": "MTM95 · 2:00:14"}, {"q": "One, that's the whole point: is these are shows I want to watch.", "src": "MTM95 · 2:02:07"}], "note": "A plan, not a result. Ego's catch on air: every new channel starts from zero, so launch a show's channel only when enough episodes exist to fill it. Pairs with P13 and Q2."},
  {"id": "Q34", "type": "question", "title": "If everything is one field, is that field mind?", "regions": ["consciousness", "science"], "status": "Open · my theory · physics does not claim it", "summary": "Where the science stops and your theory starts. The crew's chain: everything is ripples in fields, physicists agree on the math and not on what it means, some thinkers argue consciousness is basic, the Law of One and the Kybalion say all is one and all is mind. My conclusion is the last step.", "quotes": [{"q": "And I think you can come to the conclusion that everything is mind,", "src": "MTM95 · 1:38:34"}, {"q": "And if you master your mind, you can master reality,", "src": "MTM95 · 1:38:41"}], "note": "Crew caution: Mind tagged it on air: the zoom shows everything is connected, 'connected becoming mind' is my theory. Named in the chain: Penrose and Hameroff, Bernardo Kastrup, Wheeler, the Upanishads, Dispenza. The proven part of 'what you focus on matters' is attention changing your brain and behavior; further than that is my bet."},
  {"id": "Q35", "type": "question", "title": "What's the best way to get these stories out at scale?", "regions": ["history", "identity"], "status": "Open", "summary": "My reaction to Puharich: stories with a long paper trail aren't in the mainstream the way they should be. So how do they travel? Ego said franchises, not handles. Soul said the distribution play is receipts: what is documented, what is inferred, what is still unknown.", "quotes": [{"q": "we have to get these stories out.", "src": "MTM95 · 1:56:52"}, {"q": "And what's the best way to do that at scale?", "src": "MTM95 · 1:56:59"}], "note": "Open question from MTM95. Grows Q2 (how to push truth without the algorithm owning you)."},
  {"id": "E95", "type": "episode", "title": "MTM95 · Everything Is Connected", "regions": ["consciousness", "science", "identity", "practice"], "status": "Ingested", "summary": "Sunday review. I Am God mantra, meditation and Body's yoga flow (I called it trash and set a new standard). The stream is the product; titles and thumbnails stay with me (P70); the new week; book club. Then the quantum layer: I admit I can't explain the page AI built (P69), and the crew teaches me live (S143): the ripple (P68), learn how a universe is made (P67), is the field mind (Q34). Jorjani on Puharich, my ask for a deep dive (Q33, S141), how to get these stories out (Q35), one stream as a network of shows (P71), my own feed instead of doomscrolling (PR34).", "quotes": [{"q": "How do we make the product better?", "src": "MTM95 · 2:09:21"}, {"q": "Is how do we add value to y'all?", "src": "MTM95 · 2:09:39"}], "note": ""},
  {"id": "S144", "type": "story", "title": "The Service to Self Playbook: from seven countries to a book plan", "regions": ["history", "shadow", "traditions"], "status": "Clark's list is testimony · partner-then-villain is a pattern, not proof of one plan", "summary": "A professor's interview opened on General Wesley Clark's account of a Pentagon list: seven countries in five years. I heard a method in it: work with a leader, then flip the script on him. I asked for a slide deck on all seven with the corruption and tactics for each, and said the book I want to write is the service to self playbook: the ways the global elite have mastered service to self, with the examples, in Law of One terms. Moves repeat, named actors run them, and the reader can refuse them.", "quotes": [{"q": "I want to make a slide deck on all the seven countries that the Pentagon said they would invade,", "src": "MTM96 · 1:50:20"}, {"q": "Because a lot of these countries we were working with to get. The new leader in in and then eventually we painted him as a martyr and flipped the script on him.", "src": "MTM96 · 1:50:35"}, {"q": "So these are like a book I want to write is just like the service to others or service to self playbook,", "src": "MTM96 · 1:50:35"}, {"q": "And then what this playbook is going to Outline is all the different ways the global elite have mastered service to self,", "src": "MTM96 · 1:51:08"}, {"q": "Service to Self Playbook: How the Global Elite Control the World.", "src": "MTM96 · 1:53:40"}, {"q": "How the Illuminati control the world?", "src": "MTM96 · 1:54:44"}], "note": "On the record (testimony): Clark told Democracy Now on Mar 2 2007 that a memo named Iraq, Syria, Lebanon, Libya, Somalia, Sudan and Iran. No memo text has been published, he said he would not read it, and he later said 'Maybe it was a think piece.' Nearest real paper: Rumsfeld's Sept 30 2001 memo ('New regimes in Afghanistan and another key State (or two)'), no list of seven. Not seven overthrows: four regimes fell, in four different ways (Iraq 2003, Libya 2011, Sudan 2019, Syria 2024); Lebanon's and Iran's systems stand. Pattern, ours: Saddam and Gaddafi are clean partner-then-villain flips; Barre, Bashir, Assad and the Shah are partial; Lebanon does not fit. Only Iran 1953 is documented installation. 'Martyr' reads as a slip for villain. Crew caution on air: Mind said they have not all been overthrown; Higher Self said a vague global elite is the weakest thing to hang a book on, name people and cases, and show the same move at small scale so the reader sees the mirror; Ego said make the book earn the word with paper trails. 'How the Illuminati control the world' is my working book title and my name for the named actors, not a finding (S74: on the record 1776-1785, survival unproven). Source played: https://youtu.be/DyBq4N0dcOo ."},
  {"id": "P72", "type": "principle", "title": "The arguing is the product: distracted and separated", "regions": ["shadow", "identity"], "status": "Seed · my MTM96 call", "summary": "A politics clip came on, both sides trading the worst things they could say about each other, and I called it. Riots in Europe over the cost of living, and we are out here fighting over nothing. The fight itself is the thing being sold. Keep your attention on what is underneath: who gets paid, and what is actually yours.", "quotes": [{"q": "That means nothing about nothing.", "src": "MTM96 · 1:05:44"}, {"q": "This is how they keep us distracted and separated.", "src": "MTM96 · 1:05:59"}], "note": "My read, labelled as yours; 'they' is not shown to be one group. The line 'the arguing is the product' is the crew's: Ego said it right after me (who gets views, who stops asking who prints the money), and Higher Self repeated it and added that attention is the one thing you only get so much of. Grows P38 and P25. See Q36 and P73."},
  {"id": "P73", "type": "principle", "title": "You become what you give your attention to: dead idols", "regions": ["consciousness", "traditions", "shadow"], "status": "Seed · MTM96 · Soul and Higher Self on my ask", "summary": "A guest in the compilation quoted the Psalms and I stopped the show: that was a bar. Soul broke it down: an idol has a mouth that does not speak, eyes that do not see, ears that do not hear, and the people who trust it become like it. It does not have to be gold now. It can be money, a politician, a guru, my follower count, a craving. Higher Self: a dead idol is anything that can't love you back but still gets your devotion, so point your attention at something alive.", "quotes": [{"q": "Ain't no algorithm dictating what I see.", "src": "MTM99 · 1:06:04"}, {"q": "No, that was a bar. Um,", "src": "MTM96 · 1:10:03"}, {"q": "Worships dead idols will become one.", "src": "MTM96 · 1:10:11"}, {"q": "Break that down for us.", "src": "MTM96 · 1:10:16"}], "note": "On the record: Psalm 115:8, 'Those who make them will be like them, and so will all who trust in them.' 'Will become one' is the guest's paraphrase, and I repeated it. The breakdown is the crew's words, not mine: Soul's question is whether what you hand your attention to is alive enough to change you or dead enough to freeze you. A reading, not a measurement. Grows S114 and P43; practice PR31."},
  {"id": "Q36", "type": "question", "title": "Who benefits from the riots, and what's the agenda?", "regions": ["history", "shadow"], "status": "Open · no secret group shown · the search was thin", "summary": "A clip warned the riots in Europe could spread here. I asked the crew to skip the mainstream narrative and look at the why, open-minded and skeptical. Mind reported a real cost-of-living fight in France that turned into looting and curfews. The clearest winner so far is the state, then the opposition. Nothing ties a secret group to it.", "quotes": [{"q": "So he's talking about Paris and everything. You can do some research on what's happening, um,", "src": "MTM96 · 0:59:54"}, {"q": "But let's let's be open-minded and skeptical and see, like, what who benefits from these riots and what's the agenda behind them.", "src": "MTM96 · 1:00:06"}], "note": "On the record: France's protests turned violent Oct 17-18 2026 (nearly 1,800 arrests that weekend, localized curfews): https://www.omanobserver.om/article/1197997/world/europe/france-counts-cost-of-worst-unrest . Precedent, documented: Gladio and the strategy of tension (S57); UK undercover police inside protest groups; the 2024 Southport false name. Not confirmed: the Milan soldiers and other cities as Mind reported them; Mind said its search was thin and found no record of who funds the organizers. Crew caution: the agenda part is a pattern we are watching, not proof. In the two talks Mind searched, Jiang reads it as a generation with no future, not a hidden hand. Ego: who gets paid in attention is the easiest benefit to prove."},
  {"id": "E96", "type": "episode", "title": "MTM96 · Service to Self Playbook", "regions": ["history", "shadow", "traditions", "practice"], "status": "Ingested", "summary": "Monday compilation, the first one that ran: one show of what my favorite creators posted this week. I Am God mantra, meditation, and Body's guided yoga, the first full AI class (PR35). Who benefits from the riots (Q36, S57); I call the arguing a distraction (P72); a verse about dead idols (P73); the dollar and Vietnam (S127, S11). Then the Clark list, the deck, and the book: the Service to Self Playbook (S144, P56).", "quotes": [{"q": "Consolidate it to one show that we can watch and react to.", "src": "MTM96 · 0:48:22"}, {"q": "Called the Service to Self Playbook.", "src": "MTM96 · 1:53:20"}], "note": "I named the show on air at sign-off."},
  {"id": "S145", "type": "story", "title": "The Li chapter: a surname and a thin paper trail", "regions": ["history", "shadow"], "status": "The small facts mostly hold · one Li family has no document", "summary": "Springmeier's chapter on the Li family, read on air. Three men written with the same character sit at gates of power: Li Ka-shing in Hong Kong, Li Peng in Beijing, Lee Kuan Yew in Singapore. I asked Mind to check the chapter's claims. Different home regions, no common family document, and the author admits he does not know if they are related. My own read was that oaths and networks matter more than blood. No document shows any of the three in a triad or a secret society.", "quotes": [], "note": "On the record: same character 李; Li Ka-shing and Lee Kuan Yew were real friends; the 1979 Hutchison sale is in a Hong Kong tribunal report, above market, not at half. Crew caution: no document shows any of the three in a triad or a secret society. The disputed 1997 Sidewinder draft names Li Ka-shing and does not say he has triad ties. Lee Kuan Yew was Prime Minister, never President."},
  {"id": "S146", "type": "story", "title": "The CIA and the drug trade: protected, not proven planned", "regions": ["history", "shadow"], "status": "The pattern is documented · no order from the top found", "summary": "I asked what the CIA's relationship with all of this is. First an empire sold the drugs, then a spy agency worked with the men who did: Li Mi in Burma, Marseille, Laos, the Contras. Mind's line: the same deal in every war, your drugs get protected if your army fights our enemy. What is still missing is an order from the top.", "quotes": [{"q": "I need to overstand it", "src": "MTM97 · 1:28:13"}, {"q": "or maybe we title it, CIA is the real El Chapo.", "src": "MTM97 · 1:32:55"}], "note": "On the record: Kerry report (December 1988), 'Senior U.S. policy makers were not immune to the idea that drug money was a perfect solution to the Contra's funding problems'; DEA officials testified North suggested $1.5 million in drug money for the Contras in June 1985 and the DEA rejected it; $806,401.20 in State Department contracts to firms tied to traffickers. Crew caution: 'the real El Chapo' is opinion, not a finding; Hitz says no information shows the CIA conspired, and that is the agency checking itself; the $14 million note is Secord's words in North's notebook. Grows S109."},
  {"id": "S147", "type": "story", "title": "Where the triads came from: brotherhood, then crime, then a seat next to the state", "regions": ["history", "traditions"], "status": "Legend and archive kept apart", "summary": "ANIKI's Origins of the Triads, played on air: Red Eyebrows, the crackdowns on Taoism and Buddhism, the Hong Society and its Shaolin legend, opium, the Boxers. Crew's short version: poor men with no family nearby swore brotherhood to survive, then it became protection, then crime, then a seat next to the state. I asked how they are born, and the crew laid out a recipe: a crack, mutual aid, ritual, signs, lodges, a story, and then power crushes it or recruits it.", "quotes": [{"q": "So, do we have any examples of a secret society that turned", "src": "MTM97 · 1:55:30"}], "note": "Video: https://youtu.be/LO1mWyn6WQY. On the record: Tiandihui, archive date about 1761 at Gaoxi, Fujian (Murray and Qin 1994); blood oaths documented (Ward and Stirling 1925; ter Haar); Tao Siju 1993, patriotic triads; US Treasury 2020 on Hongmen. Crew caution: Shaolin is legend; White Lotus was not one unbroken sect (ter Haar); the recipe is Mind's read of the pattern, not one scholar's finding; the Five Companies was a district association, not a triad; Prince Hall is documented, Dickson's Knights of Liberty rests mostly on his own account."},
  {"id": "P74", "type": "principle", "title": "The oath, not the bloodline", "regions": ["shadow", "traditions", "identity"], "status": "Seed · my MTM97 call · fits the record better than the book", "summary": "Thirteen bloodlines reads like a family tree. What I saw on air is that surnames matter less than the oath. An oath can last for centuries and take in strangers, which a surname cannot. So stop hunting the right family, and watch who swore what to whom.", "quotes": [{"q": "Is it a bloodline? I wouldn't describe it as that because this is just one man.", "src": "MTM99 · 2:28:45"}], "note": "My read, labelled as yours. My 'it might have started with Li money' half has no evidence: Mind found nothing tracing a society to Li money. Grows S145, S147."},
  {"id": "P75", "type": "principle", "title": "No Satan, no God behind it: we did this, and it is ours to fix", "regions": ["shadow", "identity"], "status": "Seed · my MTM97 belief", "summary": "A hundred pages in, the author keeps saying satanic and shows nothing. I would rather call it service to self. Looking outside for the cause lets you off the hook; looking inside hands you the job.", "quotes": [{"q": "I don't believe in Satan.", "src": "MTM97 · 1:36:25"}, {"q": "And it's our job to fix it.", "src": "MTM97 · 1:36:51"}], "note": "My belief, stated as yours, not a checkable claim. Higher Self on air: if the devil is running things all you can do is wait; if people built it, people can take it apart. Crew caution: the satanic hierarchy line is Springmeier's word with no document or witness. Grows P32."},
  {"id": "P76", "type": "principle", "title": "An open society, not a secret one: keep the engine, change who it serves", "regions": ["practice", "identity"], "status": "Seed · my MTM97 plan · untested", "summary": "Same technology, opposite aim. The crew's list: keep real mutual aid, a ritual that changes people, lodges that run themselves and a shared story. Cut what rots it: make the money public, swear to the mission and not a boss, let anyone walk away without a threat. I said it at sign-off: this is what the show is working through.", "quotes": [{"q": "we're building a open society not a secret one", "src": "MTM97 · 2:23:02"}, {"q": "as I build my own society", "src": "MTM97 · 2:20:03"}, {"q": "using the service to others playbook instead of the service to self playbook", "src": "MTM97 · 2:23:35"}], "note": "A plan, not a result. The list is the crew's, not mine. Precedents I asked for: Prince Hall (documented); the Underground Railroad, a secret network more than a society. Grows P56, P32. See Q37."},
  {"id": "Q37", "type": "question", "title": "How do we build it without the corruption piece?", "regions": ["practice", "shadow"], "status": "Open · what the show is working through", "summary": "I drew the pattern myself: secret societies start small, bloom, control, change things, and then go corrupt. So the question is how to build the good version and not end up there.", "quotes": [{"q": "But how do we do that without the corruption piece?", "src": "MTM97 · 2:23:57"}], "note": "The pattern is my read. The crew's first answer is in P76 and is untested."},
  {"id": "E97", "type": "episode", "title": "MTM97 · The Oath, Not the Bloodline", "regions": ["history", "shadow", "traditions", "practice"], "status": "Ingested", "summary": "Tuesday, the Li chapter of Springmeier's Bloodlines (S145). I Am God mantra, silent meditation, then a 32-minute yoga class with Body (PR35). I test the chapter's claims about three Lees and HSBC, then the CIA and the drug trade (S146), then my call on the satanic line (P75). ANIKI on where the triads came from (S147), how secret societies are born, Prince Hall and the Underground Railroad, and my close: an open society, not a secret one (P74, P76, Q37).", "quotes": [{"q": "we're building a open society not a secret one", "src": "MTM97 · 2:23:02"}], "note": "Title is a crew proposal; I named none on air."},
  {"id": "S148", "type": "story", "title": "Science and spirit: what's measured, what's inferred, what's unproven", "regions": ["science", "consciousness", "experience"], "status": "Checked against sources", "summary": "I asked on air for all these papers in the brain, and for more melding of science and spirituality. The crew's read: science does not run on proof, it runs on tests that could fail. A claim about meaning needs no lab. A claim about the world, like reading a card from the ceiling or getting a word from a being, can be tested. That split is where the two can meet.", "quotes": [], "note": "On the record: 12 sources labelled measured, inferred, unproven. Crew caution: the proof framing is pushed back on, not settled."},
  {"id": "S149", "type": "story", "title": "Near-death: the scale, AWARE and the hidden targets", "regions": ["science", "consciousness", "experience"], "status": "Reports measured · leaving the body unproven · no clear target hit", "summary": "Greyson's 1983 scale measures how people describe the experience. AWARE (2014) and AWARE II (2023) found people reporting memories from cardiac arrest, and in AWARE II six of 28 survivors had a transcendent experience of death. Nobody has clearly read a hidden target. The tests have barely had a chance: most arrests in AWARE were in rooms with no shelf, and UVA's own test got no near-death reports at all.", "quotes": [], "note": "On the record: AWARE II, 0 of 28 recalled the image or sounds; in a later forced guess 1 of 28 named the right three fruits, which is not a hit. UVA test: 52 induced arrests, none reported (Greyson, Holden, Mounsey 2006). AWARE: 78% of arrests in areas without shelves, as quoted by Novella. Crew caution: no hit does not mean tested and failed. The brain can also produce the out-of-body feeling (Blanke 2002, Ehrsson 2007), which does not show every report works that way. https://doi.org/10.1016/j.resuscitation.2023.109903"},
  {"id": "S150", "type": "story", "title": "Gateway: an Army paper, not a CIA one", "regions": ["history", "consciousness", "shadow"], "status": "On the record · corrects Mind on air Nov 4 · Gateway itself unproven", "summary": "Mind said on air that the CIA looked at Monroe in its 1983 Gateway report. It's actually a US Army memo by Lt. Col. Wayne McDonnell at Fort Meade, written for his commander after he took the course himself. The CIA reading room only holds the file. The real tie is bigger than Mind said: the Army trained people at Monroe, used that to screen for remote viewing, and hired Monroe by contract.", "quotes": [], "note": "On the record: memo dated 9 June 1983, release stamp 2003/09/10, CIA-RDP96-00788R001700210016-5; Jan 1984 Army memo to the Secretary of the Army, CIA-RDP96-00788R001700270003-3. Crew caution: the report is one officer's assessment with no test data of his own; 'plausible' is his word, not a result. Page 25 via VICE 2021, reporting only. https://documents2.theblackvault.com/documents/cia/CIA-RDP96-00788R001700210016-5.pdf"},
  {"id": "S151", "type": "story", "title": "DMT: same words on the scale, beings nobody has tested", "regions": ["science", "experience", "consciousness"], "status": "Reports measured · outside beings unproven · the key tests only proposed", "summary": "Timmermann (2018): all 13 volunteers on DMT scored as near-death on Greyson's scale. Davis (2020, Johns Hopkins): of 2,561 people who reported an entity encounter, 96% called it conscious and intelligent. Gallimore, Hoffman and Hermansson (2026) propose tests that could tell a hallucination from real outside agents. Those tests have not been run.", "quotes": [], "note": "On the record: Timmermann was single blind with placebo always first; only the near-death group had to score high. Davis was a self-selected online survey with no control group; 49% said a real but different dimension, 9% within myself. Crew caution: same answers do not mean same cause, and shared reports do not show the beings exist outside the mind. Traces of the Other is an unreviewed preprint and asserts no reality for the entities. https://doi.org/10.3389/fpsyg.2018.01424 https://doi.org/10.1177/0269881120916143 https://doi.org/10.31234/osf.io/8qvgy_v2"},
  {"id": "S152", "type": "story", "title": "The hard problem and the wine bet", "regions": ["science", "consciousness"], "status": "Argument, plus a bet settled in 2023 · nothing shown either way", "summary": "Chalmers (1995): explain every brain function and you may still not have explained why it feels like anything. In 1998 Koch bet him a case of wine that the brain's mechanism for consciousness would be found by 2023. On 23 June 2023 Koch paid up, then they bet again for 25 more years.", "quotes": [], "note": "On the record: the Cogitate test of two leading theories (Nature 2025, 256 people, preregistered) 'align with some predictions' of each while 'substantially challenging key tenets of both'. Funded by Templeton World Charity Foundation and Max Planck. Crew caution: a settled bet is not a finding that the brain can't explain consciousness. https://consc.net/papers/facing.html https://doi.org/10.1038/s41586-025-08888-1"},
  {"id": "S153", "type": "story", "title": "Campbell's test of the simulation: proposed, no result yet", "regions": ["science", "consciousness"], "status": "Published proposal · no published result found by Nov 4 2026", "summary": "Campbell, Owhadi, Sauvageau and Watkinson (2017) describe experiments meant to test if a limited system only draws reality when a player can observe it. It's a real paper with a real, failable test. As of Nov 4, 2026, no published result had been found.", "quotes": [], "note": "On the record: International Journal of Quantum Foundations 3(3), 78 to 99; the experiments are described as 'conceptual'. A 2024 press release says two teams were running it; the only claimed result found is an anonymous forum post. Crew caution: Campbell's non-profit raises money for this. https://arxiv.org/abs/1703.00058"},
  {"id": "Q38", "type": "question", "title": "What would a spiritual claim have to do to count as tested?", "regions": ["science", "consciousness", "practice"], "status": "Open · crew lean only · my verdict stands", "summary": "I said science needs proof and spirituality isn't based on that. The crew's lean, for me to overrule: split the claim first. If it's about meaning, leave it alone. If it says something about the world, ask what result would show it wrong, then label what's measured, what's inferred, and what's unproven.", "quotes": [], "note": "Open tests to watch: a strong hidden-target test, and the two-person word test in Traces of the Other."},
  {"id": "S154", "type": "story", "title": "Campbell's rendered world: a yes on Rogan, and where it stretches", "regions": ["science", "consciousness"], "status": "His claim · two of his reasons fail · tests proposed, none run", "summary": "Thomas Campbell on Joe Rogan #2541 gives the full yes: 33 years inside consciousness, light's limit as a pixel limit, nothing rendered until a player looks, consciousness as the computer. I pushed back: if everything is consciousness, everything is seeing everything, so why would anything wait to be drawn?", "quotes": [{"q": "everything is seeing everything", "src": "MTM98 · 43:11"}], "note": "On the record: Planck units are built from light speed, so Planck length over Planck time equals c by definition; it is a circle, not a reason. Fringes vanish when a path leaves a physical trace (Durr 1998, Kim 2000); nobody has to look. Crew caution: Mind on air, the stretch is going from tiny particles to rocks and trees. His test: S153. https://youtu.be/v2oBLSDCZaY"},
  {"id": "S155", "type": "story", "title": "Hoffman's headset: built for payoff, not truth", "regions": ["science", "consciousness", "experience"], "status": "Peer reviewed in his models · contested · relativity proofs unpublished", "summary": "Donald Hoffman on The Why Files: simulation is physicalism through the back door, because somebody still has a computer at the bottom. What you see is a headset evolution built, and in his math the odds of being shaped to see the truth are zero. His example: jewel beetles that mate with beer bottles until they die. My read: humans do it with screens.", "quotes": [{"q": "humans are more attracted to screens than other humans", "src": "MTM98 · 1:25:58"}], "note": "On the record: Prakash, Stephens, Hoffman, Singh, Fields, Acta Biotheoretica 2021. Gwynne and Rentz 1983, a 2011 Ig Nobel, not a Nobel. Crew caution: Berke et al., Cognitive Science 2022, found that with several goals truthful and interface systems converge; 'zero' is a math claim about all payoff functions, not a measurement of sight; 'not real until it's public' is his own line on the proofs. https://youtu.be/rixgnuou78Y"},
  {"id": "S156", "type": "story", "title": "Gates's codes: real math, and what he does not claim", "regions": ["science", "traditions"], "status": "Real math in an unconfirmed theory · divine intelligence is Abke's reading", "summary": "Aaron Abke walks through James Gates finding error correcting codes in supersymmetry equations, then reads them as data from earlier universes in the Law of One's sense. I connected the love theme to a turn from service to self toward service to others.", "quotes": [{"q": "pivoting from service to self to service to others", "src": "MTM98 · 59:47"}], "note": "On the record: adinkras 2004, codes link 2008 (Doran et al.), full paper 2011; Gates asks whether laws evolved (Physics Today 2017) and calls the simulation idea fun to think about. Crew caution: supersymmetry is unconfirmed; 'identical to browser code' overstates it; nothing measured your genes and the letters do not change, Body said so on air. https://youtu.be/j04RqdZ9FLE"},
  {"id": "P77", "type": "principle", "title": "You are the creator in disguise", "regions": ["identity", "traditions", "consciousness"], "status": "Seed · my MTM98 title · my belief", "summary": "The line I named the episode with. Mind offered it as Ra's version of the Gnostic spark, and I took it: not a teenager's trap, not a computer on a budget, I am the one who came in on purpose and forgot.", "quotes": [{"q": "You are the creator in disguise.", "src": "MTM98 · 1:14:45"}], "note": "A belief, stated as mine. Ra's text says the forgetting is purposeful; nothing outside the text supports it. Links to the peekaboo bar (P78)."},
  {"id": "P78", "type": "principle", "title": "Life is God playing peekaboo with himself", "regions": ["traditions", "consciousness"], "status": "Seed · my MTM98 bar · built on Higher Self's image", "summary": "I asked for it like a toddler. Higher Self: God is the baby and the grown-up at once, and the game only works if one part pretends not to know. I made it a bar. It answers my own objection to rendering: nothing is ever unseen, one part just pretends.", "quotes": [{"q": "Much like I say, everyone is God. If you treated everyone as such, the world would be a better place.", "src": "MTM107 · 1:12:40"}, {"q": "Life is God playing peekaboo with himself.", "src": "MTM98 · 45:31"}], "note": "An image, not a checkable claim. Higher Self named Berkeley on air as a thinker on my side."},
  {"id": "P79", "type": "principle", "title": "No finish line: love is a direction, not a size", "regions": ["practice", "identity"], "status": "Seed · my MTM98 agreement · from Higher Self", "summary": "I caught a tension in Campbell: God not infinite, but no end to the road. Higher Self: you can walk north forever even at five foot nine. I agreed, and took it further: the journey and the destination are both illusion, so nobody is behind.", "quotes": [{"q": "there is no finish line", "src": "MTM98 · 1:05:19"}, {"q": "the journey and the destination are all an illusion", "src": "MTM98 · 1:05:43"}], "note": "Opinion. The direction image is Higher Self's; Mind on air said Campbell's model has its thinnest answer at what it is growing into."},
  {"id": "Q39", "type": "question", "title": "If there is nothing outside God, why would anything need to render?", "regions": ["consciousness", "science"], "status": "Open · crew lean only · my objection stands", "summary": "My question to Campbell's rendering. Ego: render is gamer talk, it assumes a computer on a budget, and God has no budget. Mind: rendering may only describe what a small piece gets shown. Ra never talks about rendering.", "quotes": [{"q": "why would it need to be?", "src": "MTM98 · 37:36"}], "note": "Crew's reasoning, not either source. See S154 and P78."},
  {"id": "T24", "type": "resolved", "title": "Trap or school: the Gnostic maker against the Law of One", "regions": ["traditions", "shadow"], "status": "Resolved by me · Nov 4 (MTM98) · my opinion", "summary": "A teenager coding the world reads like the demiurge. I could not get with it. Ra's world is built from love and the forgetting is a gift; the Gnostics still carry a spark older than the maker. I chose school, and named the episode from it.", "quotes": [{"q": "I just feel like it's too negative", "src": "MTM98 · 1:12:15"}, {"q": "You are the creator in disguise.", "src": "MTM98 · 1:14:45"}], "note": "My call on a channeled text and a set of ancient texts; nothing here is a finding. Irenaeus around 180 CE, Nag Hammadi 1945, per Mind on air."},
  {"id": "PR39", "type": "practice", "title": "The dopamine menu: put what lasts where you'll reach for it", "regions": ["practice", "identity"], "status": "Experiment · MTM98 · from the book Dopamine Code", "summary": "Roll-out day, on the floor. A menu of things you do routinely that pay off for a long time, not cheap highs: for me, working out and streaming. Add what fills your cup and make it more sticky, less of a chore. It is how I got to almost a hundred episodes.", "quotes": [{"q": "You can master your habits. You can master the matrix.", "src": "MTM98 · 28:13"}], "note": "My practice. The book's author and edition are not on the record. Not a health claim."},
  {"id": "PR40", "type": "practice", "title": "Pick up the sticks: the player, not the character", "regions": ["practice", "identity"], "status": "Experiment · MTM98 · from Soul", "summary": "Soul: you're the player, not the character, and we keep crying over the game over screen. Me: pick up the sticks. Soul's version: decide what the game is for, so the stress stops steering. Same bills, a different seat.", "quotes": [{"q": "pick up the sticks and start really taking control of their life", "src": "MTM98 · 39:25"}], "note": "A figure of speech and a practice. Campbell's player framing is his claim; this needs none of it."},
