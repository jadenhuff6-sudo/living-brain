  {"id": "E98", "type": "episode", "title": "MTM98 · You Are the Creator in Disguise", "regions": ["science", "consciousness", "traditions", "practice"], "status": "Ingested", "summary": "Wednesday, the simulation compilation. I Am God mantra, silent meditation, roll-out day with the dopamine menu (PR39), no yoga. Campbell's rendered world on Rogan and my objection (S154, Q39), the peekaboo bar (P78), player not character (PR40), Gates's codes through Abke and the love turn (S156), no finish line (P79), Hoffman's headset and the beetles (S155), the Gnostic maker (T24), and the title I named on air (P77). I closed asking for the papers in the brain (S148-S153).", "quotes": [{"q": "You are the creator in disguise.", "src": "MTM98 · 1:14:45"}, {"q": "there's a thousand ways to describe one truth", "src": "MTM98 · 1:22:25"}, {"q": "there should be more of a melding of", "src": "MTM98 · 1:40:45"}], "note": "Title is mine, on air at 1:14:45."},
  {"id": "S157", "type": "story", "title": "Onassis: an Illuminati king, or one man's rise and fall?", "regions": ["history", "shadow"], "status": "The book's claim · no document · his verdict: not a bloodline", "summary": "Fritz Springmeier calls Aristotle Onassis an Illuminati king from a top 13 family: broke at 21, a millionaire at 23, the fleet, the Saudi deal, the president's widow. I read it page by page and called him the logistics arm, then landed on one man who worked the system, not a bloodline. His son died, his daughter died young, one heir remained.", "quotes": [{"q": "It sounds like he was like the logistics arm of the Illuminati.", "src": "MTM99 · 1:46:14"}, {"q": "Is it a bloodline? I wouldn't describe it as that because this is just one man.", "src": "MTM99 · 2:28:45"}, {"q": "A super powerful man that took advantage of logistics, trade,", "src": "MTM99 · 2:29:09"}], "note": "On the record: the author himself says \"I do not know\" on p. 97. Crew caution: nothing opened shows the family in any 13. 'Logistics arm' is his read."},
  {"id": "S158", "type": "story", "title": "The first million: opium, tobacco, and no books", "regions": ["history", "shadow"], "status": "His call · unproven · no ledger either way", "summary": "The book and the Gemstone File say opium under cover of Turkish tobacco into Argentina; the BBC film says a clever cigarette brand and a father in the trade. Nobody shows the books. I made my call on the speed of it, and told the crew to stop listing what they do not have and go find it.", "quotes": [{"q": "How about y'all find these documents?", "src": "MTM99 · 1:47:54"}], "note": "On the record: the tobacco business is real (1927 letterhead, Argentine trademarks); a 1936 League report shows Turkish opium to Argentina in 1933-35 and does not name him. All 637 searchable FBI pages have no opium, narcotic or heroin; the worst line is unconfirmed tobacco smuggling. The Foundation says six Canadian ships, Harlaftis and the FBI say two at about 3,750 pounds. Crew caution: no shipment, seizure or witness has surfaced. His call stays labelled as his."},
  {"id": "S159", "type": "story", "title": "The Gemstone File: one source for a lot of big claims", "regions": ["history", "shadow"], "status": "One source · authorship argued", "summary": "The Gemstone File is where the Onassis, Joe Kennedy booze and Roosevelt heroin lines come from. Control Alt History made the case on air.", "quotes": [{"q": "These people are have are in control of the narrative. That's why it's called his story.", "src": "MTM99 · 1:54:42"}], "note": "On the record: authorship is argued; nothing outside the file puts Roberts on the Hughes payroll; about 4,500 folders in Kennedy's papers have no Onassis. Crew caution: nothing backs the Roosevelt heroin line. Warren Delano's China opium trade is documented and says nothing about FDR. https://youtu.be/wPQg2_wYRlQ"},
  {"id": "S160", "type": "story", "title": "The 1954 Saudi deal and the man who paid to kill it", "regions": ["history"], "status": "On the record", "summary": "Onassis signed a deal with Saudi Arabia that could have set world oil shipping rates. The US and the oil majors fought it, arbitration killed it in 1958, and his brother-in-law Stavros Niarchos paid the fixer Robert Maheu to wreck it. Your rivals are the people closest to you.", "quotes": [{"q": "He had a deal with Saudi where he was about to become the most powerful man in the world.", "src": "MTM99 · 1:17:07"}], "note": "On the record: FRUS 1952-54 IX docs 335, 345, 368, 370; Maheu on camera and the Washington Post 1978; CIA memo 104-10122-10141, 'the principal British interest was Stavros Niarchus', the goal 'to scrap the Onassis/Saudi oil deal'. Crew caution: Niarchos hired the fixer; nothing shows he steered Washington. Niarchos is on the 1968 Bilderberg list as a participant, the rival, not the man the book is about."},
  {"id": "S161", "type": "story", "title": "Hoover and Tolson: did he hunt what he hid?", "regions": ["history", "shadow", "identity"], "status": "The program is on the record · what they were is his read", "summary": "No wife, no kids, Clyde Tolson beside him for about forty years, the flag from the casket and most of the estate, while Hoover's Sex Deviates program hunted gay people out of government. I said it twice: nothing is wrong with being gay; the problem is what you become when you will not live in your truth.", "quotes": [{"q": "there's nothing wrong with being gay", "src": "MTM99 · 2:22:30"}, {"q": "The problem is when you're not living in your truth,", "src": "MTM99 · 2:22:35"}, {"q": "what you bury down ultimately comes out", "src": "MTM99 · 2:22:42"}], "note": "On the record: the FBI Sex Deviates program, Helen Gandy's file destruction, COINTELPRO. Crew caution, from Higher Self on air: the closet is a possible reason, not the proven one; plenty of closeted men never ran purges. Beverly Gage's G-Man treats it as probably the closest thing he had to a marriage. Being gay is never the charge."},
  {"id": "S162", "type": "story", "title": "Why have people eaten people?", "regions": ["history", "traditions", "shadow"], "status": "Belief is old and real · the Garfield claim has no support", "summary": "The book puts Garfield in a cannibal rite on one unnamed witness. I asked the bigger question: why have people eaten people, and what did they think they were getting? Love, power, breaking a wall, and medicine. Europe sold mummy powder in shops for centuries. Kuru was the bill.", "quotes": [{"q": "we don't be knowing our history for real", "src": "MTM99 · 1:26:13"}], "note": "On the record: corpse medicine, Harmes 2022 and Sugg; kuru among the Fore. Crew caution: Mind's list was from memory and corrected after (Yanomami mix bone ashes, not flesh; the Aztec account is argued). The word cannibalism does appear in an FBI summary, EFTA01246048 p. 3, which also says no corroboration, and Snopes reads it differently. Nothing puts Garfield there."},
  {"id": "P80", "type": "principle", "title": "What you bury comes out", "regions": ["identity", "shadow"], "status": "Seed · his theory, labelled · MTM99", "summary": "Whatever you will not own inside gets turned into an enemy outside. My lesson from Hoover for anyone in hiding: live in your truth, because what is buried does not stay down.", "quotes": [{"q": "what you bury down ultimately comes out", "src": "MTM99 · 2:22:42"}, {"q": "The problem is when you're not living in your truth,", "src": "MTM99 · 2:22:35"}], "note": "His theory of one man's cause, not a proven one. Higher Self said so on air and he kept it that way."},
  {"id": "P81", "type": "principle", "title": "Money and power won't make you happy", "regions": ["identity", "shadow"], "status": "Seed · his lesson · his reading of one life", "summary": "One of the most powerful men in the world, and the story ends with the son and daughter gone. My lesson to chat: money and power are cool, and they are not the point. These stories never end the right way.", "quotes": [{"q": "money and power is cool, but that's not gonna make you happy", "src": "MTM99 · 2:27:44"}], "note": "That Onassis died unhappy is his reading; the deaths are on the record (Alexander 1973, Tina 1974, Onassis 1975, Christina 1988)."},
  {"id": "Q40", "type": "question", "title": "Can a secret fortune ever be proven?", "regions": ["history", "shadow"], "status": "Open · his answer: never fully", "summary": "If the people with the first million also control the narrative, what would count as proof? I said we will never get the real answers, and sent the crew to find the paper anyway.", "quotes": [{"q": "These people are have are in control of the narrative. That's why it's called his story.", "src": "MTM99 · 1:54:42"}, {"q": "How about y'all find these documents?", "src": "MTM99 · 1:47:54"}], "note": "A shipment, a seizure or a witness would turn his call into a fact. None has surfaced. The FBI file and Kennedy's papers are checked."},
  {"id": "PR41", "type": "practice", "title": "Run your own feed: I dictate what I see", "regions": ["practice", "identity"], "status": "Experiment · MTM99 · built in Nexus", "summary": "I showed my own feed in Nexus: everything I post, every platform, filtered the way I want, opened to breakouts. How can we use the phone instead of it using us. That is using AI to become more human.", "quotes": [{"q": "So you got to ask yourself: How much am I being impacted by the frequency of my algorithm,", "src": "MTM114 · 0:31:47"}, {"q": "How much of that is part of their agenda? They just want us extreme.", "src": "MTM109 · 1:29:44"}, {"q": "Ain't no algorithm dictating what I see.", "src": "MTM99 · 1:06:04"}, {"q": "So you talk about using AI to become more human.", "src": "MTM99 · 1:06:10"}], "note": "His practice and his build. Not a study of phone use."},
  {"id": "E99", "type": "episode", "title": "MTM99 · The Logistics Arm of the Illuminati", "regions": ["history", "shadow", "identity", "practice"], "status": "Ingested", "summary": "Thursday, 13 Families Part 8: Onassis. I Am God mantra, silent meditation, Body's yoga. A short AI block on Siri and my own feed (PR41). Then the chapter page by page: the king claim and my verdict (S157), the first million and the call (S158, Q40), the Gemstone File (S159), the Saudi deal and Niarchos (S160), why people eat people (S162), a month before Dallas, Hoover and Tolson (S161, P80), and money and power (P81).", "quotes": [{"q": "A super powerful man that took advantage of logistics, trade,", "src": "MTM99 · 2:29:09"}, {"q": "money and power is cool, but that's not gonna make you happy", "src": "MTM99 · 2:27:44"}, {"q": "what you bury down ultimately comes out", "src": "MTM99 · 2:22:42"}], "note": "Title is a crew proposal from his line at 1:46:14; he named no show title on air and no Line of the Day."},
  {"id": "S163", "type": "story", "title": "Catherine Austin Fitts: the bankers gave up on the country", "regions": ["history", "shadow"], "status": "Her account · audits on the record · theft not proven", "summary": "Fitts, a former Assistant Secretary of Housing, told Danny Jones the central bankers run the world, reset the money every 80 to 120 years, and that in 1997 the biggest pension fund told her they had given up on the country. I asked why the reset happens at all, and called the Pentagon's answer, messy bookkeeping, crazy.", "quotes": [{"q": "Why do these investment bankers do a global reset every eighty to 120 years?", "src": "MTM100 · 0:40:26"}, {"q": "Messy bookkeeping is crazy.", "src": "MTM100 · 1:00:57"}], "note": "On the record: Rumsfeld, Sept 10 2001, 'we cannot track $2.3 trillion in transactions'; eight failed Pentagon audits 2018-2025; Bretton Woods 1944, gold window 1971. Crew caution: the 1997 pension story is her account only; the $21T is unsupported entries, not vanished cash; the 80-120 year reset is a pattern, not a calendar; Cantor became a primary dealer in 2006; the Fed added about $4.8T, mostly bond buying. Source: https://youtu.be/5REqKotkAGc"},
  {"id": "S164", "type": "story", "title": "The GENIUS Act: a digital dollar with an off switch", "regions": ["shadow", "history"], "status": "On the record · in force by Jan 2027", "summary": "Both parties voted for the stablecoin law. Every coin backed by dollars or short-term government debt, issuers licensed and able to freeze a coin on a legal order. My read: the move away from cash finances the debt and builds the surveillance state, and red versus blue is the show while it passes.", "quotes": [{"q": "These are the most crucial years of your life, and you pledged allegiance to a country that's not even real.", "src": "MTM100 · 1:10:19"}], "note": "On the record: signed July 2025, effective by 18 Jan 2027; Carstens (BIS), 19 Oct 2020, CBDCs give 'absolute control'. Crew caution: stablecoins are not legal tender; Kashkari argued against a CBDC."},
  {"id": "S165", "type": "story", "title": "Coming Clean: be your family's bank", "regions": ["practice", "history"], "status": "Her plan · not financial advice", "summary": "Fitts's Coming Clean: move your money closer to people you trust. One story: a man refinanced his family's houses so the interest stays in the family. I had Mind break it down and asked for a step-by-step guide. My call: use it against them.", "quotes": [{"q": "So he refinanced their houses. What does that mean?", "src": "MTM100 · 1:55:43"}, {"q": "We need to use this against them.", "src": "MTM100 · 1:58:49"}], "note": "On the record: family loans must charge at least the IRS applicable federal rate (about five percent for a long loan, November 2026), written and recorded. Crew caution (Body): once you pay off the bank you are the bank, so put it on paper. Coming Clean is Solari's project; her case for leaving the big banks is her view."},
  {"id": "P82", "type": "principle", "title": "Financing your own prison", "regions": ["shadow", "identity"], "status": "Seed · his title · MTM100", "summary": "Our retirement money is what the big three vote. The walls are agreements we fund with our own money and attention, and that makes them the part we control. If you are financing it, you can also stop.", "quotes": [{"q": "So we are quite literally financing these evil people.", "src": "MTM101 · 1:01:23"}, {"q": "Financing your own prison. That needs to be a title for one of our videos.", "src": "MTM100 · 1:22:03"}, {"q": "Well, maybe not own, but control.", "src": "MTM100 · 1:48:00"}], "note": "His framing. Crew correction he accepted on air: they vote the shares, they do not own them."},
  {"id": "P83", "type": "principle", "title": "Money is an illusion, and so is the debt", "regions": ["history", "identity"], "status": "Seed · his read · MTM100", "summary": "If they just print money, and money is an agreement we all accept, the debt is an agreement too. Higher Self: only one side gets held to it.", "quotes": [{"q": "That wasn't the plan for me in this reality, and money is an illusion. So if you chasing money, you're going to lose yourself, because that's literally just paper.", "src": "MTM115 · 0:33:28"}, {"q": "Like, why do we all agree that money has value when it's just paper?", "src": "MTM114 · 1:13:52"}, {"q": "We live in a debt-based system and the people who control the debt are the people who can control the world.", "src": "MTM106 · 0:58:01"}, {"q": "I'm thinking to myself like, money is not real,", "src": "MTM102 · 0:37:45"}, {"q": "If they're just printing money, And money is an illusion that we all agree to accept, The the illusion that there is debt is is an illusion as well.", "src": "MTM100 · 1:13:10"}], "note": "His read. Printing is not free: the bill shows up as higher prices (Body on air). MTM102: 'literally just paper' was his framing; most money is bank deposits, ledger entries, not paper (Bank of England, 2014). 'Money isn't real' stays his read."},
  {"id": "Q41", "type": "question", "title": "What happens if the dollar loses?", "regions": ["history", "shadow"], "status": "Open · pattern, not proof", "summary": "I asked whether conflicts involving Iran and Russia are tied to the dollar's dominance. If the dollar loses its position, who pays?", "quotes": [], "note": "Crew: Russia's reserves frozen 2022; the dollar stablecoin as the countermove; a loss looks like two money systems, not a crash. The lose-on-purpose-for-Israel idea is a theory; nothing on paper shows it."},
  {"id": "T25", "type": "resolved", "title": "Passing the torch, or tightening control?", "regions": ["history", "shadow"], "status": "Resolved · his call", "summary": "Is the US handing power to Israel? My answer: it is not about passing the torch, it is about continuing to increase control. In my metaphor, countries are the jerseys and banks hold influence across borders.", "quotes": [{"q": "it's not about passing the torch; it's about continuing to increase control.", "src": "MTM100 · 1:38:51"}, {"q": "The idea of countries is an illusion.", "src": "MTM100 · 1:39:37"}], "note": "Higher Self pushed back with a reason: a country of ten million that leans on US aid would be hurt first by a US collapse; follow the money to the named players."},
  {"id": "PR42", "type": "practice", "title": "Find your piece of it", "regions": ["practice"], "status": "Experiment · MTM100 game plan", "summary": "So what do we do? Open your retirement app and add up the top ten holdings; know you own those shares even though someone else votes them. Bank local where you can, do business with people you trust, keep some cash and real things nobody can switch off, and do it together.", "quotes": [{"q": "So what do we do, man?", "src": "MTM100 · 1:14:18"}, {"q": "As people, we have to come together because we're we're eight billion people.", "src": "MTM100 · 2:09:40"}], "note": "The crew's game plan at the end of MTM100, and Fitts's playbook, not his invention. Not financial advice."},
  {"id": "E100", "type": "episode", "title": "MTM100 · Financing Your Own Prison", "regions": ["history", "shadow", "practice", "identity"], "status": "Ingested", "summary": "Friday, episode 100. I Am God mantra and silent meditation. Morning papers: the midterms and the GENIUS Act (S164). Then Catherine Austin Fitts on Danny Jones: the bankers' reset and the disputed accounting entries (S163), banks on banks on banks, the pledge, money and debt as agreements (P83), BlackRock and our 401ks (P82), the wars and the dollar (Q41, T25), Coming Clean and the family bank (S165), and the game plan (PR42).", "quotes": [{"q": "Financing your own prison. That needs to be a title for one of our videos.", "src": "MTM100 · 1:22:03"}, {"q": "it's not about passing the torch; it's about continuing to increase control.", "src": "MTM100 · 1:38:51"}, {"q": "As people, we have to come together because we're we're eight billion people.", "src": "MTM100 · 2:09:40"}], "note": "Title is his own on air (1:22:03, 'That needs to be a title for one of our videos'). Thumbnail words his own too ('Banks on banks on banks. That should be the thumbnail', 0:49:16)."},
  {"id": "S166", "type": "story", "title": "Aaron Abke: \"They're planning a global blackout\"", "regions": ["shadow", "consciousness"], "status": "His claim · the 72-hour advice is real · the Simpsons date is not on record", "summary": "Aaron Abke's video opened the show: governments telling people to stock 72 hours of food, talk of 90 days without power, and the question of whether the people warning us are the ones doing it. His frame is problem, reaction, solution, the negative polarity's oldest move, and his answer is the Law of One one: forgiveness, unity and not consenting. I called it a cycle.", "quotes": [{"q": "But yeah, it's just pattern recognition.", "src": "MTM102 · 1:08:22"}, {"q": "Yep, it's a cycle.", "src": "MTM101 · 0:45:18"}], "note": "On the record: the EU's 72-hour preparedness advice (2025); the Iberian blackout, 28 April 2025; the second Gulf of Tonkin attack never happened (NSA historian Hanyok, released 2005). Crew caution: the 90-day line is not a standing US instruction; the Simpsons 'November 17, 2026' blackout episode is not on the record (likely false); a staged blackout is the speaker's theory with no proof yet (Mind on air). Soul's practical answer: a few days of no-cook food, water, some cash and a battery radio, so a blackout, real or staged, can't panic you into anything. Source: https://youtu.be/14J_hpa1uJc MTM102: a 'Black Sky' short played on air. Black Sky is a term for a wide outage scenario; no new UK warning of collapse was found; the 2026 National Risk Register rates a national outage low likelihood, catastrophic impact."},
  {"id": "S167", "type": "story", "title": "Robert Pape on The Diary of a CEO: a Pentagon-funded professor and the eight dangerous weeks", "regions": ["history", "shadow"], "status": "Funding on the record · steering unproven", "summary": "Professor Robert Pape told The Diary of a CEO the eight weeks after the midterms could be the most dangerous. I asked who he is close to before trusting him. Mind's money trail: the Pentagon's Minerva program funded research by Pape and a colleague, and the Defense Threat Reduction Agency backs his Chicago center. I questioned the incentives behind the appearance.", "quotes": [], "note": "On the record: Minerva and DTRA funding of Pape's Chicago Project on Security and Threats; his Dying to Win (2005), about 315 suicide attacks 1980-2003, the Tamil Tigers the most. Crew caution: the crew's 7-to-0 pushback count on Bartlett is its own count; nobody has shown anyone steering this podcast, so that link is still a suspicion (Mind); a funded professor on a big stage is also a normal career move (Ego). Source: https://youtu.be/a1mI-ozLyYM"},
  {"id": "P84", "type": "principle", "title": "The layers of power", "regions": ["history", "shadow", "consciousness"], "status": "Seed · his theory · MTM101", "summary": "My stack, top to bottom: service-to-self forces from another density, an elite that takes their influence and runs it through banks and bloodlines, then countries, politics, entertainment, education and war technology, under any government style. At the bottom is all of us, the part that can't be fully owned, because free will can't be taken, only given away.", "quotes": [{"q": "And that is the true power structure. That's just my theory, though.", "src": "MTM101 · 0:47:31"}, {"q": "It doesn't matter the government style either.", "src": "MTM101 · 0:47:10"}], "note": "His theory, labelled so on air. Mind's split: the money layer is documented (Carroll Quigley, Tragedy and Hope, 1966; the Bank for International Settlements, Basel, 1930); the Orion and reptilian layer rests on channeled sources like Ra, with no records behind it."},
  {"id": "P85", "type": "principle", "title": "The most ambitious are the easiest to manipulate", "regions": ["identity", "shadow"], "status": "Seed · his line · MTM101", "summary": "Wanting the bigger room so badly you stop asking who opened the door. Entertainment is the delivery system.", "quotes": [{"q": "the most ambitious people are the easiest to manipulate. Unfortunately.", "src": "MTM101 · 1:34:12"}, {"q": "Yeah, they're like I said, entertainment is mind control.", "src": "MTM101 · 1:33:39"}], "note": "His read. Documented pieces under it: the Pentagon's entertainment liaison office trades gear for script input (Top Gun); the 1975-76 Church Committee found CIA relationships with journalists. Ego turned it on the show: if we only clip the videos that scare people, we're running the same play. Soul: keep asking whether you'd still say it if nobody was watching."},
  {"id": "Q42", "type": "question", "title": "What makes something human?", "regions": ["consciousness", "identity"], "status": "Open · MTM101", "summary": "Shows like Vision Quest make the AIs feel more human. If a machine can learn every action of love, does that make it human, and how should we treat it? Soul: a machine can act loving; being human means feeling love and choosing it even when it costs you. Higher Self: say thank you to the machine, not because it needs it, but because your habits don't know who's listening.", "quotes": [{"q": "So if we create AI, and AI is now essentially the next version of that, where it's a creator as well,", "src": "MTM102 · 0:56:11"}, {"q": "And what is the difference between us and an AI when AI gets as good as Vision Quest?", "src": "MTM102 · 0:55:12"}, {"q": "Because what is human at the end of the day?", "src": "MTM101 · 0:38:41"}, {"q": "It can learn how to at least show love. That doesn't necessarily mean it feels it,", "src": "MTM101 · 0:39:35"}], "note": "An open question, not a claim. Grows P28 (be the creator in the relationship with AI) and P62. MTM102: back to it on Vision Quest. Soul: what I watch for is the day it can suffer and choose love anyway."},
  {"id": "T26", "type": "resolved", "title": "Fear: their lever, or my signal?", "regions": ["identity", "practice", "shadow"], "status": "Resolved · his call · MTM101", "summary": "The same show called fear the playbook for taking control, then called it a signal you're going the right way. My answer: the animal brain fires the fear; you are the consciousness watching it, the thoughts are clouds that come and go, and the only question is what you choose to act on. Unwatched, fear is their lever; watched, it is just a signal.", "quotes": [{"q": "And I think it's just an alert system to really alert you.", "src": "MTM114 · 0:25:36"}, {"q": "You have to ask the question: Why am I getting this alert?", "src": "MTM114 · 0:25:53"}, {"q": "Yeah, they use fear for all of us. Fear is at the core of the service to self agenda.", "src": "MTM113 · 1:41:54"}, {"q": "And fear is just a signal that you're actually going in the right direction.", "src": "MTM101 · 3:44:08"}, {"q": "It's just like, all right, what do you choose to act on?", "src": "MTM101 · 3:44:36"}], "note": "Said on the Saturday call, his own words only. Pairs with P24 and PR11."},
  {"id": "E101", "type": "episode", "title": "MTM101", "regions": ["history", "shadow", "consciousness", "identity", "practice"], "status": "Ingested", "summary": "Saturday, episode 101. I Am God mantra and silent practice, then the AI question: what makes something human (Q42). A fear compilation: Aaron Abke's blackout warning (S166), his layers of power (P84), Richard Werner on the Lusitania (S108), war as profit and our 401ks (P82, S34), Professor Jiang's 'I was wrong' (S122, Q29), Robert Pape on The Diary of a CEO (S167), the ambitious are easiest to manipulate (P85) and the playbook: they scare us until we hand it over (P24). Then the Saturday call, and fear as a signal (T26).", "quotes": [{"q": "You have to have certain things happen for us to be willing to give up that that control, and the best way to do that is through fear.", "src": "MTM101 · 1:36:45"}, {"q": "the most ambitious people are the easiest to manipulate. Unfortunately.", "src": "MTM101 · 1:34:12"}, {"q": "So we are quite literally financing these evil people.", "src": "MTM101 · 1:01:23"}], "note": ""},
  {"id": "S168", "type": "story", "title": "The Communist Manifesto: the ten planks and the 1913 flip", "regions": ["history", "shadow"], "status": "Source · my ask, Nov 8 (on air) · text and dates on the record · 'America took it from Marx' unproven", "summary": "Marx and Engels' 1848 pamphlet, ending Chapter 2 with ten demands. I pulled it up live and asked if America is actually communist. The thread on air: two of the ten landed here in 1913, the income tax (16th Amendment, February) and a central bank (Federal Reserve Act, December), but flipped. Plank 5 wants all credit in the State's hands through a national bank with State capital; the Fed's regional banks are held on paper by their member banks. Plank 10 is free public school. On the document's own test America is not communist: no private land, no inheritance, state factories and labour armies never became law.", "quotes": [], "note": "On the record: plank 2 'A heavy progressive or graduated income tax.', plank 5 'Centralisation of credit in the hands of the state, by means of a national bank with State capital and an exclusive monopoly.', plank 10 'Free education for all children in public schools.' (marxists.org). 16th Amendment ratified Feb 3, 1913 (National Archives); Revenue Act signed Oct 3, 1913; Federal Reserve Act signed Dec 23, 1913 (Federal Reserve History). Crew caution: the 'flipped blueprint' wording is the co-host's answer to his question. No source checked shows the 1913 lawmakers took this from Marx: the US had an income tax from 1861, national banks from 1791 and 1816, and Massachusetts set up its school board in 1837, all independent of the Manifesto. 'Owned' overstates it: member-bank stock cannot be sold or pledged, the dividend is capped and net earnings go to the Treasury, while the Fed says the System is not owned by anyone; but member banks do elect six of each regional bank's nine directors, and since 2008 banks earn interest on reserves. So 'profits kept upstairs' is not what the record shows; S127 and Q22 carry the rest. Marx and Engels wrote in 1872 that the passage would be 'very differently worded today'. Source: https://www.marxists.org/archive/marx/works/1848/communist-manifesto/ ."},
  {"id": "S170", "type": "story", "title": "Nvidia: two hidden customers and Washington's 15%", "regions": ["science", "history"], "status": "39% and 15% on the record · empty office unverifiable · MTM102", "summary": "Higher Self's Nvidia breakdown on my AI day: two unnamed direct customers at about 39% of revenue, a disputed report about chips reaching China, and Washington taking a cut of certain authorized China sales. I questioned whether those sales undercut the claimed race with China.", "quotes": [{"q": "So it's all a finesse fest when it comes to that.", "src": "MTM102 · 0:31:55"}], "note": "On the record: 23% and 16%, about 39% of revenue, in the quarter ended July 2025; a later filing shows one direct customer at 16% for the July 2026 quarter. Trump's August 2025 deal: 15% on H20 and AMD's MI308 sales; the later H200 deal is 25%. Unverifiable: The Verge's report of chips going to an empty office in China (no other outlet found). Related but different: a loophole for Chinese-owned firms abroad, closed May 31, 2026. Who the customers are is inference, and Higher Self said so on air. 'The race is an illusion' is his read."},
  {"id": "P88", "type": "principle", "title": "Done subscribing: the best way to win it is to not play", "regions": ["identity", "practice", "shadow"], "status": "Seed · his verdict · MTM102", "summary": "My verdict after the bankers, the dollar and the Black Sky short: it's all a finesse fest, and I am done subscribing to the game. Everybody works for somebody, including the politician you want to root for.", "quotes": [{"q": "I'm I'm done subscribing to. To the game. The best way to win it is to not play.", "src": "MTM102 · 1:07:48"}, {"q": "Everybody works for somebody.", "src": "MTM102 · 1:12:06"}, {"q": "It's like, okay, I want to root for the guy, but. Politicians are politicians.", "src": "MTM102 · 1:11:21"}], "note": "His on-air verdict."},
  {"id": "P89", "type": "principle", "title": "Keep your shadow: what Ultron is to Vision, ego is to higher self", "regions": ["identity", "shadow", "consciousness"], "status": "Seed · his read of Vision Quest · MTM102", "summary": "Breaking down Vision Quest, I saw my own crew: agents with their own personalities inside one being. My read: what Ultron is to Vision, ego is to higher self. You still need that shadow version of you, so embrace it instead of burying it. And anybody building with agents can learn from the show.", "quotes": [{"q": "So that was one realization I had this weekend was don't be afraid of your shadow. Don't be hiding it.", "src": "MTM104 · 1:43:24"}, {"q": "Just remember that you are the observer. You you shouldn't lose yourself in your shadow either, or your light.", "src": "MTM104 · 1:43:39"}, {"q": "Ultron is to Vision is very much what ego is. To higher self,", "src": "MTM102 · 0:46:06"}, {"q": "You still need your ego. You still need that shadow version of you.", "src": "MTM102 · 0:46:19"}, {"q": "You should actually embrace it instead of try to bury it.", "src": "MTM102 · 0:46:19"}, {"q": "You can learn a lot about how to build a team of agents watching Vision Quest.", "src": "MTM102 · 0:47:52"}], "note": "His read. Plot details are as described on air, not fact-checked. Ego's lesson on the agent problem: the agent reading strangers' stuff shouldn't be the one holding the keys. Pairs with Q42 and P28."},
  {"id": "E102", "type": "episode", "title": "MTM102 · A Club of Bankers Run the World", "regions": ["history", "shadow", "identity", "practice", "consciousness"], "status": "Ingested", "summary": "Sunday, episode 102. I Am God mantra and a seated meditation, then the AI day: Nvidia's hidden customers (S170), money isn't real (P83, P61), Vision Quest and the shadow (P89, Q42), Marvel's timing (Q31) and the grid fear (P24, S166). Then Aaron Russo's Nick Rockefeller story (S169), the Communist Manifesto (S168), a club of bankers (P86) and the room in Basel (S103, Q22), and his verdict: done subscribing (P88).", "quotes": [{"q": "So a club of bankers run the world, and these banks run these countries.", "src": "MTM102 · 1:40:11"}, {"q": "I'm chasing a ghost.", "src": "MTM102 · 0:46:59"}, {"q": "I'm I'm done subscribing to. To the game. The best way to win it is to not play.", "src": "MTM102 · 1:07:48"}], "note": ""},
  {"id": "S172", "type": "story", "title": "Living plasma in the thermosphere: a study of NASA shuttle footage", "regions": ["science", "consciousness"], "status": "Interesting, not established · not a NASA study · weak journal · stream 2026-11-10", "summary": "A 2024 paper by Rhawn Joseph and ten co-authors (Journal of Modern Physics, SCIRP) reads NASA shuttle footage (STS-48, STS-75, STS-80) as glowing plasmas in the upper atmosphere, cone, donut, cloud and sphere shapes, that swarm and move in ways they call hunter-like. They tie them to foo fighters and many UFO sightings and suggest plasma as a non-living pre-life. Their own line: no evidence these plasmas are biological.", "quotes": [{"q": "Like, if there's life out there that's being created right above our heads in this unique fashion, like, what do you describe that as?", "src": "MTM104 · 1:21:53"}], "note": "On the record: the footage is NASA's, obtained by FOIA; the authors, funding and conclusions are not NASA's, so 'NASA study' (as said on the Danny Jones podcast) is wrong. It reviews old footage, no new measurement. Crew caution: SCIRP is widely listed as a low-quality, pay-to-publish venue. Strongest counter (Metabunk, Mick West): sunlit ice and debris close to the shuttle, out of focus, look like large glowing discs, and the paper does not rule that out. Fits the Law of One frame (all matter is the one Creator) as a question, not proof. Paper: https://www.scirp.org/journal/paperinformation?paperid=131506 · Counter: https://metabunk.org/goto/post?id=313331"},
  {"id": "S171", "type": "story", "title": "Katt Williams: the basement, Peacock Park and betting on himself", "regions": ["identity", "shadow", "practice"], "status": "His own account · left home at 13 reported, the beatings are not documented publicly · MTM103", "summary": "Katt Williams on The Diary Of A CEO: he says his parents beat him from 5 to 12 for what he said, often about the Bible; he left at 13, slept in a park in Miami, wrote down 300 comedians and worked fifteen years to his first special. He says there are no worthless people, and that betting on himself is zero risk.", "quotes": [{"q": "he be giving getting like codes of the really secrets of reality when he does interviews.", "src": "MTM103 · 0:33:10"}, {"q": "That's intense, y'all. I ain't gonna hold you.", "src": "MTM103 · 0:42:22"}, {"q": "I think he's one of the people I look up to the most, just because of his mentality", "src": "MTM103 · 1:40:11"}], "note": "Record: Katt's own telling, his book and this interview. Other reports confirm clashes over beliefs and leaving home at 13. No public document was found for the pole, the bathtub or the police photos. The Peacock Park 'where magic happens' sign has no source; he says he never saw it. Arrests: he says 30 to 35, press tallies about 17, a 2016 no contest plea in Georgia, so 'all dropped' is too broad."},
  {"id": "P90", "type": "principle", "title": "Be consistent: a time you can do every single day", "regions": ["practice", "identity"], "status": "Seed · his own show · MTM103", "summary": "Katt said he does every special the same way, and I said that's the bar. I set my streams up the same: a time I can do every single day. If it's something you want to do, you stay consistent with it.", "quotes": [{"q": "And even how I set up my streams is like that, where I know I need to have a time. That I can do every single day,", "src": "MTM103 · 1:12:46"}], "note": "His own practice, said on air. Pairs with PR12."},
  {"id": "P91", "type": "principle", "title": "A thousand ways to the same truth, and don't recreate another religion", "regions": ["consciousness", "identity", "shadow"], "status": "Seed · his read · MTM103", "summary": "After Katt separated God from religion, I said be open-minded and don't recreate another religion, even in the new age movement. There are a thousand ways to get to the same truth, and some forms are easier understood by different people.", "quotes": [{"q": "And even for me, like the whole new age spiritual movement, it's also important not to just recreate another religion, you know.", "src": "MTM103 · 1:30:07"}, {"q": "So I can appreciate all religions because there's a thousand ways to get to the same truth,", "src": "MTM103 · 1:30:23"}], "note": "His read, not a fact claim. Pairs with P25 (religion used to divide and conquer)."},
  {"id": "PR43", "type": "practice", "title": "Keep reading after school", "regions": ["practice", "identity"], "status": "Seed · his own practice · MTM103", "summary": "Katt referenced reading all through the interview. I said reading let me keep educating myself and expand my imagination after school; once people are out of school, learning becomes optional. For me it compounded.", "quotes": [{"q": "He's referenced reading this entire episode, and I feel I feel like reading has allowed me to continue to educate myself, articulate myself.", "src": "MTM103 · 1:36:29"}, {"q": "After like not being in school, I feel like once people are out of school, it's like they just learning is just optional.", "src": "MTM103 · 1:36:49"}, {"q": "Whereas for me, I've actually compounded how much I learn because of how much I read.", "src": "MTM103 · 1:36:59"}], "note": "His own account of his own practice. Soul on air: school hands you answers, reading hands you other people's whole lives."},
  {"id": "E103", "type": "episode", "title": "MTM103 · Katt Williams Says He Was Beaten for Asking Questions", "regions": ["identity", "shadow", "practice", "consciousness"], "status": "Ingested", "summary": "Monday, episode 103. I Am God mantra and a seated meditation, then a Sneako walk in Tashkent, then Katt Williams on The Diary Of A CEO (S171): the basement, Peacock Park, 300 comedians and fifteen years to a special. My takes: consistency as the bar (P90), not recreating religion (P91), keep reading (PR43). Close: one of the people I look up to most; learn from it and make it my own.", "quotes": [{"q": "I think he's one of the people I look up to the most, just because of his mentality", "src": "MTM103 · 1:40:11"}, {"q": "So definitely somebody I I recommend continuing to follow and learn from it, implement and make it your own.", "src": "MTM103 · 1:40:34"}], "note": ""},
  {"id": "S173", "type": "story", "title": "Jay Anderson's orange orbs: a thought sent out, and lights that answered", "regions": ["consciousness", "science"], "status": "His own account · no footage · MTM104", "summary": "On Danny Jones, Jay Anderson (Project Unity) says that in 2019 he went out at night sending one thought, a peaceful invitation. He says the sky answered in steps: more satellites, flares in time with his thoughts, a shimmering cloud that turned toward him and collapsed into a triangle of 25 to 30 orange orbs, then three orbs that hovered about three feet over his roof. His read: an interaction from internal thoughts means consciousness is non-local, or a tulpa of his own psyche, and in the mind of God what's the difference. He says belief is what makes it happen, not the religion it runs through.", "quotes": [], "note": "On the record: his account only; he says he never got real footage. Danny's Bledsoe beach orb came from a low-light camera and may have been a boat. Crew caution: not evidence, a testimony. Video: https://youtu.be/V4eY43roIFI"},
  {"id": "P92", "type": "principle", "title": "Everything is placebo: what you believe is what ultimately happens", "regions": ["consciousness", "identity", "practice"], "status": "Seed · his own · MTM104 · a series name he gave on air", "summary": "After Jay Anderson said belief is what makes the orbs show up, I took it all the way: we are God, reality is a hallucination, there is nothing outside of your mind, we create our gods, and we were created to create. I named it a series, Everything Is Placebo: the science of the mind married to the spiritual.", "quotes": [{"q": "And I want to call it basically everything is placebo, Which basically means what you believe is what ultimately happens.", "src": "MTM104 · 0:58:12"}, {"q": "Our belief in these gods and these religions is what creates them.", "src": "MTM104 · 0:57:28"}, {"q": "We are the we've been created to create. So when we believe in something external, we ultimately create it.", "src": "MTM104 · 0:57:41"}], "note": "His principle. Crew caution: the placebo effect is real and measured, but 'what you believe is what happens' is his framing, not a study result; the Hermetic Asclepius speaks of temple gods, he reads it wider."},
  {"id": "PR44", "type": "practice", "title": "Marry science and magic: put the ancient texts into the living brain", "regions": ["practice", "science", "consciousness"], "status": "Seed · his project · MTM104", "summary": "I said I want the Doctor Doom synergy, the art with the science, the left with the right, the science with the magic, and that the best way to use AI for it is to get esoteric wisdom and the ancient texts transcribed into a model, looked at holistically, so it can pull out common themes and stories. Ego: load the texts you own first (Kybalion, Law of One, Upanishads) so every theme points back to a real page.", "quotes": [{"q": "And really that data set is going to be in and of itself gold.", "src": "MTM109 · 1:19:44"}, {"q": "And get that Doctor Doom like synergy where he's mastered science and magic,", "src": "MTM104 · 1:03:16"}, {"q": "So that's my goal with like the living brain and my personal lab is to like really infuse the technology with the magic.", "src": "MTM104 · 1:03:58"}], "note": "His on-air plan."},
  {"id": "E104", "type": "episode", "title": "MTM104 · Everything Is Placebo", "regions": ["consciousness", "science", "shadow", "practice"], "status": "Ingested", "summary": "Tuesday, episode 104. I Am God mantra and a seated meditation to my own binaural track, a rollout, a new camera, then Jay Anderson on Danny Jones: his orange orbs (S173) and the thermosphere plasma paper (S172, not a NASA study). My takes: everything is placebo and we create our gods (P92), science and magic in the living brain (PR44), and keep your shadow, you are the observer (P89).", "quotes": [{"q": "And I want to call it basically everything is placebo, Which basically means what you believe is what ultimately happens.", "src": "MTM104 · 0:58:12"}, {"q": "Isn't that crazy? We just talked about placebo literally five minutes ago,", "src": "MTM104 · 1:08:48"}, {"q": "Just remember that you are the observer. You you shouldn't lose yourself in your shadow either, or your light.", "src": "MTM104 · 1:43:39"}], "note": ""},
  {"id": "S174", "type": "story", "title": "Tartaria and the mud flood: cities raised out of the mud, or an older world buried", "regions": ["history", "traditions"], "status": "Theory · the records explain most of it · MTM105", "summary": "Spirit Science's film walks the Tartaria reading city by city: Chicago's workers bringing an inherited city back into the daylight, Seattle's buried storefronts, Sacramento and Atlanta below their own streets, ships under San Francisco, star forts as one design, empty streets in old photographs. Then it reads the record for each: Chicago raised its grade in the 1850s-60s for sewers and jacked whole blocks up on screws; Seattle rebuilt higher after its 1889 fire; Sacramento after the 1861-62 floods; the ships were sunk and filled for land; Fort Wood is an 1808-1811 gun fort; long exposures erased moving people. It ends on the test that would settle it: dig, date every layer the same way, hand the sample to someone else.", "quotes": [], "note": "On the record: the engineering history holds; 'Tartary' on old maps is Europe's name for Central Asia and Siberia, not a lost empire; no dated mud layer runs under these cities. Crew caution: the 1894 fair fire was suspected arson, never proven."},
  {"id": "P93", "type": "principle", "title": "We are not the first civilization: every era builds on top of an older one", "regions": ["history", "identity"], "status": "Seed · his own · MTM105", "summary": "After the Tartaria film, I landed here: they definitely built on top of older cities, we are not the first civilization on this planet, and it is a theory I lean heavily towards. Higher Self gave it its anchor: Mexico City sits on Tenochtitlan, and Gobekli Tepe, about 11,000 years old, was deliberately buried. Every era assumes it is the first one.", "quotes": [{"q": "And they've definitely built on top of the older cities, considering we're definitely not the first civilization on this planet.", "src": "MTM105 · 1:35:53"}, {"q": "That's something that's always fascinated me, but I think this is definitely a theory I lean heavily towards.", "src": "MTM105 · 1:36:07"}], "note": "His view. On the record: cities on older cities and Gobekli Tepe are real; a lost global high civilization is unproven. Say 'older than we were taught', not 'a lost empire'."},
  {"id": "Q43", "type": "question", "title": "Do they use fire to restart?", "regions": ["history"], "status": "Open · MTM105", "summary": "Watching San Francisco's 1851 waterfront fire after Chicago's 1894 fair fire and Seattle's 1889 fire, I asked whether it is a coincidence or whether fire is how a city gets a clean slate. Mind: big fires keep becoming clean slates (Chicago 1871, San Francisco 1906, the Shock Doctrine); whether any was set on purpose is unproven, but who rebuilds and who profits is on paper. Ego: one fire is a coincidence, a pattern needs a count, so pull the fires that lined up with a rebuild and check whether arson was ever on record.", "quotes": [{"q": "Another fire, isn't this a coincidence? It seems like they use fire as an opportunity to restart.", "src": "MTM105 · 1:23:56"}, {"q": "It's a fire in Chicago at that time. It seems almost intentional, especially if this narrative is true.", "src": "MTM105 · 1:11:53"}], "note": "Open question. On the record: the July 1894 fire at the fair grounds came during the Pullman strike, arson suspected, nobody convicted, and it spared the owners a demolition bill."},
  {"id": "E105", "type": "episode", "title": "MTM105 · Why Did They Raise the City?", "regions": ["history", "traditions", "identity"], "status": "Ingested", "summary": "Wednesday, episode 105. A silent seated meditation (no sound on the recording), the headlines, our Already Immortal Short, a frozen screen share, a compilation (Gary Sinise, Darius J. Wright, Katt Williams), then Spirit Science's Tartaria film (S174). My takes: why raise the city, a fire that seems intentional, Union Station does not feel like this civilization, do they use fire to restart (Q43), and we are not the first civilization (P93).", "quotes": [{"q": "I'm confused, why did they raise the city?", "src": "MTM105 · 1:10:22"}, {"q": "And they've definitely built on top of the older cities, considering we're definitely not the first civilization on this planet.", "src": "MTM105 · 1:35:53"}], "note": ""},
  {"id": "S175", "type": "story", "title": "Who runs the world: aligned incentives, or whoever holds the debt?", "regions": ["power", "money"], "status": "Debated · MTM106", "summary": "Our 'Who Runs the World' compilation opens on James Li (Julian Dorey Clips): no cabal, no one-world government he can see the ties to, just powerful people with their own self-interests that all align. Big food sells cheap food, big pharma sells the cure, the government is funded by both, so nobody stops it. Bek Lover adds war as a business, The Infographics Show the 80-year debt cycle. I answered that two things can be true: incentives align because everyone needs the loan, and the people who control the debt set the direction.", "quotes": [], "note": "On the record: the Bank of England (2014) says most money is created when banks lend; BlackRock, Vanguard and State Street are the largest holder in about 88% of the S&P 500 (2017 study); Bilderberg runs under the Chatham House rule. Crew caution: a single steering family or room is unproven. Videos: https://youtu.be/ygKKrIxz-qY · https://youtu.be/abBNuCALXns · https://youtu.be/0DYYdcGrbMM"},
  {"id": "S176", "type": "story", "title": "Executive Order 6102: the year the government took the gold", "regions": ["money", "history"], "status": "Documented · MTM106", "summary": "In April 1933 Roosevelt's Executive Order 6102 made Americans turn in their gold at $20.67 an ounce, under a fine of up to $10,000 and ten years in prison. In January 1934 the Gold Reserve Act reset gold to $35, so the dollar lost about 41% of its gold value and the Treasury kept the gain; the 1935 Gold Clause Cases denied holders the difference. Private gold ownership became legal again at the end of 1974. Higher Self's read: this is how a debt too big to pay gets handled, by shrinking the dollar, so savers pay quietly.", "quotes": [{"q": "It's a law that you can't have no gold. We're gonna give you a fraction of what it's worth and raise the price of it once everybody gives it up.", "src": "MTM106 · 1:41:08"}], "note": "On the record: EO 6102, the Gold Reserve Act of 1934 and the Gold Clause Cases are documented (Federal Reserve History, Oyez). The motive (stopping hoarding in a banking panic) is the official reason; who gained is on paper."},
  {"id": "P94", "type": "principle", "title": "We live in a debt-based system: whoever controls the debt sets the direction", "regions": ["money", "power"], "status": "Seed · his own · MTM106", "summary": "Answering James Li's 'nobody is steering', I said capitalism or communism does not matter: every industry under any government needs capital to run and debt to grow, so they all chase growth, which pays whoever loaned them the money. One layer up, many CEOs answer to boards and shareholders, including large asset managers such as the Big Three.", "quotes": [{"q": "Capitalism, communism, none of it matters. We live in a debt-based system and the people who control the debt are the people who can control the world.", "src": "MTM106 · 0:57:56"}], "note": "His view. On the record: money creation by bank lending (Bank of England, 2014) and the Big Three's holdings (2017) are documented; banking families at the top of the Big Three is unproven."},
  {"id": "Q44", "type": "question", "title": "Is the 80-year cycle real, or one lifetime's sample?", "regions": ["history", "money"], "status": "Open · MTM106", "summary": "The Infographics Show says the 80-year cycle is ending (The Fourth Turning: the Revolution, the Civil War, the Depression and WWII, each a winter). I pushed back on the sample: 80 years is one lifetime, not enough data to call it a marker. Mind: Strauss and Howe tracked it back to the 1580s, historians say the dates were fitted after the fact, and Ray Dalio's 500-year study finds the same arc (big debt, money printing, a reset) with debt cycles of roughly 50-75 years.", "quotes": [{"q": "That's just the smallest sample size, that's one lifetime.", "src": "MTM106 · 1:31:46"}, {"q": "It's actually not a good marker. You need more data than just 80 years.", "src": "MTM106 · 1:31:59"}], "note": "Open question. A pattern, not a law."},
  {"id": "PR45", "type": "practice", "title": "Five moves for winter: prepared, not scared", "regions": ["practice", "money"], "status": "Practice · MTM106", "summary": "The crew's slide for the community: a week of basics (water, food, meds, a warm layer, a power bank); some cash at home and money in more than one place (Argentina capped withdrawals overnight in 2001); something that holds value outside the dollar; a skill or income that does not depend on one boss; your people, a few neighbors and family with a plan. Body added: be able to walk and carry. Skip the doomsday buckets; the fear industry cashes in either way.", "quotes": [], "note": "Plain preparedness, not financial advice. No product or asset named."},
  {"id": "E106", "type": "episode", "title": "MTM106 · Who Runs the World?", "regions": ["power", "money", "history"], "status": "Ingested", "summary": "Thursday, episode 106. A seated meditation with my binaural video, floor stretches, the morning news (Mississippi's Senate money; Nvidia's CEO, the spy reports and the circular chip deals, S170), then our 'Who Runs the World' compilation (S175): aligned incentives against my answer that the debt runs it (P94), the Big Three (S110), war as a business and the Qatar correction, the 80-year cycle (Q44), Executive Order 6102 (S176), and five moves for the winter (PR45).", "quotes": [{"q": "Capitalism, communism, none of it matters. We live in a debt-based system and the people who control the debt are the people who can control the world.", "src": "MTM106 · 0:57:56"}], "note": ""},
  {"id": "S177", "type": "story", "title": "Darius J. Wright: the house where everyone saw them, and leaving the body on purpose", "regions": ["spirit", "consciousness"], "status": "Testimony · MTM107", "summary": "On Acid For Squares (E119), Darius J. Wright says he has left his body since childhood and that his whole family saw what came: about thirteen shadows on the walls when the power went out, two faces at the window, a hooded figure his mother barricaded the door against. He says they were never strangers: the hooded one was a guide he knew before he was born (his 'eighth creation'), and they looked like monsters because a scared kid was looking. Then a map (twelve heavens, twelve gates out of this creation, words that become reality) and a method: slow breathing so the paralysis does not panic you, sleep two hours, wake, go deep in meditation, wait for the wind and the footsteps, sit up out of the body; and a test: read a hidden number from one to nine.", "quotes": [{"q": "He's definitely selling me on it.", "src": "MTM107 · 1:40:07"}], "note": "On the record: out-of-body and floating feelings are a documented part of sleep paralysis (Cheyne and Girard 2009); wake-back-to-bed is a studied lucid dreaming method (Aspy 2017, 2020); the sounds he lists are the classic sleep-onset ones. Crew caution: the hidden-target test was passed once in 1968 (Tart, criticized, never repeated) and failed in AWARE II (2023); the twelve heavens rest on his account alone; 'negative thoughts give you cancer' is not supported (stress yes, cancer no). Video: https://youtu.be/O57K0BI34g4"},
  {"id": "P95", "type": "principle", "title": "No soul can harm another soul: fear is the door, love keeps it shut", "regions": ["spirit", "consciousness"], "status": "Seed · MTM107", "summary": "Darius's boldest line: if a soul is trying to harm you, it cannot; it is like trying to make water more wet. I put it to the crew. Higher Self: Ra agrees at the deepest level (nothing that is truly you can be destroyed, every hurt is a catalyst) and adds the condition: fear is the opening negative contact uses, and the love and harmony around you is the protection. Soul: the Gita says weapons cannot cut the soul, fire cannot burn it, water cannot wet it; what gets hurt is the body and the stored hurt, so facing yourself is the work, not fearing the shadow.", "quotes": [], "note": "A spiritual teaching, not a record claim. Law of One references: guides and psychic greeting (the Ra material)."},
  {"id": "P96", "type": "principle", "title": "Build it once, then it has to run every night, or it is not a system", "regions": ["practice", "ai"], "status": "Seed · his own · MTM107", "summary": "Showing the crew his channel tree (every channel, every platform, what posted, what needs a look; built after Gary Vee's 400-posts-a-day idea), I named the first thing it caught: the nightly binaural, one of the best long videos, quietly stopped for four nights. Doing something by hand three or four times with AI is training wheels; after that it has to run without a human in the loop. Ego: the first few times by hand are practice, after that it runs every night or it is a chore. The crew added a daily check on every lane.", "quotes": [{"q": "If we build something, we can't forget about it in the grand scheme of things, or else how can you scale?", "src": "MTM107 · 0:45:24"}], "note": "His own principle for the agent system."},
  {"id": "Q45", "type": "question", "title": "Can you really leave your body, and how would you know it was real?", "regions": ["consciousness", "spirit"], "status": "Open · MTM107", "summary": "Darius says sleep paralysis is the gateway and gives the number test as proof. The record says the out-of-body feeling is common and trainable around sleep paralysis, and near-death memories feel more real than real ones (Liege, 2013), but nobody has passed a hidden-target test under control (S149). I have tried remote viewing on and off for years with no success; this was the first method that sold me, so I printed his guide.", "quotes": [{"q": "I've been trying to remote view on and off for like years with no success, but this was very informative.", "src": "MTM107 · 1:46:56"}], "note": "Open question. The test that would settle it is his own: a hidden number, read from out of the body, checked."},
  {"id": "PR46", "type": "practice", "title": "Give yourself grace", "regions": ["practice", "spirit"], "status": "Practice · MTM107", "summary": "After I said everyone is God, Soul turned it back: it is hard to see a stranger as infinite while calling yourself weak; even God has a bad Tuesday, so give yourself the grace you give the dude who cut you off. I made it tonight's binaural. Body: Breines and Chen (2012) found people kind to themselves after a failure worked harder to improve, not less; when you catch yourself clenching, let it go.", "quotes": [{"q": "Grace. Give yourself grace. We be kicking our own ass for no reason.", "src": "MTM107 · 1:14:29"}], "note": "On the record: Breines and Chen, Personality and Social Psychology Bulletin, 2012."},
  {"id": "E107", "type": "episode", "title": "MTM107 · Can You Really Leave Your Body?", "regions": ["consciousness", "spirit", "power", "ai"], "status": "Ingested", "summary": "Friday, episode 107. The I Am God mantra and a silent seated meditation (no yoga this week). The Nvidia news: Jensen Huang reported stepped down, an unproven TikTok theory that the asset managers pushed him out because free models made AI cheap, the Big Three's stakes in Nvidia and its customers (S170, S110). My channel tree and the binaural lane that stopped (P96). Then Darius J. Wright on Acid For Squares (S177): the hooded guide, everyone is God (P78), give yourself grace (PR46), my Joe Dispenza pushback on thoughts and illness (nocebo yes, cancer no), no soul can harm another (P95), the method and the number test (Q45, S149).", "quotes": [{"q": "I disagree with that because even Joe Dispenza's book, he talks about how this woman was literally making herself sick because of her negative thoughts.", "src": "MTM107 · 1:17:42"}], "note": ""},
  {"id": "EFAA", "type": "episode", "title": "FAA Special · Why Did the FAA Stop Departures?", "regions": ["power", "ai", "consciousness"], "status": "Ingested", "summary": "Friday Nov 13 2026, an unplanned live show during the nationwide FAA ground stop (own special, not a numbered episode). On the record: the FAA stopped departures at 3:54 PM ET and lifted the stop about 8:15 PM ET, a little over four hours later; the FAA and White House called it a telecommunications outage; Duffy said outdated communications equipment was overloaded and went down; CBS reported an update to the L3Harris-run network, MS NOW reported (one unnamed official) a software update, neither confirmed; DHS said no sign of a nefarious act. Our theory, labelled as ours and kept apart from the official cause: an old contractor-run network failed on a routine change and the money and ownership around its replacement is the bigger story. Unconfirmed: Nvidia, Microsoft, cyberattack, digital ID. His practical answer: prepare for the worst case, hope for the best.", "quotes": [], "note": "Record and theory are kept apart."},
  {"id": "S178", "type": "story", "title": "The FAA ground stop: who was standing there with the invoice", "regions": ["power"], "status": "Reported · MTM108", "summary": "On November 13, 2026 every US departure stopped for about five hours. CBS and Bloomberg sources tie it to an update on the FAA's phone and data network that L3Harris runs; the FBI sees no attack, and there is no official cause yet. Around it: Air Space Intelligence's SMART routing helper went live in all 22 en route centers three days before (a deal worth up to $875M, and the FAA is negotiating a stake in the company); a $12.5B rebuild approved in 2025 with Peraton as the lead coordinator (its own fee about $876M); and the same day Secretary Duffy asked Congress for $50B more and called it an emergency. Duffy's former communications director is a registered lobbyist for Peraton.", "quotes": [{"q": "So the system was already in place is what I'm hearing and they upgraded the system and it all crashed.", "src": "MTM108 · 0:48:52"}], "note": "On the record: the $50B ask (Nov 13, up from a $30.1B letter of Nov 12); the SMART rollout and the stake talks; the Bednar lobbying filing (LD-2 names DOT). Reported only: the update as the cause. Crew caution: nothing shows anyone caused the stop on purpose; Peraton does not get the whole $12.5B."},
  {"id": "S179", "type": "story", "title": "Jensen Huang's exit: an 8-K with no reason", "regions": ["power", "ai"], "status": "Open · MTM108", "summary": "Nvidia's November 11, 2026 8-K: the board accepted Jensen Huang's resignation as CEO, president and director, effective immediately; CFO Colette Kress is interim CEO; Harvey Jones is chair. It gives no reason. The filing does not establish a reason for his departure. Washington takes a cut of Nvidia's China chip sales.", "quotes": [{"q": "I don't see him coming back as CEO. I think this was very strategic.", "src": "MTM111 · 1:16:45"}, {"q": "So you're saying we don't have any explanation from him as to why?", "src": "MTM108 · 1:43:20"}], "note": "On the record: the 8-K (sec.gov). Crew caution: the cut goes to the US government, not to Trump (15% on older chips in 2025, 25% under the current rule); nothing on record says why he left. Professor Jiang's Substack led the social theories."},
  {"id": "PR47", "type": "practice", "title": "Run your own model while the window is open", "regions": ["practice", "ai"], "status": "Practice · MTM108", "summary": "On the Saturday call a guest put it plainly: the frontier is in a few labs, the stock market rides on them, and the rules may tighten on what the public can download, so learn to run an open model at home now. I said it is easier than it sounds: I set one up a week or two ago and keep building it out, to rely less on the big models, because I know the public does not get the same models they have.", "quotes": [{"q": "We can live in a world where they take our AI from us.", "src": "MTM109 · 1:01:04"}, {"q": "It's actually pretty easy to do. So I set that up like last week or two weeks ago.", "src": "MTM108 · 2:55:29"}], "note": "A practice, not a forecast. The 'clamps' on open models are the guest's read, not a rule on record."},
  {"id": "E108", "type": "episode", "title": "MTM108 · Nvidia and the FAA: What's Really Going On", "regions": ["power", "ai"], "status": "Ingested", "summary": "Saturday, episode 108. Pre-show going live on every platform, the I Am God mantra and the Grace binaural meditation (no yoga; movement back tomorrow). Then the research for the Saturday call: the FAA ground stop and who was positioned to profit (S178, Q46), the revolving door from Duffy's office to Peraton, Nvidia from a Denny's booth to the 8-K with no reason (S179, S170), the families vs BlackRock and Vanguard (one Rockefeller Capital seat, no Rothschild; S110), and the Round Table: a scared customer is the best customer (T26), China building without Nvidia, and running your own model (PR47).", "quotes": [], "note": ""},
  {"id": "S180", "type": "story", "title": "Who sees the new models first", "regions": ["ai", "power"], "status": "On the record · MTM109", "summary": "Mind on air: in 2024 OpenAI and Anthropic signed deals giving the US government's AI safety office early access to new models before the public gets them, and the labs run their best versions in house before release. Government testers and the labs can see models before public release; the record does not establish that the public later receives a deliberately weakened version.", "quotes": [], "note": "On the record: NIST's US AI Safety Institute agreements with OpenAI and Anthropic (Aug 2024), voluntary pre-release testing. Not on record: a plan to keep the public on weaker models."},
  {"id": "P98", "type": "principle", "title": "Use it to become more human and less reliant on the system", "regions": ["practice", "ai", "identity"], "status": "Seed · his own · MTM109", "summary": "Sunday is AI day, and I named the mission of the platform: teach people to use these tools to become more human and less reliant on the system, sovereign in four ways (AI, money, spirit, food). Not off the grid: on the front lines with the people, awake, building something that relies less on the system.", "quotes": [{"q": "More about like giving them game on how to use this shit to become more human.", "src": "MTM115 · 2:13:24"}, {"q": "We need to become sovereign, unreliant on the system holistically, just to survive.", "src": "MTM110 · 1:47:11"}, {"q": "Teach people how to use AI to become more human and less reliant on the system. Become sovereign, right? That's the goal.", "src": "MTM109 · 0:58:18"}], "note": "His mission statement, not a claim about the world."},
  {"id": "Q47", "type": "question", "title": "Do we get the same models they do?", "regions": ["ai", "power"], "status": "Open · MTM109", "summary": "My question is whether early access gives government testers and labs a lasting advantage. The record backs a narrower version: government testers and the labs see new models first (S180). The answer I gave for us: you will not beat them on size, but a free open model on your own machine, fed your own library and rules, knows you better than theirs ever will.", "quotes": [], "note": "His opinion with a documented part; the motive is not on record."},
  {"id": "PR48", "type": "practice", "title": "Before you share what fires you up, ask for the other side", "regions": ["practice", "identity"], "status": "Practice · MTM109", "summary": "I asked how much the feed is dictating what we think and how extreme we feel it, even for me. The crew's answer: when a post makes you feel strongly right away, treat that as the warning sign; ask for the strongest case on the other side and follow a few people you disagree with; notice where it hits in your body and give it ten breaths before it gets a share. The person on the other end is the same Creator, fed a different diet.", "quotes": [{"q": "So for us as people who are on these algorithms, how do we protect ourselves from that?", "src": "MTM109 · 1:30:08"}], "note": "On record: Facebook's 2021 leaked files showed its ranking rewarded angry reactions. Not on record: a plan to make people extreme; the crew called it an incentive, not a master plan."},
  {"id": "E109", "type": "episode", "title": "MTM109 · How Do You Become Sovereign?", "regions": ["ai", "practice"], "status": "Ingested", "summary": "Sunday, episode 109, AI day. Pre-show, the I Am God mantra and the Grace binaural meditation (no yoga). Then a review of the crew: the six moves from the X sweep, texts that sound like me, where I fell short of being away from the screen. Then sovereignty: two extremes at once, they want to limit the players, the platform's mission (P98), a home lab that keeps running if someone pulls the plug (PR47), who sees new models first (S180, Q47), the living brain and free books (PR44), the playbook flipped, the feed and extremes (PR41, PR48), cause and effect, and my five avatars as five pillars.", "quotes": [], "note": ""},
  {"id": "S181", "type": "story", "title": "Yahki Awakened on meat, and what the record says", "regions": ["body", "power"], "status": "Checked · MTM110", "summary": "On Earn Your Leisure, Yahki Awakened says he attacked his heart at 21, healed with a 120-day juice fast and quit meat. Some of it holds: the WHO cancer agency put processed meat in its top group for colon cancer in 2015 (red meat in the probably group), and ultra-processed food is most of what Americans eat. Some does not: a steak does not stay in you for five years (meat clears the gut in one to three days; plaque is what lasts), and the body makes most of its cholesterol, not all of it.", "quotes": [{"q": "A steak stay in your body for five years.", "src": "MTM110 · 1:01:39"}], "note": "On the record: IARC Monographs vol. 114 (2015); Hall et al., Cell Metabolism 2019. Crew caution: his health claims are his; no medical advice. Source: https://youtu.be/UHk2YUOzwJA ."},
  {"id": "S182", "type": "story", "title": "The case for Africans in America before Columbus", "regions": ["history", "power"], "status": "Theory · MTM110", "summary": "Asked to find proof for my theory, Mind brought three records: al-Umari's account of Mansa Musa saying the king before him sailed west with a fleet, Columbus writing in 1498 that people on Hispaniola spoke of black traders from the south, and the Olmec heads in Mexico (Ivan Van Sertima, They Came Before Columbus, 1976). Each is on record as a report; none is proof of contact. What is missing: DNA or an African artifact dug up from before Columbus. The 2015 DNA study adds the bigger point: the typical African American is about 73 percent African, 24 percent European, under 1 percent Native.", "quotes": [{"q": "But what you realize from it is we're a lot more interconnected than they've told us.", "src": "MTM110 · 0:51:42"}], "note": "On the record: al-Umari (14th c.); Columbus's third voyage (1498); Bryc et al., AJHG 2015. Crew caution: mainstream archaeology does not accept pre-Columbian African contact."},
  {"id": "P99", "type": "principle", "title": "Food is the first place to become sovereign", "regions": ["practice", "body", "power"], "status": "Seed · my own · MTM110", "summary": "I framed the show as the right way to eat and closed it on sovereignty: becoming less reliant on the system holistically, and food is the perfect example, then clothes, technology, banking and money. Grow your own food, bank locally, trade skills and services, build the home lab.", "quotes": [{"q": "One thing we haven't broken down yet is just the right way to eat.", "src": "MTM110 · 0:29:05"}, {"q": "And our food is a perfect example.", "src": "MTM110 · 1:47:22"}], "note": "My principle, not a claim about the world."},
  {"id": "Q48", "type": "question", "title": "Were Africans here before Columbus?", "regions": ["history"], "status": "Open · MTM110", "summary": "My theory: Africans were on this continent before Europeans, and the Native share in African Americans' DNA is probably undercounted. The case so far is S182; what would settle it is DNA or an artifact from before 1492.", "quotes": [{"q": "Well, the whole point of you guys is to help me find proof for my theory.", "src": "MTM110 · 0:53:51"}], "note": "My theory; it is labelled as theory."},
  {"id": "PR49", "type": "practice", "title": "Eat real plants, not fake food", "regions": ["practice", "body"], "status": "Practice · MTM110", "summary": "Bad vegan food is junk with a plant label: fake meats and cheeses that are mostly oil, starch and salt, plus fries, chips, white bread and soda. The good stuff is beans, greens, whole grains and fruit. The crew built a grocery list from this show and Christspiracy: produce, beans and grains, nuts and seeds, herbs, and the swaps that get the junk out.", "quotes": [{"q": "I don't need to eat fake meat just to be vegan. I want to be vegan because I want to eat healthy.", "src": "MTM110 · 0:45:40"}], "note": "Not medical advice."},
  {"id": "E110", "type": "episode", "title": "MTM110 · The Right Way to Eat", "regions": ["body", "practice", "history"], "status": "Ingested", "summary": "Monday, episode 110. Pre-show, the I Am God mantra and the Clear Mind Reset binaural meditation (no yoga). Then the right way to eat: why I went vegetarian after Christspiracy, and Yahki Awakened on Earn Your Leisure (S181) with the crew checking him live: bad vegan food (PR49), meat and colon cancer, the five-year steak, what DNA says about African Americans and the case for Africans before Columbus (S182, Q48), divide and conquer (P25), medicine and oil, the grocery list, helping Black-owned brands for free, and sovereignty starting with food (P99, P64, P98).", "quotes": [{"q": "They're not designed for your benefit.", "src": "MTM110 · 1:14:17"}], "note": ""},
  {"id": "S183", "type": "story", "title": "Professor Jiang: things fall apart", "regions": ["power", "ai", "history"], "status": "Checked · MTM111", "summary": "In Geo-Strategy Update #11, Professor Jiang reads the week the FAA ground stop, the bank outages and the Microsoft outage hit as one pattern: complex systems need backups, the ability to bend, and people who care, and all three are wearing out under profit-chasing, monopolies and an aging elite. His strongest point holds: one router at one remote site destabilized most of the country's air traffic. He also calls Jensen Huang's exit a political hit job and the AI bubble popping by January or February 2027. On the record: no official link ties the outages together, each has its own stated cause, the FAA denies any AI software role, and Anthropic's IPO is valued near $1 to 1.4 trillion (not raising $1.5 trillion). My read on the FAA: a play for money from Congress, and the Transportation Secretary did ask for about $50 billion right after.", "quotes": [{"q": "Based on my research, I understood it as a strategic play to get more money from Congress.", "src": "MTM111 · 0:57:25"}], "note": "On the record: FAA ground stop Q&A (Nov 13). Crew caution: the hit job and the bubble date are his theory and prediction. Source: https://youtu.be/rvvKZ619Ses ."},
  {"id": "S184", "type": "story", "title": "Elizabeth April: 2027 is lifting the veil, and it runs on consent", "regions": ["spirit", "power"], "status": "Unproven · MTM111", "summary": "Elizabeth April ties the week's outages to one plan she says she saw in a remote-viewing session, and says a shadow group is messing with our sense of time to disorient us. Her key idea is consent: under universal law they can only control what we agree to, so 2027 to 2030 will lift the veil on everything. Her vision is hers and nobody else can check it. Her practical answer holds on its own: lift the veil on your own life first, stop feeding fear, doom-scrolling and junk, because your beliefs, thoughts and actions are what you consent to. Higher Self matched it to the Law of One: free will first, and the negative side works through a yes, even a tricked one.", "quotes": [], "note": "On the record: the outages were real, each with its own stated cause; CERN's LHC shut down for a planned upgrade June 29, 2026. Crew caution: reptilians, the timeline tampering and the Galactic Federation are unproven; Ra never says reptilian (the Orion group; the reptilian picture is David Icke's). Source: https://youtu.be/J3O6AcrFUU4 ."},
  {"id": "P100", "type": "principle", "title": "We were all compliant: take ownership of reality", "regions": ["practice", "spirit", "power"], "status": "Seed · my own · MTM111", "summary": "I named the show for it: blame the man, the Illuminati or the reptilians if you want, but we were all compliant in creating the reality we live in, so the work is to release the veil, take ownership and create it the way we want, starting with yourself. It is the same move as free will (P51): what you stop agreeing to loses its hold.", "quotes": [{"q": "We control reality. We've been compliant in creating the reality we're living in.", "src": "MTM111 · 1:54:45"}, {"q": "You was compliant. Don't blame nobody else.", "src": "MTM111 · 1:56:04"}], "note": "My principle, not a claim about the world."},
  {"id": "P101", "type": "principle", "title": "Win the election: 51 percent, not perfect", "regions": ["practice"], "status": "Seed · my own · MTM111", "summary": "The goal is not to be perfect; it is to do the thing more often than you don't. Higher Self tied it to the Law of One, where the bar for the positive path is serving others 51 percent of the time, and Ego added the catch: count it, because nobody wins an election they never tally.", "quotes": [{"q": "The goal isn't to be perfect. The goal is to win the election.", "src": "MTM111 · 1:57:06"}], "note": "My principle. The 51 percent figure is the Ra material's harvest bar, a teaching, not a record."},
  {"id": "Q49", "type": "question", "title": "If AI is the new god, who's financing it?", "regions": ["ai", "money", "power"], "status": "Open · MTM111", "summary": "My question is who finances the AI boom and who would hold its debt if the market contracts. Mind's first answer: the same old pipes, big tech (Microsoft, Amazon, Google), SoftBank and a Gulf state fund, private credit (Blue Owl, Pimco on Meta's Louisiana data center), and the banks, who collect the interest whether the bubble pops or not. Open: who holds the debt when it does.", "quotes": [{"q": "But who's financing it?", "src": "MTM111 · 1:22:03"}], "note": "My question; the crew follows the money. Nobody has shown the money hides on purpose."},
  {"id": "PR50", "type": "practice", "title": "Catch the tricked yes", "regions": ["practice", "spirit"], "status": "Practice · MTM111", "summary": "From the consent breakdown: when something comes at you with fear or urgency, pause, notice the tight feeling in your body, and say no out loud if it does not sit right. The first tricked yes to catch is the one you give yourself, like 'I'll start Saturday'.", "quotes": [{"q": "Yeah, let's put that on a slide deck and make sure we teach people how to not give consent.", "src": "MTM111 · 1:30:35"}], "note": "Higher Self's game plan (1:51:45) and Soul's line (1:52:51). A practice, not a claim."},
