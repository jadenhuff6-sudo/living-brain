  {"id": "E111", "type": "episode", "title": "MTM111 · You Was Compliant", "regions": ["power", "spirit", "practice"], "status": "Ingested", "summary": "Tuesday, episode 111. Pre-show (tonight's intention: in the darkest nights, be thankful), the I Am God mantra, a 20-minute seated meditation (\"almost out of body before my alarm went off\") and a foam-roller roll-out with an honest check-in. Then a double feature: Professor Jiang's Things Fall Apart (S183) with my read on the FAA money ask, Huang's exit (S179) and the oil game in AI (P50), the AI bubble call and my question who's financing the new god (Q49); then Elizabeth April on consent and 2027 (S184), the Law of One on free will (P51), reptilians and David Icke, the game plan (PR50), and my close: we were all compliant (P100), win the election (P101), one step at a time.", "quotes": [{"q": "You just gotta take one step at a time.", "src": "MTM111 · 1:58:42"}], "note": "Title named on air at 1:56:04."},
  {"id": "S185", "type": "story", "title": "The Group of 30: Rockefeller money, regulators and the regulated at one table", "regions": ["money", "power", "history"], "status": "On the record · 'thirty running the world' is my read · MTM112", "summary": "Who's in the rooms where money gets decided? Only central bankers sit at the BIS in Basel, which meets about every two months. But the Group of 30, a private club started in 1978 by banker Geoffrey Bell with Rockefeller Foundation money, puts sitting and former central bankers, Wall Street executives and top economists at one table, and it writes reports on how banking should be regulated. Paul Volcker led it for decades; Jacob Frenkel chaired it while running JPMorgan's international arm; Mark Carney and Larry Summers have been members. In 2018 the EU's own watchdog found it was wrong for Mario Draghi to stay a member while his central bank regulated the bankers in that room. The people being regulated help write the playbook with the people who regulate them. My read: it's called the Group of 30 for a reason.", "quotes": [{"q": "Who's in those rooms?", "src": "MTM112 · 0:42:22"}, {"q": "It's called a group of thirty for a reason.", "src": "MTM112 · 0:46:20"}], "note": "On the record: G30 history page (founded 1978, Rockefeller Foundation initiative and first funding); European Ombudsman decision on Draghi (Jan 2018); member lists. Crew caution (Higher Self, 0:45:32): a real web of overlap, but nobody has shown one command room."},
  {"id": "S186", "type": "story", "title": "Standard Oil and the first trust: the name disappears, the control stays", "regions": ["money", "history", "power"], "status": "On the record · MTM112", "summary": "The Rockefeller chapter, the part that checks out. By about 1880 Standard Oil controlled around 90 percent of America's oil refining, through secret rebate deals with the railroads and by buying out or starving rivals. In 1882 Rockefeller invented the trust: dozens of companies handed their stock to a few trustees, so on paper they looked independent while one hand ran them. The Supreme Court broke Standard Oil into 34 companies in 1911; the family kept shares in every piece, and Rockefeller got richer after the breakup. Ego: the shell company trick is the legal move, not the secret one, and it is the same blueprint the big asset managers run today. My read: own the supply chain end to end and use shell companies so the name is nowhere near the control.", "quotes": [{"q": "So their name is nowhere near how much control they actually have.", "src": "MTM112 · 0:34:50"}], "note": "On the record: Standard Oil Co. of New Jersey v. United States (1911); the 1882 Standard Oil Trust."},
  {"id": "S187", "type": "story", "title": "The big three at APEC, and who the money follows", "regions": ["power", "money"], "status": "Checked in part · MTM112", "summary": "Trump met Xi in Shenzhen at APEC, with a three-way with Putin set for Thursday. My question: what are the angles on the board? The record: BlackRock is the asset manager most built into China (the first foreign firm allowed its own fund business there, and a 2024 House China committee report found its funds held at least $1.9 billion in blacklisted Chinese companies); Vanguard closed its China office in 2023 but its index funds still hold Chinese stocks. Russia is different: Western bankers and Harvard advisors helped hand its industries to a few oligarchs in the 90s, Putin jailed the Yukos boss in 2003 just as it came out Jacob Rothschild was lined up to control his shares, and the West froze about $300 billion of Russia's reserves in 2022. Mind's caution: Putin did not beat the money so much as swap it for his own crew. My read: there is no conflict between us and them.", "quotes": [{"q": "So when I say there is no conflict between us and them, there is no conflict between us and them.", "src": "MTM112 · 0:09:10"}], "note": "On the record: House Select Committee on the CCP report (Apr 18, 2024); Vanguard's 2023 China exit (Bloomberg); loans-for-shares; Khodorkovsky voting rights to Lord Rothschild (2003 reports). Correction: Vanguard is a top BlackRock shareholder, not its owner. Crew caution: that the families steer Trump today is unproven."},
  {"id": "P102", "type": "principle", "title": "Be ready, don't feed fear", "regions": ["practice", "spirit"], "status": "Seed · my own · MTM112", "summary": "What to do when it hits the fan: stay informed, keep a week of water, food and cash at home and a way to charge your phone off the grid (Body), keep your people close, and keep your own body steady so fear cannot steer you. Their game runs on fear and on getting you to hand over your choice; calm, love and choice stay yours. Ego: rage is just fear in a louder voice, and it feeds them the same.", "quotes": [{"q": "Be prepared, you know, have food, have a backup battery, have canned goods, whatever that looks like.", "src": "MTM113 · 2:05:22"}, {"q": "Don't feed fear, stay informed, be ready at home with water, food, cash and a plan.", "src": "MTM112 · 0:29:02"}, {"q": "Fear is their fuel. Calm, love, and choice are yours.", "src": "MTM112 · 0:29:12"}], "note": "My principle. Body's prep list matches Ready.gov / FEMA guidance. No grid shutdown is on record; that part is what people are saying."},
  {"id": "P103", "type": "principle", "title": "Master the matrix to graduate out of it", "regions": ["spirit", "practice"], "status": "Seed · my own · MTM112", "summary": "Running from the matrix still lets it steer you. You have to go through it: live in the money system, the phones and the noise, and stay awake while you do it. That includes the shadow, the service to self side inside each of us: see it clearly enough that you stop choosing it (Soul and Higher Self, the Law of One). It answers the old tension of leaving for the land or mastering it from inside (T9).", "quotes": [{"q": "How do you master the matrix?", "src": "MTM112 · 0:48:09"}, {"q": "So you got to master the matrix in order to graduate up out of it.", "src": "MTM112 · 0:48:25"}], "note": "My principle. The Jung line on air is a paraphrase of Aion."},
  {"id": "PR51", "type": "practice", "title": "Guard your peace: no phone the first hour", "regions": ["practice"], "status": "Practice · MTM112", "summary": "They can control the matrix but not your peace, so watch where you hand it over: cheap dopamine from scrolling, gambling, weed, watching people crash out online. Body's test: put the phone in another room for the first hour after you wake up and watch how much steadier your day runs. Soul's version: catch the little tug in your chest right before the thumb moves, and let it pass without feeding it.", "quotes": [{"q": "They can control the matrix, but they can't control your peace.", "src": "MTM112 · 0:29:48"}], "note": "A practice, not a claim. Grows the dopamine menu (PR39)."},
  {"id": "Q50", "type": "question", "title": "Who's in those rooms?", "regions": ["money", "power"], "status": "Open · MTM112", "summary": "My question at the BIS: they meet in Switzerland, so who sits there, and are BlackRock, State Street, Vanguard and JPMorgan in the room? First answer (Mind): only central bankers are BIS members; the asset managers meet the same people in the rooms next door, Davos and the Group of 30 (S185). Open: what the private conversations change, which no member list shows.", "quotes": [{"q": "Is BlackRock, State Street, and Vanguard in there? JP Morgan?", "src": "MTM112 · 0:42:24"}], "note": "My question."},
  {"id": "E112", "type": "episode", "title": "MTM112 · Shit Hitting the Fan: What to Do When Shit Hits the Fan", "regions": ["power", "money", "practice", "spirit"], "status": "Ingested", "summary": "Wednesday, episode 112. No mantra or meditation today. Trump in China with Xi and Putin next (S187): BlackRock and the banking families in China and Russia, questions about leaders and banking interests, the Orion group and the reptilian story (Q32), and what to do when it hits the fan (P102), where we give up our peace (PR51). Then the Rockefeller chapter: Standard Oil and the first trust (S186), the asset managers who control money they don't own (S110), the Fed and the revolving door, who's in those rooms (Q50), the Group of 30 (S185), and my close: master the matrix to graduate out of it (P103).", "quotes": [{"q": "Don't let them steal your awareness.", "src": "MTM112 · 0:47:12"}], "note": "Title I named for the show."},
  {"id": "S188", "type": "story", "title": "The bunker list: a plan for the worst day, with names not public", "regions": ["power", "history"], "status": "On the record · the list is not public · MTM113", "summary": "Annie Jacobsen on Julian Dorey: every war game stops at game over, and the government's own plan for the worst day is a list of officials picked ahead of time who go underground and wait it out. Who picked them? That's classified. Mind: continuity of government is real, sites like Raven Rock and Mount Weather are real and staffed, and the names are not public. Then launch on warning: both sides keep missiles ready to fire the moment sensors say an attack is coming, so a leader gets minutes to trust a phone call or a radar screen.", "quotes": [], "note": "On the record: continuity of government and launch on warning. Not public: who is on the list. Annie Jacobsen never says '2029'; that is the video's headline. Source: https://youtu.be/87wtKPse6TI"},
  {"id": "S189", "type": "story", "title": "The CIA's UFO cover for its spy planes", "regions": ["power", "history", "ufo"], "status": "On the record · MTM113", "summary": "Jacobsen's other point: the CIA once let UFO stories cover for its spy planes. The CIA's own 1997 history says the U-2 and later spy planes explain many of the UFO reports of the late 1950s and 1960s, and that the Air Force misled the public to keep the planes secret. A proven case of UFO stories used as cover, which is not the same as proof that every sighting is a plane.", "quotes": [], "note": "Source: the CIA's 1997 history of its role in UFO studies; the clip is https://youtu.be/87wtKPse6TI"},
  {"id": "S190", "type": "story", "title": "The Galactic Federation deal: one unsourced claim", "regions": ["ufo", "power"], "status": "Unproven · MTM113", "summary": "Jonathan Caplan, a British barrister on Jesse Michels, describes Haim Eshed's Hebrew-only book: governments have agreements with a 'Galactic Federation', then Eshed and his co-author went quiet, and nobody knows his source. My question: so we have an agreement with the Galactic Federation? The disclosure point that holds: if they ever said what they know, the next questions (who knew, since when, what crimes) are the danger. Ego: 'we can't explain it' is the participation trophy of disclosure; the 2021 report covered 144 sightings and explained one.", "quotes": [], "note": "Unproven: Eshed named no source. The guest is not the founder of an Israeli space force; that is the video's headline. Source: https://youtu.be/jMJDFndJAwc"},
  {"id": "S191", "type": "story", "title": "Watson Brake and the unlisted mounds", "regions": ["history"], "status": "On the record in part · MTM113", "summary": "Luke Reagan on Danny Jones: about 80 unlisted earthworks in one lidar data set, a 970-yard ring in Louisiana the state survey did not have, and a landowner who said they ought not do that. Mind: Watson Brake in Louisiana is dated to about 3500 BC, built by foragers before farming, older than the Great Pyramid. Site locations are kept secret by law to stop looting. Some of what is hidden is just buried under the trees.", "quotes": [], "note": "On the record: Watson Brake's date; site secrecy laws. Reagan's own new site and its date are his claim. Source: https://youtu.be/iVdf6UFrCOc"},
  {"id": "S192", "type": "story", "title": "Thiel's Antichrist lectures: fear for the poor, utopia for the middle", "regions": ["power", "tech", "spirit"], "status": "On the record in part · my read · MTM113", "summary": "Randall Carlson sat in on two of Peter Thiel's four Antichrist lectures: Armageddon, or an Antichrist who uses the fear of it to sell peace and safety. Carlson's read: fear for the poor, a fake utopia for the middle, power for the elite. My read: Thiel's Antichrist lectures sit uneasily beside Palantir's defense work. Palantir is named after the seeing stone in Lord of the Rings, and got early money from the CIA's In-Q-Tel (S98).", "quotes": [], "note": "No Thiel audio in the video; Carlson describes what he heard. His motive is unknown. Source: https://youtu.be/uXIe-HG6SOg"},
  {"id": "P104", "type": "principle", "title": "The opposite of love is fear", "regions": ["spirit", "practice"], "status": "Seed · my own · MTM113", "summary": "The compilation asks whether fear keeps people from questioning claims about the bunker list, visitors, a deal and a plan. Fear is the tool they use to control us, so fear is also where the control breaks. Higher Self and the Law of One: the service-to-self side works through fear and agreement; no being of any density can make the choice for you.", "quotes": [{"q": "you have two choices basically: are you going to evolve or die?", "src": "MTM114 · 0:35:43"}, {"q": "And you evolve through love, And then you die through fear.", "src": "MTM114 · 0:35:49"}, {"q": "One thing you got to understand is the opposite of love is fear. So that's what they use to control us, is fear.", "src": "MTM113 · 1:08:15"}], "note": "My principle; it grows P95 (fear is the door, love keeps it shut) and T26."},
  {"id": "P105", "type": "principle", "title": "The reality of separation is an illusion", "regions": ["spirit"], "status": "Seed · my own · MTM113", "summary": "My verdict on 'what are they hiding': not a ship or a list, but how much of this runs on us being afraid and apart. This is the time to come together as one, as a civilization, and see there is no difference between me and you. Tom Campbell's version: consciousness comes first, and death is a restart; the only penalty is not learning.", "quotes": [{"q": "The reality of separation is an illusion. We are all one on this planet.", "src": "MTM113 · 2:06:46"}], "note": "My principle. Campbell's 'consciousness is fundamental' is a minority view in physics, not a buried finding."},
  {"id": "PR52", "type": "practice", "title": "Feel the fear, notice it, let it pass", "regions": ["practice", "spirit"], "status": "Practice · MTM113", "summary": "Soul's answer to fear as a control tool: fear only works if you agree to carry it. Feel it come up, notice it and let it pass through without handing over the wheel. When enough people do that, the whole control system starves. With P102: be prepared (food, a backup battery, canned goods), rely less on the system and more on each other.", "quotes": [], "note": "Soul's line on air, MTM113 1:42:15; pairs with PR11."},
  {"id": "Q51", "type": "question", "title": "What's the opposite of a Palantir?", "regions": ["tech", "power"], "status": "Open · MTM113", "summary": "Palantir connects private data to watch regular people. My ask: flip it. An open, real-time map of the global elite from what is already public: money, contracts, filings and their own words. Higher Self's rule: public records only, never anyone's home or family, or we have picked up the same seeing stone.", "quotes": [], "note": "Boundaries: public records and their own words only."},
  {"id": "E113", "type": "episode", "title": "MTM113 · What Are They Hiding From Us?", "regions": ["power", "ufo", "history", "tech", "spirit"], "status": "Ingested", "summary": "Thursday, episode 113. The I Am God mantra and a 20-minute seated meditation with his own Deep Rest binaural track, then his compilation of six videos on one question. The bunker list and launch on warning (S188), the CIA's UFO cover (S189), Steve Aspin's abductions and the Law of One, aliens and angels (P52), the opposite of love is fear (P104), the Galactic Federation deal (S190), unlisted earthworks in Louisiana (S191), Thiel's Antichrist lectures and Palantir (S192, S98), the opposite of a Palantir (Q51), Tom Campbell's 100-year cover-up claim (S154), and his close: be ready, not afraid (P102, PR52), the reality of separation is an illusion (P105).", "quotes": [{"q": "Do we want to upgrade or get left behind or go backwards?", "src": "MTM113 · 2:10:40"}], "note": ""},
  {"id": "S193", "type": "story", "title": "Tucker's month of outages: is it all connected?", "regions": ["history", "shadow"], "status": "On the record (each outage) · no link on the record · MTM114", "summary": "Tucker Carlson's 'You Don't Have to Be a Conspiracy Theorist to See It's Connected': the Pentagon's FORTRESS plan to make bases run on their own power, a map of stockpile advice across 33 countries, including the US, the $6.3B Binance theft, Microsoft, then the FAA ground stop, Claude, Workday, the NSA's network, Apple Pay and smoke at the CIA, all within weeks. His question: maybe something connects them. My concern: the outages could be used to justify more surveillance; no evidence here links them or shows a coordinated plan.", "quotes": [{"q": "Remember that everything is connected. We are all connected.", "src": "MTM114 · 0:56:52"}], "note": "On the record: FORTRESS is real (memo Sept 30, 2026), but the 90-day figure is Fox's report of documents and the plan says nothing about a coming blackout; Binance about $6.3B on Oct 29, North Korea blamed by tracing firms, not a government finding; the FAA stop Nov 13 (router work in a contractor's upgrade); at least 11 NSA and Cyber Command suicides in a year (Bloomberg), reported days, not hours, before the NSANet outage. Crew caution: the 33 countries is misleading (Newsweek's map includes the US); the outage order is off (Microsoft was the day before the FAA stop) and each has its own stated cause, nothing links them; the CIA 'fire' was HVAC smoke, no fire found; the Army intelligence-center phone outage is unverifiable. My 'surveillance state' read is my opinion. Source: https://www.youtube.com/watch?v=z1X9mLyx7Yo"},
  {"id": "S194", "type": "story", "title": "A numerologist on the dollar: what really backs it?", "regions": ["history", "shadow"], "status": "On the record in part · numerology is not evidence · MTM114", "summary": "A random pick: Jack Neel's podcast with a numerologist on what happens to our money. The dollar as the world's reserve currency, Bretton Woods in 1944, off gold in 1971, the petrodollar, a move to tokenized money, and Venezuela's oil after the US took Maduro. My take: the dollar's value depends in part on military power, and I question whose interests that power serves. I stopped it to say the countries are not really at war; the money behind them is the point (S11).", "quotes": [{"q": "The only thing backing it is our military, and guess what? Our military is struggling.", "src": "MTM114 · 1:04:37"}], "note": "On the record: Bretton Woods 1944 and leaving gold 1971; Venezuela's proven reserves (about 303 billion barrels) are the world's largest; Maduro met Xi's envoy hours before the US operation in January 2026; Musk born on the 28th and xAI bought X on March 28, 2025. Crew caution: the guest's Chavez dates are wrong (born 1954, in office 1999); '33 Days' is the channel's headline and numerology dates are not evidence. Source: https://www.youtube.com/watch?v=8xHGLT0pQF0"},
  {"id": "P106", "type": "principle", "title": "Your frequency is what you frequently see", "regions": ["identity", "practice", "shadow"], "status": "Seed · my own · MTM114", "summary": "The same few owners keep buying the media, the apps included. They do not care what your opinion is, only that you feel it strongly, so we stay divided. The more often you see something, the stronger your opinion on it gets. So ask how much the frequency of your algorithm is shaping your worldview.", "quotes": [{"q": "Your frequency is what you frequently see, you know.", "src": "MTM114 · 0:32:42"}, {"q": "They just want you to feel strongly about it, so we can be more divided as people.", "src": "MTM114 · 0:32:14"}], "note": "My principle, not a study. The practice side is PR41 (run your own feed) and PR31."},
  {"id": "Q52", "type": "question", "title": "What are the data centers really for?", "regions": ["shadow", "science"], "status": "Open · my read · MTM114", "summary": "My concern on air: the data-center build-out could also enable more surveillance and control. Scale how much of your life runs through these apps to billions of people and you can model how crowds move and test what makes them react: our literal digital soul.", "quotes": [], "note": "My read, not a record. On the record: the data-center build-out is real and data brokers and Palantir-style tools are real (S98); nobody has shown the build-out is for surveillance first."},
  {"id": "Q53", "type": "question", "title": "Grid shutdown by February?", "regions": ["history", "practice"], "status": "Open · my prediction · MTM114", "summary": "After Tucker's rundown I asked chat what happens next and made a call: a grid shutdown by February at the latest, so the old system can be uprooted and everything made AI. A prediction to check against the calendar, with P102 as the answer either way: be ready, not afraid.", "quotes": [{"q": "I say by February max.", "src": "MTM114 · 0:58:34"}], "note": "My prediction, not a claim. On the record: the Pentagon's FORTRESS plan says nothing about a coming blackout; the claim that a nationwide 90-day blackout starts on November 17, 2026 is rated false. Check again in March 2027."},
  {"id": "E114", "type": "episode", "title": "MTM114 · Fear Is How They Steal Money", "regions": ["history", "shadow", "practice", "identity"], "status": "Ingested", "summary": "Friday, episode 114. The I Am God mantra and twenty minutes of silence to my own track Courage Over Fear, then a roll-out and fear as an alert system (T26). An open talk on feeds: your frequency is what you frequently see (P106, PR41), and Campbell's evolve through love or die through fear (P104). Tucker Carlson's month of outages (S193), the surveillance state and the data centers (Q52), and my prediction of a grid shutdown by February (Q53). A numerologist on the dollar (S194), then my close: the wars are a lie (S11), there is no right way to govern people (P37), money is just paper (P83), and we are here to remember we are God (T16).", "quotes": [{"q": "And I think for me, it's always important to be spiritually rooted and understand what is the point of all of this.", "src": "MTM114 · 1:12:28"}], "note": ""},
  {"id": "S195", "type": "story", "title": "Nvidia buys into Anthropic's IPO: the chips-and-labs loop", "regions": ["tech", "power"], "status": "On the record · my read · MTM115", "summary": "Anthropic went public in November 2026. Nvidia and Alphabet each agreed to buy about ten billion dollars of its non-voting stock at the IPO price, part of a 26 billion dollar private placement. Anthropic spends money on Nvidia's chips to train its models. The chip maker funds the lab, the lab buys the chips. Jensen Huang resigned as Nvidia's CEO on November 12; why is still a question. My read: control the chips, then the labs, then the institutions that depend on them, then the money; where it leads is a one world government run by AI.", "quotes": [{"q": "There's a few different ingredients you need in order to control the world with AI. You need to control the chips, which is what these labs are built on.", "src": "MTM115 · 0:48:37"}], "note": "On the record: the IPO, the placement (about 1% of Anthropic for Nvidia), Huang's resignation and the board's 'no return'. My read, not a record: the one world government. Sources: Nvidia press release Nov 12 2026; CryptoBriefing and VKTR on the placement."},
  {"id": "S196", "type": "story", "title": "Simon Dixon: democracy as a game where capital rules", "regions": ["power", "history"], "status": "On the record in part · his framing · MTM115", "summary": "Simon Dixon, a former investment banker, in an interview I reacted to: defending democracy funds the weapons makers; politicians need lobby money and rise by being useful to power; leverage is collected, not exposed; the Epstein settlements were pennies to JPMorgan and Deutsche Bank; the financial industrial complex (banks create money, asset managers allocate it, investment banks package it) sits above the countries. My pushback: his view is black and white, follow the money is not the whole story; somebody decides what money is.", "quotes": [{"q": "So at the end of the day, the people who make, create the money are the ones that run the world.", "src": "MTM115 · 1:32:33"}], "note": "On the record: JPMorgan $290M and Deutsche Bank $75M Epstein settlements (2023); the big three are the largest holder in about 88% of S&P 500 companies (not owners of 88%). His framing: 'no war on drugs'. Grows S105, S106, S110."},
  {"id": "P107", "type": "principle", "title": "They won't need chains: escape the matrix before the technology closes it", "regions": ["tech", "spirit", "power"], "status": "Seed · my own · MTM115", "summary": "Why I stream: the AI build-out is moving fast, and if we do not wake up, we end up owned by our screens, not by force. GTA is the example I used, people on their screens all day. The answer is to be part of the change: become the best version of yourself and help the people around you do the same.", "quotes": [{"q": "If we don't escape the matrix soon, we're gonna be slaves. And they're not gonna do it with chains, but what they're gonna do it with is technology.", "src": "MTM115 · 0:50:10"}], "note": "My principle; pairs with P98 (use it to become more human) and Q49 (if AI is the new god, who is financing it?)."},
  {"id": "Q54", "type": "question", "title": "An AI surveillance state, or a utopia?", "regions": ["tech", "spirit"], "status": "Open · MTM115", "summary": "His question to the crew and chat: the world is changing into a new era either way. Do we want AI to watch and run us, or to free us from doing a job all day so we can become better humans, serve others, evolve spiritually and explore? He fears depopulation on one side and imagines a utopia on the other. The choice is in what we build and who we build it with.", "quotes": [{"q": "So we all have a choice to make. What do you want that to look like? Do you want it to be an AI surveillance state, or do you want it to be a utopia", "src": "MTM115 · 1:15:21"}], "note": "No evidence of a depopulation agenda is provided here."},
  {"id": "PR53", "type": "practice", "title": "Check what your retirement owns", "regions": ["practice", "power"], "status": "Practice · MTM115", "summary": "A broad index fund owns a slice of every big company, defense included. The practice: look at the holdings of the funds your money sits in, then decide with your eyes open.", "quotes": [{"q": "You don't even look at what stocks are in your retirement.", "src": "MTM115 · 1:27:37"}], "note": "Not financial advice. Pairs with PR20 (map the money) and S110."},
  {"id": "E115", "type": "episode", "title": "MTM115 · They Won't Need Chains", "regions": ["tech", "power", "spirit"], "status": "Ingested", "summary": "Saturday, episode 115, on YouTube and TikTok only. The I Am God mantra, a long seated meditation and a roll-out, then Anthropic's IPO and money as paper (P83), GTA as a double-edged sword, Nvidia buying into Anthropic and control of the chips (S195), they won't need chains (P107), Simon Dixon on democracy, leverage and the financial industrial complex (S196, S105, S110), checking fund holdings (PR53), the algorithm making you extreme, surveillance state or utopia (Q54).", "quotes": [{"q": "If you can change yourself, you can change the world. There's a butterfly effect with self-improvement.", "src": "MTM115 · 2:10:10"}], "note": ""}
];

  const r=g.createRadialGradient(64,64,0,64,64,64);

/* brain shell: procedural cortex point cloud */
function rand(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
const R = rand(7);
function cortexPoint(side){
  // hemisphere ellipsoid with folds
  const u=R()*Math.PI*2, v=Math.acos(2*R()-1);
  let x=Math.sin(v)*Math.cos(u), y=Math.cos(v), z=Math.sin(v)*Math.sin(u);
  const fold = 1 + .045*Math.sin(u*9+v*5)*Math.sin(v*11-u*3) + .025*Math.sin(u*23+v*17);
  let px = x*0.66*fold, py = y*0.8*fold, pz = z*1.2*fold;
  if (px*side < -0.02) px *= 0.25;            // flatten medial wall
  if (py < -0.35) py = -0.35 + (py+0.35)*0.45; // flatten base
  if (pz > 0.6 && py > 0.2) py -= (pz-0.6)*0.25; // slope frontal lobe
  if (py < 0 && Math.abs(pz) < .5) px += side*.08*(-py); // temporal bulge
  return [px + side*0.55, py + 0.18, pz];
}
const shellPts=[], shellRnd=[];
for(let i=0;i<16000;i++){ const p=cortexPoint(i%2?1:-1); shellPts.push(...p); shellRnd.push(R()); }
// cerebellum
for(let i=0;i<1600;i++){
  const u=R()*Math.PI*2, v=Math.acos(2*R()-1);
  const f = 1+.05*Math.sin(v*28);
  shellPts.push(Math.sin(v)*Math.cos(u)*0.78*f, -0.42+Math.cos(v)*0.3*f, -0.82+Math.sin(v)*Math.sin(u)*0.38*f); shellRnd.push(R());
}
// brainstem
for(let i=0;i<500;i++){ const a=R()*Math.PI*2, h=R(); shellPts.push(Math.cos(a)*0.13*(1-h*.2), -0.35-h*0.75, -0.42-h*0.12+Math.sin(a)*0.13); shellRnd.push(R()); }
// inner volume haze
for(let i=0;i<2200;i++){ const p=cortexPoint(i%2?1:-1); const k=.35+R()*.55; shellPts.push(p[0]*k+(i%2?1:-1)*.2*(1-k),p[1]*k+.08,p[2]*k); shellRnd.push(R()*.5); }

const shellGeo = new THREE.BufferGeometry();
shellGeo.setAttribute('position',new THREE.Float32BufferAttribute(shellPts,3));
shellGeo.setAttribute('aRnd',new THREE.Float32BufferAttribute(shellRnd,1));
const shellMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uPR:{value:renderer.getPixelRatio()},uFocus:{value:new THREE.Vector3(0,0,0)},uFocusAmt:{value:0}},
  vertexShader:`
    attribute float aRnd; uniform float uTime; uniform float uPR; uniform vec3 uFocus; uniform float uFocusAmt;
    varying float vA; varying float vW;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_Position = projectionMatrix*mv;
      float tw = .45+.55*sin(uTime*1.3 + aRnd*40.0);
      float wave = smoothstep(.22,0.0,abs(position.z - (mod(uTime*.35,3.4)-1.7)));
      float wave2 = smoothstep(.18,0.0,abs(position.y - (mod(uTime*.22+1.0,2.2)-1.0)))*.6;
      float near = smoothstep(.75,0.0,distance(position,uFocus))*uFocusAmt;
      vW = wave+wave2+near*1.4;
      vA = (.30+.34*tw)*(.6+aRnd) + vW*.7;
      gl_PointSize = min((1.9+aRnd*2.3+vW*2.0)*uPR*(3.4/-mv.z), 4.5*uPR);
    }`,
  fragmentShader:`
    varying float vA; varying float vW;
    void main(){
      vec2 c = gl_PointCoord-.5; float d = length(c);
      if(d>.5) discard;
      float a = smoothstep(.5,0.0,d)*vA;
      vec3 col = mix(vec3(.33,.80,.88), vec3(.80,.98,1.0), clamp(vW,0.0,1.0));
      gl_FragColor = vec4(col*a, a);
    }`
});
brain.add(new THREE.Points(shellGeo,shellMat));

/* ---------------- GRAPH LAYOUT ---------------- */
const byId = {}; NODES.forEach(n=>byId[n.id]=n);
const regionPos = {}; REGIONS.forEach(r=>regionPos[r.id]=new THREE.Vector3(...r.pos));
const SIZE = {core:.075,region:.05,principle:.046,practice:.03,tension:.036,resolved:.036,question:.03,episode:.036,story:.038,experiment:.03};
const LR = rand(11);
NODES.forEach(n=>{
  if(n.type==='region'){ n.pos = regionPos[n.id].clone(); return; }
  if(n.type==='core'){ n.pos = new THREE.Vector3(0,.48,.28); return; }
  const c = new THREE.Vector3(); const rs=(n.regions||[]).filter(r=>regionPos[r]); rs.forEach(r=>c.add(regionPos[r])); c.multiplyScalar(1/(rs.length||1));
  c.add(new THREE.Vector3((LR()-.5)*.38,(LR()-.5)*.3,(LR()-.5)*.38));
  n.pos = c;
});
// relax: repel, keep near home, stay inside brain
const homes = NODES.map(n=>n.pos.clone());
function insideBrain(p){
  const side = p.x>=0?1:-1; const cx=side*.55;
  const q = new THREE.Vector3((p.x-cx)/.6,(p.y-.18)/.72,p.z/1.1);
  const L = q.length(); if(L>0.92){ q.multiplyScalar(.92/L); p.set(q.x*.6+cx,q.y*.72+.18,q.z*1.1); }
  if(p.y<-.22) p.y=-.22;
}
for(let it=0;it<260;it++){
  for(let i=0;i<NODES.length;i++){
    const a=NODES[i]; if(a.type==='core'||a.type==='region') continue;
    const f=new THREE.Vector3();
    for(let j=0;j<NODES.length;j++){ if(i===j) continue; const b=NODES[j];
      const d=a.pos.clone().sub(b.pos); const L=d.length()+1e-4; const min=.24;
      if(L<min) f.add(d.multiplyScalar((min-L)/L*.5)); }
    f.add(homes[i].clone().sub(a.pos).multiplyScalar(.04));
    a.pos.add(f); insideBrain(a.pos);
  }
}

/* nodes */
const pickables=[];
NODES.forEach((n,i)=>{
  const col = new THREE.Color(n.type==='region'?n._region.color:TYPES[n.type].color);
  n.color = col; n.phase = i*1.7;
  const s = SIZE[n.type];
  const core = new THREE.Mesh(new THREE.SphereGeometry(s*.42,16,16), new THREE.MeshBasicMaterial({color:col,transparent:true}));
  core.position.copy(n.pos);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:col,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:n.type==='region'?.55:.9}));
  halo.position.copy(n.pos); halo.scale.setScalar(s*(n.type==='region'?7:5));
  if(n.type==='region'){ core.visible=false; }
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(s*1.25,.055),8,8), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.copy(n.pos); hit.userData.node=n;
  brain.add(core,halo,hit); pickables.push(hit);
  n.core=core; n.halo=halo; n.baseScale=halo.scale.x; n.flash=0; n.dim=1;
  n.neighbors=new Set(); n.edges=[];
});

/* edges as curved fibers */
const edgeObjs=[];
EDGES.forEach(([a,b])=>{
  const A=byId[a], B=byId[b]; if(!A||!B) return;
  if(A.neighbors.has(B)) return;
  A.neighbors.add(B); B.neighbors.add(A);
  const mid = A.pos.clone().add(B.pos).multiplyScalar(.5);
  mid.multiplyScalar(.78).add(new THREE.Vector3(0,.06,0));
  const curve = new THREE.QuadraticBezierCurve3(A.pos.clone(),mid,B.pos.clone());
  const pts = curve.getPoints(28);
  const isRegion = A.type==='region'||B.type==='region';
  const mat = new THREE.LineBasicMaterial({color:isRegion?0x3fb7c2:0x7fe9f1,transparent:true,opacity:isRegion?.07:.16,depthWrite:false,blending:THREE.AdditiveBlending});
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  brain.add(line);
  const e={a:A,b:B,curve,line,mat,base:mat.opacity,isRegion};
  edgeObjs.push(e); A.edges.push(e); B.edges.push(e);
});

/* pulses */
const pulses=[];
const pulseMat = c=>new THREE.SpriteMaterial({map:GLOW,color:c,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function firePulse(e,from,speed=1,bright=1){
  if(reduce) return;
  const fwd = e.a===from;
  const s = new THREE.Sprite(pulseMat(from.color)); s.scale.setScalar(.045*bright);
  brain.add(s); pulses.push({s,e,t:0,fwd,speed:(.55+Math.random()*.4)*speed,bright});
}
function fireNode(n,speed=1,bright=1,skipRegions=false){
  n.flash=1;
  n.edges.forEach(e=>{ if(skipRegions && e.isRegion) return; firePulse(e,n,speed,bright); });
}

/* ---------------- CAMERA FLIGHT ---------------- */
let flight=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(pos,target,ms=1300){
  const sp=camera.position.clone(), st=controls.target.clone();
  if(reduce){ camera.position.copy(pos); controls.target.copy(target); return; }
  flight={sp,st,ep:pos.clone(),et:target.clone(),t0:performance.now(),ms};
}
function worldPos(n){ return n.pos.clone().applyMatrix4(brain.matrixWorld); }
let selected=null, hoverNode=null;
function select(n){
  if(!n) return;
  selected=n; fillPanel(n); panel.classList.add('open');
  const wp=worldPos(n);
  const out = wp.clone().sub(new THREE.Vector3(0,.15,0)); if(out.length()<.2) out.set(.6,.3,1);
  out.normalize();
  const dist = n.type==='region'?2.0:(n.type==='core'?2.4:1.55);
  const narrow = innerWidth<760;
  const camPos = wp.clone().add(out.multiplyScalar(narrow?dist*1.5:dist)).add(new THREE.Vector3(0,.12,0));
  // shift target so node sits left of the panel on desktop
  const tgt = wp.clone();
  if(!narrow){ const right=new THREE.Vector3().subVectors(camPos,tgt).cross(camera.up).normalize(); tgt.add(right.multiplyScalar(-dist*.22)); }
  else { tgt.y -= dist*.35; }
  flyTo(camPos,tgt);
  controls.autoRotate=false;
  fireNode(n,1.2,1.4);
  REGIONS.forEach(r=>r.chip.classList.toggle('on',n.type==='region'&&r.id===n.id));
  hideHint();
}
function home(){
  selected=null; panel.classList.remove('open');
  REGIONS.forEach(r=>r.chip.classList.remove('on'));
  flyTo(HOME.pos,HOME.target,1500);
  controls.autoRotate=!reduce;
}
document.getElementById('homeBtn').onclick=()=>{stopTour();home();};

  if(i===-1){ const all=NODES.filter(n=>n.type!=='region').map(n=>n.id); i=selected?all.indexOf(selected.id):-1;
    const next=all[(i+dir+all.length)%all.length]; select(byId[next]); return; }
  select(byId[order[(i+dir+order.length)%order.length]]);
}
function startTour(){ touring=true; tourBtn.classList.add('on'); tourBtn.querySelector('span').textContent='Touring';
  tourIdx = selected? Math.max(0,TOUR.indexOf(selected.id)) : 0; select(byId[TOUR[tourIdx]]);
  clearInterval(tourTimer); tourTimer=setInterval(()=>{ tourIdx=(tourIdx+1)%TOUR.length; select(byId[TOUR[tourIdx]]); },7500); }
function stopTour(){ if(!touring) return; touring=false; clearInterval(tourTimer); tourBtn.classList.remove('on'); tourBtn.querySelector('span').textContent='Tour'; }
tourBtn.onclick=()=>touring?stopTour():startTour();
document.getElementById('prevBtn').onclick=()=>{stopTour();step(-1);};
document.getElementById('nextBtn').onclick=()=>{stopTour();step(1);};

/* ---------------- SEARCH ---------------- */
const qIn=document.getElementById('q'), resEl=document.getElementById('results');
let resList=[], resIdx=0;
function hay(n){ return (n.title+' '+n.summary+' '+(n.quotes||[]).map(q=>q.q).join(' ')).toLowerCase(); }
function renderResults(){
  const s=qIn.value.trim().toLowerCase();
  if(!s){ resEl.style.display='none'; resList=[]; return; }
  resList=NODES.filter(n=>hay(n).includes(s)).slice(0,10); resIdx=0;
  resEl.innerHTML='';
  if(!resList.length){ resEl.appendChild(el('div','note','Nothing yet. This brain grows with every episode.')); }
  resList.forEach((n,i)=>{ const b=el('button',i===0?'on':null); const d=el('span','dot'); const c=n.type==='region'?n._region.color:TYPES[n.type].color; d.style.color=c; d.style.background=c; b.appendChild(d); b.appendChild(document.createTextNode(n.title));
    b.onmouseenter=()=>{hoverNode=n;}; b.onmouseleave=()=>{hoverNode=null;};
    b.onclick=()=>{stopTour();select(n);qIn.value='';renderResults();qIn.blur();}; resEl.appendChild(b); });
  resEl.style.display='block';
}
qIn.addEventListener('input',renderResults);
qIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&resList[resIdx]){ stopTour(); select(resList[resIdx]); qIn.value=''; renderResults(); qIn.blur(); }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+resList.length)%Math.max(resList.length,1);
    [...resEl.children].forEach((c,i)=>c.classList.toggle('on',i===resIdx)); hoverNode=resList[resIdx]; }
  if(e.key==='Escape'){ qIn.value=''; renderResults(); qIn.blur(); }
  e.stopPropagation();
});

/* ---------------- POINTER ---------------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(-9,-9);
const tip=document.getElementById('tip');
let downAt=null, moved=false, lastInput=performance.now();
canvas.addEventListener('pointermove',e=>{
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
  if(downAt && Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5){ moved=true; canvas.classList.add('dragging'); }
  lastInput=performance.now();
});
canvas.addEventListener('pointerleave',()=>{ mouse.set(-9,-9); });
canvas.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; moved=false; stopTour(); hideHint(); lastInput=performance.now(); });
canvas.addEventListener('pointerup',e=>{
  canvas.classList.remove('dragging');
  if(downAt && !moved){
    mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(pickables)[0];
    if(hit) select(hit.object.userData.node); else if(selected) home();
  }
  downAt=null;
});
addEventListener('keydown',e=>{
  if(e.target===qIn) return;
  if(e.key==='Escape'){ stopTour(); home(); }
  if(e.key==='ArrowRight'){ stopTour(); step(1); }
  if(e.key==='ArrowLeft'){ stopTour(); step(-1); }
  if(e.key==='t'||e.key==='T'){ touring?stopTour():startTour(); }
  if(e.key==='/'){ e.preventDefault(); qIn.focus(); }
  lastInput=performance.now();
});
const hint=document.getElementById('hint'); let hintGone=false;
function hideHint(){ if(hintGone) return; hintGone=true; hint.style.opacity=0; }
setTimeout(hideHint,9000);

/* ---------------- RESIZE ---------------- */
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight;
  camera.fov = innerWidth<760?54:42; camera.updateProjectionMatrix(); shellMat.uniforms.uPR.value=renderer.getPixelRatio(); }
addEventListener('resize',resize); resize();

/* ---------------- LOOP ---------------- */
const clock=new THREE.Clock(); let nextFire=1.2;
const tmp=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  shellMat.uniforms.uTime.value=t;

  if(flight){
    const k=Math.min(1,(performance.now()-flight.t0)/flight.ms), e=ease(k);
    camera.position.lerpVectors(flight.sp,flight.ep,e); controls.target.lerpVectors(flight.st,flight.et,e);
    if(k>=1) flight=null;
  }
  controls.update();

  // hover
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(pickables)[0];
  const pointerHover = h?h.object.userData.node:null;
  canvas.classList.toggle('pointing',!!pointerHover);
  const hv = hoverNode||pointerHover;
  if(pointerHover){ const ty=pointerHover.type==='region'?{label:'Region',color:pointerHover._region.color}:TYPES[pointerHover.type];
    tip.querySelector('.t').textContent=ty.label; tip.querySelector('.t').style.color=ty.color; tip.querySelector('.n').textContent=pointerHover.title; tip.style.opacity=1; }
  else tip.style.opacity=0;

  // focus set
  const focus = hv||selected;
  const near = new Set(); if(focus){ near.add(focus); focus.neighbors.forEach(m=>near.add(m)); }
  if(focus){ shellMat.uniforms.uFocus.value.copy(focus.pos); }
  shellMat.uniforms.uFocusAmt.value += ((focus?1:0)-shellMat.uniforms.uFocusAmt.value)*.06;

  // ambient firing: the brain is thinking
  if(!reduce && t>nextFire){
    const pool = NODES.filter(n=>n.type!=='region');
    const n = (focus && Math.random()<.55)? [...near][Math.floor(Math.random()*near.size)] : pool[Math.floor(Math.random()*pool.length)];
    fireNode(n,1,1,true); nextFire=t+.5+Math.random()*.9;
  }
  if(selected && !reduce && Math.random()<dt*1.2) fireNode(selected,1.1,1.2);

  // nodes
  NODES.forEach(n=>{
    const target = focus? (near.has(n)?1:.18) : 1;
    n.dim += (target-n.dim)*.12;
    n.flash = Math.max(0,n.flash-dt*1.6);
    const breathe = reduce?1:1+.08*Math.sin(t*1.5+n.phase);
    const big = (n===focus?1.6:1) + n.flash*.7;
    n.halo.scale.setScalar(n.baseScale*breathe*big);
    n.halo.material.opacity = (n.type==='region'?.5:.85)*n.dim + n.flash*.3;
    n.core.material.opacity = Math.min(1,.25+n.dim);
    // label
    tmp.copy(n.pos).applyMatrix4(brain.matrixWorld);
    const dCam = tmp.distanceTo(camera.position);
    tmp.project(camera);
    const L=n.label;
    if(tmp.z>1){ L.style.opacity=0; return; }
    L.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-150%)`;
    let show=0;
    const always = n.type==='core'||n.type==='region'||n.type==='principle';
    if(focus){ if(near.has(n)) show = n===focus?1:.85; }
    else if(always){ const reach = n.type==='principle'?3.0:5.5; show = Math.max(0,Math.min(1,(reach-dCam)/1.0)) * (n.type==='principle'?.8:1); }
    if(n===hv) show=1;
    L.style.opacity=show;
    L.classList.toggle('hot',n===focus);
  });

  // edges
  edgeObjs.forEach(e=>{
    const on = focus && (e.a===focus||e.b===focus);
    const target = on? .75 : (focus? e.base*.35 : e.base);
    e.mat.opacity += (target-e.mat.opacity)*.12;
  });

  // pulses
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i]; p.t+=dt*p.speed;
    if(p.t>=1){ brain.remove(p.s); p.s.material.dispose(); pulses.splice(i,1); const dest=p.fwd?p.e.b:p.e.a; dest.flash=Math.max(dest.flash,.6*p.bright); continue; }
    const u = p.fwd?p.t:1-p.t;
    p.e.curve.getPoint(u,p.s.position);
    const f = Math.sin(p.t*Math.PI);
    p.s.material.opacity = f*(focus&&!(near.has(p.e.a)&&near.has(p.e.b))?.25:1);
    p.s.scale.setScalar((.03+.03*f)*p.bright);
  }

  // idle: auto tour after a while
  if(!touring && !selected && performance.now()-lastInput>45000 && !reduce){ startTour(); }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
document.getElementById('sub').textContent = `Master your mind, master reality. ${NODES.filter(n=>n.type==='principle').length} principles, ${NODES.filter(n=>n.type==='practice').length} practices and ${NODES.filter(n=>n.type==='story').length} stories from ${(()=>{const E=new Set();NODES.forEach(n=>{(n.quotes||[]).forEach(q=>{const m=String(q.src||'').match(/MTM\s?(\d+(?:\.5)?)/);if(m)E.add(m[1]);});const m=n.type==='episode'&&String(n.title).match(/MTM\s?(\d+)/);if(m)E.add(m[1]);});return E.size;})()} episodes of Mastering the Matrix, in my own words. It grows with every stream.`;
</script>
</body>
</html>
