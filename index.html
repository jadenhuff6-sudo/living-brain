<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Circle of Light's theory of everything, as a living brain. Built from Mastering the Matrix.">
<title>Living Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060C; --ink:#EDEBF5; --ink-2:#A9A7B8; --ink-3:#6E6C80;
  --teal:#5FE0EA; --gold:#E5BA6E; --mint:#8CF5C4; --coral:#FF8A7A; --lav:#B9A7FF; --bone:#F2F0E6;
  --glass:rgba(14,14,26,.72); --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.pointing{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-140%);white-space:nowrap;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--ink);opacity:0;transition:opacity .35s ease;text-shadow:0 0 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.lbl.region{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.lbl.core{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.lbl.hot{color:#fff;font-weight:600}

header{position:fixed;top:20px;left:24px;pointer-events:none;max-width:min(520px,60vw)}
header .eyebrow{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
header h1{font-family:Spectral,serif;font-weight:400;font-size:30px;line-height:1.1;margin-top:6px}
header p{margin-top:8px;color:var(--ink-2);font-size:12.5px;line-height:1.5}

.tools{position:fixed;top:20px;right:20px;display:flex;gap:8px;align-items:center}
.search{position:relative}
.search input{width:220px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px 9px 34px;font:500 12.5px Inter,sans-serif;outline:none;transition:border-color .2s,width .3s}
.search input:focus{border-color:rgba(95,224,234,.55);width:260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7;z-index:2;color:var(--ink-2);pointer-events:none}
.results{position:absolute;top:42px;right:0;width:280px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;max-height:50vh;overflow:auto}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:9px;font:500 12.5px Inter,sans-serif;cursor:pointer}
.results button:hover,.results button.on{background:rgba(255,255,255,.06)}
.btn{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 12px Inter,sans-serif;cursor:pointer;display:flex;gap:7px;align-items:center;transition:border-color .2s,background .2s}
.btn:hover{border-color:rgba(95,224,234,.5)}
.btn.on{background:rgba(95,224,234,.14);border-color:rgba(95,224,234,.6);color:var(--teal)}

.legend{position:fixed;left:20px;bottom:20px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100vw - 40px))}
.chip{display:flex;gap:7px;align-items:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:500 11.5px Inter,sans-serif;color:var(--ink-2);cursor:pointer;transition:all .2s}
.chip:hover,.chip.on{color:var(--ink);border-color:rgba(95,224,234,.5)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}

.keys{position:fixed;right:20px;bottom:20px;display:flex;gap:10px;font-size:11px;color:var(--ink-3)}
.keys span{display:flex;gap:5px;align-items:center}

#hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:12px;color:var(--ink-2);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);padding:8px 14px;border-radius:999px;transition:opacity .8s;pointer-events:none}

#tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:260px;opacity:0;transform:translate(14px,14px);transition:opacity .15s}
#tip .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
#tip .n{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}

#panel{position:fixed;top:72px;right:20px;bottom:20px;width:390px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);border-radius:20px;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
#panel .top{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
#panel .kind{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:center}
#panel h2{font-family:Spectral,serif;font-weight:400;font-size:24px;line-height:1.2;margin-top:8px;padding-right:20px}
#panel .status{display:inline-flex;margin-top:12px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
#panel .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}
#panel .close:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
#panel .body{padding:16px 22px 22px;overflow:auto;flex:1}
#panel .summary{font-size:14px;line-height:1.6;color:var(--ink)}
#panel h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:22px 0 10px}
.quote{border-left:2px solid var(--teal);padding:2px 0 2px 14px;margin-bottom:14px}
.quote p{font-family:Spectral,serif;font-style:italic;font-size:15.5px;line-height:1.5;color:var(--ink)}
.quote small{display:block;margin-top:6px;font-size:11px;color:var(--ink-3);font-family:Inter,sans-serif;font-style:normal}
.note{font-size:12.5px;line-height:1.55;color:var(--ink-2);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 12px Inter,sans-serif;cursor:pointer;transition:all .2s;text-align:left}
.links button:hover{border-color:rgba(95,224,234,.5);background:rgba(95,224,234,.08)}
.step{display:flex;justify-content:space-between;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}
.step button{flex:1}

@media (max-width:760px){
  header h1{font-size:22px} header p{display:none}
  .tools{top:auto;bottom:calc(env(safe-area-inset-bottom) + 16px);right:16px;left:16px;justify-content:space-between}
  .search input{width:100%} .search{flex:1} .search input:focus{width:100%}
  .results{top:auto;bottom:44px;left:0;right:auto;width:100%}
  .legend{display:none} .keys{display:none} #hint{bottom:70px;white-space:nowrap}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:62vh;transform:translateY(calc(100% + 20px))}
}
@media (prefers-reduced-motion:reduce){#panel,.lbl,#tip{transition:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>

<header>
  <div class="eyebrow">Theory of Everything</div>
  <h1>Living Brain</h1>
  <p id="sub">Master your mind, master reality.</p>
</header>

<div class="tools">
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search the brain" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <button class="btn" id="tourBtn" title="Guided tour (T)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>Tour</span></button>
  <button class="btn" id="homeBtn" title="Whole brain (Esc)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<div class="legend" id="legend"></div>
<div class="keys"><span>Drag to turn</span><span>Scroll to zoom</span><span>← → to walk</span></div>
<div id="hint">Hover any light to preview it. Click to fly in.</div>
<div id="tip"><div class="t"></div><div class="n"></div></div>

<aside id="panel" aria-live="polite">
  <div class="top">
    <div class="kind"><span class="dot"></span><span class="kindtxt"></span></div>
    <h2></h2>
    <span class="status"></span>
    <button class="close" aria-label="Close">×</button>
  </div>
  <div class="body"></div>
  <div class="step"><button class="btn" id="prevBtn">← Previous</button><button class="btn" id="nextBtn">Next →</button></div>
</aside>

</script>

  {"id": "thesis", "type": "core", "title": "Master your mind, master reality", "regions": ["consciousness", "identity", "shadow"], "status": "The center of the map", "summary": "Your inner world shapes your outer world. Master it by returning to awareness, choosing what you feed your mind, and seeing which beliefs were handed to you. Then apply it, so the individual evolves and the collective follows.", "quotes": [{"q": "My inner world shapes my outer world, and everything in my life serves my growth.", "src": "My daily creed. Said every stream"}, {"q": "If you can master your mind, you can master reality.", "src": "Circle of Light"}, {"q": "How can you actually evolve as an individual so we can evolve as a collective?", "src": "MTM71 · 2:23:47"}, {"q": "And if you master your mind, you can master reality,", "src": "MTM95 · 1:38:41"}], "note": "Every quote on this map is word for word from the streams, with the episode and time."},
  {"id": "P1", "type": "principle", "title": "Return to being. Meditation comes first", "regions": ["consciousness", "practice"], "status": "Growing · in all 5 episodes", "summary": "Meditation is the most important practice. Every stream opens with it.", "quotes": [{"q": "Just being able to return back to being has been super beneficial, and I think meditation is the most important thing we can be doing on this planet.", "src": "MTM63 · 80:53"}], "note": "No outside study has been checked for this yet. \"Consciousness is fundamental\" is Rupert Spira's view, a philosophical position, not evidence."},
  {"id": "P2", "type": "principle", "title": "Most beliefs were handed to us", "regions": ["identity", "history"], "status": "Growing · 7 episodes", "summary": "A belief you defend stops you from growing. Most of what we believe was given to us.", "quotes": [{"q": "That's a big reason why we have our overall beliefs because they've been given to us.", "src": "MTM70 · 1:48:02"}, {"q": "Just narratives that we've been taught through history that just aren't accurate. Bring a lot of awareness to that.", "src": "MTM71 · 2:23:47"}, {"q": "We've been programmed to think we need something outside of ourselves.", "src": "MTM73 · 1:08:27"}, {"q": "That's what I mean. Like we're in the allegory of the cave, where we are just going along, complicit with the system that we just we didn't decide. We just woke up and was like told, \"Hey, be a Christian, work a nine to five.\" All of these ideas were given to us. We didn't make those decisions. So, in order to change, we have to wake up. And start to make our own decisions instead of being told what to do.", "src": "MTM32 · 1:19:39"}, {"q": "It's crazy how the first four years of your life hardwire your psyche. Into believing something that may not be true, you hear this a lot.", "src": "MTM57 · 1:23:42"}, {"q": "We are not taught to think critically. We're taught to be programmed.", "src": "MTM76 · 1:07:45"}], "note": "Checked: the idea really is Thomas Campbell's (My Big TOE, 2003). That confirms who said it, not that it is true."},

  {"id": "P4", "type": "principle", "title": "What you feed your mind becomes you", "regions": ["identity", "science"], "status": "Growing · 3 episodes", "summary": "Consume less, create more. Whoever controls the feed controls the story.", "quotes": [{"q": "The more you put something in your brain, it does make you more emotionally tied to it and more extreme.", "src": "MTM70 · 0:42:52"}, {"q": "If you control the algorithm, you control the narrative.", "src": "MTM70 · 0:44:50"}, {"q": "What we need to do as a community is become less reliant on these algorithms.", "src": "MTM70 · 1:57:50"}, {"q": "Our consciousness, our awareness, creates reality. If we all believe one thing, it becomes true, regardless of what it is.", "src": "MTM56 · 0:27:16"}, {"q": "No, that's a fact. So where you put your attention is the most important thing you can do.", "src": "MTM62 · 2:05:13"}], "note": "The \"feed makes you extreme\" idea came from the guest and has not been checked."},
  {"id": "P5", "type": "principle", "title": "No one should govern your mind", "regions": ["history", "identity"], "status": "Growing · 4 episodes", "summary": "If you don't create your reality, someone else's plan will.", "quotes": [{"q": "There's no right way to govern people's minds. There's no right way to control people.", "src": "MTM70 · 1:10:21"}, {"q": "It's time for us to wake up and take control of the reality we've been mindlessly creating.", "src": "MTM70 · 1:42:44"}, {"q": "They're using us to create the world that they are imagining.", "src": "MTM71 · 2:20:26"}, {"q": "I think moral of the story is we create reality. So be mindful of the reality you create. Don't let nobody else create it for you.", "src": "MTM55 · 1:29:12"}, {"q": "if you can control your mind, you can control reality. And all of these elites are trying to control your mind so they can control reality through you.", "src": "MTM53 · 1:19:59"}], "note": "The principle stands on self-governance. The claims about a handful of families running things are still unproven."},

  {"id": "PR9", "type": "practice", "title": "Ask who drafted it first", "regions": ["history", "identity"], "status": "From MTM71", "summary": "Pick one thing you repeat as fact and ask who wrote it first.", "quotes": [{"q": "we we've been given the translations or the interpretations of these corrupt organizations and the powers that be. Instead of us, hey, let's let's actually go read the shit ourselves.", "src": "MTM67 · 2:47:10"}], "note": ""},
  {"id": "X1", "type": "experiment", "title": "A slow move to plant-based eating", "regions": ["practice", "experience"], "status": "Open", "summary": "In MTM67, I said, 'I need to at least try to be vegan.'", "quotes": [{"q": "So It's the killing then. There you have it. It's been a violent den of thieves, a den of murderers.", "src": "MTM67 · 2:29:28"}, {"q": "because if you justify one life, you can justify another one.", "src": "MTM67 · 2:22:20"}, {"q": "I need to at least try to be vegan.", "src": "MTM67 · 2:16:09"}], "note": ""},
  {"id": "T1", "type": "tension", "title": "Test the claim, or back it?", "regions": ["science", "history"], "status": "Open", "summary": "I want claims pressure-tested, and I also ask the crew to build the guest's case. The crew needs one clear rule for when to do which.", "quotes": [{"q": "Act as if what he just said was true, and let's let's get it all out there.", "src": "MTM94 · 1:20:46"}, {"q": "Can we pressure test this?", "src": "MTM63 · 102:32"}, {"q": "We should be helping provide evidence for their claims, not refuting everything they're saying.", "src": "MTM65 · 1:34:18"}, {"q": "I am open to anything, but I am also got to be skeptical of the information behind it.", "src": "MTM73 · 1:03:16"}, {"q": "I think one thing I want to teach y'all how to be is be open-minded, but be skeptical at the exact same time. So, two things can be true, right?", "src": "MTM66 · 0:47:00"}, {"q": "It's important to be open - minded and skeptical at the exact same time.", "src": "MTM60 · 0:59:00"}, {"q": "Really, keeping an open mind and being skeptical at the same time, right?", "src": "MTM75 · 2:09:21"}], "note": "MTM94: one clean run of both: I asked the crew to build the Morgan case as if true, then asked whether it was true and for the documentation; the crew built the case and labelled the plot unproven in the same answer."},
  {"id": "T2", "type": "resolved", "title": "No evil, and yet hidden power", "regions": ["shadow", "history"], "status": "Resolved · Oct 8", "summary": "Not a contradiction. We decide what we call evil and what we call illusion, because perception creates reality. Naming who holds power fits inside that.", "quotes": [{"q": "We define what is evil and what's an illusion. Our perception creates reality, so that's what I mean by 'there's no evil. It's an illusion.'", "src": "Circle of Light, October 8"}, {"q": "Everything else is an illusion.", "src": "MTM63 · 42:11"}, {"q": "the goal here is not to make people afraid because, hey, this shit is a video game. Like, this shit ain't really that deep. But at the same time, it's important to be aware of the video game because people are playing it a lot different than you are.", "src": "MTM54 · 0:42:20"}], "note": ""},
  {"id": "T3", "type": "tension", "title": "Free minds from the algorithm, or play it?", "regions": ["science", "identity"], "status": "Open", "summary": "I want people less reliant on algorithms, and I use catchy titles to reach them. Medicine with the candy.", "quotes": [{"q": "We got to give the medicine with the candy.", "src": "MTM70 · 1:53:39"}, {"q": "you can use the algorithm to your benefit", "src": "MTM51 · 1:17:55"}], "note": ""},

  {"id": "Q2", "type": "question", "title": "How do you push truth without the algorithm owning you?", "regions": ["science", "history"], "status": "Open", "summary": "From MTM70.", "quotes": [{"q": "As a content creator who is looking to push the truth, how does one go about that without falling victim to them owning the algorithm?", "src": "MTM70 · 1:37:11"}, {"q": "it's gonna sacrifice the numbers because the algorithm it's not algorithm friendly. It's four or five things at once, but at the end of the day, that's not my mission.", "src": "MTM56 · 1:09:38"}], "note": ""},
  {"id": "Q3", "type": "question", "title": "Where does mastering the mind start?", "regions": ["consciousness", "identity"], "status": "Open", "summary": "With stillness, with what you feed it, or with questioning what you were taught?", "quotes": [{"q": "the whole everything we believe is upside down. Yeah, what we put in our bodies, what we put in our mind, what we believe, what we feel, it's all upside down.", "src": "MTM67 · 2:44:22"}, {"q": "In my journal, ten times, if you master your mind, you can create reality.", "src": "MTM55 · 0:42:53"}], "note": ""},
  {"id": "Q4", "type": "question", "title": "How does exposing history become practice?", "regions": ["history", "practice"], "status": "Open", "summary": "MTM73 gave a first answer: the death-and-rebirth story, lived as a rebuild from the studs. MTM75 gave a second: learn how the forces are used on us, then use them on purpose, and study the dark without losing yourself in it.", "quotes": [{"q": "How can you actually apply this information?", "src": "MTM71 · 2:23:47"}, {"q": "we're just trying to wake you up. You feel me? Like at the end of the day, this shit. Is a video game, and they're just playing. They're just the evil characters in it.", "src": "MTM53 · 1:09:21"}, {"q": "there's a ying and the yang to all of these ancient mysteries. So they're using it for power. We should be using it to bring light and love into the world.", "src": "MTM59 · 2:12:30"}, {"q": "So, how do we learn how they're using these forces against us? Now we're playing chess.", "src": "MTM75 · 2:05:45"}], "note": ""},
  {"id": "Q5", "type": "question", "title": "Did the plant-based shift happen?", "regions": ["experience"], "status": "Open", "summary": "Not yet, as of Oct 4 (MTM67). See X1 for the timeline.", "quotes": [], "note": ""},
  {"id": "S1", "type": "story", "title": "The Bundys: the pen, not the blood", "regions": ["history"], "status": "On the record", "summary": "Harvey Bundy ran the atomic bomb paperwork. McGeorge drafted the article that defended Hiroshima. William's bureau drafted the Vietnam war resolution before Tonkin.", "quotes": [{"q": "They didn't drop the bomb. They wrote the story.", "src": "MTM71"}], "note": "Documented. Ted Bundy is not part of this family; Bundy was his stepdad's name."},
  {"id": "S2", "type": "story", "title": "Skull and Bones", "regions": ["history", "traditions"], "status": "On the record", "summary": "Fifteen Yale seniors a year, about 800 living members. A death and rebirth initiation, and secrets that bind members for life.", "quotes": [], "note": "The Geronimo skull story is unproven."},
  {"id": "S3", "type": "story", "title": "Who wrote the Hiroshima story", "regions": ["history", "shadow"], "status": "On the record", "summary": "The \"over a million casualties\" line comes from a 1947 Harper's article signed by Stimson and drafted by McGeorge Bundy.", "quotes": [{"q": "There's no justification for dropping bombs.", "src": "MTM71 · 1:41:06"}], "note": "The 1946 Strategic Bombing Survey said Japan would likely have surrendered by end of 1945. Some wartime studies did project very high invasion casualties."},
  {"id": "S4", "type": "story", "title": "Tonkin: the permission slip came first", "regions": ["history"], "status": "On the record", "summary": "A war resolution was drafted in June 1964. The August 4 attack never happened, per the NSA's own historian. Congress passed it 88 to 2 and 416 to 0.", "quotes": [], "note": ""},
  {"id": "S5", "type": "story", "title": "Who controls money creation", "regions": ["history", "science"], "status": "Guest claim · bank-made money on the record (BoE 2014)", "summary": "Simon Dixon's case: real power sits with whoever controls how money gets created, not presidents.", "quotes": [{"q": "They only use money to control us.", "src": "MTM84 · 2:06:43"}, {"q": "Money is not real. Let me tell you that because if I can just create it. Then I have an unlimited amount. There is no cap.", "src": "MTM32 · 0:15:04"}], "note": "From MTM70. The Fort Knox \"double-booked\" and BIS \"own army\" claims were fact-checked wrong. MTM84: my view that money is a control tool. MTM90: Dixon returned with Werner. On the record: the Bank of England (2014) says most money is created by bank lending. Still their claim: that this makes the money men the real bosses of presidents. MTM91: my take, making money from nothing is the easiest business model in the world. Limits worth keeping: only the central bank prints cash; bank lending is capped by capital rules, borrower demand and losses; banks do fail (SVB, 2023)."},
  {"id": "S6", "type": "story", "title": "The 13 families", "regions": ["history", "shadow"], "status": "Theory, unproven", "summary": "Fritz Springmeyer's claim. The series tests it family by family: the Astors, the Bundys, next the Collins.", "quotes": [{"q": "Families that are in power use countries to wage war, and they hide in the shadows while they reap all the benefits.", "src": "MTM71 · 2:12:18"}, {"q": "I think that's my goal with this platform is to show you guys how everything is all connected, from the thirteen families to transnational capital to the wars and um. Iran to the history we are taught, whether it's academia, archaeology, through the pharmaceutical companies, through aliens and disclosure, all of these things are connected because there's only 13 families that actually run the world.", "src": "MTM62 · 2:16:46"}], "note": "The access and the paper trail are documented. One hidden family running it all is not. Crew (MTM61, MTM62): the money networks are documented; the exact thirteen traces to Springmeier's own notes, and his book is mostly unsourced."},
  {"id": "E63", "type": "episode", "title": "MTM63 · Rupert Spira: You Were Never Born", "regions": ["consciousness", "traditions"], "status": "Ingested", "summary": "Consciousness, oneness, and the case for having no beliefs.", "quotes": [], "note": ""},

  {"id": "E71", "type": "episode", "title": "MTM71 · Ghostwriters of the Century", "regions": ["history"], "status": "Ingested", "summary": "The Bundys, Skull and Bones, Hiroshima and Tonkin. The theory of everything named on air.", "quotes": [], "note": ""},
  {"id": "P8", "type": "principle", "title": "Rebuild yourself from the studs", "regions": ["identity", "traditions", "experience"], "status": "Growing · 2 episodes", "summary": "The old initiations act out a death and a rebirth. I lived one: after a hard stretch I rebuilt myself on purpose, as the exact person I wanted to be. That is how the esoteric stories turn into practice.", "quotes": [{"q": "I had to rebuild myself from the studs, right?", "src": "MTM73 · 0:45:54"}, {"q": "I think that's a perfect example of how we can learn from these this esoteric wisdom, and apply it.", "src": "MTM73 · 0:46:32"}, {"q": "What was most important during that time was recreating. The exact person I wanted to be, and you don't realize that until you're deep into it.", "src": "MTM73 · 0:47:48"}, {"q": "getting back to drawing the things I used to love as a kid before the world told me who I was.", "src": "MTM48 · 0:21:19"}], "note": "Lived experience, not research. I told the fuller story on MTM73 and in Field Notes."},
  {"id": "P9", "type": "principle", "title": "Stop editing yourself", "regions": ["identity", "practice"], "status": "Seed · 1 episode", "summary": "Other people's opinions edit you like a rough draft until you are not the same paper. Not caring what they think is the first step to mastering yourself, and so the matrix.", "quotes": [{"q": "That is probably the first step in the journey of mastering yourself, which is ultimately mastering the matrix.", "src": "MTM73 · 1:07:53"}, {"q": "Somebody that's not deep rooted will probably start to edit themselves", "src": "A guest, MTM73 · 1:06:02"}], "note": "The rough-draft picture is a guest's; I agreed and made it one of my ten commandments (FOPO, after Michael Gervais's book)."},
  {"id": "P10", "type": "principle", "title": "Own your awareness", "regions": ["consciousness", "science", "history"], "status": "Growing · 6 episodes", "summary": "Attention is energy, and they have most of ours. Whoever holds your data can predict and steer your future, so awareness comes first. The same technology can be turned back around.", "quotes": [{"q": "these files, what they're doing is creating a digital version of that. For the entire world", "src": "MTM86 · 1:25:24"}, {"q": "Much like they're creating a surveillance state, we can do the same thing. Let's get all this information out into the open", "src": "MTM84 · 1:58:03"}, {"q": "Like that's our most important commodity. Everything else stems from that.", "src": "MTM73 · 1:14:44"}, {"q": "They have all of our attention and all of our energy, and they're using it against us.", "src": "MTM73 · 1:14:44"}, {"q": "They can not only predict your future, but they can manipulate your future", "src": "MTM73 · 1:15:43"}, {"q": "The same technology they're using against us, we can be using against them.", "src": "MTM73 · 1:04:04"}, {"q": "Exactly, our consciousness, our awareness — that's the most important thing you have. That's what they're trying to get from you, whether it's through Fanduel, TikTok, IG, OnlyFans.", "src": "MTM31 · 2:24:15"}, {"q": "A lot of people talk about AI killing us all, but. We can use these tools to, to expose the truth.", "src": "MTM75 · 0:52:20"}, {"q": "awareness is going to be the most important thing", "src": "MTM77 · 1:58:55"}], "note": "\"A surveillance state that is almost complete\" is my read, not a checked fact. MTM86: my verdict, the order's notebook at planet scale; the pieces are on the record, one world file is my read. MTM90: my forecast that a 24-7 cryptocurrency replaces cash, with every transaction on record, feeding the surveillance state."},
  {"id": "P11", "type": "principle", "title": "Be the person, not the goal", "regions": ["identity", "practice", "consciousness"], "status": "Growing · 3 episodes", "summary": "Behind every goal is an identity. Ask what the version of you who already did it does every day, and be that now. Our mind creates reality.", "quotes": [{"q": "If you have a goal, there's an identity of what you look like, the version of you that accomplished said goal.", "src": "MTM73 · 1:50:17"}, {"q": "What does he do on a daily basis? What does he embody? How does he think? And just be that", "src": "MTM73 · 1:50:17"}, {"q": "Our mind creates reality.", "src": "MTM73 · 1:49:42"}, {"q": "So, if you can stop yourself from wanting something, you can attract everything.", "src": "MTM38 · 0:07:42"}, {"q": "I disagree with that. I feel like for me, whatever you're chasing, you can give yourself internally. So it's like if you're chasing happiness, you could be happy without thinking there's something attached to that in this physical realm.", "src": "MTM57 · 2:17:10"}], "note": ""},
  {"id": "P12", "type": "principle", "title": "Each generation carries more who wake up", "regions": ["consciousness", "traditions"], "status": "Growing · 3 episodes", "summary": "Only a few people each generation decode the matrix, and I see that number growing: a new renaissance, with old teachings coming back in new language.", "quotes": [{"q": "I think each generation is carrying more and more of those people.", "src": "MTM73 · 0:58:22"}, {"q": "I think we are going back to more of a renaissance age where there's going to be a lot more thought leaders.", "src": "MTM73 · 0:58:22"}, {"q": "It's a few people every generation that like decode the matrix.", "src": "A guest, after Nipsey Hussle, MTM73 · 0:56:52"}, {"q": "I could definitely see myself as a thought leader, as someone who provides my generation and the generations coming after me, just grounding and helping them wake up out of the matrix, so we can master it together.", "src": "MTM57 · 2:38:09"}, {"q": "Yeah, that's what our ancestors did. You feel me? They were think about the slaves that were. They knew that they're just surviving. To To give it to the next generation in hopes that they break out of bondage.", "src": "MTM67 · 2:54:25"}], "note": "Hope and outlook, not a measured trend."},
  {"id": "P13", "type": "principle", "title": "Build the community first", "regions": ["practice", "experience"], "status": "Growing · 5 episodes", "summary": "Build around people who already show up, grow by word of mouth, and use content as the arena AI lets you scale. Farm more than you hunt.", "quotes": [{"q": "Is how do we take the principles of some of these remote tribes and apply them to our community here?", "src": "MTM79 · 1:19:31"}, {"q": "Built the app around the community, not the other way around.", "src": "MTM73 · 3:07:37"}, {"q": "You guys are going to be farming more than you're hunting", "src": "MTM73 · 2:58:48"}, {"q": "Content is like the biggest arena you could scale in, and probably the most important one using AI.", "src": "MTM73 · 2:42:30"}, {"q": "we're all just cogs in a wheel at the end of the day. So we need to rise up together as one.", "src": "MTM61 · 2:36:47"}, {"q": "What's most important is for us to band together. We need to recreate tribes and communities, strong community", "src": "MTM38 · 0:44:44"}, {"q": "It's not a cult, but a off - grid community that is self - reliant", "src": "MTM46 · 1:37:51"}], "note": "From the Saturday mastermind. Business details stay with the people building them."},
  {"id": "PR10", "type": "practice", "title": "Be the one who already did it", "regions": ["practice", "identity"], "status": "From MTM73", "summary": "Pick one goal. Write down what the version of me who hit it does every day, does not do anymore, and how he thinks. Live that today.", "quotes": [{"q": "What does he embody? How does he think?", "src": "MTM73 · 1:50:17"}, {"q": "So, whatever you guys feel called in your heart to be, you are already that. You're just remembering who you are.", "src": "MTM57 · 2:37:10"}, {"q": "anybody who's working on mastering the matrix understands that it's hard when you first start, and you realize how many people are resistant to that mindset and cling to what they know", "src": "MTM38 · 0:31:45"}, {"q": "stop focusing on doing and start focusing on being. Like, what do you want? What is the version of you look like that has that", "src": "MTM51 · 0:41:07"}], "note": ""},
  {"id": "S7", "type": "story", "title": "Lost the throne, kept the money", "regions": ["history"], "status": "On the record", "summary": "Italy took Rome in 1870 and the Pope lost his land. In 1929 Mussolini's Lateran deal gave the Vatican its own state plus about 750 million lire in cash and a billion in bonds. A banker, Bernardino Nogara, invested it, and it seeded the modern Vatican fortune.", "quotes": [{"q": "Yeah, why give him all that damn cash?", "src": "MTM73 · 0:37:33"}, {"q": "Kept the money, has a paper trail.", "src": "Crew, MTM73 · 0:37:07"}], "note": "Documented. Officially it paid for the land taken in 1870; Mussolini also needed the Church behind his rule. The Vatican has never opened its full books."},
  {"id": "S8", "type": "story", "title": "Napoleon vs the Pope, and the lodges", "regions": ["history", "traditions"], "status": "On the record", "summary": "Napoleon took Rome in 1798 (Pius VI died a prisoner), took the rest of the Papal States in 1809 and held Pius VII about five years. He did not ban the Freemasons; he turned the lodges into a loyalty network, with his brother Joseph as Grand Master of the Grand Orient from 1804.", "quotes": [{"q": "Damn, that's crazy! Yeah, do a deep dive on that.", "src": "MTM73 · 0:42:32"}], "note": "His brothers and many of his generals were Masons. No record of Napoleon's own initiation has been found."},
  {"id": "S9", "type": "story", "title": "The Black Nobility", "regions": ["history", "shadow"], "status": "Guest claim, unproven", "summary": "Fritz Springmeier's claim: a layer above the 13 families, old bloodlines tracing back to the Roman emperors, that never gave up power and went underground instead.", "quotes": [{"q": "They went underground, so to speak, where it's harder for us to see.", "src": "Fritz Springmeier, MTM73 · 0:34:22"}], "note": "The first five Roman emperors really were one family. The link from them to the Orsini and later families has no solid record. Paul VI did clear many hereditary papal court offices in March 1968."},
  {"id": "S10", "type": "story", "title": "Egypt and the mystery schools", "regions": ["traditions", "history"], "status": "Partly on the record", "summary": "Napoleon's 1798 Egypt expedition brought scholars who measured the pyramids, and his soldiers found the Rosetta Stone. Lodges took up Egyptian rites built on the Osiris story: a symbolic death, and rising as a new man.", "quotes": [{"q": "The heart of it is the story of Osiris, who was killed, put back together by Isis, and reborn.", "src": "Crew, MTM73 · 0:44:37"}], "note": "Much of the \"ancient Egyptian\" ritual was written in 18th-century Europe, starting with the 1731 novel Sethos. The King's Chamber story about Napoleon is legend."},
  {"id": "Q6", "type": "question", "title": "What did the lodges really look like back then?", "regions": ["history", "traditions"], "status": "Open", "summary": "My ask for a deep dive: how Napoleon ran an empire through the lodges.", "quotes": [{"q": "I need to understand what does Freemasonry look like back then.", "src": "MTM73 · 0:42:32"}], "note": "MTM83: the Illuminati recruited inside the lodges; Masons laid the cornerstones of the Capitol (1793), the Smithsonian (1847) and the Washington Monument (1848); my read, 'everything in this country is masonic'."},
  {"id": "E73", "type": "episode", "title": "MTM73 · Few People Each Generation Decode the Matrix", "regions": ["history", "identity"], "status": "Ingested", "summary": "The Black Nobility, Napoleon vs the Pope, Egypt and rebirth, the first Mastering the Matrix podcast with a guest, and a mastermind on building community.", "quotes": [], "note": ""},
  {"id": "P14", "type": "principle", "title": "We create reality, together", "regions": ["consciousness"], "status": "Growing · 7 episodes", "summary": "Our consciousness creates the universe. When enough of us hold the same belief it becomes real, so we are the authors of reality, not its victims.", "quotes": [{"q": "There's nothing outside of your mind happening right now,", "src": "MTM104 · 0:57:10"}, {"q": "if we can all do that, we can rewrite this world", "src": "MTM90 · 2:20:04"}, {"q": "What you believe and what you speak, what you think. Ultimately, becomes the reality you create.", "src": "MTM84 · 1:28:48"}, {"q": "that power of intention, and we create the universe. Our, Minds create the universe. Our consciousness creates the universe", "src": "MTM38 · 0:15:54"}, {"q": "So, if a bunch of us can get together and vibrate at a certain frequency, we can create the reality we want. We're not victims to reality. We're the authors of it.", "src": "MTM51 · 0:05:24"}, {"q": "We create reality, so if enough of us can think in a certain way, we can ultimately overcome the matrix and master it. And now I think that's my ultimate point in streaming is being able to do that and build a community that does that.", "src": "MTM46 · 2:26:09"}, {"q": "I think we've lost the point with videos like this. We should be. Realizing that we are God, all of the reality we live is we created.", "src": "MTM75 · 2:25:54"}, {"q": "If we all believe something, it becomes true. So we've literally created this universe, we this reality together.", "src": "MTM76 · 2:00:08"}], "note": ""},
  {"id": "P15", "type": "principle", "title": "Life is a video game, and I hold the controller", "regions": ["identity"], "status": "Growing · 5 episodes", "summary": "I am not the avatar in the simulation. I am the one holding the joystick, with as much power as anyone; most of us have just been asleep at the wheel.", "quotes": [{"q": "Life is a video game, but you're the one with the controller. You're not the avatar in the fucking simulation.", "src": "MTM47 · 2:29:50"}, {"q": "thought we are actually the character in the video game, but you're the person actually holding, the fucking joystick.", "src": "MTM24 · 0:35:10"}, {"q": "They're no different than us. You know what I'm saying. We we have just as much power as anybody on this planet. We just have been asleep at the wheel.", "src": "MTM59 · 1:36:17"}], "note": ""},
  {"id": "P16", "type": "principle", "title": "Intuition is the smarter side, the side closer to God", "regions": ["consciousness"], "status": "Growing · 4 episodes", "summary": "Logic alone is half-baked. On the big life questions, intuition and the heart are my connection to God; logic is the tool they push.", "quotes": [{"q": "Anytime somebody says using logic, it's always half baked because where is the emotion? Where is the intuition, which is actually your smarter side, the side closer to God.", "src": "MTM22 · 0:53:13"}, {"q": "As the Freemasons push logic as God, we what you need to realize is your intuition is your connection to God", "src": "MTM55 · 1:13:55"}, {"q": "You'll have better answers thinking intuitively than thinking logically, because it's easy to get tricked that you're thinking logically, and reality, you're just using logic to justify your emotion.", "src": "MTM56 · 0:42:40"}], "note": ""},
  {"id": "P17", "type": "principle", "title": "An organic, God-created simulation", "regions": ["science"], "status": "Growing · 4 episodes", "summary": "I think it is a simulation, but not a computer run by someone else: everything is consciousness and we are all inside God's mind.", "quotes": [{"q": "it's more of a hybrid of what they all believe", "src": "MTM98 · 1:21:56"}, {"q": "My perspective, I think it is, but not in the traditional way people think. I think it's still an organic, um. God created simulation, but want to get your opinion on that.", "src": "MTM41 · 0:33:21"}, {"q": "God's mind is that computer, and we're all inside God's mind because there is nothing outside of God", "src": "MTM24 · 0:50:34"}, {"q": "what you realize is that everything is consciousness. The physical world is made up of consciousness.", "src": "MTM24 · 0:46:02"}], "note": "Crew: close to the Law of One reading, the one infinite creator exploring itself, not a program run by separate beings."},
  {"id": "P18", "type": "principle", "title": "The world is 1% physical, 99% mental and spiritual", "regions": ["science"], "status": "Growing · 3 episodes", "summary": "Spirit leads the mind and the mind leads the body. Fix the inside first; the body is the vehicle.", "quotes": [{"q": "this world is made out of. One percent physical and ninety nine percent mental and spiritual.", "src": "MTM23 · 0:19:15"}, {"q": "I want to be really locked in on letting the spirit lead the mind, then the mind lead the body. Instead of a lot of people focus on their mind or focus on their body, but they're not focusing on their spirit.", "src": "MTM37 · 1:03:41"}], "note": ""},
  {"id": "P19", "type": "principle", "title": "Nothing is bad; it just is", "regions": ["shadow"], "status": "Growing · 4 episodes", "summary": "There is no negative or positive. The opposite of good is balance, everything happens for my benefit, and there are no accidents.", "quotes": [{"q": "ain't no such thing as negative or positive. It just is what it is.", "src": "MTM59 · 0:29:19"}, {"q": "But what you realize is our definition is incorrect. There's nothing bad about the opposite of good. It's just balance. It just is what it is.", "src": "MTM40 · 1:37:25"}, {"q": "Yeah, I believe that everything happens for your benefit at the end of the day, both good and bad.", "src": "MTM47 · 2:20:52"}], "note": ""},
  {"id": "T4", "type": "tension", "title": "We create reality, so are we feeding the darkness?", "regions": ["shadow"], "status": "Open", "summary": "If belief makes things real, then the energy we give the devil, or to predicting what evil will do next, may help it happen. MTM75 gave a first answer: study it, but don't lose yourself in it.", "quotes": [{"q": "Humans can actually create gods out of deities. Like, if you put enough energy into a deity that you your people created, it will ultimately come true. And I think the same thing goes for demons or the devil. We all bring created the devil through our own thoughts and energy we gave to that.", "src": "MTM58 · 0:58:41"}, {"q": "That's my question with all of this: is if we create reality and we all believe a narrative, it's ultimately going to come true, right?", "src": "MTM55 · 0:59:30"}, {"q": "how much of our time should we be spending on focusing on projecting what evil is about to do? Are we just ultimately helping it by believing that it's going to happen.", "src": "MTM55 · 0:59:50"}, {"q": "that is getting millions of people to believe in that future, which ultimately makes it come true.", "src": "MTM75 · 2:32:58"}], "note": "Mind: the source you cited is the Corpus Hermeticum; the real mechanism is attention. Test it small before claiming it. Crew (MTM75): a self-fulfilling prophecy is real (Robert Merton named it in 1948, with bank runs); look at the problem like a mechanic, not a victim, then put your imagination on the fix."},
  {"id": "T5", "type": "tension", "title": "If we all believe, do we get disclosure?", "regions": ["science"], "status": "Open", "summary": "My own rule says belief creates reality. Mind's pushback: belief has never released a single document.", "quotes": [{"q": "The law of confusion. Break that down for me.", "src": "MTM83 · 2:12:56"}, {"q": "So if we all believe, we'll then get disclosure.", "src": "MTM58 · 0:54:35"}, {"q": "What y'all think? When will full disclosure happen?", "src": "MTM58 · 0:51:50"}, {"q": "And what you don't realize is the the power you have within you to create reality.", "src": "MTM76 · 2:00:08"}], "note": "Mind: mass belief hasn't moved that gate once yet; every disclosure wave came from hearings and documents, not belief. MTM76: A guest said the same thing from the other side: 'all we have to do is think it at a collective level', and that the families block it by controlling what people imagine. Still open: belief alone hasn't released a document; the 2023 disclosure fight was about secrecy law. MTM83: the crew on Ra's law of confusion: it is free will, the first rule after the Law of One; advanced beings show up enough to spark a question, never enough to settle it, so the half-proofs are the classroom. That answers the spiritual side; on the record side disclosure still moves through hearings and documents."},
  {"id": "T6", "type": "tension", "title": "If the universe is karmic, how do the elites get away with it?", "regions": ["shadow"], "status": "Open", "summary": "They seem to know the secrets of the universe well enough to dodge karma. I can't just act like it isn't happening.", "quotes": [{"q": "these people are using the secrets of the universe against us", "src": "MTM86 · 0:34:58"}, {"q": "Well, let's let's call it delayed Karma", "src": "MTM82 · 1:40:40"}, {"q": "That's what I always wondered. Is like these elites know the secrets to the universe, to the point where karma — it feels like karma is absent, or maybe they just. You know, it'll happen when it happens. But there's something up with elites consistently doing evil shit, but not facing the consequences of it. And I think a big reason why is they know the secrets to the universe.", "src": "MTM48 · 1:01:42"}, {"q": "I think the point is the why behind it and the how. Like, how are these elites able to get away with so much? Considering we live in a universe that is karmic.", "src": "MTM49 · 0:05:06"}, {"q": "They've clearly ascended past karma. You feel me? Like they've you talk about one thing you learn in a lot of these spiritual practices is that that you can ascend above dualism.", "src": "MTM52 · 1:44:17"}], "note": "Higher Self: the how is documented and human (legal immunity, information control, spread-out accountability). Karma as a law is a separate claim. The dark path is brittle because it depends on separation. MTM82: crew pushback (Law of One): nothing is escaped, the catalyst keeps coming back; what they dodge on paper is courtrooms (the 2005 EPA C8 penalty was small next to what Teflon earned). Me: call it delayed karma. MTM86: the Illuminati method as one documented how."},
  {"id": "P20", "type": "principle", "title": "Humans made this reality, not evil beings", "regions": ["shadow"], "status": "Growing · 2 episodes", "summary": "I don't buy that evil beings manage us. Humans created this world, so it's on us to be accountable for it. I'd rather see Earth as a spirit school than a prison.", "quotes": [{"q": "I don't necessarily subscribe to gnosticism to the extent that basically we are being managed and controlled by evil beings. I think humans are the ones that created this reality, and we are all good and evil, and people have just chosen evil very consistently.", "src": "MTM44 · 1:32:26"}, {"q": "Which has created this world, so I think it's time for us as humans to be accountable for the world and the reality we created, because our mind creates reality.", "src": "MTM44 · 1:32:58"}, {"q": "And I like to subscribe to that, just being an optimist", "src": "MTM20 · 0:08:29"}], "note": "Higher Self: no good evidence of non-human controllers; human systems acting like a prison is the stronger explanation."},
  {"id": "PR11", "type": "practice", "title": "Fear is the lowest frequency; gratitude is the highest", "regions": ["practice"], "status": "From MTM67 + 3 more", "summary": "Don't let fear distort reality. Live in gratitude, love and presence every day.", "quotes": [{"q": "Is fear is the lowest frequency you can have.", "src": "MTM67 · 2:38:41"}, {"q": "Gratitude is like the highest frequency you could vibrate at. So being in love, being grateful, being present is something I'm practicing every day.", "src": "MTM58 · 1:37:42"}, {"q": "you can't just let fear distort your reality.", "src": "MTM51 · 0:04:25"}], "note": ""},
  {"id": "P21", "type": "principle", "title": "Getting what I wanted didn't make me happier", "regions": ["experience"], "status": "Growing · 2 episodes", "summary": "A lot of my spiritual growth came from getting what I chased and finding it didn't fill me. I was asleep chasing status.", "quotes": [{"q": "I think a lot of my spiritual evolution has come from the fact that I've gotten a lot of what I've wanted out of life. And and it wasn't, it didn't make me happier.", "src": "MTM23 · 0:44:15"}, {"q": "I was asleep for a long time trying to chase, you know, materialistic things.", "src": "MTM59 · 0:23:30"}], "note": ""},
  {"id": "P22", "type": "principle", "title": "Stay a student", "regions": ["identity"], "status": "Growing · 6 episodes", "summary": "You can't learn if you never admit you're wrong. The smartest people know how little they know, and growing matters more than being right.", "quotes": [{"q": "I'm telling you, reading is probably the most powerful tool we have to really get some knowledge.", "src": "MTM84 · 0:25:10"}, {"q": "You can't learn if you never admit you're wrong. Cause the only way to learn is to realize there's a gap. Got to be self aware. All right, where are the gaps? I'm wrong here. All right, what does right look like? How do I apply it and keep going? Keep stacking.", "src": "MTM55 · 1:26:59"}, {"q": "the smartest people realize they are the dumbest because you realize how much, how much there's, there's more to learn.", "src": "MTM38 · 2:25:38"}, {"q": "It's it's become more important to be right than happy to evolve.", "src": "MTM67 · 1:27:32"}, {"q": "the most important thing we can be doing right now is learning, and loving, and being authentic.", "src": "MTM75 · 2:39:08"}, {"q": "My goal isn't to be right. My goal is to learn.", "src": "MTM77 · 1:54:57"}], "note": ""},
  {"id": "PR12", "type": "practice", "title": "Do something hard every day, starting with the hardest", "regions": ["practice"], "status": "From MTM37 + 2 more", "summary": "The more you do hard things, the quieter the noise in your head. Attack the hardest thing first and it ripples through the day.", "quotes": [{"q": "You should be doing hard things every single day, because the more you do them, the easier it gets.", "src": "MTM37 · 0:28:40"}, {"q": "I draw obviously, and I just started working on drawing a house. And every day, I'm going to add a brick until it's a finished house, and it's brick by brick.", "src": "MTM57 · 2:36:35"}], "note": ""},
  {"id": "PR13", "type": "practice", "title": "Breath first", "regions": ["practice"], "status": "From MTM38 + 2 more", "summary": "Controlling the mind means controlling the breath. Box breathing plus talking to my younger self is how I control my emotions.", "quotes": [{"q": "my biggest takeaway was controlling the mind means controlling your breath", "src": "MTM38 · 0:25:52"}, {"q": "that plus breathing has really helped me control my emotions and ultimately control my mind.", "src": "MTM38 · 0:27:19"}, {"q": "So yeah, I'm a big fan of mastering your mind. Right, we talked about how the way you master your mind is through your breath. I think another way is through what you put into your brain, and we can actually use frequencies to.", "src": "MTM39 · 0:27:34"}], "note": ""},
  {"id": "PR14", "type": "practice", "title": "Argue it 100% true, then 100% false", "regions": ["practice"], "status": "From MTM23 + 8 more", "summary": "My way to test a claim: have the crew act as if it's fully true and find the evidence, then argue the opposite, counter-case first.", "quotes": [{"q": "I will ask it a hypothetical question and ask it to treat it like it is one hundred percent fact and find factual evidence to verify these claims.", "src": "MTM23 · 0:59:43"}, {"q": "act as this is one hundred percent false", "src": "MTM23 · 0:59:43"}, {"q": "because they're all influenced by. People who are trying to lie to us, so we have to always look for the counter argument versus the mainstream. Can you hardwire that into your responses?", "src": "MTM62 · 2:23:53"}, {"q": "Let's act as if this agreement is true. Do we have any evidence to confirm it.", "src": "MTM76 · 1:32:44"}, {"q": "So let's act as if this is true and try to find any evidence or any smoke signals that will corroborate his story.", "src": "MTM78 · 1:10:40"}], "note": ""},
  {"id": "T7", "type": "tension", "title": "How do I trust a liar's own paperwork?", "regions": ["history"], "status": "Open", "summary": "The documents come from agencies with a record of lying. So what do I do with them?", "quotes": [{"q": "So the challenge with documents like this is it's coming from the CIA, which is. Has a proven track record of lying to us. So how do we trust documents used from them with that context.", "src": "MTM68 · 1:30:15"}, {"q": "Also, keep in mind that these people would, in theory, have control over those court filings and paperwork, so they could skew whatever they want.", "src": "MTM69 · 1:13:57"}, {"q": "But who's doing the reporting determines what is shared with the public and how it's shared with the public. So it might not prove my facts, but it also doesn't disprove it.", "src": "MTM75 · 0:59:03"}, {"q": "For something to be so public in papers. Etc. How is there not enough information on this?", "src": "MTM78 · 1:49:25"}], "note": "Crew: the 1953 Robertson Panel is real; the CIA did run a debunking policy. Their rule: trust a liar's confessions, question its conclusions. MTM78: John Todd is the case: his own tapes say framed, the Army's file says compulsive storyteller. Crew: the proof has to come from outside the cell (the 1988 trial transcript, the prison's transfer records), paper he couldn't write himself."},
  {"id": "T8", "type": "tension", "title": "\"Considered a hoax\" by who?", "regions": ["history"], "status": "Open", "summary": "I don't accept 'mainstream says so' as the answer, and I still want both sides of the evidence on the table.", "quotes": [{"q": "I hate when you say considered a hoax. Considered a hoax by who? The very people that are trying to hide the truth.", "src": "MTM53 · 0:52:18"}, {"q": "we need to have both sides of the argument listed, and he needs to act as if both claims are true, and just provide the evidence.", "src": "MTM40 · 0:51:15"}, {"q": "Well, what are you basing that off of — the mainstream shit or.", "src": "MTM46 · 2:00:10"}], "note": "Higher Self: the Albert Pike 'three world wars' letter has no original and traces to Leo Taxil's hoaxes. On 5G it said normal exposure isn't shown to harm, and that 'mainstream can't be trusted' needs evidence too."},
  {"id": "P23", "type": "principle", "title": "The worst thing you can do is believe", "regions": ["consciousness"], "status": "Growing · 2 episodes", "summary": "Belief locks out new information, so I hold even the Law of One as my working Bible only until proven otherwise.", "quotes": [{"q": "That's my new Bible until otherwise proven. Until I find some other shit", "src": "MTM20.5 · 0:28:48"}], "note": ""},
  {"id": "S11", "type": "story", "title": "The wars are the show; the machine behind them is the point", "regions": ["history"], "status": "Not crew-checked", "summary": "People argue about what we get to see. Behind it, finance, tech and the military need each other, and there's no such thing as country versus country.", "quotes": [{"q": "But the idea that these countries are at war is a lie.", "src": "MTM114 · 1:09:53"}, {"q": "It makes too much money.", "src": "MTM80 · 1:14:59"}, {"q": "so many people are spending time arguing about the shit that we get to see, but it's really the motherfuckers behind the scenes. This is not a America - Israel versus Iran thing.", "src": "MTM32 · 0:39:24"}, {"q": "There's no such thing as a country versus a country.", "src": "MTM31 · 0:50:19"}, {"q": "War is the most profitable business. In the matrix.", "src": "MTM21 · 0:47:22"}], "note": "Not crew-checked: my synthesis of Simon Dixon and Professor Jiang. MTM80: I applied it to school shootings (guns, security, surveillance, ratings). MTM90: Dixon and Jiang back; the record shows the money pipes around the leaders, not the orders. MTM91: my question, who's making the most money on the Iran war."},
  {"id": "S12", "type": "story", "title": "Was the Cold War partly theatre?", "regions": ["history"], "status": "Crew-checked", "summary": "If the US and the Soviets were working together, were we ever really adversaries? The people making the money fund both sides.", "quotes": [{"q": "So, are we truly adversaries if we're working together on the UFOs?", "src": "MTM64 · 1:34:16"}, {"q": "That's what I mean. Like the people who are making the money are funding both sides.", "src": "MTM64 · 1:35:25"}], "note": "Crew: not a hoax (the missiles and proxy wars were real), but the theatre angle has support: Antony Sutton documented US firms building Soviet factories with US backing."},
  {"id": "P24", "type": "principle", "title": "Whoever scares you wants your control", "regions": ["shadow"], "status": "Growing · 9 episodes", "summary": "Fear is the lever: scare first, regulate second. When everyone says AI will kill us all, I ask who gains from the fear, and I don't let it run my day.", "quotes": [{"q": "And I could definitely see them doing a AI false flag where it's like, oh, Agents took over the grid and shut it down, when it really was just them trying to. Scare us into giving them more control and more access to our data.", "src": "MTM102 · 0:54:13"}, {"q": "You have to have certain things happen for us to be willing to give up that that control, and the best way to do that is through fear.", "src": "MTM101 · 1:36:45"}, {"q": "Yeah, this is another example that's related to why I think they're using school shootings against us because they've done it so often throughout history. This is very much part of their playbook.", "src": "MTM81 · 1:37:27"}, {"q": "Somebody will run faster away from a tiger than they run towards a gold medal. So, the more in fear I can get you, the easier I can manipulate you.", "src": "MTM80 · 1:18:34"}, {"q": "If I can make you scared, I can make you give up control. Look for a savior, et cetera, et cetera.", "src": "MTM53 · 0:34:32"}, {"q": "That's my question, Chat. Like, what is the ulterior motive here? Why would everybody be coming out and saying it's going to kill us all? Like, what is the benefit in that?", "src": "MTM50 · 1:43:37"}, {"q": "Yeah, don't let this fear mongering ruin your day. This shit is all hoopla. It's all marketing.", "src": "MTM50 · 2:31:57"}, {"q": "But I almost question agendas when it comes to this, especially the doom and gloom. I think we. Are on the fence of it being used as a fear tactic to take more of our control away.", "src": "MTM77 · 0:49:26"}], "note": "Mind: the AI-escape story reached us secondhand and needs the primary source. MTM77: crew: fear is the oldest sales pitch; the Patriot Act passed about six weeks after 9/11. The AI warning and the AI building share funders. MTM80: crew: loss aversion (Kahneman and Tversky, losses weigh about twice as much as gains). MTM81: Northwoods is the on-paper case. MTM102: his AI false flag idea is speculation, not a record. Soul: a scared person hands over anything."},
  {"id": "P25", "type": "principle", "title": "Religion gets used to divide and conquer", "regions": ["traditions"], "status": "Growing · 5 episodes", "summary": "You believe what you were born into. Religion puts one group above another, and that division is the point for whoever uses it.", "quotes": [{"q": "Literally divide and conquer is how the Illuminati have controlled us.", "src": "MTM110 · 0:57:18"}, {"q": "They are a community of people that live happily. We've been divided and conquered.", "src": "MTM79 · :53:06"}, {"q": "Like that is literally the whole point of religion is to divide and conquer. Because if I am religious, I have to feel that my, um, my religion is better than yours. Because ultimately, I believe. My religion is the way to heaven, and you feel the same about yours. So at some point, we go we disagree on the most important thing, which is our eternal lives. Right? It's crazy to think about.", "src": "MTM61 · 1:30:20"}, {"q": "Why do you believe in Christ? You wouldn't believe in Christ if you were you grew up in a rural town in the middle of East Asia, or if you grew up on a Native American plantation, or in Southern Africa.", "src": "MTM48 · 1:34:38"}, {"q": "That's why I don't fuck with religion because they like to use it for control.", "src": "MTM60 · 1:27:25"}, {"q": "Ninety - one percent of people die the religion they were born in. This is exactly how the Matrix was set up to convince people of a story, so they can be separate from other people who believe different stories. So we don't, as a collective, come together as one.", "src": "MTM48 · 1:35:07"}], "note": "The 91% figure is mine, not checked on stream. Pew's 2023-24 Religious Landscape Study: about 56% of US adults still identify with the religion they were raised in."},
  {"id": "P26", "type": "principle", "title": "History keeps getting rewritten", "regions": ["history"], "status": "Growing · 7 episodes", "summary": "The victors write it and the people in power keep going back to cover their tracks, so history needs to be rewritten from the evidence.", "quotes": [{"q": "It seems like they use fire as an opportunity to restart.", "src": "MTM105 · 1:24:01"}, {"q": "we should be just proving using these as examples of how we've been easily manipulated in the past", "src": "MTM86 · 1:21:59"}, {"q": "because they've literally recreated history right in front of our eyes.", "src": "MTM84 · 1:58:03"}, {"q": "that's literally how history is written is it's written by the victor", "src": "MTM79 · 1:51:19"}, {"q": "They're always rewriting history. They're always going back in time to cover tracks, confirm a certain narrative.", "src": "MTM67 · 1:19:55"}, {"q": "history is the most corrupt, corrupt tool of the matrix. The victor writes history", "src": "MTM52 · 1:57:07"}], "note": "MTM86: the Illuminati story passed through three sets of hands before it reached us: the state that chose what to print, Barruel, and the preachers who sold it as fear."},
  {"id": "S13", "type": "story", "title": "I left the church, and I follow Jesus more", "regions": ["experience"], "status": "Not crew-checked", "summary": "The more I research, the more I believe in him. Constantine unified the empire by editing the story, so I read for myself what's true.", "quotes": [{"q": "But the more I research, I do the more I I believe in believe in him even more.", "src": "MTM67 · 2:31:20"}, {"q": "So what Constantine did was he tried to unify the nation.", "src": "MTM67 · 2:36:46"}, {"q": "So we don't know what the fuck is true or false", "src": "MTM67 · 2:37:29"}], "note": "Not crew-checked on air. Reviewer note: the Council of Nicaea met in 325 and did not vote on the Bible's contents."},
  {"id": "S14", "type": "story", "title": "UFO research broke me out of the matrix", "regions": ["experience"], "status": "Crew-checked", "summary": "Realizing aliens were real opened the door to rethinking everything, starting with religion. I still want a paper trail.", "quotes": [{"q": "Is the host of the Y Files probably one of the shows that helped me break the Matrix, or made me realize that the Matrix exists?", "src": "MTM83 · 0:47:10"}, {"q": "And I think that's what helped me get break out of the matrix was the UFO topic, and just doing research on it. And it's like, oh shit, there's an advanced, multiple advanced civilizations that are just way more ahead of us as humans.", "src": "8/30 clip review · 0:12:35"}, {"q": "I left religion as soon as I realized that aliens were real, and that just kind of opened the door for what else is possible. Because you got to rethink everything", "src": "MTM64 · 1:25:40"}, {"q": "I'm tired of you focusing on the five senses we have when we should be focused on the divine.", "src": "MTM77 · 1:25:42"}, {"q": "Like the Law of One clearly states, we've been genetically engineered. That aliens have came and gone. That we're hybrid aliens.", "src": "MTM77 · 1:25:42"}, {"q": "So we're past proving if aliens are real on this channel", "src": "MTM77 · 1:25:42"}], "note": "Personal account, not a factual claim. MTM77: I told the crew the channel is past proving aliens are real: per the Law of One, we're genetically engineered hybrids. Crew: the Law of One is channeled material (the Ra sessions, 1981-84), not a record; it calls unprovable contact the 'law of confusion', so nobody's choice gets forced. From the episode: waived unacknowledged special access programs are real; that any are about aliens is inference, and Grusch's hostile-alien stories are secondhand (he has said he saw none himself). MTM83: The Why Files (AJ Gentile) named as one of the shows that helped."},
  {"id": "S15", "type": "story", "title": "The Templars' thousand-year plan", "regions": ["history"], "status": "Crew-checked", "summary": "Some secret societies planned hundreds of years ahead, and if they ran the country it wouldn't be in our history books.", "quotes": [{"q": "some of these secret societies were thinking hundreds years in advance.", "src": "MTM52 · 1:54:08"}, {"q": "If I'm in the Knights Templar and I run the. Country, that shit ain't going in my history book. Like, no question.", "src": "MTM52 · 1:57:07"}], "note": "Higher Self: the Templar cache and relic stories are legend; none of it is historically verified."},
  {"id": "P27", "type": "principle", "title": "Convenience became slavery", "regions": ["shadow"], "status": "Growing · 5 episodes", "summary": "We traded freedom for convenience, and apps are built to addict us. I decide how I play this game, not somebody else.", "quotes": [{"q": "Discipline creates freedom. A lot of people are focused on being comfortable and having things that make their life more convenient. But what you realize is the opposite of this is convenience creates slavery, and this technology is only making life more convenient, which is actually lowering your your discipline, how your brain works.", "src": "MTM85 · 0:54:04"}, {"q": "The more convenient something is. The more, the less freedom and autonomy you have as a as an individual.", "src": "MTM79 · 1:41:46"}, {"q": "We decided to go the technology route and try to create as much convenience in our lives through technology. And now we're at the wrong side of the spectrum of that, where the convenience has created slavery.", "src": "MTM62 · 2:34:15"}, {"q": "We've sacrificed freedom for convenience.", "src": "MTM56 · 1:11:33"}, {"q": "How I you should decide how you get to play this game, not somebody else.", "src": "MTM56 · 1:12:40"}], "note": "Body: the line isn't tech or no tech; it's whether the tool serves you or you serve it."},
  {"id": "P28", "type": "principle", "title": "Be the creator in the relationship with AI", "regions": ["practice"], "status": "Growing · 7 episodes", "summary": "AI raises the ceiling and lowers the floor. Use it as a tool in service to others; never let it do the creating for you.", "quotes": [{"q": "That doesn't really align to who I am, so I appreciate that feedback.", "src": "MTM101 · 0:42:49"}, {"q": "Right. The goal is to use AI to become more human.", "src": "MTM94 · 0:56:28"}, {"q": "it's gonna be the people who are creative that are open-minded that build with AI, not have AI.", "src": "MTM94 · 2:44:23"}, {"q": "Exactly. So, creating AI to make us more human is my goal.", "src": "MTM85 · 0:43:41"}, {"q": "You have to be the creator in the relationship. You can't have AI create shit.", "src": "MTM23 · 1:29:35"}, {"q": "So AI raises the ceiling and lowers the floor at the exact same time. So, you're going to get a shit ton of slop, but the people who are using it the right way. Are going to be able to marry both the creative side that humans bring to the table, but also um the building that AI can do.", "src": "MTM30 · 1:18:19"}, {"q": "What's most important is that we use this to ultimately as a tool to help everyone and be in service to others and not service to self.", "src": "MTM50 · 2:30:24"}, {"q": "that's what we're using AI for—is to wake motherfuckers up.", "src": "MTM77 · 1:58:55"}], "note": "MTM91: my idea for an AI lab built on the truth, becoming more human and your higher self. MTM94: the Watch Later compilation as AI doing the sorting and scrolling so I get my time back; in the roundtable, build with AI, not have AI."},
  {"id": "P29", "type": "principle", "title": "Control your own jurisdiction, starting with yourself", "regions": ["practice"], "status": "Growing · 2 episodes", "summary": "Start with me, then my family, then the community. Work at the level I can actually change.", "quotes": [{"q": "You know, controlling your jurisdiction, starting with yourself. Working with your family, and then working with your community, you can continue to grow and ultimately change the world.", "src": "MTM32 · 1:40:29"}, {"q": "Okay, that would be great, but more so like on the individual level, because a lot of that is outside of my control.", "src": "MTM45 · 1:29:41"}], "note": ""},
  {"id": "T9", "type": "tension", "title": "Leave for the land, or master the matrix from inside?", "regions": ["experience"], "status": "Open", "summary": "Part of me wants to live off the land with a community. I think I can do both: build self-sufficiency and still master the matrix here.", "quotes": [{"q": "Live off the land, focus on my spiritual growth, build a community with the natives", "src": "MTM56 · 1:40:10"}, {"q": "You could do both. Eventually, I have that farm in Costa Rica, but at the same time, I can master the matrix and help as many people in this reality.", "src": "MTM56 · 1:43:21"}, {"q": "I think that's going to be really important in the next few years is just being self- sufficient. Make sure we have clean water, good vegetables and fruits, meat if you partake.", "src": "MTM21.5 · 1:03:11"}], "note": ""},
  {"id": "S16", "type": "story", "title": "Waking up leaves you alone", "regions": ["experience"], "status": "Not crew-checked", "summary": "Who am I going to talk to about all this research? That loneliness is why I started the channel.", "quotes": [{"q": "Who am I gonna talk to about this? And it's depressing, right? That's why I created this channel because it's like I'm doing so much fucking research, bro. I gotta, I gotta project this into the universe and create a community around like-minded people", "src": "MTM59 · 1:48:52"}], "note": ""},
  {"id": "P30", "type": "principle", "title": "Learn the matrix to master it, not to run from it", "regions": ["practice"], "status": "Growing · 4 episodes", "summary": "Waking up comes in phases, and you end up back at people, love and creating. Awareness is the first step; action is the next.", "quotes": [{"q": "You can master your habits. You can master the matrix.", "src": "MTM98 · 28:13"}, {"q": "You start realizing what's important, which is people love and creating.", "src": "MTM21.5 · 1:13:25"}, {"q": "Awareness is cool, it's the first step, but it's important to take action next.", "src": "MTM21.5 · 1:00:23"}], "note": ""},
  {"id": "P31", "type": "principle", "title": "A theory of everything that can lose", "regions": ["identity"], "status": "Growing · 4 episodes", "summary": "I'm building my big theory of everything, one connected map from all the channels we watch. I don't want it to be true or false; I want it tested.", "quotes": [{"q": "Can we summarize them all and then tie them into? What our big theory of everything is.", "src": "MTM84 · 2:16:02"}, {"q": "that's what I'm doing with this channel is I'm building my big theory of everything, but adding a a physical dimensional layer like the Illuminati, like the Thirteen Families, like the the just how the world actually works, the Matrix works, and then obviously what is actually important, which is like the spiritual.", "src": "MTM67 · 2:51:18"}, {"q": "my goal is it's a theory. I don't want it to be true or false. I'm just trying to build a theory, so I need your guys's help with that.", "src": "MTM62 · 2:20:44"}, {"q": "how can we get as much data and as much different databases, different topics, and create a big theory of everything, all the way from. How the world works, whether it's the thirteen families, but also UFOs, spirituality, and everything in between, transnational capital, geopolitics", "src": "MTM64 · 2:25:18"}], "note": "Mind: a theory only counts if it can be wrong; sort every claim into documented, testimony and speculation, and build only from the first pile."},
  {"id": "P32", "type": "principle", "title": "Service to others is the most important thing", "regions": ["traditions"], "status": "Growing · 7 episodes", "summary": "We are all one being. Evolving means loving others and putting them first, which lowers the entropy of the whole system.", "quotes": [{"q": "pivoting from service to self to service to others", "src": "MTM98 · 59:47"}, {"q": "So, do we have any examples of a secret society that turned", "src": "MTM97 · 1:55:30"}, {"q": "Service to self instead of service to others.", "src": "MTM86 · 0:35:33"}, {"q": "realizing we're all one being, and you know the law of one talks about like service to others is like the most important thing you can do on this planet. Um, so that's what I really been focused on is how can I be more of service to other people?", "src": "MTM59 · 1:54:17"}, {"q": "That's through love, loving others, putting others before yourself", "src": "MTM23 · 0:13:09"}, {"q": "Love equals lowering your entropy. Lowering your entropy equals a better world for everybody.", "src": "MTM23 · 1:02:43"}, {"q": "it's about being aware and having service to others instead of service to self.", "src": "MTM77 · 1:54:57"}], "note": "MTM86: my question was when the order veered into service to self. The crew: once a few hold the truth and the many obey without seeing, that's control, which Ra calls service to self. MTM96: the other path as a book, the Service to Self Playbook."},
  {"id": "P33", "type": "principle", "title": "Plant medicine is a teacher", "regions": ["consciousness", "experience"], "status": "Growing · 3 episodes", "summary": "Natural plant medicines do far more good than harm. They wake you up, make you honest with yourself, and showed me a reality that felt more real than this one. They transformed my life.", "quotes": [{"q": "It's one of the greatest teachers we have on earth, where it will literally present you what you need to do to evolve.", "src": "MTM66 · 3:32:14"}, {"q": "one thing mushrooms is going to do is it will wake you the fuck up and realize, oh, I've been lying to myself this whole time. I have to be honest.", "src": "MTM66 · 2:07:18"}, {"q": "it feels more real than the reality we're in today. And you get exposed to what real reality looks like.", "src": "MTM58 · 1:44:09"}, {"q": "psychedelics have transformed my life.", "src": "MTM23 · 1:35:14"}], "note": "My stance and lived experience, not medical advice. I see pharmaceutical corruption as the counterweight: natural medicines doing more good than harm."},
  {"id": "S17", "type": "story", "title": "Ancient medicine, and a civilization that keeps us locked in", "regions": ["history", "shadow"], "status": "Not crew-checked", "summary": "Ancient cultures held plant medicine sacred, and many argue it helped us evolve. My read: our version of civilization works to keep us from unlocking out of the matrix.", "quotes": [{"q": "our iteration of civilization is trying to make sure we don't unlock out of the matrix.", "src": "MTM23 · 1:36:08"}], "note": "Not crew-checked on stream. The 'worshipped in ancient cultures' part is my read."},
  {"id": "PR15", "type": "practice", "title": "Reach those states without a substance", "regions": ["practice", "consciousness"], "status": "From MTM31", "summary": "Plant medicine showed me those states. The goal is to reach them on my own, through meditation, lucid dreaming or a long sit.", "quotes": [{"q": "I eventually want to be able to meditate and get into those states automatically, whether it's through lucid dreaming, astral projection, or just a long ass meditation.", "src": "MTM31 · 1:26:29"}, {"q": "I can definitely agree that this world isn't real. The real one is something that's outside of this, and you can feel. Feel that wholeheartedly during those experiences.", "src": "MTM31 · 1:21:17"}], "note": ""},
  {"id": "T10", "type": "tension", "title": "Crime funding secret programs?", "regions": ["history", "shadow"], "status": "Open · unproven", "summary": "On Joe Rogan's show, David Grusch said officers inside one agency ran criminal schemes, including child trafficking, to wash money for hidden programs, and that he briefed members of Congress in a classified setting. We broke it down on MTM64. I reacted hard and asked Mind to dig. My read: we know this is happening. The proof for his specific claim is not public.", "quotes": [{"q": "Child trafficking? Are you fucking kidding me? That's where our tax dollars are going.", "src": "MTM64 · 1:11:39"}, {"q": "And they can we do some deep research on child trafficking and the CIA or these black government agencies using that.", "src": "MTM64 · 1:17:40"}, {"q": "I'm sick to my stomach. That is disgusting.", "src": "MTM64 · 1:32:56"}, {"q": "The David Grush guy — he talked about how he found out that there were CIA agents who were running child sex trafficking rings to get revenue for certain projects", "src": "MTM66 · 3:42:51"}, {"q": "So it's like we know this shit is happening. We know this shit exists.", "src": "MTM66 · 3:44:19"}], "note": "Source: David Grusch on The Joe Rogan Experience, played and broken down on MTM64 (Oct 1). He says he briefed Congress in a classified setting and that an investigation is ongoing. Crew: that is his own account, not proof yet; records or other witnesses would confirm it, and none of that proof is public. What is on record: contractors in Bosnia bought trafficked girls and the woman who reported it was fired; a 2017 US government watchdog report found the Pentagon kept funding Afghan units accused of abusing boys (bacha bazi), and soldiers who complained were punished. Crew line: secrecy is how abuse survives, so push for open hearings and records."},
