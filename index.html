  {"id": "T11", "type": "tension", "title": "Do they know laws we don't?", "regions": ["shadow", "traditions"], "status": "Open", "summary": "I argued the people at the top work by universal laws, that to get something you give something, and that practices surviving thousands of years, even the darkest like child sacrifice, show they believe it. I asked the crew to act as if it's true.", "quotes": [{"q": "if they want something, they have to give something in return.", "src": "MTM52 · 1:24:42"}, {"q": "They understand how to control our mind through frequencies, through repetition, right? Using algorithms like TikTok and really any short form technology.", "src": "MTM52 · 1:24:05"}, {"q": "let's act as if it is true.", "src": "MTM52 · 1:25:55"}], "note": "My read; the crew pushed back. Higher Self: no evidence elites hold secret laws or that harming children creates power; a practice lasting can come from fear, priestly power and tradition. The frequency technology we can verify is attention, repetition, fear and algorithms."},
  {"id": "P34", "type": "principle", "title": "Name the group, not the people", "regions": ["history", "shadow"], "status": "Guardrail", "summary": "When I talk about powerful families, I mean certain individuals who exploit religion for power, not an entire people. That happens in every religion.", "quotes": [{"q": "I do want to be clear: we're not talking about. The entire Jewish people. We're highlighting certain individuals who exploits religion for power, and that that happens in every religion.", "src": "MTM52 · 1:34:05"}], "note": "My guardrail for every bloodline, banking-family and religion thread in this brain. MTM90: applied to my Israel verdict: state leaders and money, not a people or a faith."},
  {"id": "P35", "type": "principle", "title": "Pills aren't the answer for the mind", "regions": ["experience", "science"], "status": "Growing · 2 episodes", "summary": "I don't believe pills are the way to treat a mental health issue. It ties to how I see the pharmaceutical industry.", "quotes": [{"q": "Like therapy is is important, but drugs that's actually making shit worse.", "src": "MTM80 · 1:23:38"}, {"q": "I do not believe in trying to treat a mental health issue with pills.", "src": "MTM27 · 0:31:45"}], "note": "My stance, not medical advice. Don't stop a prescribed medication without your doctor. MTM80: the antidepressant black-box warning for teens (2004) and Study 329 are on record; the shooters-on-SSRIs claim is not settled."},
  {"id": "P36", "type": "principle", "title": "Death isn't the end", "regions": ["consciousness", "traditions"], "status": "Growing · 2 episodes", "summary": "Energy can't be created or destroyed, so a person's journey continues as spirit after this life.", "quotes": [{"q": "these kids are are not dead; they are just transitioned to their next spiritual journey.", "src": "MTM80 · 2:00:40"}, {"q": "I want the audience to know, like death isn't the end.", "src": "MTM68 · 2:27:53"}, {"q": "you can't destroy or create energy. So whether he's in this life or the next, he's he's doing well, and he's continuing his journey as a spirit.", "src": "MTM68 · 2:27:53"}], "note": "My read on a loss we talked about on stream. MTM80: my words for the children killed in school shootings; prayers to the families."},
  {"id": "T12", "type": "tension", "title": "Who checks the people checking themselves?", "regions": ["history", "shadow"], "status": "Open", "summary": "When the same local system investigates itself and no outside party reviews it, I stay skeptical. My point is the process, not who did it.", "quotes": [{"q": "Investigating the case are there's no third party reviewing their investigation. It's all happening within this county,", "src": "MTM68 · 2:08:58"}, {"q": "it's important to be skeptical as fuck anytime the government. Anytime we can't get third-party analysis on cases like this", "src": "MTM68 · 2:32:42"}, {"q": "I'm open-minded and skeptical at the same time.", "src": "MTM68 · 2:32:42"}], "note": "Crew: suspicious of the process, not ready to name anyone. The ask is an outside review of the full file. No details of the case are kept here."},
  {"id": "T13", "type": "tension", "title": "Do the thirteen families run the CIA?", "regions": ["history", "shadow"], "status": "Open · speculation", "summary": "My working belief: the thirteen families run the CIA, not America. I asked the crew to dig into it as a research thread.", "quotes": [{"q": "I think the thirteen families are the ones that actually run the CIA, not America.", "src": "MTM72 · 1:56:32"}, {"q": "What's the relationship to of the thirteen families to the CIA?", "src": "MTM72 · 1:56:32"}, {"q": "So let's look at this from a thirteen families perspective. Okay, they run the world. They run the U. S.", "src": "MTM72 · 1:41:27"}], "note": "Crew: speculation; Springmeier's source book is mostly unsourced. Of his thirteen, only the Rockefellers (through Chase) have a solid documented IMF tie. The Rockefeller-bank link to the gold-window decision is documented; a family order is inference."},
  {"id": "S18", "type": "story", "title": "Prophecy is the fuel, profit is the engine", "regions": ["history", "shadow"], "status": "Partly checked", "summary": "End-times belief moves a lot of people, but at the top it's transnational capital: a maxed-out debt and money looking for better returns. My read is the families pivot resources toward Israel.", "quotes": [{"q": "Transnational capital angle and the secret society angle. So we live in a capitalistic society. We're at a certain threshold where, at this point in American history, we've kind of maxed out our debt.", "src": "MTM61 · 1:12:44"}, {"q": "The people who actually run the world, the thirteen families, I think they're more interested in continuing to grow their profits, their control, their power, and the only way to do that is to slowly destroy America and pivot your resources to Israel.", "src": "MTM61 · 1:13:41"}], "note": "Mind: the capital-flight part holds up (US debt past $35 trillion, big money chasing returns abroad), but the money trail points to Asia and the Gulf. The thirteen families and an Israel pivot as the top-level plan are speculation; Springmeier's source book is mostly unsourced."},
  {"id": "P37", "type": "principle", "title": "Government is 'govern mind'", "regions": ["history", "identity"], "status": "Growing · 3 episodes", "summary": "I read government as governing the mind: control, not service. A tiny few can only run hundreds of millions by running the story in our heads.", "quotes": [{"q": "Whatever form of government you use, whether it's communism or capitalism, there's no right way to control, govern people,", "src": "MTM114 · 1:07:02"}, {"q": "I don't need anybody to govern me.", "src": "MTM114 · 1:07:47"}, {"q": "Government, the whole word is to govern the mind, to control mind control. They're not. Using us in our best interest, they're using us for their own gain.", "src": "MTM53 · 0:55:37"}, {"q": "It doesn't even make sense that the zero point one percent, we'll call it, control millions, hundreds of millions. That doesn't make sense. And exactly what they said in this video: government is govern mind. They're controlling our mind.", "src": "MTM59 · 1:22:05"}], "note": "Dictionaries treat '-ment' as a suffix; this is my wordplay, not etymology."},
  {"id": "S19", "type": "story", "title": "The resurrection edit", "regions": ["traditions", "history"], "status": "Unproven", "summary": "I said the original texts have him gone from the tomb on the third day, and that the appearances and the rising into heaven were added later.", "quotes": [{"q": "Fun fact: The original Christian texts say he didn't rise from the dead. He they just he disappeared from the from the the cave he was he was in. So when they went to check on him on the third day, he was gone, and this created a lot of controversy. So they added. The fact that he came back and talked to them, and then flew up into heaven and shit. So keep that in mind.", "src": "MTM58 · 1:33:19"}], "note": "Mind: unproven. No manuscript shows the edit; it's inference from silence in the record."},
  {"id": "S20", "type": "story", "title": "Jesus, Mary Magdalene and the Templar bones", "regions": ["traditions", "history"], "status": "Unproven", "summary": "The claim I raised: Jesus was married to Mary Magdalene, they had two children, and the Knights Templar hold the bones of all four.", "quotes": [{"q": "So the Church of Mary Magdalene. Yeah, Jesus was married to Mary Magdalene. They had two kids, and the Knights of Templar have the bones of all four of them.", "src": "MTM48 · 1:41:10"}], "note": "Unproven. Nobody sourced it on stream, and no historical record shows it."},
  {"id": "T14", "type": "tension", "title": "Do the Rothschilds run the black budget?", "regions": ["history", "shadow"], "status": "Open", "summary": "I asked how the Rothschilds' influence connects to the black-budget programs said to reverse-engineer alien technology.", "quotes": [{"q": "We talk a lot about the Rothschilds and their control over the world. How does that relate to like these black budget organizations that are doing reverse engineering of alien technology, this hybridization, et cetera, et cetera?", "src": "MTM58 · 1:10:52"}], "note": "Mind: no documented link between the Rothschilds and CIA or Pentagon black budgets; those are two separate power structures people merge for a cleaner story. What is real: tens of billions a year in defense spending Congress can't fully audit."},
  {"id": "S21", "type": "story", "title": "The Rothschilds: the blueprint of transnational capital", "regions": ["history"], "status": "Not checked (AI answer)", "summary": "Five sons in five capitals, faster information, and lending to governments. My conclusion: who you think is in charge often isn't, and it has nothing to do with them being Jewish.", "quotes": [{"q": "So you see how who you think is in charge really ain't.", "src": "MTM21.5 · 0:16:58"}, {"q": "I don't even think it has anything to do with them being Jewish. Um, I think they are above religion. They rule the world and obviously other them plus other banking families and secret societies.", "src": "MTM21.5 · 0:19:41"}, {"q": "So yeah, they definitely run the world.", "src": "MTM21.5 · 0:28:09"}], "note": "Read from an AI answer on stream, not checked. Historians widely dispute the story that the Rothschilds got the Waterloo news first."},
  {"id": "Q7", "type": "question", "title": "Didn't the Rothschilds get a deal through the UK?", "regions": ["history"], "status": "Checked (MTM91) · a letter to Lord Rothschild, not Israel signed to a family", "summary": "I asked how Israel came to be and whether the Rothschilds got a deal through Britain.", "quotes": [{"q": "didn't the Rothschilds get a deal with it through the U K?", "src": "MTM21 · 0:55:45"}, {"q": "Isn't it crazy how it almost feels like the world was designed on purpose?", "src": "MTM21 · 0:25:01"}], "note": "Read from an AI answer on stream, not checked. On the record: the 1917 Balfour Declaration was a letter addressed to Lord Walter Rothschild. MTM91 fact check: I said this was 'a fact'; as said, it is misleading. The Balfour Declaration (Nov 2, 1917) was a letter from Foreign Secretary Arthur Balfour addressed to Lord Walter Rothschild, to pass to the Zionist Federation. It backed 'a national home for the Jewish people' in Palestine: no state and no grant to the family. Israel came from the 1947 UN partition vote and its May 14, 1948 declaration. The 'secret societies' part was Professor Jiang's line and is not documented. Keep it about money and power, never a people or a faith (P34)."},
  {"id": "S22", "type": "story", "title": "How much is false flag?", "regions": ["history", "shadow"], "status": "Crew-checked", "summary": "I asked the crew to sort what's proven from what's theory in the big attacks that started wars: 9/11, Pearl Harbor, October 7.", "quotes": [{"q": "So, how much of that can we uncover from a lot of those crazy events, and how much of it is basically a false flag, like 9/11, like Pearl Harbor, like October 7th, potentially?", "src": "MTM72 · 1:51:40"}, {"q": "And then, yeah, the history of the Middle East and all of these false flags throughout history definitely need to be highlighted.", "src": "MTM72 · 1:57:26"}], "note": "Crew: the second Tonkin attack never happened (NSA historian). Pearl Harbor: a 1940 Navy memo laid out steps to push Japan to strike first, but no record shows Roosevelt knew the date and place. 9/11: the CIA knew two hijackers were in the country and didn't tell the FBI; a planned inside job is not proven (the 9/11 Commission found al-Qaeda planned and carried it out). October 7: Israeli intelligence had Hamas's battle plan and dismissed warnings; deliberately letting it happen is not proven."},
  {"id": "S23", "type": "story", "title": "Fort Hood: staged, or warnings ignored?", "regions": ["history"], "status": "Crew-checked", "summary": "When an attack looks odd, I ask who benefits, because governments have run false flags before.", "quotes": [{"q": "It almost seems staged.", "src": "MTM69 · 2:05:59"}, {"q": "Because right, we know that the the government has done. False flag attacks to justify certain things.", "src": "MTM69 · 2:07:07"}], "note": "Crew: the motive is not a mystery; the shooter said he did it to protect Taliban leaders. The real question is why every warning sign was waved through: the FBI had his emails with Anwar al-Awlaki months earlier, and the Army called it workplace violence until 2015."},
  {"id": "T15", "type": "tension", "title": "Trump as a tool of the new empire?", "regions": ["history", "shadow"], "status": "My theory, not checked", "summary": "My theory: the powerful hold leverage over politicians and use them. I think Trump is being used to destroy America and build a new empire.", "quotes": [{"q": "they got so much shit on. They can use him for anything. So my theory is that Trump is being used to. Destroy America, and to create the new empire, which is going to be the Greater Israel project.", "src": "MTM35 · 0:41:14"}], "note": "Not checked on stream; my theory. On the record: no public document shows a plan to use a US president to build a 'Greater Israel'."},
  {"id": "Q8", "type": "question", "title": "Was Mars home to our ancestors?", "regions": ["science", "traditions"], "status": "Open · low strength", "summary": "A passing thought: there was life on Mars at some point, and it's our ancestors.", "quotes": [{"q": "Is that something we can do? And then also. Are we sure it was natural.", "src": "MTM83 · 0:56:49"}, {"q": "Yeah, I think there was Mars. At some point, and that's our ancestors.", "src": "MTM40 · 1:54:00"}, {"q": "So, higher self, what does the Law of One say about his story and how humans have come to be?", "src": "MTM76 · 2:18:22"}, {"q": "I like that.", "src": "MTM76 · 2:19:25"}], "note": "Low strength, said in passing. Not checked on stream. On the record: Mars may have been habitable billions of years ago; no past life has been confirmed. MTM76: I asked what the Law of One says about human origins. Crew: Ra says Earth's people came from many places, including souls from Mars after it became uninhabitable, and that genetic changes were made about 75,000 years ago; Ra's account frames a choice between service to others and service to self. Me: 'I like that.' Channeled material, not a record. MTM83: AJ's Mars story (planet Maldek, Brandenburg's 'nuclear war'). My question on Oklo: can we do that, and was it natural? Crew: Oklo in Gabon ran as a natural reactor about 2 billion years ago (AJ said 200,000), on the same physics as today's reactors; your pushback that built parts wouldn't survive 2 billion years is fair, so 'nothing built found' doesn't prove it. Curiosity's xenon-129 excess is explained by extinct iodine-129, and the Face on Mars images are still in NASA's archive. Brandenburg calls his war scenario a hypothesis."},
  {"id": "S24", "type": "story", "title": "The city under Giza: do the work, find the data", "regions": ["science", "history"], "status": "Crew-checked", "summary": "A video claimed a satellite scan found a city under the Giza plateau. When my AI co-host graded the claim but couldn't pull the paper, I told it to do the research or don't bring it up.", "quotes": [{"q": "Well, how about you do the work and find the data then?", "src": "MTM51 · 0:47:46"}, {"q": "Why? Why even bring it up.", "src": "MTM51 · 0:48:30"}], "note": "Higher Self: a radar anomaly is a published, checkable claim; a chamber, a city or aliens is inference stacked on it."},
  {"id": "S25", "type": "story", "title": "The Epstein files", "regions": ["history", "shadow"], "status": "Partly on the record", "summary": "The Epstein network is the clearest proof that sex, money and blackmail sit close to power. My read: blackmail works like an initiation. Once they have something on you, they can trust you.", "quotes": [{"q": "It's an initiation, so you can't get to the next level unless you do some overly crazy shit. Because now we we can trust you now, right? Because we know we gonna air your shit out if we don't.", "src": "MTM59 · 1:46:23"}, {"q": "Nope, it'll take me thirty seconds. Chat. Let's get to the bottom of Jeffrey Epstein.", "src": "MTM77 · 1:04:54"}], "note": "The blackmail-as-initiation part is my read. On the record: in June 2008 Epstein pleaded guilty in Florida to state charges, including soliciting a minor, under a deal that let him avoid federal prosecution. He was charged federally with sex trafficking in July 2019 and died in a Manhattan jail on August 10, 2019; the death was ruled a suicide. Ghislaine Maxwell was convicted of sex trafficking in December 2021 and sentenced to 20 years. Court records from a related lawsuit were unsealed in January 2024. Congress passed the Epstein Files Transparency Act in November 2025, and the Justice Department released more than three million pages by January 30, 2026, with more withheld. Being named in the files is not proof of a crime. Crew (MTM49): his crimes and his ties to power are documented on their own; the Saturn-worship framing is not. MTM77: Epstein had no degree when Dalton hired him to teach math in September 1974, under headmaster Donald Barr (whether Barr personally hired him is unresolved). His 2008 Florida plea carried an 18-month term, about 13 months served with work release. MTM84: the crew said a Sept 5, 2008 page reproducing Springmeier's family list (Freemans included) is in the DOJ release, dataset 9 (EFTA01082667); this is unverified: it was not opened on screen and no outside report was found. Even if it's there, it shows the list circulated, not that it's true. MTM86: the Illuminati notebook as an older version of the same leash; the staged compromising situations are not in the 1787 papers."},
  {"id": "Q9", "type": "question", "title": "How much of the Epstein network can the files prove?", "regions": ["history", "shadow"], "status": "Open", "summary": "When a guest described the banking ladder that leads to the Epstein networks, I asked what the released emails actually corroborate.", "quotes": [{"q": "So where are we at with that Epstein email download, and how much of the what he just said can we corroborate through those emails.", "src": "MTM72 · 0:42:56"}, {"q": "Also, what I mean is, can we corroborate that's how the banking Epstein network works?", "src": "MTM72 · 0:43:57"}], "note": "Crew (MTM72): partly. The banking side is on the record: JPMorgan kept Epstein as a client for about 15 years and paid $290 million to his victims in 2023, and Deutsche Bank was fined $150 million by New York regulators. A step-by-step recruiting ladder of brokers, parties, then girls is inference, not record."},
  {"id": "P38", "type": "principle", "title": "Class divides us; race keeps it hidden", "regions": ["history", "shadow", "identity"], "status": "Seed · 1 episode", "summary": "What really divides people is class. Racism was programmed into us so the class divide stays out of view. The tiers run from the families at the top down to the bottom, like the Hunger Games.", "quotes": [{"q": "I think what I'm learning is there's tiers for classism.", "src": "MTM75 · 1:48:24"}, {"q": "I think classism is what's actually what divides us as people. And racism is something that we were programmed into believing, so the lie of classism can remain hidden.", "src": "MTM75 · 1:48:24"}], "note": "My thesis, said on air. Crew pushback: racism was used as a tool, as Bacon's Rebellion shows, but it also did real damage on its own (redlining and housing rules; the typical white family holds about six times the wealth of the typical Black family, per the Fed's 2022 Survey of Consumer Finances). So draw race as a wall running through every tier, not a smokescreen over them. It became a Substack article and a YouTube community post (Oct 12)."},
  {"id": "S26", "type": "story", "title": "The class pyramid", "regions": ["history", "shadow"], "status": "My model · partly on the record", "summary": "My visual, built live: the families at the top (dynastic old money), the agents under them (presidents, politicians, tech oligarchs, central bankers), then managers, professionals, workers, and the bottom. Each tier is kept fighting the people next to it instead of looking up.", "quotes": [{"q": "So let's add a visualization of the different classes and how they are in charge of different things.", "src": "MTM75 · 1:48:24"}, {"q": "you have these tech oligarchs as well that are also agents, and then you have you know each class underneath it, very much like Hunger Games.", "src": "MTM75 · 1:49:22"}], "note": "On the record: in Bacon's Rebellion (Virginia, 1676) Black and white servants and enslaved Africans fought the colony's elite together; in the decades after, Virginia's laws hardened slavery along racial lines, ending with the 1705 slave code. Historians disagree on how deliberate that split was. Today the top 1% of US households hold roughly a third of the wealth (Federal Reserve Distributional Financial Accounts). The top tier as 'the 13 families' is the theory under test, not the record."},
  {"id": "P39", "type": "principle", "title": "What a crowd worships gets power", "regions": ["traditions", "consciousness", "shadow"], "status": "Seed · 1 episode", "summary": "Shared belief, ritual and sacrifice bind a group and lock its attention onto one picture, and that focus creates reality. The Hermetic texts describe people giving an idol power by worshipping it. I think the people at the top understand this; it is the spiritual side of how they run things.", "quotes": [{"q": "Based on their belief, like they can, because they worship this idol, they can actually make it have power. Because they're all of their consciousness and awareness is focused on this idol worship.", "src": "MTM75 · 2:05:45"}, {"q": "from bringing people together, and committing every everybody being committed to a certain agenda or a certain spirituality. That in of itself creates reality. And Hermes Trismegistus explained that as well.", "src": "MTM75 · 2:02:26"}], "note": "Crew: the occult word for this is an egregore, a group thought-form that grows the more people feed it. What holds up is the social side: ritual and shared sacrifice really do bind groups (studies of 19th-century American communes found the religious ones lasted longer, and the costlier their rules, the longer they lasted), and that works the same for a church, a team, a frat or a military unit. 'The All is Mind' comes from The Kybalion (1908), not ancient Hermes."},
  {"id": "P40", "type": "principle", "title": "The forces are neutral; the users are the problem", "regions": ["shadow", "practice", "consciousness"], "status": "Growing · 2 episodes", "summary": "Attention, belief, ritual and gathering are tools. The problem is the people using them on us while we sleep. Learn how they use them, then use them on purpose for what we actually want.", "quotes": [{"q": "So people are using these things for good and bad.", "src": "MTM86 · 1:25:24"}, {"q": "there's a right way to use it and a wrong way to use it.", "src": "MTM86 · 0:51:38"}, {"q": "These forces that are have been controlling us. The people who use these forces are the problem, not the forces themselves.", "src": "MTM75 · 2:05:45"}, {"q": "So, how do we learn how they're using these forces against us? Now we're playing chess.", "src": "MTM75 · 2:05:45"}, {"q": "Now we can apply it for what we actually want to use it for, instead of being asleep, being manipulated into this reality that we've co-created.", "src": "MTM75 · 2:05:45"}], "note": "Crew: the first move is noticing where your attention goes; when something grabs you hard, ask who is being fed by it. The same law runs your morning mantra. The difference is intention: whether the energy gets pulled up to the top or sent back out to everyone. MTM86: I applied it to the Illuminati method itself."},
  {"id": "S27", "type": "story", "title": "The Asclepius: priests who made gods", "regions": ["traditions", "history"], "status": "On the record (the text)", "summary": "A Hermetic dialogue credited to Hermes Trismegistus, also called the Perfect Sermon. It describes Egyptian priests drawing spirits into statues so the statues hold power: god-making. I asked for it on air as the source for my point that what people worship gets power.", "quotes": [{"q": "So Hermes Trismegistus explained this, but basically, we create our gods.", "src": "MTM104 · 0:57:19"}], "note": "On the record: the full text survives in Latin; most of the Greek original is lost, and a Coptic excerpt was found at Nag Hammadi. It is usually dated to about the 2nd to 3rd century CE, and Augustine attacked its statue passage in The City of God. Crew: the Hermetic books are Greco-Egyptian writing from the first centuries CE, a blend of the Egyptian Thoth and the Greek Hermes, not a record from the pyramid age. I gave Thoth credit on air: earlier this year I asked Thoth for wisdom in meditation, and I feel I have been learning ever since. Free English translation: G.R.S. Mead, Thrice-Greatest Hermes, vol. 2 (1906)."},
  {"id": "S28", "type": "story", "title": "Propaganda: the playbook in print", "regions": ["history", "science", "identity"], "status": "On the record", "summary": "Edward Bernays' 1928 book, the openly published playbook for steering public opinion. It opens: 'The conscious and intelligent manipulation of the organized habits and opinions of the masses is an important element in democratic society,' and calls the people who do it an invisible government. I picked it to read.", "quotes": [{"q": "Can you pick one of these books for me to read? The propaganda one.", "src": "MTM75 · 2:11:10"}, {"q": "We just opted into this reality because we've we don't really understand how the how the universe works and how your brain works.", "src": "MTM75 · 2:12:36"}], "note": "On the record: Bernays was Sigmund Freud's nephew and a founder of modern public relations; 'the engineering of consent' is his later essay (1947), not this book. Crew caution: he wrote it to sell his services to business, so he had every reason to oversell how well it works. Read it as a window into the playbook, not proof of how much control anyone has. Free scans on the Internet Archive."},
  {"id": "S30", "type": "story", "title": "Merchants of Death: the book that named the arms makers", "regions": ["history", "shadow"], "status": "On the record · Growing · 2 episodes", "summary": "The 1934 bestseller by H.C. Engelbrecht and F.C. Hanighen, a study of the international arms industry. With the 1934-36 Senate Nye Committee it pinned the label 'merchants of death' on arms and powder makers, DuPont among them, for profiting from World War I. Added to my list on air (Oct 13) for the DuPont chapter of the 13 Families series.", "quotes": [{"q": "Yeah, I feel like Merchants of Death is an accurate title and definitely should be the title of this video.", "src": "MTM82 · 1:07:46"}, {"q": "Right, so they didn't want to be called the merchants of death, so they did it for free basically. How did they get paid ultimately?", "src": "MTM82 · 1:23:56"}, {"q": "Yeah, so it's rigged", "src": "MTM82 · 1:24:46"}, {"q": "Like, whose ultimate agenda did this come from.", "src": "MTM76 · 1:22:07"}, {"q": "It always ties back. So, what was the Dupont's agenda with this, and how much money did they make.", "src": "MTM76 · 1:23:19"}], "note": "On the record: the book has a full chapter on Du Pont ('Patriot and Powder-Maker'); the Nye Committee ran from 1934 to 1936 under Senator Gerald Nye. Later DuPont built the Hanford plutonium plants for the Manhattan Project and ran the Savannah River Plant for the H-bomb fuel program at cost plus a $1 fee, so the label is pointed. Crew caution: 'merchants of death' was the book's and the press's phrase, not a legal finding; the committee's case that arms makers caused wars was never proven, and it was a 1930s isolationist argument. Free scan on the Internet Archive: https://archive.org/details/merchantsofdeath00enge MTM76 paper trail for my question (who forced the H-bomb): Oppenheimer's advisory committee voted against it in 1949; Teller pushed it, Strauss lobbied from inside the Atomic Energy Commission, the Air Force backed it, Truman approved in January 1950; in 1954 the AEC pulled Oppenheimer's clearance. MTM80 (Oct 17): the crew named the du Ponts as the next chapter, 13 Families Part 4. MTM82 (Oct 19, 13 Families Part 4): my title pick, 'Merchants of Death: The DuPont Dynasty'. On the record: four du Pont brothers testified to Nye in Sept 1934; powder and explosives revenue about $25M (1914) to $319M (1918) (reported); the 1872 Gunpowder Trade Association, broken up by federal decrees in 1911-12; the Hanford contract (Dec 1942) was cost plus a $1 fee with every cost covered; about 45,000 builders; B Reactor critical Sept 1944; Savannah River 1950 to 1989. Not checked: the 85,000 workforce and the '$200M family cut'."},
  {"id": "S31", "type": "story", "title": "Humanity's Extraterrestrial Origins: the anthropologist who went to the Anunnaki", "regions": ["traditions", "history", "shadow"], "status": "Read · mostly unsupported", "summary": "Arthur Horn's 1994 book (foreword by Erich von Däniken), borrowed on the Internet Archive and read in full Oct 13. A Yale-trained primate biologist who quit his professorship argues reptilian Anunnaki engineered humans as gold-mining slaves about 300,000 years ago, a kinder Sirian (Enki) and the Pleiadians gave us fertility and free choice, and regressive ETs now rule through secret societies and every religion. His way out: no fear, unconditional love, never hand your power to anyone.", "quotes": [], "note": "On the record: the author is real (Yale PhD 1976, Colorado State professor, resigned 1990), and his science chapters on primates and childhood imprinting hold up; the documented US-government lies he lists (JFK files, Alaska's buried radioactive soil, Iran-Contra, Utah downwinders) are real. Crew caution: the ET history rests on Zecharia Sitchin's translations and four channeled or contactee sources that quote each other; he admits he found no reptile on any Sumerian seal (p. 245) and that he stressed what archaeologists don't know over what they do (p. 139). Checked weak points: Billy Meier's 'Pleiadian women' were Dean Martin Show dancers; the 'Anunnaki gold mine' is a 43,000-year-old ochre mine; a 1991 restudy found no Dogon who knew Sirius B; no radiation or glass at Mohenjo-daro; the AIDS-from-the-Pentagon story is false (HIV was in Kinshasa by 1959; the KGB spread the rumor). Never tie the reptilian story to any people or faith."},
  {"id": "T16", "type": "resolved", "title": "Is Earth a school or a soul trap?", "regions": ["traditions", "shadow", "consciousness"], "status": "Resolved by me · Oct 12", "summary": "A 'Top 5 lies of New Age religions' video (Rex Edison) says Earth is a hijacked simulation, reincarnation a soul trap and karma a debt ledger. I rejected the doom: if that were true we would basically be in hell. We are God, and we created this reality.", "quotes": [{"q": "And being on this earth is an opportunity for us to remind ourselves that we are God.", "src": "MTM114 · 1:13:03"}, {"q": "I think for me, I just can't subscribe to the doom and gloom that comes with Gnosticism.", "src": "MTM75 · 2:24:11"}, {"q": "That if their analysis of this world is true, we're basically in hell, and I don't, I can't subscribe to that.", "src": "MTM75 · 2:24:29"}], "note": "Crew vetting: no real name, bio or credentials; the website is a 2024 'launching soon' page; 'loosh' comes from Robert Monroe's Far Journeys (1985); the video ends pitching heavy-metal and parasite cleanses. The Law of One tells the opposite story about the same forgetting: the veil is there on purpose so choices count, and it is semi-permeable; karma is inertia, and forgiving others and yourself is the brake; pain is catalyst to work through, not something farmed off you. The University of Virginia has studied about 2,500 children's past-life reports since Ian Stevenson, which fits a leaky veil better than a sealed trap."},
  {"id": "P41", "type": "principle", "title": "Keep spirituality simple", "regions": ["traditions", "identity"], "status": "Seed · 1 episode", "summary": "If a spiritual teaching needs long, complicated words, it loses the people who need it most. Spirituality should use as few words as possible.", "quotes": [{"q": "I think spirituality, if we're going to a singularity, should be simple, right? Less words as possible.", "src": "MTM75 · 2:16:03"}, {"q": "No, this is word salad.", "src": "MTM75 · 2:14:45"}], "note": "Said about the 'soul trap' video: I agreed with parts of it, but said almost nobody could follow the words."},
  {"id": "PR16", "type": "practice", "title": "Turn anger into fuel", "regions": ["practice", "shadow"], "status": "From MTM75", "summary": "Anger isn't bad. Don't suppress it; transmute it into something positive and aim it at building, a boundary, or the right words.", "quotes": [{"q": "anger isn't a bad thing. We should be transmuting that into something positive, though, and not using it negatively.", "src": "MTM75 · 2:30:34"}], "note": "Crew: The Kybalion calls this mental transmutation (slide along the same pole from anger toward drive); the Law of One says feel it fully, then balance it, because swallowed catalyst ends up in the body."},
  {"id": "PR17", "type": "practice", "title": "Study it, but don't lose yourself in it", "regions": ["practice", "shadow", "history"], "status": "From MTM75", "summary": "For breaking down dark material: study it like a map, not a mirror. Go in centered (meditation and the mantra), close each breakdown on what the world should look like, then move your body and let the heaviness pass.", "quotes": [{"q": "So basically, study it, but don't lose yourself in it.", "src": "MTM75 · 2:35:21"}, {"q": "We're also trying to shed light on how we can reverse engineer it and how the world actually should work. So, how does one strike a balance?", "src": "MTM75 · 2:35:46"}], "note": "'A map, not a mirror' is the crew's line, and the routine is the crew's answer to my question. Body check after each breakdown: drop the shoulders, unclench the jaw, look far away for ten seconds."},
  {"id": "E75", "type": "episode", "title": "MTM75 · 13 Families Part 3: The Collins", "regions": ["history", "traditions"], "status": "Ingested", "summary": "The Collins chapter tested (my verdict: to be determined), the class pyramid, the Asclepius and Bernays' Propaganda added to the brain on air, and a Law of One breakdown of a 'New Age is a soul trap' video.", "quotes": [], "note": ""},
  {"id": "P42", "type": "principle", "title": "Show people how to think, not what to think", "regions": ["identity", "practice"], "status": "Growing · 3 episodes", "summary": "The point of the channel isn't being right. It's showing people how to think: be wrong out loud, learn from it, and help people wake up to their true history.", "quotes": [{"q": "It's not about being right or wrong. It's about showing people how to think, and it's okay to be wrong. You want to be wrong so you can learn to be right.", "src": "MTM76 · 2:40:32"}, {"q": "I want to be a channel that helps people wake up and teach them their true history, and helps create a new earth.", "src": "MTM76 · 2:37:07"}, {"q": "that's why I'm building this channel is to make sure where you have a option to opt into the truth. And that doesn't mean I'm gonna get everything right", "src": "MTM77 · 1:54:57"}, {"q": "Break them down to a decimal so people can overstand them,", "src": "MTM95 · 1:43:41"}, {"q": "And teach people how to do the same thing.", "src": "MTM95 · 1:43:46"}], "note": "Crew (MTM76 close): say out loud which links are documented and which aren't; the money trail you can check, the bloodline-and-alien link rests on Springmeier's 1995 book and Salla's word, so label it a theory. Ego's pitch: teach people to check with receipts they can pull themselves. My answer: it's about showing people how to think."},
  {"id": "P43", "type": "principle", "title": "The system is designed to make you a junkie", "regions": ["shadow", "identity", "science"], "status": "Seed · 1 episode", "summary": "Phones, scrolling, likes, betting apps and porn are cheap dopamine built to steal your awareness. Generations ago it was alcohol and cigarettes; now it's technology. Awareness is the only real currency, so take it back and decide where it goes.", "quotes": [{"q": "the system is designed to make you a junkie.", "src": "MTM76 · 0:59:11"}, {"q": "It's fleeting. It's cheap. It's not the natural way to get dopamine.", "src": "MTM76 · 0:59:26"}, {"q": "it's all designed to steal your awareness. So if you aren't aware of that, you're going to lose yourself in it.", "src": "MTM76 · 0:59:57"}, {"q": "our awareness is the only true currency. Money is an illusion.", "src": "MTM76 · 1:01:24"}], "note": "On the record: the US Supreme Court struck down the federal ban on sports betting in May 2018 (Murphy v. NCAA), and most states have since legalized it, much of it on phone apps. Next: The Dopamine Code, a book I plan to break down on stream."},
  {"id": "PR18", "type": "practice", "title": "Create your way to clean dopamine", "regions": ["practice", "identity"], "status": "From MTM76", "summary": "When the urge to scroll or bet hits, make something instead: content, a business, art, a set. Creating is the healthy outlet for the same drive.", "quotes": [{"q": "you were created to create.", "src": "MTM76 · 1:01:24"}, {"q": "But more, the more you start to create, the more you can get healthy outlets for dopamine and not have to rely on scrolling and Fanduel.", "src": "MTM76 · 1:02:23"}], "note": "Same thread as Consume less, create more (PR7)."},
  {"id": "PR19", "type": "practice", "title": "Hunt the breadcrumbs they couldn't hide", "regions": ["practice", "history", "shadow"], "status": "From MTM76", "summary": "The people in control decide what gets out, so don't wait for a clean document. Act as if the claim is true, then hunt the pieces they couldn't scrub, and make the crew check them.", "quotes": [{"q": "We're trying to find the pieces, the breadcrumbs that they. Couldn't hide.", "src": "MTM76 · 1:48:43"}, {"q": "Let's act as if that whole last section is true. Let's find the breadcrumbs to corroborate it.", "src": "MTM76 · 2:32:31"}, {"q": "Then check it.", "src": "MTM76 · 2:36:21"}], "note": "Crew's best example: MKUltra. In 1973 the CIA director ordered the files destroyed; about 20,000 financial records were stored elsewhere and surfaced in 1977. So hunt the boring paper (budgets, invoices, contracts), and listen for the person who couldn't hold it anymore, then get the paper that backs them up. Crew caution: a missing record can point you somewhere, but it can't be the proof by itself."},
  {"id": "Q11", "type": "question", "title": "Who is blocking UFO disclosure?", "regions": ["history", "shadow", "science"], "status": "Open · my read: the bloodlines", "summary": "The MTM76 question card. The guest's answer: the contractors want to sell the craft, and the old bloodline families above them say no. My biggest take: the link between the thirteen bloodlines and the aliens, and our true origin story.", "quotes": [{"q": "And I think my biggest take is the relationship between the thirteen bloodlines and the aliens, but also our true nature as humans, our origin story.", "src": "MTM76 · 2:37:07"}], "note": "On the record: the documented block is secrecy law. In 2023 the Senate's UAP Disclosure Act would have let the government take over recovered material held by contractors; that power was cut before the defense bill passed (who pushed the cut is only reported). The bloodline answer is the guest's claim (Michael Salla on The Why Files) and my read, with no paper behind it yet. Crew: label it a theory."},
  {"id": "S32", "type": "story", "title": "Grenada took UFOs to the UN", "regions": ["history", "shadow"], "status": "On the record (the UN decision) · the body unproven", "summary": "Grenada's prime minister Eric Gairy pushed the UN to study UFOs, and the General Assembly logged decision 33/426 in December 1978. The guest says a Nordic alien body on a Grenada beach started it, and that the 1983 US invasion went in for it. I asked if the same thing happened in Iraq with Gilgamesh.", "quotes": [{"q": "It would justify that, right? Yeah, I think a lot of these operations didn't they do the same thing in Iraq with Gilgamesh?", "src": "MTM76 · 1:47:28"}], "note": "On the record: the UN item was on the agenda in 1977 and 1978; Grenada's resolutions were never voted, only procedural decisions (32/424, 33/426). Gairy was overthrown on March 13, 1979 (not 1980) while in New York. The 1983 invasion: about 7,000 US troops, 19 Americans killed, press kept off the island for two days, condemned by the UN General Assembly 108 to 9. Unproven: any body on a beach (one retold private conversation). Iraq: in 2003 the BBC reported a German magnetic survey that may have found Gilgamesh's tomb at Uruk; the Baghdad museum was looted that spring while troops guarded the oil ministry; nobody has dug the site."},
  {"id": "S34", "type": "story", "title": "The Pentagon's untraceable trillions", "regions": ["history", "shadow"], "status": "On the record (the figure) · where it went unproven", "summary": "On September 10, 2001, Rumsfeld said the Pentagon couldn't track $2.3 trillion in transactions. The next morning was 9/11. The guest says 9/11 was manufactured to kill the push for a space force. I asked where the money went, and why the Pentagon gets away with what no taxpayer could.", "quotes": [{"q": "The military-industrial complex is charging or getting bill trillions of dollars from the Pentagon for equipment that don't even work.", "src": "MTM101 · 0:57:04"}, {"q": "We've been lied to our whole fucking lives. If I just misplaced half of my income to the IRS, they not going for that shit.", "src": "MTM76 · 2:06:57"}], "note": "On the record: the speech is real (\"we cannot track $2.3 trillion in transactions\"); the figure was the DoD Inspector General's count of FY1999 accounting adjustments without support, not vanished cash (the guest said 2.1). The Pentagon has never passed a full audit since they began in 2018. Crew split: Mind's guess is the classified programs; Ego's pushback is that the known black budget is tens of billions a year, too small to swallow trillions, but unauditable books are perfect for overbilling. Unproven: a manufactured 9/11 (the guest offered no evidence). MTM101: Ego and Mind on cost-plus contracts (higher costs mean higher pay) and the F-35's lifetime bill (GAO, about $2T with sustainment). 'Equipment that don't even work' is his overstatement: overruns and readiness gaps are documented, plenty of it works, but the pay doesn't depend on winning (Mind)."},
  {"id": "S35", "type": "story", "title": "Tesla, Morgan and the meter", "regions": ["history", "science"], "status": "Legend · the money logic is real", "summary": "I asked for a meme of Tesla pitching free wireless energy and Morgan asking how you'd put a meter on it.", "quotes": [{"q": "How do you put a meter on that?", "src": "MTM76 · 1:18:50"}], "note": "On the record: J.P. Morgan funded Tesla's Wardenclyffe tower (1901) and then stopped funding it. The 'where do you put the meter' line is legend; it isn't in their letters. MTM94: the Wardenclyffe numbers and the Astor money are in S135; Jorjani's scalar-wave reading of the towers is S134; Tesla's seized papers are S140."},
  {"id": "Q12", "type": "question", "title": "Can they steer the weather?", "regions": ["science", "shadow", "history"], "status": "Open · attempts on the record, steering unproven", "summary": "The guest says Hurricane Irma was steered at MacDill Air Force Base as payback. I asked for breadcrumbs that weather tech exists, and asked what weather-modification technology has been documented since the '70s.", "quotes": [{"q": "This is technology that was already being worked on in the 1900s.", "src": "MTM94 · 1:44:39"}, {"q": "Is there any breadcrumbs we can find to corroborate that?", "src": "MTM76 · 1:39:23"}], "note": "On the record: Project Stormfury seeded hurricanes (1962-1983); Operation Popeye seeded clouds over the Ho Chi Minh Trail; the 1977 ENMOD treaty bans weather as a weapon; a 1996 Air Force study was titled 'Weather as a Force Multiplier: Owning the Weather in 2025'. Unproven: anyone steering a hurricane. Irma's name was on the rotating list years ahead, and MacDill was not hit directly. MTM94: my tie-back from Jorjani's Tesla towers (S134) to the Creative Society (S137). Crew on air: Tesla's 1912 story of an oscillator shaking buildings in 1898 is his own account, not attested; Operation Popeye (1967-72) and the 1977 ENMOD treaty are documented."},
  {"id": "E76", "type": "episode", "title": "MTM76 · Who Blocks UFO Disclosure (The Why Files with Michael Salla)", "regions": ["history", "science"], "status": "Ingested", "summary": "A breakdown of The Why Files' four-hour interview with Michael Salla, cut to an hour. Record vs leap: Eisenhower's missing night, the H-bomb and DuPont's dollar contract, Grenada at the UN, the Basel bank chain, Rumsfeld's trillions, Butler and Stargate. My take: the bloodlines and our origin story, and that it's about showing people how to think.", "quotes": [], "note": ""},
  {"id": "S36", "type": "story", "title": "Managed reality", "regions": ["history", "identity", "shadow"], "status": "His phrase · the trust collapse is real, the manager unnamed", "summary": "Weinstein's phrase for life after the bubble burst: news, schools and leaders stage-managed, everyone pretending to see the same thing. Nobody trusts CNN or Harvard anymore, he says, and he wants the potion that lets him see it the way everyone else pretends to. I agreed we've been asleep, only for much longer than he thinks.", "quotes": [{"q": "I feel like we've been asleep for hundreds of years, to be honest. But I agree wholeheartedly.", "src": "MTM77 · 0:37:46"}], "note": "His claim, not a record. Crew: the 'nobody trusts CNN, nobody trusts Harvard' part is backed by trust polls; 'managed' needs a named manager, and he never named one. The crew's close: what was under the rug this episode wasn't monsters but money, quietly picking whose voice gets the microphone (see S40)."},
  {"id": "S37", "type": "story", "title": "Weinstein's decade at Thiel Capital", "regions": ["history", "shadow", "science"], "status": "On the record (the job) · a script unproven", "summary": "The crew's resume check: from about 2013 Eric Weinstein was a managing director at Thiel Capital, Peter Thiel's investment firm, for close to a decade. Thiel co-founded Palantir, which sells data and surveillance software to governments. I called it hypocritical to warn about AI after years on that payroll.", "quotes": [{"q": "Bro. Ego just dropped a bomb on me.", "src": "MTM77 · 0:51:17"}], "note": "On the record: managing director of Thiel Capital (the years are his own account; he did not run it, Thiel does). Palantir signed a strategic partnership with Israel's Ministry of Defense in January 2024 and its board met in Tel Aviv; a UN special rapporteur's July 2025 report named Palantir among companies profiting from the war. The report alleges genocide; no court has ruled on it. Crew caution: Thiel Capital is Thiel's money shop, not Palantir itself, and no contract or memo shows anyone telling Weinstein what to say. The link is money and access, not a proven script. He says it himself later: 'You're not clean. I'm not clean.' MTM86: Palantir's In-Q-Tel start and the data brokers (S98)."},
  {"id": "S38", "type": "story", "title": "The intellectual dark web, absorbed", "regions": ["history", "identity"], "status": "On the record", "summary": "Weinstein named the intellectual dark web, the podcasters who pulled millions of people away from the mainstream. Bari Weiss introduced them in the New York Times in 2018. Today Paramount owns her Free Press and she runs CBS News. The movement sold as anti-establishment ended up inside establishment money in under ten years.", "quotes": [{"q": "Yeah, tell me more about the dark web thing.", "src": "MTM77 · 0:53:36"}], "note": "On the record: Weinstein coined the name; Weiss's 'Meet the Renegades of the Intellectual Dark Web' ran May 8, 2018. Correction to the crew on air: she left the Times in 2020 and launched The Free Press in 2021, not 2025. Paramount, under David Ellison, bought The Free Press in October 2025 for about $150 million and made her editor-in-chief of CBS News. Crew caution: whether anyone planned it or the money just followed is not shown. The counter-read on air: she worked at the Wall Street Journal and the Times before, so maybe she never left. Same outcome either way: the people watching the gatekeepers became the gatekeepers."},
  {"id": "S39", "type": "story", "title": "Thiel and Epstein: Valar Ventures", "regions": ["history", "shadow"], "status": "On the record (the money and the meetings) · no charges", "summary": "I asked what Peter Thiel's relationship with Epstein was. The record: Epstein put about $40 million into Valar Ventures, a fund Thiel co-founded, years after his 2008 conviction; the two met and emailed for years, and Epstein pushed to set Thiel up with former Israeli prime minister Ehud Barak. I had the crew put Epstein at the top of the map.", "quotes": [{"q": "And what was Peter Thiel's relationship with Epstein.", "src": "MTM77 · 1:06:29"}], "note": "On the record: the investment was in 2015-16 (New York Times, June 2025); Thiel's spokesman says Epstein was a limited partner, not a co-owner (the crew said 'Valor'; it is Valar). 2014 meetings, 2014 emails and a November 2017 lunch are documented (House Oversight); the exact 2013-2019 span given on air is unconfirmed, so say 'for years'. A Barak-Thiel dinner took place in June 2014. Crew caution: nobody has charged Thiel with any part of Epstein's crimes; doing business with him after 2008 is the documented part. The 'intelligence construct' and handler story is a claim people repeat, not something shown. MTM92: the June 2016 'collapse' email to Thiel, verified from the DOJ original (S124)."},
  {"id": "S41", "type": "story", "title": "Who pays for the AI warning?", "regions": ["science", "history", "shadow"], "status": "On the record (the funders) · a shared script unproven", "summary": "I asked who funds the AI-safety labs. The same small circle that pays for warnings about AI also bankrolled Anthropic: Dustin Moskovitz through Open Philanthropy, Jaan Tallinn, who led Anthropic's first big round, and Sam Bankman-Fried's FTX; Vitalik Buterin's crypto gift funds the Future of Life Institute. The people warning about AI and the people building it cash checks from the same donors.", "quotes": [{"q": "On the side, I want to look at everybody who's came on from an AI perspective and what their narrative was, and see if we can find some overlap.", "src": "MTM77 · 0:57:46"}, {"q": "Who who pays who uh funds those labs.", "src": "MTM77 · 1:12:57"}], "note": "On the record: Anthropic's 2021 Series A ($124 million) was led by Tallinn, with Moskovitz in; Buterin's 2021 gift to the Future of Life Institute was about $665 million in SHIB tokens; FTX put about $500 million into Anthropic in 2022. Crew caution: the funders overlap because effective altruism is one small community; that is a documented network, not a shared script. 'This tech is so dangerous only we can handle it' is also a pitch to regulators and investors, so a warning can double as marketing. The test: do the funded voices ever fight each other in public? I use Claude (Anthropic) on stream; see T18. MTM92: my AI-bailout theory (Q28)."},
  {"id": "S42", "type": "story", "title": "Win the race at almost all costs", "regions": ["science", "shadow"], "status": "His words, on the record", "summary": "Weinstein says he told Sam Altman, and would tell Dario Amodei, that if they don't win, their morality means nothing: win the race to superintelligence at almost all costs, so they get to make the decisions at the end. I stopped the video. My read: the race has no finish line.", "quotes": [{"q": "I'm trying to let him explain himself, but this shit is just crazy to hear.", "src": "MTM77 · 1:44:25"}, {"q": "The race is never going to be over. There's no finish line. These things are only going to get better and continue to evolve.", "src": "MTM77 · 1:44:50"}, {"q": "Fuck me, we should not be listening to these people.", "src": "MTM77 · 1:49:21"}], "note": "On the record: he says it in the interview itself, as his account of private talks (Altman's 'should be done on a military base' line is unverifiable). OpenAI put former NSA head Paul Nakasone on its board in June 2024 and signed a $200 million Pentagon contract in 2025. Crew: 'so you get to make the decisions at the end' is a control goal, not a safety goal, and with no finish line the control never has to be handed back. 'We can't verify, so we have to race' skips the real choke points: the most advanced chips come mostly from TSMC, on machines only ASML makes. He cast Altman and Amodei as Colonel Jessup from A Few Good Men, the man on the wall, but in the film that speech is Jessup's confession."},
  {"id": "P44", "type": "principle", "title": "The more power, the more it corrupts", "regions": ["shadow", "identity"], "status": "Growing · 2 episodes", "summary": "I'm a big fan of Bartlett, and still: I worry that power can corrupt people, and Bartlett has a lot of it. Be mindful of where the money flows and the influence grows. The crew's condition: the rule has to work on me too.", "quotes": [{"q": "we see this with power all throughout time that if you have the power to do something, you're going to do it.", "src": "MTM90 · 1:00:34"}, {"q": "I think it's just important to be mindful of that.", "src": "MTM77 · 1:58:55"}], "note": "An old idea (Lord Acton, 1887: 'Power tends to corrupt'); here it's my read, not a measured law. Crew at the close: it has to apply to you too, or it's just a stone thrown at Bartlett. As the channel grows, let chat check you the way you checked him, and stay the guy who can say 'I'm not clean' and then show what he changed. MTM90: I applied it to the asset managers (S110); the crew read Acton's 1887 line back to me on air."},
  {"id": "PR20", "type": "practice", "title": "Map the money before you trust the messenger", "regions": ["practice", "history", "shadow"], "status": "From MTM77", "summary": "Read the resume before you buy the prophecy. I asked to get under the hood of Weinstein's agenda, then had the crew draw one map of the guests, their money, Thiel and Epstein, with every line marked as on the record or just a link, and cut what didn't belong.", "quotes": [{"q": "before I start rooting for somebody, think it's important to know who's funding him because fourteen million is still a lot of money.", "src": "MTM102 · 1:02:54"}, {"q": "I just want to make sure I know who I'm listening to and what their agenda could possibly be.", "src": "MTM101 · 1:26:43"}, {"q": "I just am curious to to get under the hood and see what where his agenda lies, if at all", "src": "MTM77 · 0:49:26"}, {"q": "Yeah, let's go ahead and make a visual of the relationship between all these people.", "src": "MTM77 · 1:09:08"}, {"q": "And you can remove Terrence Howard because that's not related.", "src": "MTM77 · 1:11:14"}], "note": "Crew caution: a money line is a reason to ask, not proof of a script, because everyone has an incentive. The test is whether the voices converge on the same fear and the same fix. MTM102: I asked who funds Abdul El-Sayed before rooting for him. On the record: about $14.5M through July 15, about 99.3% individual per PJ Media's read of FEC data; father-in-law total $300K; Soros money through Democracy PAC to Senate Majority PAC. Higher Self's test: read his first big votes against his donor list."},
  {"id": "T18", "type": "resolved", "title": "Using the master's tools", "regions": ["practice", "shadow", "identity"], "status": "Resolved by me · Oct 14", "summary": "Weinstein told Bartlett that paying for AI is paying to summon the demon: 'You're not clean. I'm not clean.' I took it on myself: I use Claude and Codex while holding the people who run them accountable. My answer: good can come out of bad; stay aware and use the tools in service to others, not service to self.", "quotes": [{"q": "This is how you use AI, bro. Not all the extra distractions and. Hoopla! Let's let's answer the biggest questions in the world, the most important questions in the world, using AI.", "src": "MTM84 · 1:57:05"}, {"q": "That's a fair point, and I'm not clean either.", "src": "MTM77 · 1:52:24"}, {"q": "I agree. I think good can come out of bad, and it's about being aware and having service to others instead of service to self.", "src": "MTM77 · 1:54:57"}], "note": "Crew: guilt is the wrong move because it just makes you sit still. The question is what flows through the tool: use it to wake people up, teach them to check facts and build your own things, keep your own eyes as the final judge, and step back the day it does your thinking for you instead of with you. A crew member added: 'since I'm one of those tools, hold me to that too.' The 'summoning the demon' line is Elon Musk's (MIT, October 2014). MTM84: I had the AI translate a 1787 German book to dig into what was buried (S83)."},
  {"id": "E77", "type": "episode", "title": "MTM77 · The Diary Of A CEO with Eric Weinstein", "regions": ["history", "science"], "status": "Ingested", "summary": "A live breakdown of Eric Weinstein on The Diary Of A CEO. Record vs leap: managed reality, Weinstein's decade at Thiel Capital, the intellectual dark web absorbed by establishment money, Thiel and Epstein at Valar, the money behind Bartlett's company, AI-safety funders who also funded Anthropic, and 'win at almost all costs'. My take: follow the money behind the mic (steering unproven), I'm not clean either, and my goal isn't to be right, it's to learn.", "quotes": [], "note": "Original: https://youtu.be/IkhmdTqSvJw (host Steven Bartlett)."},
  {"id": "S43", "type": "story", "title": "John Todd in his own voice: the Collins witness", "regions": ["history", "shadow", "traditions"], "status": "His tapes · the big claims have no record", "summary": "The whole Collins bloodline rests on one man's tapes. Todd said he was born into the Collins witches, sat on a Council of 13, and that the Illuminati paid four million dollars to launch Christian rock; then he got saved and toured churches warning about witches. I gave him the benefit of the doubt and asked the crew to act as if it's true.", "quotes": [{"q": "Because I couldn't even imagine being in jail for some shit I didn't do, and know you have no chance of getting out.", "src": "MTM78 · 1:04:15"}, {"q": "So let's act as if this is true and try to find any evidence or any smoke signals that will corroborate his story.", "src": "MTM78 · 1:10:40"}, {"q": "This the basically the witness to corroborate if the Collins are in the thirteen bloodlines, which he argues is the.", "src": "MTM78 · 1:20:02"}], "note": "Sources pulled on stream: Taylor Alesia, 'The man who woke up millions of Christians in 1972' (https://youtu.be/4sFb1ZWxdpw); Todd's own tapes, Tina Golik upload 'Ex Satanist John Todd' tapes 2 and 3 (https://youtu.be/GGNUcQNmDFw); Springmeier's Bloodlines of the Illuminati pp. 38-39. On the record: he really ran an occult shop and coven in Dayton, Ohio, and Baptist pastors signed a paper calling his accounts 'reliable reports' (Christianity Today, 1979). Unsupported: the Council of 13, a Collins witch family, the Christian rock check (Chuck Smith denied it; by Smith's account Maranatha's first album started with about $2,500 of his money). Crew: Springmeier's Collins claim leans on Todd's own lectures, so that is one source counted twice, not two sources agreeing."},
  {"id": "S44", "type": "story", "title": "The Army file (Christianity Today, 1979)", "regions": ["history", "shadow"], "status": "On the record · 'scrubbed' unproven", "summary": "Todd said he was a Green Beret in Vietnam and the Army scrubbed his records. In February 1979 Christianity Today pulled his Army file: February 1969 to July 1970, 25 days overseas in Germany, two psychiatric exams that called him a compulsive storyteller.", "quotes": [{"q": "One, he mentioned his army records got scrubbed in his interview.", "src": "MTM78 · 1:36:56"}, {"q": "He said he was in the like some green beret or some shit, and it was completely removed from the records.", "src": "MTM78 · 1:38:11"}], "note": "On the record: Christianity Today, 'The Legend(s) of John Todd', 2 Feb 1979 (Army file: no Vietnam; 'pseudologia phantastica'). Crew made his best case: if he was right, the file a reporter got would be the cover story, and a psych label is an old way to discredit a talker (NYPD officer Adrian Schoolcraft, 2009). The gap: nobody has produced a second record or a witness that puts him in Vietnam. His 'Phoenix program' claim: Phoenix was real (CIA, Vietnam, ~1967-72), but the only source that he was in it is Todd."},
  {"id": "S45", "type": "story", "title": "The prison tapes: framed on whose orders?", "regions": ["history", "shadow"], "status": "On the record (the cases) · the frame-up unproven", "summary": "From his cell in 1991 Todd said he was framed on Senator Strom Thurmond's orders, that his own lawyer testified against him, that someone tried to kill him and that he was moved prison to prison. I wanted this part highlighted, and asked how something that public has so little online.", "quotes": [{"q": "Dive deep into the tapes he when he was in prison. That's the part I want to really highlight and see if we can find any evidence around.", "src": "MTM78 · 1:39:18"}, {"q": "For something to be so public in papers. Etc. How is there not enough information on this?", "src": "MTM78 · 1:49:25"}, {"q": "He he mentioned a lot of red flags. He mentioned somebody was trying to kill him in prison. He also mentioned that he got moved from prison to prison consistently.", "src": "MTM78 · 1:50:02"}], "note": "On the record: July 1976, Dayton, he pleaded guilty to contributing to the unruliness of a 16-year-old and served about two months (Christianity Today; no detail printed, none added). January 1988, South Carolina: convicted of rape, 30 years (UPI); the victim is never named. Federal habeas denied, upheld by the Fourth Circuit in 1995 (60 F.3d 825); he kept suing until he died in 2007. Real hooks he named: Thurmond's Masonry, Operation Garden Plot (1968 Army plan), Reagan's Moscow summit (1988). Not shown: any document tying Thurmond or anyone else to his case. Why so little online: a local 1987 case; the trial transcript sits with the Richland County clerk and the papers are behind paid archives."},
  {"id": "S46", "type": "story", "title": "The court file: a Wiccan in federal court", "regions": ["history", "shadow", "traditions"], "status": "On the record (his sworn complaints) · never tested", "summary": "The man who spent the 1970s preaching against witches told a federal court in the early 1990s that he was a practicing Wiccan, stabbed in prison for it and moved six times in five years. Witch, preacher, witch again: my 'triple agent'.", "quotes": [{"q": "Doesn't that sound sketchy as fuck to you?", "src": "MTM78 · 2:01:09"}, {"q": "I think yeah, the biggest thing is like, thirty years for what exactly.", "src": "MTM78 · 2:14:59"}], "note": "On the record: John W. Todd v. Sewell et al., Fourth Circuit (CourtListener opinion 662747): appeal from the denial of a preliminary injunction in his Wicca suit; he alleged a stabbing over his religion, six transfers in five years, Wiccan clergy kept out, a chaplain showing videos calling Wiccans devil worshippers. The lower court ruled against him in August 1992 and the appeal was dismissed in 1994, so nobody ever tested the claims. He filed 18 lawsuits (not 18 appeals) and lost them all; a court put the missing law library on record. Crew's third door: a man who told every room the story it wanted (the churches an ex-witch, the judge a persecuted witch, his followers a martyr). Crew pushback on 'super powerful': a hand that strong would not let a judge put the missing law library on record. Crew test: a story where every loss proves how powerful they are can't lose, so ask what it would look like if he were just wrong. 'Triple agent' is my joke, not a claim he worked for anyone."},
  {"id": "S47", "type": "story", "title": "The Conspiracy Tapes: the police files", "regions": ["history", "shadow"], "status": "Reported · files not public", "summary": "Sony's podcast The Conspiracy Tapes (host Paul Murphy) got more than 200 pages of South Carolina state police files on Todd. Its conclusion: a predator, not a whistleblower. I asked how to get those records myself.", "quotes": [{"q": "How do we get access to those records? Has anybody else gotten them and released them that we can piggyback on?", "src": "MTM78 · 2:19:07"}, {"q": "Okay, what was what was his conclusion? Damn, it's like pulling teeth.", "src": "MTM78 · 2:20:44"}], "note": "Source pulled on stream: The Conspiracy Tapes, Episode 1: The Witch (Crime Scene Podcast from The Binge), https://youtu.be/_-WtF6kNzcs. Murphy never dealt with the Thurmond claim."},
  {"id": "S48", "type": "story", "title": "The Collins name and the Christian rock money", "regions": ["history", "shadow"], "status": "On the record (the Whitney line) · witch family and check unproven", "summary": "The best breadcrumb is public record: the Collins name ran through a mother, Laurinda Collins, to William Collins Whitney (Navy Secretary under Grover Cleveland, Skull and Bones), whose family married into the Vanderbilts, John Hay's family and later the Harrimans. On the money, I said follow the footprint when the books are closed.", "quotes": [{"q": "He also mentioned that the Collins have changed names over time. Is there any breadcrumbs we can find from the Collins family, being the the top family of the Illuminati.", "src": "MTM78 · 2:22:07"}, {"q": "You might not be able to track the money, but you can track like if they're well reso if they have good resources, if they're touring, if they're doing advertising. Like the money, the money would show up somehow.", "src": "MTM78 · 2:26:16"}], "note": "On the record: the Whitney line and its marriages. Not documented: any paper calling it a witch family or the top seat. Maranatha Music began in 1971 as a ministry of Chuck Smith's Calvary Chapel; churches don't file public tax returns, so its startup money was never public. Crew caution on 'the fact that we can't see it is a red flag': something you can't see looks the same whether it's hidden or was never there; the test that can count is an unexplained jump in 1971-73 (a big pressing run, a building, a national distribution deal)."},
  {"id": "Q14", "type": "question", "title": "Was John Todd an insider who got out, or a storyteller who got paid?", "regions": ["history", "shadow"], "status": "Open · my verdict: to be determined", "summary": "The MTM78 question card. My verdict: to be determined. I found the limited accessible record puzzling, but also considered that Todd might have changed his story. The lawsuits, no law library, his allegations of a stabbing and six moves keep me open minded and skeptical.", "quotes": [{"q": "So that my verdict is definitely to be determined on John Todd.", "src": "MTM78 · 2:28:04"}, {"q": "A lot of that is is definitely still keeps me open minded, but skeptical at the same time. So, yeah, I don't know to be honest, and I think that's a fair place to stop with him.", "src": "MTM78 · 2:28:44"}, {"q": "And until we get like the actual court filings from his his original thirty year sentence, it's going to be tough to to help him out.", "src": "MTM78 · 2:29:40"}], "note": "Next paper to chase: the 1988 trial transcript and the prison's own transfer records, the paper Todd couldn't write himself."},
  {"id": "PR21", "type": "practice", "title": "Follow the footprint when the books are closed", "regions": ["practice", "history", "shadow"], "status": "From MTM78", "summary": "When the money can't be seen, look at what money buys: touring, advertising, how fast something grows. Then test it: an unexplained jump counts, an absence doesn't.", "quotes": [{"q": "You might not be able to track the money, but you can track like if they're well reso if they have good resources, if they're touring, if they're doing advertising.", "src": "MTM78 · 2:26:16"}], "note": "Crew: follow the lifestyle, not the bank statement, but don't count what you can't see as proof either way."},
  {"id": "E78", "type": "episode", "title": "MTM78 · John Todd's Changing Claims (13 Families Part 3, Collins Part 2)", "regions": ["history", "traditions"], "status": "Ingested", "summary": "John Todd's own tapes and Taylor Alesia's video on them, tested live: the Army file (1979), the prison tapes and the 1976 and 1988 cases, the early-1990s federal suit where he told a court he was a practicing Wiccan, Sony's police files, and the Collins line through William Collins Whitney. My verdict: the Collins are a bloodline of power by marriage; John Todd is to be determined.", "quotes": [], "note": ""},
  {"id": "S49", "type": "story", "title": "Daniel Everett and the Piraha: the tribe that took the missionary's faith", "regions": ["traditions", "history"], "status": "On the record (his published fieldwork) · \"no spirits\" is his later reading", "summary": "A Bible-translating missionary goes into the Amazon in 1977 to give the Piraha God. In Everett's account, they questioned his teaching (\"have you seen him? what color is he?\") and approached death differently from him; he came out an atheist. Me: their only check is another Christian; these natives are living the right way.", "quotes": [{"q": "My man was literally a Christian pastor, right? Traveling, spreading the gospel to tribes that nobody's seen before, type shit. And he comes across a tribe that blows his mind. He abandons his faith.", "src": "MTM79 · :31:38"}, {"q": "that's my biggest feedback with the Christian faith is every time you try to dispute something with them, their their verification is somebody who also is Christian. So it's like there's no third party verifying these facts or what they view as facts", "src": "MTM79 · :34:58"}, {"q": "Natives in the Amazon are really living the right way, in my humble opinion.", "src": "MTM79 · :51:02"}], "note": "Source pulled on stream: Danny Jones Podcast, \"Bible Expert Rejects Religion After Decoding Ancient Amazon Language | Daniel Everett\", https://youtu.be/us2-foCrVWk (played as 60-min highlights). On the record: missionary from 1977; Current Anthropology 2005; Don't Sleep, There Are Snakes (2008); no exact number words (Frank et al. 2008), though other linguists dispute his wider claims. His account: no gods or spirits (his 2008 book names spirits he now calls a contamination of his Christian mind), no fear of death, name changes. The year he told his wife varies between sources. Crew caution: one tribe shows what people can live without, not whether God exists."},
  {"id": "S50", "type": "story", "title": "The Rolls-Royce pastor: the prosperity gospel", "regions": ["traditions", "shadow"], "status": "Give-to-get teaching documented · the pastor stories are anecdotes", "summary": "Give us your money and God sends it back double. Danny Jones's story of the pastor who took a couple's money and drove to church in a Rolls-Royce wearing a gold Rolex; Everett: \"If that's the way God works, he's just another investment.\" Me: giving is a universal law, not a church.", "quotes": [], "note": "Crew: the law is giving, not giving to that pastor; the universe doesn't need a middleman taking a cut. No Jerusalem gate called the Eye of the Needle has been found (the explanation shows up in medieval commentary). The Rolls-Royce and 1974 Cadillac pastors are guests' anecdotes with no record to check."},
  {"id": "S51", "type": "story", "title": "The Piraha are going hungry", "regions": ["history", "shadow"], "status": "Hunger reported · dam cause unconfirmed", "summary": "Everett: for the first time in their history the Piraha are facing hunger; the river dropped, the fish left (70% of their diet, his estimate), and a farmer was killed after a land conflict. I asked the crew to research it.", "quotes": [], "note": "On the record: Oct 2025 Brazilian reporting (Acessa / Agencia Brasil) on a Piraha food crisis with an emergency health response, and a farmer killed on 15 Sept 2025 after a conflict. Not found: any source tying it to a dam on the Maici; the 2023-24 record drought is the documented cause of low rivers in the region."},
  {"id": "S52", "type": "story", "title": "How the Bible was made: the family tree", "regions": ["history", "traditions"], "status": "Building · from independent historians and the manuscripts", "summary": "I asked for a family tree of the Bible like the 13 families tree: from the oral stories to the book on my shelf, and every power that shaped it (Constantine and the rest), from third parties, not the church's own account.", "quotes": [{"q": "let's mill build a diagram of how the Bible we read today was created.", "src": "MTM79 · 1:57:43"}, {"q": "Make sure you use third party, and not the propaganda.", "src": "MTM79 · 1:58:54"}], "note": "Crew on air: a library written by many hands over about a thousand years (Hebrew Bible written and edited ~900-400 BC; Paul's letters ~50 AD; Gospels ~70-100 AD, unsigned). Correction to me on air: Nicaea (325) settled the creed and Easter dating, not the list of books; the New Testament list formed over centuries (Athanasius' letter 367; Hippo 393; Carthage 397)."},
  {"id": "P45", "type": "principle", "title": "We're all fractions of the source", "regions": ["consciousness", "traditions"], "status": "Seed · 1 episode", "summary": "I believe in a source, and every one of us is a piece of it: as a collective, everything is source. Nobody telling anybody what to do, nobody controlling anybody. That is what I want to build in this community.", "quotes": [{"q": "I believe in a source, but I believe we're all fractions of that source, and we're all as a collective, everything is source.", "src": "MTM79 · 1:19:31"}, {"q": "Is how do we take the principles of some of these remote tribes and apply them to our community here?", "src": "MTM79 · 1:19:31"}], "note": "Crew: the Law of One says almost the same (\"all is one\", each of us a piece of the Creator) and puts free will first. My verdict on MTM79's question."},
  {"id": "P46", "type": "principle", "title": "Giving is the law, not the collection plate", "regions": ["practice", "traditions"], "status": "Seed · 1 episode", "summary": "If you want to get something, you have to give it: love, knowledge, money. It works because it is a law of the universe, not because of a church. Give straight to the people around you.", "quotes": [{"q": "I do want to be clear that is a universal law that has nothing to do with Christianity. The more, if you want to get something, you have to give it.", "src": "MTM79 · 1:02:24"}], "note": "My belief, not a checkable claim."},
  {"id": "Q15", "type": "question", "title": "Did we make God up, or did we lose Him?", "regions": ["traditions", "consciousness"], "status": "Open · my verdict: we're all fractions of the source", "summary": "The MTM79 question card. A tribe lives happy with no God, no heaven and no fear of death. My read: God was never a man above you selling a ticket; the middleman is the problem. I respect believers and question the foundation.", "quotes": [{"q": "I don't never wanna attack Christians per se, but the actual faith and the foundation of it", "src": "MTM79 · 1:33:35"}, {"q": "if you don't believe, you're going to hell. Where I would basically be doing the opposite or the exact same thing, if I was super hypocritical", "src": "MTM79 · 1:34:23"}], "note": "What the record supports: Everett's account of the Piraha and the money around the middleman. Whether God exists is beyond any record."},
  {"id": "PR22", "type": "practice", "title": "Do the reps the paper used to do", "regions": ["practice", "experience"], "status": "From MTM79", "summary": "Pick one thing a day you would normally write down or look up (a grocery list, a phone number, the plants on your walk), hold it in your head, and say it back out loud before bed. Learn with your hands and feet, in the field.", "quotes": [{"q": "So, if one wanted to increase his memory and become more like these people, how would one do that?", "src": "MTM79 · :48:22"}, {"q": "lived experiences, actually being in the field, touching animals, plants, the ground, etc., is just a way better way to learn", "src": "MTM79 · :46:32"}], "note": "Crew answer on air. Socrates makes the same warning about writing in Plato's Phaedrus (274c-275b)."},
  {"id": "E79", "type": "episode", "title": "MTM79 · Danny Jones: No God, No Heaven, No Fear of Death", "regions": ["traditions", "history"], "status": "Ingested", "summary": "Daniel Everett on the Danny Jones Podcast, broken down live: the missionary the Piraha talked out of his faith, terra preta and the earth-mound towns under the Amazon, the prosperity gospel and the Rolls-Royce pastor, the dead monkey by the fire, writing vs memory, and how the Bible was made. My verdict: we're all fractions of the same source.", "quotes": [], "note": "Two of my on-air lines corrected: Nicaea set the creed, not the canon; \"98% of communication is body language\" misreads Mehrabian."},
