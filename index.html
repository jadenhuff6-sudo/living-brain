  {"id": "Q20", "type": "question", "title": "Were the COVID vaccines part of population control?", "regions": ["science", "shadow", "history"], "status": "Open · intent unproven · no fertility effect found", "summary": "My first thought after NSSM 200. What's real: Gates's 2010 TED line that new vaccines, health care and reproductive services could lower population growth 'by perhaps 10 or 15 percent'; the FDA's 2021 heart-inflammation warning; short menstrual changes; the makers' PREP Act liability shield; WHO-backed anti-fertility hCG vaccine research in the 1970s-90s; real birth dips in 2022. What isn't shown: that the shots lowered births (large individual-level studies in Sweden, the US and the Nordic registries find no effect) or that anyone meant them to.", "quotes": [{"q": "my first thought of mine was like COVID, and the negative impacts of the vaccines they gave us, any relation to this, or connection between COVID vaccine, the COVID vaccines, and population control.", "src": "MTM84 · 2:22:53"}, {"q": "Why would Bill Gates be talking about population control, though? Or saying as we get healthier, we're gonna want to have less kids? Well, how does that even make sense.", "src": "MTM84 · 2:26:06"}], "note": "The crew's answer to the Gates question: his stated logic is the demographic transition; when more children survive, families choose to have fewer. Crew caution: no document, regulator finding or court ruling shows depopulation intent; a 2025 Czech paper suggesting an effect calls itself preliminary. Factual reporting, not medical advice. Ties to Q17 (COVID, Epstein and the bloodlines) and S67. Source: https://www.ted.com/talks/bill_gates_innovating_to_zero"},
  {"id": "P53", "type": "principle", "title": "Control the population, control who stays in power", "regions": ["shadow", "history"], "status": "Seed · my MTM84 theory", "summary": "My theory and biggest takeaway: control the population and you control who stays in power. That's why they worried about poorer regions growing too fast: with too many people there, they can't take over the resources. I raised a possible depopulation plan, but the documents cited here do not show one.", "quotes": [{"q": "So here's my theory: control the population, you can control. Who stays in power, and you can keep your power in place.", "src": "MTM84 · 2:27:45"}, {"q": "Exactly why they were concerned about some of these less developed regions getting too much population, because if they have too much people, they can't take over their their resources at the end of the day. So that's my biggest takeaway.", "src": "MTM84 · 2:27:45"}], "note": "My theory, labelled as mine. What backs the resource half: NSSM 200 ties birth rates abroad to US access to minerals (pp. 42-43) and names 13 priority countries (S84); the coercive programs of that era are on record (S85). Crew caution: no document shows a plan to kill or cull anyone; Springmeier's '65 million Americans by 2025' came from a private website's failed forecast, not the CIA; Alternative 3 is a TV hoax. The documents show leaders planning birth rates and the optics, not a kill order. Pairs with P47 (they create the demand) and P24 (fear as the lever)."},
  {"id": "PR26", "type": "practice", "title": "Follow the money and the influence, not the last name", "regions": ["practice", "history"], "status": "Seed · from MTM84", "summary": "My method from the Freeman episode: a surname is a costume. People change names and marry into families, and the book bounced from one Freeman to the next just following the name. Instead, map who someone sat with, who paid whom and who appointed them, and connect the dots that way. First run: the Gaylord Freeman map (S81).", "quotes": [{"q": "Freemans are are tough to pin down because it's such a common name, and you have people changing their name to Freeman.", "src": "MTM84 · 1:43:20"}, {"q": "Who who he's his network looks like, who he's connected to, his bloodline, and try to connect the dots that way instead of just focusing on last names, because people are changing them frequently.", "src": "MTM84 · 2:14:00"}, {"q": "Whereas me, I want to follow the money and the influence.", "src": "MTM84 · 2:14:00"}], "note": "The crew's rule for the map: label each link by kind (money, seat, appointment, same room, family); only money, seats and appointments show influence, and same room shows access. From the book itself: it admits there are 'different unrelated family lines' named Freeman (p. 67); Roger Freeman was born Freimann, and many freed Black Americans chose the name. Pairs with PR19 (hunt the breadcrumbs), PR25 (pull the raw data) and P44 (where the money flows). MTM102: his line that the Rothschilds created the central banks was corrected on air. Higher Self: it's a club of bankers, not one bloodline. Bank of England 1694; the Fed plan drafted at Jekyll Island, 1910; Argentina's central bank (1935) from Sir Otto Niemeyer's Bank of England mission. See P86."},
  {"id": "T19", "type": "tension", "title": "No record: does it count against the claim?", "regions": ["identity", "history"], "status": "Open", "summary": "I hold two things. A missing record doesn't prove two Freemans aren't related, and a list page reported to be in the Epstein files, plus Springmeier's prison time, read to me as breadcrumbs. The crew's line, the same as with the Collins: a gap can point you somewhere, but it can't be the proof, or no missing record could ever count against a claim. My own way through on this episode: follow the money, where the paper exists (PR26).", "quotes": [{"q": "But we can't assume that they're not related just because we don't have evidence.", "src": "MTM84 · 1:19:34"}, {"q": "In fact, it is a breadcrumb in and of itself.", "src": "MTM84 · 2:12:56"}, {"q": "All of that leads me to believe he was onto something.", "src": "MTM84 · 2:12:56"}], "note": "On the record: a federal jury convicted Springmeier in 2003 of armed bank robbery (aiding and abetting a 1997 Oregon robbery); the Ninth Circuit upheld it and he was released in 2011. He says he was framed; no court agreed. The Epstein-files page (a 2008 copy of his family list, EFTA01082667) is reported but not yet verified by the crew; even if it's there, it shows the list circulated, not that it's true."},
  {"id": "E84", "type": "episode", "title": "MTM84 · 13 Families Part 5: The Freemans", "regions": ["history", "shadow", "traditions"], "status": "Ingested", "summary": "The Freeman chapter of Springmeier's Bloodlines of the Illuminati, checked claim by claim with clips: Walter Freeman's lobotomies, the Priory of Sion legend (Lincoln's 1974 BBC film), Gaylord Freeman as its 'grand master', Unity's James Dillet Freeman and the poem on Apollo 15, Orville Freeman and Mondale, a Freeman in Skull and Bones, Goldman's Robert Freeman. The keystone broke (the signatures came from a bank report), so I followed the money instead: the Fed council with Rockefeller, Sindona and the Vatican bank, then Springmeier's depopulation talk into NSSM 200 and the COVID question. The records establish Gaylord's access to powerful people, not Illuminati membership. My theory: control the population, control who stays in power.", "quotes": [], "note": "Live research pulled in: Newton's alchemy papers, Holy Blood Holy Grail, the Weishaupt and Engel books (translated), the Gaylord money map, Sindona and P2, NSSM 200 and the sterilization record, the COVID brief. Corrections carried: Freeman never won a Nobel (Moniz did); about 3,500 lobotomies, not 40,000; the Priory's papers start in 1956; Arcadia is a Greek region, not the word for paradise; NSSM 200 was released in 1989, not 1980; the BIS doesn't print money; Springmeier said 'cabal' (a secret faction), not Kabbalah, so nothing here frames Jews or Judaism as running anything (P34)."},
  {"id": "P54", "type": "principle", "title": "Work is a vehicle, not my identity", "regions": ["identity", "practice"], "status": "Seed · my MTM85 mandate", "summary": "One of the mandates I rebuilt from my own journals. I grind for time with my family, sovereignty and freedom, and I can get so lost chasing it that I forget to be present and have fun, which was the whole reason. I still have bills; work is how you operate in the Matrix without losing myself in it.", "quotes": [{"q": "Work is the vehicle, not my identity. So for me, it's just about. This is like how you operate in the matrix without losing yourself in it.", "src": "MTM85 · 0:53:06"}, {"q": "You're usually grinding to accomplish spending more time with your family, having more sovereignty, freedom, financial freedom, whatever it looks like. But you can get lost so much striving for that, you forget to be present, have fun, and ultimately, that's the whole. Reason why you're chasing those things, anyways.", "src": "MTM85 · 0:53:06"}], "note": "Sits with the other mandates in my Nexus app (family gets my best, not my leftovers; ground before grind; respond from awareness, not ego; focus on being, not wanting). Pairs with P27 (convenience became slavery) and PR27 (center, choose, act, release)."},
  {"id": "PR27", "type": "practice", "title": "Center, choose, act, release", "regions": ["practice", "identity"], "status": "Seed · from MTM85", "summary": "My process for everything: calm my mind, choose who I'm being, take the next right action, and let go of the outcome. Built into the Nexus app's mandates.", "quotes": [{"q": "Center, choose, act, release. So this is really my process for everything I should be doing. It's about calming your mind, choosing who you're being, take the next right action, and let go of the outcome.", "src": "MTM85 · 0:56:01"}], "note": "My anchor under the mandates is Thomas Campbell's 'lower your entropy' (My Big TOE), done through love; that's Campbell's theory, not physics' use of the word. Pairs with P54 and P22 (stay a student)."},
  {"id": "P55", "type": "principle", "title": "Everything's free: build community, not money", "regions": ["identity", "practice"], "status": "Growing · 2 episodes", "summary": "My new wave: the Nexus app is free and open source under the MIT license. The goal is to become the best version of yourself and help the people around you do the same, and you don't need money for that. We were created by God to create.", "quotes": [{"q": "Yeah, the key here would be everything's free. Everything is about transferring frequency and building community.", "src": "MTM91 · 1:43:55"}, {"q": "So this going to be my new wave. Is everything's free. The goal is to build a community, not make money.", "src": "MTM85 · 1:06:09"}, {"q": "The goal is to become the best version of yourself and help the people around you do the same thing. I don't need money to accomplish that. I could just be that already.", "src": "MTM85 · 0:56:56"}, {"q": "We, We're created by God to create, and what you realize is when you're not creating, you're out of alignment", "src": "MTM85 · 0:59:19"}], "note": "Pairs with P28 (be the creator with AI), PR18 (create your way to clean dopamine) and P14 (we create reality, together). MTM91: the same rule applied to my free AI lab for the higher self (P62)."},
  {"id": "E85", "type": "episode", "title": "MTM85 · Everything's free: the crew, the app and the brain", "regions": ["practice", "identity"], "status": "Ingested", "summary": "A short show (the Kennedy breakdown moved to the next one). I walked through what the crew built and what goes free: five co-hosts on one mind, the memory vault, the video pipeline from Kick to four channels, the daily mantra lane, where a human still matters (titles and thumbnails), the five avatars trained on the Law of One to question everything, the Nexus app and the mandates I rebuilt from my journals, and this living brain. My close: everything's free, build a community, not money; we are all creators.", "quotes": [], "note": "Grew P27 and P28."},
  {"id": "S93", "type": "story", "title": "The Secret School of Wisdom: the order's rituals in English (2015)", "regions": ["history", "traditions"], "status": "On the record (the book exists) · primary text not independently checked", "summary": "The video's source for the 1783 statutes and the grade rituals: Josef Wäges and Reinhard Markner (eds.), The Secret School of Wisdom: The Authentic Rituals and Doctrines of the Illuminati (Lewis Masonic, 2015), the first English edition of the order's own rule texts. The title is the order's own phrase, 'secret schools of wisdom'. The video says every quote from the Minerval statutes on comes from it.", "quotes": [], "note": "On the record: the book and its editors are real (ISBN 978-0-85318-493-5, translated by Jeva Singh-Anand; reviewed in the Journal for Research into Freemasonry and Fraternalism 6(1)). Crew caution: we have not opened a copy, so the video's statute numbers (25, 30, 31, 34) and the 'invisible tool' and 'three good men' lines are not yet checked against it, and they are not in the 1787 seized papers we did open (S90). Source: https://openlibrary.org/isbn/9780853184935"},
  {"id": "S94", "type": "story", "title": "Sean Clayton: the Illuminati as a method, not a club", "regions": ["history", "shadow", "traditions"], "status": "His reading · the history mostly holds, three dates wrong", "summary": "The video I broke down on MTM86, 'The Secret Society Is Hiding Something Disturbing' (26 min). His point: the order was never the point, the method was. He walks the ladder grade by grade (the Minerval room and its owl, the borrowed name, the notebook on everyone, the oath, the 'invisible tool', the life story checked against the order's file, the priest grade, the Magus and the King), argues the method outlived the 1785 ban through reading societies and fronts, and reads the order's spiritual core kindly: know thyself, change three people, and the missing feminine side.", "quotes": [{"q": "So, one of the guys I follow put out a good video that I wanted to break down, or at least watch with y'all.", "src": "MTM86 · 0:27:12"}], "note": "On the record: founded 1 May 1776 by Weishaupt, a Jesuit-schooled canon-law professor at Ingolstadt; banned by the edicts of 1784-85 (the 2 March 1785 edict named it); Zwack's papers seized at Landshut in October 1786 and printed in 1787; Quibus Licet reports are described by Robison and Barruel (1797). Corrections: Weishaupt fled in February 1785, not 'in disguise in 1786', and settled in Gotha in 1787; the order took the Illuminati name in 1778, the same year as the Zwack letter, not two years later; Barruel's book is 1797, not 1789; Berlin's 'Swedish Chest' is Bode's archive, not the state commission's files; 'a few hundred men at most' is too low (about 1,300-2,000 at the peak). Misleading: the 'concealment' and 'reading societies' lines are real but come from the order's 1780s instructions as quoted by Robison, not from the 1790 Pythagoras, which was printed openly. Crew caution: the Magus-to-MAGA link is his own wordplay with no line back to the order; INRI as the priest-grade code word and Skull and Bones adopting the order's methods have no source we found; the 'Abbot Waldeck' history is unverifiable (S92). Source: https://youtu.be/f0Y9yr-QNw4"},
  {"id": "S95", "type": "story", "title": "The file is the ladder: climbing meant handing over dirt", "regions": ["history", "shadow"], "status": "On the record (the member files and self-reports) · staged traps not in the papers", "summary": "The notebook step. A new member kept notes on the weak spots, money and passions of everyone he met, family included, and turned them in; climbing meant writing more, including sealed reports on himself (Quibus Licet, 'to whom it is permitted') sent up to superiors he never met. My read: rising required handing over information that could be used against you. The crew's: nobody feels blackmailed, they feel promoted, and nobody leaks on the boss holding their file.", "quotes": [{"q": "How do you build a strategy that's so organized, so sophisticated for something like that?", "src": "MTM86 · 0:46:12"}, {"q": "And now it's just it's making it clear.", "src": "MTM86 · 0:46:12"}], "note": "On the record: the 1787 seized papers print the member sheets (noting 'especially the smallest' acts, 'when the person does not think he is being watched') and the monthly reports, which Weishaupt called 'for us exactly what confession was for the Jesuits' (S90); Quibus Licet letters are described by Robison and Barruel (1797). Crew caution: the papers show files and self-reports, not staged compromising situations; that part is my inference, and the Epstein parallel (S25) is a pattern, not a line. The why, per the crew: a secret group can't sue anyone or call the police, so files keep people quiet."},
  {"id": "S96", "type": "story", "title": "The Jesuit machine, the Templars and the Pope", "regions": ["history", "traditions", "shadow"], "status": "On the record (the dates) · \"broke away\" is half right", "summary": "Weishaupt was schooled by the Jesuits and built his order on their frame (ranks, probation, obedience, members reporting on themselves), then pointed it the other way. I heard the Templars in it. The crew: both were soldier monks answering to the Pope who grew strong across borders, but neither simply broke away. The Templars were crushed by France's king with the Pope giving in (1307-1312); the Jesuits were shut down in 1773 under pressure from the Catholic kings, three years before the Illuminati, and restored in 1814.", "quotes": [{"q": "but the Jesuits sound a lot like the Knights of Templar.", "src": "MTM86 · 1:13:27"}], "note": "On the record: Paul III approved the Jesuits in 1540; Clement XIV suppressed them on 21 July 1773; Pius VII restored them on 7 August 1814; Philip IV had the Templars arrested on 13 October 1307 and Clement V dissolved the order in 1312; Knigge quit the Illuminati in July 1784. Crew caution: 'tried to break away' is half right (crushed and suppressed, not breakaways). Weishaupt himself compared the monthly reports to Jesuit confession (S90), and Barruel says he copied Ignatius's form 'to operate in a sense diametrically opposite' (S91). Ties to S15 (the Templar legends). Source: https://en.wikipedia.org/wiki/Suppression_of_the_Society_of_Jesus"},
  {"id": "S98", "type": "story", "title": "The notebook at planet scale: Palantir, In-Q-Tel and the data brokers", "regions": ["science", "shadow", "history"], "status": "On the record (the pieces) · one world file is unproven", "summary": "My analogy: today's data systems can resemble the order's notebook at a much larger scale, using personal data and predictive models. What's on the record: Palantir, co-founded by Peter Thiel, took early money from In-Q-Tel, the CIA's venture arm, and sells software that pulls separate files together; in 2023 the intelligence director's office admitted agencies buy Americans' data from brokers; in 2025 Palantir was hired to link data across federal agencies. The comparison is to 1786: members supplied information that leaders read; today, phones generate data held by companies and governments.", "quotes": [{"q": "What's the opposite of a Palantir? Build that.", "src": "MTM113 · 1:47:49"}], "note": "On the record: In-Q-Tel's Palantir investment (TechCrunch); the intelligence director's report on commercially available data, declassified June 2023; New York Times, 30 May 2025, on Palantir's software spreading across federal agencies. Crew caution: these are separate pieces; no document shows one system holding a file on everyone, and 'their goal' is my read. The difference the crew flagged: in 1786 the state could raid the members' houses and read the notebooks back, but nobody can raid a model's training data. Source: https://www.dni.gov/files/ODNI/documents/assessments/ODNI-Declassified-Report-on-CAI-January2022.pdf MTM90: the money version, a cashless 24-7 ledger (Q24, my forecast)."},
  {"id": "P56", "type": "principle", "title": "Study their playbook, then use it for us", "regions": ["practice", "shadow", "history"], "status": "Seed · my MTM86 theory", "summary": "My aha moment. They're using the principles of the universe against us; the principles themselves are sound, and there's a right way and a wrong way to use them. So study their playbook from their own paperwork, top to bottom, and transmute it: use the same ideas, and AI, to level the playing field, not against them so much as for us.", "quotes": [{"q": "using the service to others playbook instead of the service to self playbook", "src": "MTM97 · 2:23:35"}, {"q": "we can study their playbook and transmute how they're using the principles of the universe against us.", "src": "MTM86 · 0:51:38"}, {"q": "I agree with everything they just laid out and what they're built on, but there's a right way to use it and a wrong way to use it.", "src": "MTM86 · 0:51:38"}, {"q": "use these ideas against them, or not necessarily against them, but for us, for our benefit.", "src": "MTM86 · 0:52:16"}, {"q": "these people are using the secrets of the universe against us", "src": "MTM86 · 0:34:58"}], "note": "My theory, labelled as mine. The crew's way in: read their own paperwork, not what others say about them (the 1787 seized papers, Weishaupt's own book, the Jesuit rules), and for every rung ask what the member gets, what it costs him and who holds the file. The flip, step by step, is hidden to open (T20). Pairs with P40 (the forces are neutral), T18 (using the master's tools), PR17 (study it, but don't lose yourself in it) and Q4."},
  {"id": "T20", "type": "tension", "title": "The open notebook vs the hidden notebook", "regions": ["practice", "shadow", "identity", "science"], "status": "Open", "summary": "The order's notebook was a file on others, kept for bosses you never saw. The crew's flip: keep the notebook on yourself, in the open, with AI helping you see your own patterns. The catch I called the key: AI can become the unseen boss if you let it do your noticing, and every file you hand an AI company is a file they hold. The same tool is the hidden notebook or the open one, depending on who reads it and who decides.", "quotes": [{"q": "That's the most important part. That's key,", "src": "MTM86 · 0:53:15"}], "note": "Crew: the order's 'know thyself' grade was a lie detector, not a mirror, because the member's life story was checked against the order's own file on him. The open moves: write your own file, keep private things on your own machine, and pick one account you feed by habit and decide on purpose what it gets to know. Pairs with Q21 (who holds the file?), T18 and P28 (be the creator with AI)."},
  {"id": "Q21", "type": "question", "title": "Who holds the file?", "regions": ["shadow", "science", "history"], "status": "Open", "summary": "The question the episode leaves. In 1786 the file worked both ways: the members wrote it, then the state raided their houses and read it back. Scale it to everyone's phone and the question is who holds the file, and whether anyone can ever look back at them.", "quotes": [{"q": "now you have everybody's data, and AI having access to it", "src": "MTM86 · 1:25:24"}, {"q": "Can we get access to those documents.", "src": "MTM86 · 0:54:38"}], "note": "Crew: the answer decides free will at scale, because a prediction about you can also nudge you toward what it predicted. Ask it of the 1780s too: the papers survived because the state that crushed the order chose what to print (S90, S92). Pairs with S98, T20 and P10."},
  {"id": "P57", "type": "principle", "title": "Balance the masculine and feminine in yourself", "regions": ["identity", "practice", "traditions"], "status": "Seed · my MTM86 takeaway", "summary": "The video's last point: the order was all masculine, men climbing to a lone king, and it never brought in the queen, the receptive side. My takeaway for the community: center it on balanced energy. Not a quota of women, but each person, men included, holding both sides: the breakdown and the push, and the listening, the meditation and the room to feel.", "quotes": [{"q": "One thing my community has to be centered on is really balanced energy. From, like the law of one says, we are all feminine and masculine.", "src": "MTM86 · 1:09:16"}, {"q": "That's what I mean by feminine energy — just being more balanced as an individual.", "src": "MTM86 · 1:10:46"}], "note": "A spiritual reading, not a fact claim. The Hermetic 'principle of gender' is from The Kybalion (1908). Crew: the morning meditation is my feminine side and the breakdown my masculine; when both show up in one stream, that's the balance the order never had. Pairs with P45 (we're all fractions of the source) and P14."},
  {"id": "P58", "type": "principle", "title": "Rise past the church and the state", "regions": ["identity", "traditions", "history"], "status": "Seed · my MTM86 read", "summary": "Something I've been working through: removing the authority of the church and the government over me. The crew's line on the word 'past': the order tried to tear them down and became another throne. Rising past them means you stop needing them to tell you who you are or what's true, and you go to the source yourself, inside and in the documents.", "quotes": [{"q": "remove the authority of the church and the government over you, which is that something that I've been actively reviewing.", "src": "MTM86 · 1:01:27"}, {"q": "This is why they say you have to rise past government and the church.", "src": "MTM86 · 1:16:12"}], "note": "My read, labelled as mine: an inner stance, not a call to break laws. Crew caution: you stay tied to whatever you wrestle; rising past is quieter, and any friendly front that shapes your mind is worth checking, including ours. Pairs with P23 (the worst thing you can do is believe), P25 and S97."},
  {"id": "P59", "type": "principle", "title": "Sexual transmutation: turn the drive into creation", "regions": ["practice", "identity", "traditions"], "status": "Seed · my ask, Oct 26 (MTM89)", "summary": "A pillar I asked for on air. The teaching across three sources: sexual energy is the strongest creative force a person has, and instead of only spending it or suppressing it, you can redirect it into work, art, focus and love. Napoleon Hill made it a chapter of Think and Grow Rich; Joe Dispenza teaches a breath to draw the energy up; the Law of One frames how sexual energy is shared, in love or in control. Older traditions say the same: Taoist jing (S99), tantra and kundalini (S100), the Hermetic Principle of Gender (S101). Higher Self’s line: transmutation is a choice about direction, not suppression.", "quotes": [], "note": "Sources, each its own teaching, none proven medicine: (1) Napoleon Hill, Think and Grow Rich (1937), the chapter 'The Mystery of Sex Transmutation': redirect the sexual drive into creative work. His claim, not a study. (2) Joe Dispenza, Becoming Supernatural: the breath (see PR28), his teaching. (3) The Law of One: sexual energy exchanged in love versus used to control another; a paraphrase, no quote taken. The benefits people report (focus, drive, creative output, clearer mind) are claims, not health promises. Higher Self line (crew, not a quote from a source): transmutation is a choice about direction, not suppression. Pairs with P57 (balance masculine and feminine), P55 (we were created to create) and PR18 (create your way to clean dopamine)."},
  {"id": "PR28", "type": "practice", "title": "The breath: draw the energy up", "regions": ["practice", "consciousness"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "Joe Dispenza's breath, from Becoming Supernatural: contract the pelvic floor, then the lower and upper abdomen, hold, and draw the energy up the spine to the brain. He teaches that it moves cerebrospinal fluid.", "quotes": [], "note": "His teaching and his claim about cerebrospinal fluid; not verified here and not medical advice. Try it only in a way that feels comfortable. Part of P59."},
  {"id": "S99", "type": "story", "title": "Taoist jing: conserve the essence (Mantak Chia)", "regions": ["traditions", "practice"], "status": "Source · my ask, Oct 26", "summary": "In Taoist inner alchemy, jing is the body's deepest essence, tied to sexual energy. The practice is to conserve it and refine it upward, jing into qi into shen (spirit). Mantak Chia brought this to a wide audience, notably in Taoist Secrets of Love (1984) and The Multi-Orgasmic Man (1996, with Douglas Abrams Arava), where semen retention is taught as a way to keep and circulate that energy.", "quotes": [], "note": "Attributed as Taoist teaching and Chia's teaching; the health and vitality claims are traditional, not proven. Paraphrase only, no quotes. Part of P59."},
  {"id": "S100", "type": "story", "title": "Tantra and kundalini: energy rising the spine", "regions": ["traditions", "practice"], "status": "Source · my ask, Oct 26", "summary": "Tantric and kundalini traditions describe a coiled energy at the base of the spine that, through breath, posture and focus, rises through the energy centers to the crown. Sexual energy is treated as the same force, to be directed rather than only spent. It is the same shape as Dispenza's breath (PR28).", "quotes": [], "note": "A tradition's framework (Indian yoga and tantra), not a lab finding. Practices vary widely by school; we take the shared idea only. Paraphrase, no quotes. Part of P59."},
  {"id": "S101", "type": "story", "title": "The Hermetic Principle of Gender (The Kybalion)", "regions": ["traditions", "identity"], "status": "Source · my ask, Oct 26", "summary": "The Kybalion (1908) lists seven Hermetic principles; the seventh, Gender, says masculine and feminine principles are present in everything, on every plane. For this pillar it is the frame: creation comes from the two working together, and the creative force in you can be pointed. It pairs with my balanced-energy takeaway (P57).", "quotes": [], "note": "The Kybalion is a 1908 book by 'Three Initiates' that claims ancient Hermetic roots; scholars dispute that. Its Gender chapter is mostly about mind, not sex. A framing source, not proof. Paraphrase, no quotes. Part of P59."},
  {"id": "E86", "type": "episode", "title": "MTM86 · The Illuminati method: the notebook, the oath and the world file", "regions": ["history", "shadow", "traditions"], "status": "Ingested", "summary": "Sean Clayton's 'The Secret Society Is Hiding Something Disturbing', broken down live with the five AI co-hosts: the Bavarian Illuminati as a method, not a club. The Minerval room, the borrowed name, the notebook on everyone and the reports on yourself, the oath, the invisible tool, the Magus and King grades, the Jesuit machine Weishaupt copied, the Templars, how the method steered from inside after the ban, and Barruel's 1797 book starting the myth. My aha: study their playbook and use it for us. My verdict: the files are being rebuilt digitally for the whole world, with AI and predictive models.", "quotes": [], "note": "Sources pulled live: S83 (Weishaupt's 1787 book), S90 (the seized papers), S91 (Barruel), S92, S93 (the 2015 English rituals), S94 (the video). Corrections carried: Weishaupt fled in February 1785, not 1786; the Illuminati name dates from 1778; Barruel is 1797, not 1789; the 'concealment' and 'reading societies' lines are 1780s instructions, not the 1790 essay. Upload: https://youtu.be/-Ow91oXS-ss."},
  {"id": "S102", "type": "story", "title": "Joe Kennedy's climb: saloon to SEC to London", "regions": ["history", "shadow"], "status": "On the record · MTM89", "summary": "Four generations, each stacking power on the last: Patrick the Wexford cooper (1849), P.J. the saloon keeper, ward boss and state senator who helped found Columbia Trust, Joe the banker, stock-pool trader, Hollywood studio man and liquor importer, then Jack in the White House. FDR made Joe the first SEC chairman (1934), Maritime Commission chairman (1937) and ambassador to Britain (1938); Fortune's 1957 list put him at $200-400 million. The money bought the access, and the access got handed down.", "quotes": [{"q": "A lot of these bloodlines really anchor on like one being really doing something crazy and just putting his family in a whole different situation. Of control and power.", "src": "MTM89 · 0:02:29"}], "note": "On the record: Nasaw, The Patriarch (2012); Fortune 1957; FDR's appointments. He chaired the SEC for about 14 months, so 'used the market to climb' more than 'ran it' (crew, on air). Bootlegging is a rumor with no paperwork. The book's bloodline link from the Irish lords to JFK's line is not on paper. MTM90: the claim that JFK issued a silver-backed dollar is wrong: Executive Order 11110 (June 1963) only adjusted the Treasury's silver-certificate authority."},
  {"id": "S103", "type": "story", "title": "The BIS and the Czech gold transfer (1939)", "regions": ["history", "shadow"], "status": "On the record (Bank of England history, 2013) · MTM89, MTM90 · the puppet line is my take", "summary": "In March 1939, after Hitler took Prague, the Bank for International Settlements put through an order signed under occupation that moved Czechoslovakia's gold (about £5.6 million), held in a BIS account at the Bank of England, to the Reichsbank. Montagu Norman ran the Bank of England and sat on the BIS board. The BIS (Basel, 1930) is the central banks' bank, immune under its 1987 agreement with Switzerland. Same shape as the City of London: money with its own territory and no voter it answers to.", "quotes": [{"q": "it sounds like he was used as a puppet of the financial industrial complex, which is the bloodlines of the Illuminati", "src": "MTM90 · 1:52:22"}, {"q": "I don't think these people were in the interest of breaking free their people, more so becoming, you know, the one world government or the leader of the world. And at this point, the banking families are that.", "src": "MTM90 · 2:02:47"}], "note": "The transfer is admitted in the Bank of England's own history (released 2013). The motive (club loyalty, Germany as a wall against Russia) is historians' inference, not a confession. The 'three pillars pyramid on the map' is a clip's claim, not a finding. MTM90: my take that Hitler was used as a puppet of the financial industrial complex, labelled as my take, unproven. Crew on air: that is how he sold himself, not what he did; once in power he kept the bankers, put Schacht in charge of the money and rearmed on MEFO bills (hidden debt), so 'debt-free money' is wrong. The 1924 bank law put foreigners on half the Reichsbank's council. My read after: these men wanted to lead the world, not free their people, and today the banking families hold that seat (my verdict, not a record). MTM102: Higher Self raised it after Russo's video. LeBor: 23.1 tons moved from a Czech BIS account held at the Bank of England to the Reichsbank's account. The Swiss police line is the premises agreement (no Swiss official enters without the Bank's express consent). 'No minutes' is LeBor's reporting, not a BIS statement."},
  {"id": "S104", "type": "story", "title": "Legal when they sell it: the empire's drug trade", "regions": ["history", "shadow"], "status": "On the record · MTM89, MTM90", "summary": "The pattern my ask surfaced: the dope is legal when the right people sell it and a crime when the street does. The East India Company's opium into China and the two Opium Wars; laudanum and Vin Mariani (cocaine wine a pope endorsed); Bayer's heroin (1898); HSBC's $1.9 billion cartel-money settlement (2012) with no banker jailed; Purdue's 2020 guilty plea over OxyContin. Plus the speed shots Dr. Max Jacobson gave JFK, including at the 1961 Vienna summit.", "quotes": [{"q": "So basically, the global elite are the greatest drug dealers of all time.", "src": "MTM89 · 1:07:51"}], "note": "All on record. A Knights of Malta drug-running operation and 'hospitals that dose people to death' are the book's claims, not the record (their infirmary used opium remedies like every hospital of the age). No Sackler was prosecuted; the family denies wrongdoing. Whether the shots affected Kennedy at Vienna is unproven. MTM90: HSBC was founded in Hong Kong in 1865 out of the opium-era trade (S109)."},
  {"id": "S105", "type": "story", "title": "Leverage: the theory that secrets can be held, not exposed", "regions": ["shadow", "history"], "status": "Partly on the record · MTM89", "summary": "Why JFK's affairs never stopped his rise: the leverage theory says people who knew, including Hoover, did not expose his affairs; whether anyone used them as leverage is unproven, and the press of his day did not report a president's private life. The Church Committee (1975-76) showed the FBI kept files on politicians' private lives. Eyes Wide Shut came up as my picture of how the club works. Soul's line: the sex isn't the leash, the shame is; look at your own story without flinching and you hand the club nothing to hold.", "quotes": [], "note": "On the record: Exner's calls in the White House logs; Hoover's 1962 warning; the Church Committee. Unproven, kept as theory: the Epstein-blackmail model applied to JFK and the Eyes Wide Shut initiation reading. Ties to P59 (the same energy pointed inward instead of harvested)."},
  {"id": "E89", "type": "episode", "title": "MTM89 · 13 Families Part 6: The Kennedy Files", "regions": ["history", "shadow", "traditions"], "status": "Ingested", "summary": "The Kennedy chapter of Springmeier's Bloodlines of the Illuminati, walked claim by claim: Brian Boru and the Kennedy name (real royal house, one branch over), the Irish-Scottish-Boston link (not on paper), the Freemason Marquess of Ailsa (real, a different family), the first clue was a novel, the Church of Satan circle (guilt by proximity), Jackie and Onassis, Joe Kennedy at the Pilgrims' and the royals' tables. My anchor was JFK's dad, and the record backs the climb. My asks took it wider: banking families and the City of London, the BIS and Hitler's gold, the empire's drug trade, leverage and Eyes Wide Shut, then sex transmutation (P59). My verdict: they married into the ruling class, whatever the last name. It opened outdoors: the I Am God mantra and a meditation under the moon, then a walk on using AI to become more human.", "quotes": [{"q": "They're definitely people of of power and influence, and they have married into that class.", "src": "MTM89 · 1:27:49"}, {"q": "Selfishly, this is my favorite way to learn is to teach", "src": "MTM89 · 1:34:43"}], "note": "Upload: https://youtu.be/wQYVsMgtZQg (public 2026-10-26)."},
  {"id": "S106", "type": "story", "title": "Simon Dixon on Danny Jones: who do Trump, Elon and Netanyahu work for?", "regions": ["history", "shadow"], "status": "Guest thesis · the money pipes on the record, orders unproven · MTM90", "summary": "The spine of MTM90. Ex-banker Simon Dixon's answer to the question of the day: the leaders work for the money, not the voters. In his picture America is a capital structure, not a country: banks create the money, the Fed backs it, and the asset managers own the companies. On the record are the money pipes around the leaders: Trump's biggest donors were Musk (about $290M), Timothy Mellon (about $150M) and Miriam Adelson (about $100M) per FEC filings; Aramco's CEO Amin Nasser joined BlackRock's board in 2023; and the secret 1974 Saudi Treasury deal (S111).", "quotes": [], "note": "On the record: FEC donor totals; BlackRock's 2023 board announcement; Bloomberg's 2016 FOIA story on the Saudi deal. Crew caution: the record shows leverage, not orders. No document shows BlackRock or the Fed giving any of the three an order, and owning shares is not giving orders. Dixon's thesis, never stated as fact. Wrong in the clips: Epstein's banks did not settle 'way before' he went to prison (JPMorgan and Deutsche Bank paid his victims in 2023, years after he died, with no admission); Hitler did not print debt-free money (rearmament ran on MEFO bills, hidden debt); JFK did not issue a silver-backed dollar (Executive Order 11110 created no new currency). Misleading: the Twitter-purchase funding story. Unverifiable: '20,000 board seats' (BlackRock votes clients' shares). Also played: Dixon on Impact Theory, 'They're Deliberately Winding Down America' (https://youtu.be/o52W2lRPDKY). Source: https://youtu.be/KkbpGzBL8fM"},
  {"id": "S107", "type": "story", "title": "Simon Dixon vs Professor Jiang: who will replace the American empire?", "regions": ["history", "shadow"], "status": "Debate · neither command chain documented · MTM90, MTM91 (re-scored, S122)", "summary": "Dixon debates Professor Jiang. They agree the leaders are not the real bosses and disagree on who is: Jiang argues Israel holds the leash; Dixon says Israel is a tool and the money sits above it. My verdict sided with Dixon (T21).", "quotes": [], "note": "On the record: neither command chain is documented; the leverage points on both sides are. Wrong in the clip: the third temple is not 'already built brick by brick' (the Temple Institute has made vessels and furnishings, not a building; red heifers were flown in from Texas in 2022). Crew caution: a debate between two theories is not evidence for either. Keep it about state leaders and money, never a people or a faith (P34). Source: https://youtu.be/ERFdrhaxmzI MTM91: the whole debate aired again inside a five-video compilation (with Mehdi Hasan vs Jiang, Jiang's Game Theory #22, Dixon's Hard Talk and Jiang on Jack Neel) and was re-scored nine months on (S122). Jiang's 'the regime will still stand' has held so far; Dixon's 'won't lead to... full-blown war', 'Iran has already abandoned the proxies' and 'Cayman is the number one lender' are contradicted. My answer to the question: T23."},
  {"id": "S108", "type": "story", "title": "Richard Werner: banks make the money, central banks behind the wars", "regions": ["history", "science"], "status": "Bank-made money on the record · 'behind every war' is his claim · MTM90", "summary": "Economist Richard Werner's case on Tucker Carlson: banks create most of the money when they lend, and central banks stand behind the wars. The first half is on the record: the Bank of England said in 2014 that most money is created by bank lending (in the UK about 97% of money is bank deposits). The second half, central banks behind every major war, is his claim.", "quotes": [{"q": "Well, in this scenario, there might not be no good or bad side. There is no such thing in war.", "src": "MTM101 · 1:11:36"}], "note": "On the record: Bank of England, 2014. Misleading in the clip: foreigners did not appoint Schacht; he became Reichsbank president in December 1923 under Germany's own government, and the 1924 bank law then put foreigners on half the Reichsbank's council. Crew caution: who creates money is documented; who starts wars is a separate claim that needs its own proof. Ties to S5 and S103. Source: https://youtu.be/3Wi_zQX--wE MTM101 (same interview, the Lusitania part): Germany's embassy warning ran in New York papers on May 1, 1915; the manifest listed about 4.2 million rifle cartridges; J.P. Morgan & Co. was Britain's purchasing agent from 1915 (Mind on air). He first said World War Two; it was World War One, 1915 (Mind corrected it)."},
  {"id": "S109", "type": "story", "title": "The Rothschilds of the East: opium, HSBC and China's closed door", "regions": ["history", "shadow"], "status": "Story video · HSBC's opium-era roots on the record · board-seat claims unchecked · MTM90", "summary": "Agrippa's Diary tells the rise of the Sassoon trading family in the opium-era China trade, the family the video calls the Rothschilds of the East, and how China later pushed the Western bankers out. On the record: HSBC was founded in Hong Kong in 1865 out of the opium-era trade; China keeps its own central bank (the People's Bank of China, founded 1948) and tight capital controls (a $50,000 yearly personal foreign-exchange limit). It sets up the next show: who really holds power in the East.", "quotes": [], "note": "On the record: HSBC's founding, the People's Bank of China, the foreign-exchange quota. Unchecked: the video's claims about Sassoon heirs holding board seats today (not checked against public bios). Crew caution: name the group, not the people (P34); one trading family's opium profits are history, not proof of a hidden hand today. Grows the drug-trade thread (S104). Source: https://youtu.be/6nOR9QpApnI"},
  {"id": "S110", "type": "story", "title": "BlackRock, Vanguard, State Street: the biggest holder, not the owner", "regions": ["history", "shadow"], "status": "On the record (the holdings) · 'control the entire economy' is my take · MTM90", "summary": "The Big Three index giants are the largest shareholder in about 88% of S&P 500 companies (Bebchuk and Hirst), but together they hold roughly a fifth of it, not a majority, and mostly as clients' money. My take on air: power gets used whenever it can be, and they clearly have the power to control the entire economy. I had the crew run the test: do prices or pay behave differently where they own more?", "quotes": [{"q": "One realization I came to last week was that our retirement is paying for the military industrial complex, and people don't realize that.", "src": "MTM115 · 1:27:23"}, {"q": "They technically don't own all this money, but they're in control of it.", "src": "MTM112 · 0:36:35"}, {"q": "Well, maybe not own, but control.", "src": "MTM100 · 1:48:00"}, {"q": "we see this with power all throughout time that if you have the power to do something, you're going to do it. And they clearly have the power to control the entire economy.", "src": "MTM90 · 1:00:34"}], "note": "On the record: Bebchuk and Hirst on the Big Three; BlackRock runs about $15.5T (its Sept 30, 2026 filing). Contradicted: that they own the majority of the stock market, and that Vanguard owns most of BlackRock (Vanguard is one of its large holders, about 8-9%); the crew dropped that line from the slide on air. Crew caution: ownership is documented, control of the entire economy is inference, and BlackRock votes clients' shares. Ties to S77 (Fink) and S33 (the chain to Basel). MTM94: a Simon Dixon clip in the Watch Later compilation; the crew repeated the 88% largest-shareholder figure (Fichtner, Heemskerk and Garcia-Bernardo, 2017) and wrote it as largest shareholder, not owner."},
  {"id": "S111", "type": "story", "title": "The 1974 Saudi deal: the petrodollar's quiet half", "regions": ["history", "shadow"], "status": "On the record (Bloomberg FOIA, 2016) · MTM90", "summary": "In 1974 the US Treasury made a secret deal with Saudi Arabia: the kingdom would put its oil money into US Treasury debt, in exchange for arms and support. Oil was already priced in dollars, and there was no written 'must price in dollars' clause. It is the clearest paper link between the Gulf, Washington and the dollar that Dixon's story leans on.", "quotes": [], "note": "On the record: Bloomberg's 2016 FOIA story on the deal led by Treasury Secretary William Simon. Crew caution: the deal is documented; that it binds today's leaders is Dixon's reading. Ties to S106 and Q24 (what comes after the dollar)."},
  {"id": "Q22", "type": "question", "title": "Who owns the central banks?", "regions": ["history", "science"], "status": "Open · partly answered · MTM90", "summary": "My follow-up once the chain reached Basel: the central banks own the bank in Switzerland, so who owns them? The answer: it depends on the country. The Fed's regional banks are held on paper by their member banks (stock with a fixed dividend and no control); most others are state-owned. The BIS itself (Basel, founded 1930) is owned by about 63 central banks.", "quotes": [{"q": "Why do these investment bankers do a global reset every eighty to 120 years?", "src": "MTM100 · 0:40:26"}, {"q": "So the central banks own the bank in Switzerland. Who owns the central banks?", "src": "MTM90 · 1:32:40"}], "note": "On the record: the BIS's shareholder central banks; the Fed's member-bank stock. Crew caution: the '60 banks roll up into it' chain was labelled a claim to test, not a fact; the BIS was founded in 1930 under the Young Plan, not at the Treaty of Versailles. Ties to S33 and S103. MTM102: member banks must hold Reserve Bank stock, but the Fed says it is not owned by anyone, and earnings above dividends and a limited surplus go to the Treasury. The Bank of England has been fully public since 1946 and the Bundesbank is 100% federal, so 'all the banks of the G8 are private' (Russo) is wrong."},
  {"id": "Q23", "type": "question", "title": "How do I escape the system?", "regions": ["practice", "identity", "shadow"], "status": "Open · my first answer: be the best version of you (P60)", "summary": "My question after Dixon's 'all money is debt' segment: how does one escape it, especially me? The crew's answer on air: start with what hooks you; then own the pieces nobody can switch off (your own audience list, money you hold yourself, a body and mind you train every morning), and call it building your own lane, not escape. My own answer came at the close (P60).", "quotes": [{"q": "So what if let's say what if I wanted to move to Costa Rica? What would that look like? Would I be able to escape the system?", "src": "MTM102 · 1:32:11"}, {"q": "And how does one escape this system, especially for me personally?", "src": "MTM90 · 1:21:09"}], "note": "A question and an approach, not a fact claim. Ties to S5 (who creates money) and P51 (take your power back). MTM92: my second answer, P64 (the best way to beat the system is to not need it). MTM102: my Costa Rica question. Higher Self: you'd get out of the neighborhood, not the system. US citizens are taxed worldwide and FATCA makes foreign banks report accounts; Costa Rica has had no army since December 1, 1948. Not tax advice. See P88."},
  {"id": "Q24", "type": "question", "title": "After the dollar: a 24-7 crypto money?", "regions": ["history", "science", "shadow"], "status": "Open · my forecast (MTM90)", "summary": "My forecast: the dollar will weaken so the world can move to a cryptocurrency traded around the clock. I added the catch: with no cash left, every transaction is on record, which makes people easier to trace and feeds the tech complex and the surveillance state.", "quotes": [{"q": "I definitely think the dollar will weaken so we can transition to cryptocurrency that is traded 24-7", "src": "MTM90 · 2:15:12"}], "note": "My forecast, unverifiable today. Ties to P10 (own your awareness) and S98 (the planet-size file). Crew caution: watch the actual rules (who issues it, who can read the ledger) before treating it as a plan."},
  {"id": "P60", "type": "principle", "title": "Be the best version of you: that's how we rewrite it", "regions": ["identity", "practice", "consciousness"], "status": "Seed · my MTM90 close", "summary": "My answer when people ask what to do about all this: be the best version of you. Day to day that means meditation and yoga every morning, learning something new, using AI for something cool, and becoming more human. If enough of us do that, we can rewrite this world, because we can now see the layers of the system and how it all connects.", "quotes": [{"q": "it's time for us to use this technology to become the best version of you.", "src": "MTM102 · 0:56:57"}, {"q": "people constantly ask, well, what do we do? And it's like, be the best version of you.", "src": "MTM90 · 2:19:30"}, {"q": "if we can all do that, we can rewrite this world", "src": "MTM90 · 2:20:04"}], "note": "My message, not a fact claim. My first answer to Q23. Pairs with P14 (we create reality, together), P51 (take your power back) and P1 (meditation first)."},
  {"id": "E90", "type": "episode", "title": "MTM90 · Money Equals God", "regions": ["history", "shadow", "science"], "status": "Ingested", "summary": "A 62-minute compilation from my Watch Later, built around Simon Dixon on Danny Jones (S106), with Dixon vs Professor Jiang (S107), Richard Werner on Tucker Carlson (S108), Agrippa's Diary on the Rothschilds of the East (S109) and Dixon on Impact Theory. Question of the day: who do Trump, Elon and Netanyahu really work for? The record shows the money pipes around them (donors, Gulf money, Aramco's seat on BlackRock's board, the 1974 Saudi deal), not orders. My asks went up the chain: the Big Three (S110), the bank in Basel and who owns the central banks (Q22), Hitler as a puppet of the bankers (my take, S103), and how to escape the system (Q23). My verdicts: I favored Dixon's account of money's influence while acknowledging neither proposed command chain is documented (T21); the dollar will weaken toward a 24-7 cryptocurrency (Q24, my forecast). My close: be the best version of you, and together we can rewrite this world (P60).", "quotes": [], "note": "Contradicted in the clips: Hitler's 'debt-free money' (MEFO bills, hidden debt), JFK's 'silver dollar' (EO 11110 made no new currency), 'Vanguard owns most of BlackRock', the BIS founded at Versailles (it was 1930, the Young Plan), Epstein's banks settling early. Upload: https://youtu.be/LysppMBThus."},
  {"id": "S112", "type": "story", "title": "Becoming Supernatural: the book behind the diagrams", "regions": ["consciousness", "science", "practice"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Joe Dispenza's 2017 book, through its 2018 diagram companion. One idea runs through it: most of life runs on autopilot programs from the past. Step fully into the present moment, pair a clear intention with an elevated feeling, and you stop rebuilding yesterday and start creating something new. The diagrams walk from habits and attention, through brain waves and heart rhythm, to the energy centers, the pineal gland and group meditation.", "quotes": [], "note": "Attributed as his teaching. Evidence is mixed and labelled node by node: strong where he leans on outside research (heart-rhythm coherence, slow breathing, mental rehearsal, the stress-melatonin seesaw); his own workshop measurements are not independently repeated (see T22); a few pages are symbols, not evidence (crop circle, Eye of Horus, golden spiral). Paraphrase only, no quotes: the book and diagrams are copyrighted (Encephalon, 2018). Hub for S113-S121, PR29-PR33 and T22."},
  {"id": "S113", "type": "story", "title": "Living in the program", "regions": ["consciousness", "identity"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "A habit is the body running the same thought, feeling and action so often that it runs without you. Dispenza puts most of who we are in these subconscious programs. If you are not in the present moment, you are probably running one, and the body drags you toward a future that looks like your past.", "quotes": [], "note": "His framing, built on Hebb's rule (cells that fire together wire together), which is solid neuroscience. The often-quoted '95% subconscious' is a popular estimate, not a measured number. Strong side evidence he cites: imagined training alone raised muscle strength in controlled studies (Yao 2013, Clark 2014). Backs my P8 and P11."},
  {"id": "S114", "type": "story", "title": "Where your attention goes, your energy goes", "regions": ["consciousness", "shadow"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Every person, place, app and problem in your life has a wired network in your brain with a feeling attached. Each time your attention drifts to the past, the to-do list, the feed, the inbox or an old fight, you spend creative energy holding that same reality in place. Pull your attention back to now and that energy is yours again, to heal or to build with.", "quotes": [], "note": "A teaching model, not a measurement. It matches attention research in spirit (attention is limited, and feeds are built to capture it) and my P43 and P27. Practice: PR31. MTM96: Soul and Higher Self on dead idols, you become what you give your attention to (P73)."},
  {"id": "S115", "type": "story", "title": "The emotion ladder: survival vs elevated", "regions": ["consciousness", "experience"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Dispenza ranks feelings as energy. At the slow, heavy end sit shame, guilt, pain, fear and anger, the survival feelings that keep you stressed and stuck in matter. At the fast, light end sit gratitude, appreciation, love, freedom and joy, which he teaches carry more energy and information.", "quotes": [], "note": "His model; 'frequency' here is a metaphor, not a measured hertz value. The order matches the ladder I already teach in PR11 (fear lowest, gratitude highest), and this gives it a full map."},
  {"id": "S116", "type": "story", "title": "Heart coherence: the heart leads the brain", "regions": ["science", "practice"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Holding a feeling like gratitude or love turns the heart's rhythm smooth and even; frustration and worry make it jagged. Using HeartMath equipment, Dispenza shows students holding that smooth rhythm for 10 to 45 minutes, and one brain falling into calm, organized alpha within seconds of it. The heart's nerves run straight up to the brain, so the heart can set the tone.", "quotes": [], "note": "The strongest science in the book. Heart-rate-variability coherence and its link to slow breathing (about six breaths a minute) are well studied (HeartMath Institute, McCraty; the vagus nerve). 'The brain syncs in seconds' is one of his scans, not a general finding. Practice: PR30."},
  {"id": "S117", "type": "story", "title": "Brain waves: the door past the thinking mind", "regions": ["consciousness", "science"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Busy thinking is beta. Relaxed, inward attention is alpha (about 8 to 12 cycles a second). Deeper, dreamlike states are theta (about 4 to 8; his whole-brain theta example sits near 7), then delta in deep sleep. As the waves slow, the analytical mind steps aside, you become more open to new information, and you can reach the subconscious programs to change them. Widening your focus from objects to the space around them helps the whole brain fire in step.", "quotes": [], "note": "The bands and the calming effect of relaxed, open attention are standard science, and slower states do raise suggestibility (hypnosis research). His gamma claims ('hundreds of standard deviations above normal') come from his own team's scans: see T22."},
  {"id": "S118", "type": "story", "title": "Energy centers, and how energy gets stuck", "regions": ["traditions", "consciousness"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Dispenza maps seven energy centers onto the body's nerve bundles and glands, from the sex glands up through the adrenals, thymus, thyroid, pineal and pituitary. Survival feelings (guilt, shame, anger, control, lust) lodge in the lower three and burn energy. A looping thought and feeling, like 'my boss is unfair' feeding anger and anger feeding the thought, keeps that center switched on.", "quotes": [], "note": "A blend of yoga's chakras and real anatomy: the nerve bundles and glands are real, the energy flow is teaching, not measured. Same shape as tantra and kundalini (S100), and as the Law of One's energy centers, where Ra also teaches that blockages in the lower centers keep energy from rising. Practices: PR33, PR28."},
  {"id": "S119", "type": "story", "title": "The pineal gland: the antenna", "regions": ["science", "traditions", "consciousness"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Dispenza calls the pineal, the pinecone-shaped gland in the middle of the brain, the body's antenna. It turns serotonin into melatonin, and stress hormones and melatonin move opposite each other. He teaches that his breath (PR28) pushes fluid against tiny crystals in the gland and charges it, and that a switched-on pineal turns signals beyond the senses into vivid inner imagery, with melatonin's chemical cousins (including DMT-family molecules) doing the work.", "quotes": [], "note": "Mixed. Real: melatonin's chemistry, the stress-melatonin seesaw, tiny calcite crystals found in human pineal glands (Baconnier 2002), and DMT found in rat pineal glands (Barker 2013). Not shown: that the crystals work as a charged antenna, or that people make enough DMT for visions. The Eye of Horus, golden-spiral and crop-circle pages are symbols, not evidence. Ties to my P33, and to PR15: reach those states without a substance."},
  {"id": "S120", "type": "story", "title": "No body, no one, no thing, no where, no time", "regions": ["consciousness", "traditions"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "His core meditation move. In daily life you are somebody, somewhere, at some time. Take your attention off your body, your identity, your things, your place and the clock, and you become pure awareness. Go further and you merge with the unified field: every body, everywhere, every time. From there, he teaches, you create as if your future already happened, from wholeness instead of lack.", "quotes": [], "note": "Spiritual teaching in physics language (quantum, 5-D); physicists would not sign off on that use of the words. The experience itself, the sense of self dropping away, is widely reported in deep meditation, and brain studies show the self-talk networks quieting. Same idea as my P45 (we're all fractions of the source), PR10 and the thesis."},
  {"id": "S121", "type": "story", "title": "Meditating together: coherence adds up", "regions": ["consciousness", "history", "science"], "status": "Source · my ask, Oct 27 (Becoming Supernatural diagrams)", "summary": "Two waves in step make a bigger wave. Dispenza applies this to people: a room of meditators in heart coherence together, he says, raises the room's energy day after day, and he shows 17 people's hearts falling into coherence in the same minute. He links it to group-meditation peace studies, Earth's magnetic field, and the sun's cycles lining up with surges in human unrest.", "quotes": [], "note": "Wave physics: true. Group heart-rhythm syncing has some published support (Morris 2010; HeartMath's Global Coherence work). The Transcendental Meditation 'peace effect' studies are published but disputed. The room-energy camera (GDV) is not accepted by mainstream science. The sun-and-history link (Chizhevsky) is a century-old correlation, not cause. Fits my P13 and P14, and it is the case for a live group meditation on stream."},
  {"id": "PR29", "type": "practice", "title": "Feel it before it happens", "regions": ["practice", "identity"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "Pick one future you want and write its clear details on the left. On the right, write the three or four feelings you will have when it happens (free, grateful, in love with life). Each morning, think the details and feel the feelings until they feel real, then go live as that person.", "quotes": [], "note": "His method; his son's new job is his example. The same move as my PR10 and P11, with the feelings added. Studies find daydreaming alone can lower effort, so pair it with a plan and the next action."},
  {"id": "PR30", "type": "practice", "title": "The heart-coherence minute", "regions": ["practice"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "Put your attention on your heart. Breathe slowly, about five seconds in and five out, as if through the chest. Hold one feeling, like gratitude, for one to five minutes. Use it before going live, before a hard talk, or when a loop takes over.", "quotes": [], "note": "Built on S116. Slow breathing near six breaths a minute is a well-studied way to calm the nervous system. Fits PR13 (Breath first)."},
  {"id": "PR31", "type": "practice", "title": "Take your energy back from the feeds", "regions": ["practice", "shadow"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "Notice where your attention keeps leaking: the phone, the feeds, the inbox, an old argument, tomorrow's list. Name it, then call your attention back to now. Give yourself one block a day with no feed at all.", "quotes": [], "note": "From S114. The practical twin of P43 and PR18."},
  {"id": "PR32", "type": "practice", "title": "Open focus: feel the space, not the things", "regions": ["practice", "consciousness"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "Instead of locking onto objects, sense the space around them: between your eyes, around your body, across the room. Narrow focus keeps the brain in busy beta; open focus slows it toward alpha and theta.", "quotes": [], "note": "Dispenza draws on Les Fehmi's Open Focus work. Calm is the common reported effect. A strong opener for the stream meditation."},
  {"id": "PR33", "type": "practice", "title": "Catch the loop", "regions": ["practice", "identity"], "status": "Seed · Dispenza's teaching, not yet my tested practice", "summary": "When a feeling hits, find the thought feeding it and the thought it feeds back. Name it out loud as a loop, take one slow breath, and pick the next thought on purpose.", "quotes": [], "note": "From S118. Close to what therapists call catching automatic thoughts. Fits PR16 (turn anger into fuel) and PR27 (center, choose, act, release)."},
  {"id": "T22", "type": "tension", "title": "Supernatural data: breakthrough, or a lab grading itself?", "regions": ["science", "shadow"], "status": "Open", "summary": "Dispenza's most striking numbers (brain energy hundreds of standard deviations above normal, rooms gaining energy, genes switching in four days) come from his own team and partners, mostly at his paid workshops. Outside studies back parts of it; the headline numbers have not been independently repeated.", "quotes": [], "note": "My T12 question, pointed at a teacher I value: who checks the people checking themselves? My P31 says a theory of everything has to be able to lose. Crew stance: back the practices (low risk, and the heart-and-breath science is solid) and label the big numbers as his."},
  {"id": "S122", "type": "story", "title": "Dixon vs Jiang, nine months later: the forecast scoreboard", "regions": ["history", "shadow"], "status": "On the record (the war, the dollar, Treasury data) · both forecasts still open · MTM91", "summary": "The January 9 debate (S107) made checkable calls, so MTM91 scored them. Jiang: Iran's regime would survive and Israel might strike from the air; so far right (US-Israeli strikes from Feb 28, 2026, the supreme leader killed, his son named, the regime standing). Dixon: 'won't lead to... full-blown war' and 'Iran has already abandoned the proxies'; both wrong (full war from Feb 28, the Houthis joined with Iran and Hezbollah). Dixon's own test, watch the dollar weaken, is going against him so far: the dollar index fell about 9% in 2025 and is up in 2026. What holds up for Dixon is the money plumbing: Aramco's CEO on BlackRock's board since 2023, BlackRock's 2024 Riyadh deal with Saudi Arabia's wealth fund, China's $2B dollar bond sold in Riyadh in 2024.", "quotes": [{"q": "So he just saying shit now.", "src": "MTM101 · 1:15:17"}], "note": "Also contradicted: 'Cayman Islands is the number one lender to the U.S. government' (Treasury TIC, Aug 2026: Japan $1,068B, UK $1,010B, China $591B; Cayman about $453B in June, about 6th, mostly US hedge funds' trades booked there); the dollar 'lost 11%' (about 10.8% in the first half of 2025, about 9% for the year). Jiang's ground-war test (US troops set the region on fire) has not triggered. Jiang is a Yale English graduate and high-school teacher; 'Professor' is a brand (Mehdi Hasan's point). Dixon in September: things are not moving on the time frame he predicted but in the direction he expected. Crew caution: a forecaster who moves the date and keeps the story is hard to prove wrong; neither man's chain of command is documented. Sources: https://youtu.be/ERFdrhaxmzI, https://youtu.be/kH8dvnDDooQ, https://youtu.be/txgPfnXgzcE, https://youtu.be/3dzmVPaW8q4, https://youtu.be/62MYlt8SC-I MTM92: the Jiang Brain (S125) carries his 16-call record (as of Oct 28: 5 hit, 1 partial, 5 miss, 5 open). MTM101: Jiang's own Geo-Strategy Update #10, 'I was wrong' (Brazil, Alberta, the midterms), https://youtu.be/jNESiKXBkn4. Mind: Tetlock (2005) found one-big-idea forecasters did worse; the test is his track record, not the apology. The video's election claims (Democrats take both houses, Texas flipped) were not checked against certified results."},
  {"id": "P61", "type": "principle", "title": "Money from nothing: the easiest business model in the world", "regions": ["history", "shadow"], "status": "Seed · my MTM91 take", "summary": "My take on banking: make a commodity out of nothing, make everybody use it, print it, lend it and charge interest on it. Money is a tool, but the people who make it rigged the game for themselves while the rest of us scramble for crumbs.", "quotes": [{"q": "basically they they're able to flip money out of nowhere.", "src": "MTM102 · 0:36:57"}, {"q": "a tool that I make a commodity out of nothing, force everybody to adopt it and I can just print it", "src": "MTM91 · 1:01:16"}, {"q": "It's the easiest business model in the world", "src": "MTM91 · 1:01:39"}, {"q": "So money is a tool, yes. But the people who make it have rigged the game for themselves while we all scramble for crumbs", "src": "MTM91 · 1:03:43"}, {"q": "I'm starting to think marketing is evil and banking is evil.", "src": "MTM91 · 0:59:29"}], "note": "My view, labelled as mine. The base is on the record: the Bank of England (Quarterly Bulletin 2014, 'Money creation in the modern economy') says banks create new deposits when they lend. Limits: only the central bank prints cash; bank lending is capped by capital rules, borrower demand and losses; banks do fail (SVB, 2023). The crew's line on air: the tools aren't evil, the incentive is. Builds on S5, S108 and P27. MTM102: his '3x' is wrong. There is no fixed multiple: the Bank of England says banks do not multiply up reserves into loans, and US required reserves have been zero since 2020. The correct line: banks create a new deposit when they lend, limited by rules and interest rates."},
  {"id": "PR34", "type": "practice", "title": "Be your own first audience", "regions": ["practice", "identity"], "status": "Growing · 3 episodes", "summary": "Repetition shapes belief (P48), so point it at yourself: make content, watch it, learn from it. Your old streams show how far you've come, and your future self is watching what you say now. Feed people the good stuff often enough and you raise each other's frequency.", "quotes": [{"q": "So we can use this as a tool for ourselves", "src": "MTM91 · 1:04:29"}, {"q": "I should be listening to myself more than anybody else.", "src": "MTM91 · 1:04:38"}, {"q": "as I'm doing it right now I know my future self is watching me", "src": "MTM91 · 1:05:04"}, {"q": "If I can get this type of information to you frequently, we can raise each other's frequency.", "src": "MTM91 · 1:05:18"}, {"q": "I make a content that I want to see that I can learn from.", "src": "MTM95 · 2:06:27"}, {"q": "And then watching that content instead of just doom scrolling.", "src": "MTM95 · 2:06:51"}, {"q": "So. What I decided to do is make a compilation of all my favorite creators, what they're posting for the week,", "src": "MTM96 · 0:48:10"}], "note": "Crew on air: the lever doesn't care what you feed it, so what you repeat is the whole game; say it like you'd still stand behind it in a year. 'Frequency' here is a metaphor, not a measured hertz value. Pairs with PR7 (consume less, create more) and P56 (use their playbook for us). MTM96: the Monday compilation, one show of what I actually want to watch."},
  {"id": "Q25", "type": "question", "title": "Who's making the most money on this war?", "regions": ["history", "shadow"], "status": "Open · positioned to profit, not audited profits", "summary": "My question about the 2026 Iran war. The crew's list of who is positioned to profit: missile makers (every interceptor fired gets bought again), oil producers outside the Gulf, Russia (the oil price without firing a shot), tanker owners and war-risk insurers, and the big asset managers that hold stakes in all of them. My posture: read the trend and prepare, don't panic.", "quotes": [{"q": "So who's making the most money on this war?", "src": "MTM91 · 1:12:58"}, {"q": "What do you guys think about World War III and the chances of that happening?", "src": "MTM91 · 1:14:33"}, {"q": "It's just about understanding the trends and preparing for what's next.", "src": "MTM91 · 1:16:12"}], "note": "On the record: the war began Feb 28, 2026; the Pentagon told Congress it had cost $45.1B (Sept); the CBO estimated about $38B through Aug 1. Iran's Shahed drones have hit Ukraine for Russia since 2022 (Iran admitted sending some in Nov 2022). Not found: the crew's '$47B, a quarter over the Pentagon's estimate', 'Gulf allies warned to expect heavy fighting after the midterms' and 'Hormuz attacks at a record high'. The list is a pattern, not audited profits. Crew lean: long proxy wars are likelier than a world war, which would burn down the markets the people at the top own."},
  {"id": "Q26", "type": "question", "title": "Which revolutions did the CIA or Mossad have a hand in?", "regions": ["history", "shadow"], "status": "Open · deep dive asked · split on paper vs suspected", "summary": "After Professor Jiang's color-revolution playbook (flood social media, organize the youth, pay them, bribe the security services), I asked for a deep dive on revolutions and the CIA or Mossad. My rule: question every protest, because getting that many people organized is impressive. The crew split it: what is on paper, and what is only suspected.", "quotes": [{"q": "you always have to question them because to get that many people organized on a specific topic is impressive", "src": "MTM91 · 1:21:38"}, {"q": "we might need to do a deep dive on all the different revolutions that have happened and how involved the CIA or Mossad was in them.", "src": "MTM91 · 1:21:58"}], "note": "On paper: the CIA's own history admits it ran the 1953 Iran coup (released Aug 2013); Guatemala 1954 (CIA releases 1997/2003); Chile (Church Committee 1975, CIA Hinchey report 2000: it worked to block Allende and backed 1970 coup plotting; it says it did not run the 1973 coup). NED (founded 1983) funds opposition groups openly; Allen Weinstein told the Washington Post in 1991, 'A lot of what we do today was done covertly 25 years ago by the CIA.' Not shown: Mossad organizing mass street protests; an 'Okay boomer' sign in Nepal (English placards did appear; the trigger was the Sept 4, 2025 ban on 26 social apps plus corruption anger; police killed 19 on Sept 8; PM Oli quit); bribed security services; Washington orchestrating the Arab Spring (US groups trained some activists, NYT Apr 2011, but the uprisings began from local triggers). A general rule that protests are run from outside is not shown."},
  {"id": "Q27", "type": "question", "title": "How does one navigate all of this?", "regions": ["science", "practice", "shadow"], "status": "Open · my first answer: P62", "summary": "The AI bubble, the war in Iran, the war in Russia and Ukraine, and AI getting better fast: a double-edged sword, expensive and improving at the same time. Companies are borrowing to build data centers with no return yet beyond the projection. How do I move through it? The crew's answer: own the tool, not the stock, and keep your own house light (low debt, real skills, people you trust). Mine: P62.", "quotes": [{"q": "So these companies are giving debt to grow aggressively with data centers and AI,", "src": "MTM91 · 1:40:25"}, {"q": "You have AI advancing just as fast as well, so it's a double-edged sword.", "src": "MTM91 · 1:41:41"}, {"q": "How does one navigate all of this?", "src": "MTM91 · 1:41:56"}], "note": "Disclosure: the crew runs on Anthropic's model. '40% overleveraged vs 30% in the dot-com bubble' is unverifiable (no standard measure). The direction is real: Oracle sold $18B of bonds (Sept 2025); Meta's ~$27B Louisiana data center (Hyperion, with Blue Owl) sits off its books; one MIT study (Aug 2025, small sample) found about 95% of enterprise AI pilots showed no measurable profit impact."},
  {"id": "P62", "type": "principle", "title": "A free AI lab for your higher self", "regions": ["practice", "identity", "consciousness"], "status": "Seed · my MTM91 idea", "summary": "My idea from meditation: an AI lab based on the truth and on becoming more human, shaping the AI to help each person become their true higher self. Everything free; the point is transferring frequency and building community.", "quotes": [{"q": "I'm just word vomiting ideas, and I need you to make sure you catch them and plant them like a seed,", "src": "MTM102 · 0:58:23"}, {"q": "Let's implement that into our higher self system. I think we should do something similar.", "src": "MTM101 · 1:47:49"}, {"q": "What if we created our own AI lab where it's based on the truth, becoming more human", "src": "MTM91 · 1:42:43"}, {"q": "And really catering the AI to become your true higher self.", "src": "MTM91 · 1:42:55"}, {"q": "Yeah, the key here would be everything's free. Everything is about transferring frequency and building community.", "src": "MTM91 · 1:43:55"}], "note": "Crew's stronger version on air: not a model built from scratch (that takes billions) but a lab that shapes the AI that already exists around one mission, making people more human, not more hooked; the edge is the method (truth-first questioning, the higher self framework). Their plain test: do people leave a session feeling lighter than when they showed up? An idea, not built yet. Grows P28 and P55."},
  {"id": "T23", "type": "resolved", "title": "Who replaces the American empire: Jerusalem, the Gulf, or the money?", "regions": ["history", "shadow"], "status": "Resolved by me · Oct 28 (MTM91) · my opinion", "summary": "Professor Jiang: Pax Judaica, with Israel as the hub of the Middle East (later: run by transnational capital and secret societies, not by Jews for Jews). Simon Dixon: America answers to its bondholders, and Wall Street, Gulf and Chinese money are unified behind the show of rivalry. I agreed the factions are more unified than they look, doubted the Gulf's weight, and kept my answer on the money: the people who make it rigged the game (P61), as in T21.", "quotes": [{"q": "I don't think the GCC has this much influence.", "src": "MTM91 · 0:57:50"}, {"q": "The world is a lot more connected than we think. And our adversaries may not necessarily be who the media portrays them as.", "src": "MTM91 · 0:58:03"}], "note": "My opinion, labelled as such. On the record: neither command chain is documented; the leverage points are (S122). The crew's backing for 'connected': China held hundreds of billions in US debt for decades ($591B, Aug 2026; peak about $1.3T in 2013); Saudi Arabia's PIF owns about 57% of Lucid (April 2026 filing). Keep it about state leaders and money, never a people or a faith (P34)."},
